# Common attribute unlocks

 marauder_attribute.unlock_tt: "Выполняется любое из нижеследующих условий:\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('sadistic').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('callous').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('vengeful').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$Можно получить доступ к атрибуту, когда [Concept('army', 'армия')|E], в которой сражается [Concept('acclaimed_knight', 'именитый рыцарь')|E], [Concept('occupies', 'оккупирует')|E] вражеское [Concept('holding', 'владение')|E]"
 accolade_marauder_unlock.t: "[marauder.GetName] [Select_CString(marauder.IsFemale, 'воодушевлена', 'воодушевлен' )] разорением вражеской твердыни"
 accolade_marauder_unlock.tt: "[marauder.GetName] может быть [Concept('acclaimed', Select_CString(marauder.IsFemale, 'удостоена', 'удостоен' ) )|E] акколады «[GetAccoladeType('marauder_attribute').GetName]»"

 idealist_attribute.unlock_tt: "Выполняется любое из нижеследующих условий:\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('compassionate').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('forgiving').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('generous').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('trusting').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] может получить доступ к атрибуту, когда #high вы#! без всяких условий освобождаете [Concept('prisoner', 'узника')|E]"
 accolade_idealist_unlock.t: "[idealist.GetName] [Select_CString(idealist.IsFemale, 'воодушевлена', 'воодушевлен' )] освобождением узника"
 accolade_idealist_unlock.tt: "При виде нашего милосердного обращения с пленными [idealist.GetName] [Select_CString(idealist.IsFemale, 'испытала', 'испытал' )] душевный подъем. [idealist.GetSheHe|U] может [Concept('acclaimed', 'удостоиться')|E] акколады «[GetAccoladeType('idealist_attribute').GetName]»"

 charmer_attribute.unlock_tt: "Выполняется любое из нижеследующих условий:\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('seducer').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('lustful').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] может получить доступ к атрибуту, когда вы завершаете [Concept('scheme', 'происки')|E] по #TOOLTIP:SCHEME_TYPE,seduce #L соблазнению#!#!"
 accolade_charmer_unlock.t: "[accolade_knight.GetName] [Select_CString(accolade_knight.IsFemale, 'воодушевлена', 'воодушевлен' )] дерзким соблазнением"
 accolade_charmer_unlock.tt: "[accolade_knight.GetName] может [Concept('acclaimed', 'удостоиться')|E] акколады «[GetAccoladeType('charmer_attribute').GetName]»"

 thug_attribute.unlock_tt: "Выполняется любое из нижеследующих условий:\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('reaver').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('wrathful').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('arbitrary').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('arrogant').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('impatient').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$Можно получить доступ к атрибуту, когда [Concept('army', 'армия')|E], в которой сражается [Concept('acclaimed_knight', 'именитый рыцарь')|E], убивает вражеских [Concept('knights', 'рыцарей')|E]"
