l_russian:
 #AGOT Modified
 LOADING_TIP_0: "#TT Валар моргулис."
 LOADING_TIP_1: "#TT Никогда не забывайте - Зима близко."
 LOADING_TIP_2: "#TT Валар дохаэрис."
 LOADING_TIP_3: "#TT Тот, кто выносит приговор, сам заносит меч."
 LOADING_TIP_4: "#TT Замки не защитят от драконов."
 LOADING_TIP_5: "#TT Кастеляна Железного трона также именуют Десницей короля."
 LOADING_TIP_6: "#TT ‘Те, кто играют в престолы, либо побеждают, либо умирают, середины не бывает.’ #!\n#TTA — королева Серсея Ланнистер"
 LOADING_TIP_7: "#TT ‘C чего бы мне,’ — сказал тот лорд, — ‘Склоняться пред тобой?’"
 LOADING_TIP_8: "#TT Доверьтесь. Мизинцу."
 LOADING_TIP_9: "#TT ‘Предпочитаю мертвую. Мертвая история пишется чернилами, живая же — кровью.’ #!\n#TTA — лорд Родрик Харлоу по прозвищу «Чтец»"
 LOADING_TIP_10: "#TT То, что мертво, умереть не может, но восстаёт вновь, сильнее и крепче!"
 LOADING_TIP_11: "#TT Вы можете отправить узника на Стену через изгнание."
 LOADING_TIP_12: "#TT Слова - это ветер."
 LOADING_TIP_13: "#TT Чёрные крылья, чёрные вести."
 LOADING_TIP_14: "#TT Жил-был медведь, косолапый и бурый! Страшный, большой и с мохнатою шкурой!"
 LOADING_TIP_15: "#TT ‘Ночь темна и полна ужасов.’"
 LOADING_TIP_16: "#TT Если у вас нет действующего мейстера, то вы можете отправить за ним письмо в Цитадель."
 LOADING_TIP_17: "#TT Но когда вы посмотрите в его глаза, море всё ещё будет там — холодное, серое и жестокое."
 LOADING_TIP_18: "#TT Охота может нести скрытую опасность..."
 LOADING_TIP_19: "#TT ‘Деньги покупают молчание лишь на время. Стрела в сердце покупает его навсегда.’ #!\n#TTA — лорд Петир Бейлиш"
 LOADING_TIP_20: "#TT Если вы находитесь в плену у одержимого огнём, суд поединком вряд ли поможет."
 LOADING_TIP_21: "#TT ‘Ходор.’ #!\n#TTA — Ходор"
 LOADING_TIP_22: "#TT ‘Вонючка, вонючка, рифма - злючка.’"
 LOADING_TIP_23: "#TT ‘Хорошо, что у богов целых семь преисподних — одна братьев Клиганов нипочём не сдержала бы.’"
 LOADING_TIP_25: "‘Почему это мёртвый должен быть правдивее или умнее, чем при жизни? Скорей всего он стал бы ныть и жаловаться — “земля, мол, чересчур холодна, надгробная плита мала, да и червей у других побольше, чем у него...”’ #!\n#TTA — Скорбный Эдд"
 LOADING_TIP_24: "#TT ‘Если бы я мог молиться своим мужским естеством, я был бы гораздо набожнее.’ #!\n#TTA — Тирион Ланнистер"
 LOADING_TIP_26: "‘Даже сейчас я могу разрезать вас пятерых так же легко, как кинжал режет сыр!’ #!\n#TTA — сир Барристан Селми"
 LOADING_TIP_27: "#TT ‘Вот единственный король, перед которым я готов преклонить колено, милорды! Король Севера!’ #!\n#TTA — Большой Джон"
 LOADING_TIP_28: "#TT ‘Читающий проживает тысячу жизней, прежде чем умрёт. Человек, никогда не читавший, проживёт лишь одну.’ #!\n#TTA — Жойен Рид"
 LOADING_TIP_29: "#TT ‘Штурмуйте, милорд, — только вспомните прежде, как этот замок называется.’ #!\n#TTA — сир Кортни Пенроз"
 LOADING_TIP_30: "#TT ‘Мужчины - это мужчины. Обеты - только слова. А слова - это ветер.’ #!\n#TTA — Железный Эммет"
 LOADING_TIP_31: "#TT ‘Отмщение. Справедливость. Огонь и кровь.’ #!\n#TTA — Принц Доран Мартелл"
 LOADING_TIP_32: "#TT ‘Собак я люблю больше, чем рыцарей.’"
 LOADING_TIP_33: "#TT ‘Хотя, может статься, это было благословением. Останься он жив, он мог бы вырасти Фреем.’ #!\n#TTA — лорд Виман Мандерли"
 LOADING_TIP_34: "#TT ‘Рейгар сражался отважно, Рейгар сражался благородно, Рейгар сражался честно. И Рейгар погиб.’ #!\n#TTA — сир Джорах Мормонт"
 LOADING_TIP_35: "#TT ‘Страх режет глубже меча.’ #!\n#TTA — Сирио Форель"
 LOADING_TIP_36: "#TT ‘Шагга полагает, что три топора лучше, чем два.’ #!\n#TTA — Тирион Ланнистер"
 LOADING_TIP_37: "#TT ‘Наши колени легко не сгибаются.’ #!\n#TTA — сир Эртур Дейн, Меч Зари"
 LOADING_TIP_38: "#TT ‘Таких как я нет. Я один такой.’ #!\n#TTA — сир Джейме Ланнистер"
 LOADING_TIP_39: "#TT Север помнит..."
 LOADING_TIP_40: "#TT ‘Рождённый среди дыма и соли? Как окорок?’ #!\n#TTA — король Ренли Баратеон"
 LOADING_TIP_41: "#TT ‘Если ты собираешься взять человеческую жизнь, сам загляни в глаза осуждённого. Если же ты не в силах этого сделать, тогда человек, возможно, и не заслуживает смерти.’ #!\n#TTA — лорд Эддард Старк"
 LOADING_TIP_42: "#TT ‘Король Джейхейрис как-то сказал мне, что безумие и величие — это две стороны одной монеты. Каждый раз, когда рождается новый Таргариен, боги подбрасывают монету, и весь мир, затаив дыхание, следит, какой стороной она ляжет.’ #!\n#TTA — сир Барристан Селми"
 LOADING_TIP_43: "#TT ‘Убей в себе мальчика, Джон Сноу. Зима почти пришла. Убей в себе мальчика и дай родиться мужчине.’ #!\n#TTA — мейстер Эймон"
 LOADING_TIP_44: "#TT ‘Но Дейнерис Таргариен — не служанка. Она вдова дотракийского кхала, мать драконов и разрушительница городов, Эйгон Завоеватель с сиськами...’ #!\n#TTA — Тирион Ланнистер"
 LOADING_TIP_45: "#TT ‘Честь?! Я правлю Семью Королевствами. Один король — семь королевств! Ты думаешь, их усмиряет честь? Честь сохраняет мир? Нет, это страх. Страх и кровь.’ #!\n#TTA — король Роберт Баратеон"
 LOADING_TIP_46: "#TT ‘Власть помещается там, где человек верит, что она помещается... Тень на стене, но тени могут убивать. И порой очень маленький человек отбрасывает очень большую тень.’ #!\n#TTA — Варис"
 LOADING_TIP_47: "#TT ‘Слова словно стрелы. Если сорвались, уже не вернёшь.’ #!\n#TTA — принц Доран Мартелл"
 LOADING_TIP_48: "#TT ‘Одного мужа я скормила драконам, а другого, чего доброго, сама съем.’ #!\n#TTA — Рейна Таргариен"
 LOADING_TIP_49: "#TT ‘Боги, как я был силён тогда.’ #!\n#TTA — Бобби Б."
 LOADING_TIP_50: "#TT ‘Многие, прошедшие испытания, желали бы обойтись без них.’ #!\n#TTA — лорд Лионель Стронг"
 LOADING_TIP_51: "#TT ‘Боги ещё не создали человека, который не стремится к абсолютной власти.’ #!\n#TTA — сир Отто Хайтауэр"
 LOADING_TIP_52: "#TT ‘Лорд Молот, мои соболезнования. Вы пали в битве.’ #!\n#TTA — Джон Рокстон по прозвищу Храбрый"
 LOADING_TIP_53: "#TT ‘Сомневаться в моей добродетели это измена.’ #!\n#TTA — принцесса Рейнира Таргариен"
 LOADING_TIP_54: "#TT ‘Я никогда не встречал никого сильнее моих милых племянников. Так выпьем же до дна за троих юных костоломов.’ #!\n#TTA — принц Эймонд Таргариен"
 LOADING_TIP_55: "#TT ‘Теперь Эйгон король? Или нам придётся преклонить колени и целовать щель старой шлюхи?’ #!\n#TTA — принц Эймонд Таргариен"
 LOADING_TIP_56: "#TT Куда отправляются все шлюхи?"
 LOADING_TIP_57: "#TT Если вы испытываете технические трудности — зовите Лунатика."
 LOADING_TIP_58: "#TT ‘Он не Роберт Второй, он Эйрис Третий.’ #!\n#TTA — Тирион Ланнистер о Джоффри"
 LOADING_TIP_59: "#TT ‘Неведомо для всех в те дни правил шут — невидимый король в разноцветных одеяниях.’ #!\n#TTA — Грибок"
 LOADING_TIP_60: "#TT ‘Я намереваюсь дать простонародью мир, еду и правосудие.’ #!\n#TTA — король Эйгон «Драконья Погибель»"
 LOADING_TIP_61: "#TT ‘С которым из этих стариков мне драться по вашей воле?’ #!\n#TTA — сир Бракстон Бисбери по прозвищу «Жало», перед смертью от рук короля Джейхейриса I"
 LOADING_TIP_62: "#TT ‘Все мы, великие и малые, обязаны исполнять свой долг.’ #!\n#TTA — король Станнис Баратеон"
 LOADING_TIP_63: "#TT ‘У королей нет друзей, только подданные и враги.’ #!\n#TTA — король Станнис Баратеон"
 LOADING_TIP_64: "#TT Ох."
 LOADING_TIP_65: "#TT ‘Когда солнце закатилось, ни одна свеча его не заменит.’ #!\n#TTA — сир Лорас Тирелл"
 LOADING_TIP_66: "#TT ‘Когда это волков волновали слова?’"
 LOADING_TIP_67: "#TT ‘Они умерли в тот день, когда мы выступили в поход, мальчик.’ #!\n#TTA — лорд Криган Старк «Кровавому» Бену Блэквуду"
 LOADING_TIP_68: "#TT ‘Единственное, в чем я с тобой соглашусь.’"
 LOADING_TIP_69: "#TT ‘У вас ведь только один глаз потерян. Как можно быть настолько слепым?’ #!\n#TTA — сир Отто Хайтауэр принцу Эймонду Таргариену"
 LOADING_TIP_70: "#TT Может быть, я никогда не видел верблюда, но я узнаю верблюда, когда чувствую его запах."
 LOADING_TIP_71: "#TT ‘В пекло Королевскую гвардию. В пекло город. В пекло короля.’"
 LOADING_TIP_72: "#TT ‘А затем раздавил её ебучую башку. Вот так.’"
 LOADING_TIP_73: "#TT ‘Без вопросов? Нет. Я бы спросил за сколько.’ #!\n#TTA — сир Бронн Черноводный"
 LOADING_TIP_74: "#TT ‘Мирная земля, тихий народ.’"
 LOADING_TIP_75: "#TT ‘Мы марионетки в руках тех, кто жил до нас, а когда-нибудь наши дети запляшут на нитках, натянутых нами.’ #!\n#TTA — Тирион Ланнистер"
 LOADING_TIP_76: "#TT ‘Объясни мне, почему убить десять тысяч человек на поле битвы — это благородно, а дюжину за обеденным столом — нет.’ #!\n#TTA — лорд Тайвин Ланнистер"
 LOADING_TIP_77: "#TT Лорд Тайвин Ланнистер, в конце концов, испражнялся не золотом."
 LOADING_TIP_78: "#TT ‘Шторм — это я, милорд. Первый и он же последний.’ #!\n#TTA — Король Эурон «Вороний Глаз»"
 LOADING_TIP_79: "#TT ‘План толстяка? Тот, что меняется каждый раз, когда поворачивается луна?’ #!\n#TTA — сир Тристан Риверс"
 LOADING_TIP_80: "#TT ‘Эгг, мне снилось, что я стал стариком.’"
 LOADING_TIP_81: "#TT ‘Забери меня отсюда, увези в земли вечной зимы.’"
 LOADING_TIP_82: "#TT ‘Возможно, если поищут в семи преисподнях.’"
 LOADING_TIP_83: "#TT ‘Десять тысяч ваших детей нашли смерть у меня в руке, ваше величество. Пока ты храпел, я слизывала твоих сыновей с лица и пальцев одного за другим, всех твоих бледных липких принцев. Ты пользовался своими правами, а я в темноте поедала твоих наследников.’ #!\n#TTA — королева Серсея Ланнистер"
 LOADING_TIP_84: "#TT ‘Все мужчины, по правде говоря, дураки, но шуты забавнее тех, кто носит короны.’ #!\n#TTA — Королева Шипов"
 LOADING_TIP_85: "#TT ‘Чем больше она пила, тем больше она гадила, но чем больше выходило, тем сильнее становилась её жажда.’"
 LOADING_TIP_86: "#TT ‘Когда зайдет солнце, твой род прервётся.’"
 LOADING_TIP_87: "#TT ‘Может, и пьянь, но упившиеся люди не знают страха. Дурачье, о да, но и дурак может убить короля! Крысы, что тоже верно, но тысяча крыс и медведя повалит.’ #!\n#TTA — Грибок"
 LOADING_TIP_88: "#TT ‘Я не лишён милосердия, прогремел он, хотя все знали, что он лишён его напрочь.’ #!\n#TTA — Кейтилин Старк о Станнисе Баратеоне"
 LOADING_TIP_89: "#TT ‘У них всех не хватит людей чтобы ограбить амбар.’ #!\n#TTA — король Станнис Баратеон"
 LOADING_TIP_90: "#TT ‘Хороший поступок не может смыть дурного, как и дурной не может замарать хороший. И за тот, и за другой положена своя награда.’ #!\n#TTA — король Станнис Баратеон"
 LOADING_TIP_91: "#TT ‘Во тьме пляшут мёртвые. Уж я то знаю, я-то знаю.’ #!\n#TTA — Пестряк"
 LOADING_TIP_92: "#TT ‘Жаль, что он не родился Фоссовеем — тогда он считал бы себя яблоком и всем было бы намного легче.’ — #!\n#TTA Принц Дейрон Пьяница о принце Эйрионе «Ярком Пламени»"
 LOADING_TIP_93: "#TT ‘Эдд, раздобудь мне плаху.’ #!\n#TTA — Лорд-командующий Джон Сноу"
 LOADING_TIP_94: "#TT ‘Есть ли в деревне золото? Серебро? Драгоценные камни? Провизия? Где лорд Берик? Куда он отправился? Сколько с ним людей? Сколько рыцарей? Сколько лучников? Сколько, сколько, сколько, сколько? Есть ли в деревне золото?’"
 LOADING_TIP_95: "#TT ‘Королевская гвардия не бежит.’ #!\n#TTA — Лорд-командующий Герольд «Белый Бык»"
 LOADING_TIP_96: "#TT ‘Обещай мне, Нед.’"
 LOADING_TIP_97: "#TT ‘Только Кэт.’"
 LOADING_TIP_98: "#TT Хехе."
 LOADING_TIP_99: "#TT Дуб и железо, храните меня от смерти и адова огня."
 LOADING_TIP_100: "#TT ‘Так что не споют песен о твоей доблестной гибели, Делатель Королей. Десятки тысяч на твоей совести.’ #!\n#TTA — сир Пейт из Длинного Листа"
 LOADING_TIP_101: "#TT ‘Короли и трупы всегда собирают большую свиту.’ #!\n#TTA — сир Давос Сиворт"
 LOADING_TIP_102: "#TT ‘Когда воссияет красная звезда и опустится тьма, Азор Ахай возродится вновь среди дыма и соли и пробудит драконов из камня.’"
 LOADING_TIP_103: "#TT ‘Роберт - это чистая сталь. Станнис - чугун, черный и прочный, но хрупкий. Он ломается, но не гнется. А Ренли - это медь. Она блестит и приятна для глаз, но в конечном счете немногого стоит’ #!\n#TTA — Донал Нойе"
 LOADING_TIP_104: "#TT ‘Я собираюсь убить это.’ — принц Оберин Мартелл перед своей смертью от рук сира Григора Клигана."
 LOADING_TIP_105: "#TT ‘Я хочу жить вечно в землях, где лето длится тысячу лет. Я хочу замок в облаках, откуда виден весь мир. Я хочу опять стать двадцатишестилетним. Когда мне было двадцать шесть, я мог сражаться весь день и трахаться всю ночь. То, чего люди хотят, не имеет значения. Зима почти пришла, мальчик. А зима — это смерть.’ #!\n#TTA — лорд Хьюго Вулл по прозвищу «Большое Ведро»"
 LOADING_TIP_106: "#TT ‘Я поднялся слишком высоко, любил слишком сильно, отважился слишком на многое. Я хотел ухватить звезду, но, переоценив свои силы, потянулся чересчур далеко и упал.’ #!\n#TTA — сир Джон Коннингтон"
 LOADING_TIP_107: "#TT  ‘Значит, пусть умрет. Быть может, эта сука заявится на похороны.’ #!\n#TTA — король Мейгор «Жестокий» перед тем, как отдать приказ о казни принца Визериса Таргариена"
 LOADING_TIP_108: "#TT Когда молот обрушится на дракона, придет новый король, и никто не встанет у него на пути."
 LOADING_TIP_109: "#TT Горят свечи из стекла. Скоро появится бледная кобыла, а за ней остальные. Кракен и тёмное пламя, лев и грифон, сын солнца и скомороший дракон. Не верь никому из них. Помни Бессмертных. Остерегайся надушенного сенешаля."
 LOADING_TIP_110: "#TT Шестнадцать у него, и трое у тебя. Золотыми будут их короны и золотыми их саваны. А когда ты утонешь в слезах, на твоей бледной шее сомкнёт свои руки валонкар и задушит в тебе жизнь."
 LOADING_TIP_111: "#TT ‘Я не видел короля и не заработал ни гроша. Но это была война. Это была война.’"
 LOADING_TIP_112: "#TT А она никогда не хотела уходить, никогда не хотела уходить."
 LOADING_TIP_113: "#TT ‘Ренли предложил мне персик.’"
 LOADING_TIP_114:2 "#TT ‘Что такое жизнь одного бастарда по сравнению с королевством?’"
 LOADING_TIP_115: "#TT ‘Некоторые люди - как мечи, они созданы для боя. Повесь их на стенку - и они заржавеют.’"
 LOADING_TIP_116: "#TT ‘Старайтесь, сир Лейнор. Рано или поздно родится похожий на вас.’ #!\n#TTA — королева Алисента Хайтауэр"
 LOADING_TIP_117: "#TT ‘Мы можем начать прямо здесь, вчетвером. Я против вас троих. Довольно ли этого для битвы?’ #!\n#TTA — Лорд-командующий Кристон Коль"
 LOADING_TIP_118: "#TT ‘Мой новый десница – стальной кулак.’ #!\n#TTA — король Эйгон II Таргариена"
 LOADING_TIP_119: "#TT Остерегайтесь. Каннибал."
 LOADING_TIP_120: "#TT ‘Царствовал Визерис всего лишь год, но правил он все пятнадцать, пока Дейрон воевал, а Бейлор молился.’"
 LOADING_TIP_121: "#TT ‘Другие знатные семьи зарывают своих покойников в сырую землю или топят в холодном зеленом море — но Таргариены ведут свой род от дракона, и их хоронят в огне.’"
 LOADING_TIP_122: "#TT ‘Я убью каждого Таргариена, до которого сумею добраться, чтобы все они умерли, как их драконы, и охотно помочусь на могилу каждого.’"
 LOADING_TIP_123: "#TT ‘Дунк-чурбан, темный, как погреб’"
