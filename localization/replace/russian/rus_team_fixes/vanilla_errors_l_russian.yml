 playdate.3013.desc:0 "Мы играем в лесу, и вдруг я оказываюсь в полном одиночестве. Мне все казалось, что остальные следуют за мной!\n\nЯ готовлюсь закричать — чтобы остальные нашли меня, а вовсе не потому, что мне #EMP страшно#!, — но вдруг мне встречается [witch.Custom2('MyCharacterIntroduction', ROOT.Char)|l] в черном плаще. [witch.GetSheHe|U] стоит на коленях и рассматривает какое-то странное растение, сравнивает его с картинкой из большой черной книги, лежащей тут же на земле.\n\n«Приветствую вас, [Select_CString(ROOT.Char.IsFemale, 'миледи', 'милорд' )]. Зов знаний привел вас ко мне?»"
 health.1004.court_physician.desc:0 "\n\n«Боюсь, проказа неизлечима, [Select_CString(ROOT.Char.IsFemale, 'миледи', 'милорд' )]. Но я знаю, как ослабить ее симптомы»."
 THIRD_BECOMES_INDEPENDENT:1 "[CHARACTER.GetUIName] теперь [Select_CString(CHARACTER.IsFemale, Concept( 'independent', 'независимая' ), independent )|El]"
 THIRD_BECAME_INDEPENDENT:1 "[CHARACTER.GetUIName] теперь [Select_CString(CHARACTER.IsFemale, Concept( 'independent', 'независимая' ), independent )|El]"
 child_personality.7020.desc:0 "«Ах ты [child.Custom('InsultNoun')|l]! Сколько еще ты будешь путаться у меня под ногами?! Ну всё, сейчас я тебя проучу…» — кричит [evil_person.GetFirstName], хватая палку.\n\nЧто я такого [Select_CString(ROOT.Char.IsFemale, 'сделала', 'сделал' )]? Я просто [Select_CString(ROOT.Char.IsFemale, 'хотела', 'хотел' )] узнать, чем [evil_person.GetFirstNameNoTooltip] занимается! [evil_person.GetSheHe|U] быстро приближается, поднимая палку для удара! На помощь!\n\n«Если скажешь кому-нибудь, кто это сделал, — тебе конец, понятно?!» — зловеще ухмыляется [evil_person.GetSheHe|l]."
