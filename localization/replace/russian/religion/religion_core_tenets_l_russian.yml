 tenet_jewish_syncretism_name:0 "Иудейский синкретизм"
 tenet_jewish_syncretism_desc:0 "Хоть мы и не готовы признать еврейский народ богоизбранным, заключенная в Торе мудрость неоспорима. Мы можем многое почерпнуть из нее."
 doctrine_parameter_hostility_override_special_doctrine_is_jewish_faith:2 "Считает, что иудейские [faiths|El] — [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|Vl], а не [GetHostilityLevelName( '(int32)3' )|Vl]. Иудейские [faiths|El] отвечают тем же."
 doctrine_parameter_can_use_jewish_artefacts:0 "Может полностью раскрывать потенциал иудейских [Concept( 'artifacts', 'артефактов' )|E]"
 doctrine_parameter_jewish_syncretic_actor_opinion_active:1 "Взаимный бонус [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] к [Concept( 'opinion', 'мнению' )|E] персонажей, принадлежащих к иудейским [Concept( 'faiths', 'конфессиям' )|E]"
 doctrine_parameter_opinion_of_jewish_syncretic_recipient_opinion_active:0 ""
 doctrine_parameter_jewish_syncretic_recipient_opinion_active:1 "Взаимный бонус [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] к [Concept( 'opinion', 'мнению' )|E] персонажей, принадлежащих к [Concept( 'faiths', 'конфессиям' )|E] с [Concept('core_tenet', 'догматом')|E] иудейского синкретизма"
