 tenet_eastern_syncretism_name: "Восточный синкретизм"
 tenet_eastern_syncretism_desc: "Мы можем поучиться тому, как различные дхармические религии соседствуют друг с другом. Возможно, они и не следуют истинной вере, но это не делает их нашими врагами."
 doctrine_parameter_hostility_override_eastern_hostility_doctrine: "Восточные [faiths|El] воспринимаются только как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|Vl]"
 #Instead, add these doctrine parameters to appropriate tenets (presently Dharmic Syncretism).
 doctrine_parameter_is_eastern_faith_bilateral_loc_override: "Считает, что #TOOLTIP:RELIGION_FAMILY,rf_eastern #L восточные#!#! [Concept('faiths', 'конфессии')|E] — [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V], а не $hostility_evil_tooltippable$. Восточные конфессии отвечают тем же"
 doctrine_parameter_hostility_override_special_doctrine_is_eastern_faith: "Считает, что #TOOLTIP:RELIGION_FAMILY,rf_eastern #L восточные#!#! [Concept('faiths', 'конфессии')|E] — [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V], а не $hostility_evil_tooltippable$. Восточные конфессии отвечают тем же"
 doctrine_parameter_eastern_syncretic_actor_opinion_active: "Взаимный бонус [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] к [Concept('opinion', 'мнению')|E] персонажей, принадлежащих к #TOOLTIP:RELIGION_FAMILY,rf_eastern #L восточным#!#! [Concept('faiths', 'конфессиям')|E]"
 doctrine_parameter_opinion_of_eastern_syncretic_recipient_opinion_active: ""
 doctrine_parameter_eastern_syncretic_recipient_opinion_active: "Взаимный бонус [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] к [Concept( 'opinion', 'мнению' )|E] персонажей, принадлежащих к [Concept( 'faiths', 'конфессиям' )|E] с [Concept('core_tenet', 'догматом')|E] дхармического синкретизма"
 doctrine_parameter_opinion_of_eastern_syncretic_actor_opinion_active: ""

 tenet_sinitic_syncretism_name:0 "Синитский синкретизм"
 tenet_sinitic_syncretism_desc:0 "Мы можем многое почерпнуть из древних китайских вероучений, которые на протяжении многих веков наставляли наш народ на путь добра и праведности."
 doctrine_parameter_hostility_override_sinitic_hostility_doctrine:1 "Синитские [Concept('faiths', 'конфессии')|E] воспринимаются только как [GetHostilityLevelName( FAITH_DOCTRINE_PARAMETER.GetIntValue )|Vl]"
 #Instead, add these doctrine parameters to appropriate tenets (presently Dharmic Syncretism).
 doctrine_parameter_is_sinitic_faith_bilateral_loc_override:0 "Считает, что синитские [Concept('faiths', 'конфессии')|E] — [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V], а не $hostility_evil_tooltippable$. Синитские $game_concept_faiths$ отвечают тем же"
 doctrine_parameter_hostility_override_special_doctrine_is_sinitic_faith:0 "Считает, что синитские [Concept('faiths', 'конфессии')|E] — [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V], а не $hostility_evil_tooltippable$. Синитские $game_concept_faiths$ отвечают тем же"
 doctrine_parameter_sinitic_syncretic_actor_opinion_active:0 "Взаимный бонус [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] к [Concept('opinion', 'мнению')|E] персонажей, принадлежащих к синитским [Concept('faiths', 'конфессиям')|E]"
 doctrine_parameter_opinion_of_sinitic_syncretic_recipient_opinion_active:0 ""
 doctrine_parameter_sinitic_syncretic_recipient_opinion_active:0 "Взаимный бонус [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] к [Concept('opinion','мнению')|E] персонажей, принадлежащих к [Concept('faiths','конфессиям')|E] с [Concept('core_tenet','догматом')|E] синитского сикнертизма"
 doctrine_parameter_opinion_of_sinitic_syncretic_actor_opinion_active:0 ""

 tenet_unreformed_syncretism_name:0 "Синкретические традиции"
 tenet_unreformed_syncretism_desc:0 "Кто мы такие, чтобы говорить людям, что их традиции неверны? Мы не должны отрывать их от корней и запрещать обычаи, которым много сотен лет: нам стоит прислушаться к ним и постараться понять."
 doctrine_parameter_hostility_override_unreformed_faith_doctrine:2 "Считает, что [faiths|El], имеющие доктрину «[GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName]», — [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|Vl], а не [GetHostilityLevelName( '(int32)3' )|Vl]. Эти [faiths|El] отвечают тем же."
 doctrine_parameter_hostility_override_west_african_unreformed_faith_doctrine:0 "Считает, что африканские нереформированные [faiths|El] — [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|Vl], а не [GetHostilityLevelName( '(int32)3' )|Vl]. Африканские нереформированные конфессии отвечают тем же."
 doctrine_parameter_unreformed_syncretic_actor_opinion_active:2 "Взаимный бонус [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] к [Concept( 'opinion', 'мнению' )|E] персонажей, чья [Concept( 'faiths', 'конфессия' )|E] [GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName|l]"
 doctrine_parameter_opinion_of_unreformed_syncretic_recipient_opinion_active:0 ""
