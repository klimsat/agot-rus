 # Additional Tenets
 tenet_ritual_cannibalism_name:0 "Ритуальный каннибализм"
 tenet_ritual_cannibalism_desc:0 "Всякий человек несет в себе искру божественного. И потому человеческая плоть священна: ее следует поглощать, а не закапывать или сжигать."
 doctrine_parameter_cannibalism_legal:0 "[GetTrait('cannibal').GetName( GetNullCharacter )] больше не [criminal|El]"

 tenet_exaltation_of_pain_name:0 "Экзальтация от боли"
 tenet_exaltation_of_pain_desc:0 "Боль — универсальная эмоция, а насилие — универсальный язык. Причинить боль другому значит благословить его, а испытать боль значит обрести милость."
 doctrine_parameter_torturing_prisoners_grants_piety:0 "Пытки [Concept( 'prisoners', 'узников' )|E] увеличивают [Concept( 'piety', 'благочестие' )|E], а не тратят его"
 doctrine_parameter_reduced_stress_from_torture:0 "Последователи невосприимчивы к негативным последствиям пыток"
 doctrine_parameter_self_mutilation_active:0 "Можно [Concept( 'decide', 'решить' )|E] устроить самоистязание, получив [Concept( 'piety', 'благочестие' )|E] и [Concept( 'trait', 'свойство' )|E] «[GetTrait('wounded_1').GetName( GetPlayer )]»"
 self_mutilation_active_name: "[GetFaithDoctrine('tenet_exaltation_of_pain').GetBaseName]"
 self_mutilation_minor_piety_gain_tt: "[THIS.Char.GetShortUIName|U] [Select_CString(THIS.Char.IsLocalPlayer, 'получаете', 'получает' )] #P [THIS.ScriptValue('minor_piety_gain')]#! ед. [piety_i] за [Concept('core_tenet', 'догмат')|E] «[GetFaithDoctrine('tenet_exaltation_of_pain').GetBaseName]»"
 self_mutilation_medium_piety_gain_tt: "[THIS.Char.GetShortUIName|U] [Select_CString(THIS.Char.IsLocalPlayer, 'получаете', 'получает' )] #P [THIS.ScriptValue('medium_piety_gain')]#! ед. [piety_i] за [Concept('core_tenet', 'догмат')|E] «[GetFaithDoctrine('tenet_exaltation_of_pain').GetBaseName]»"
 self_mutilation_major_piety_gain_tt: "[THIS.Char.GetShortUIName|U] [Select_CString(THIS.Char.IsLocalPlayer, 'получаете', 'получает' )] #P [THIS.ScriptValue('major_piety_gain')]#! ед. [piety_i] за [Concept('core_tenet', 'догмат')|E] «[GetFaithDoctrine('tenet_exaltation_of_pain').GetBaseName]»"

 tenet_sacred_shadows_name:0 "Святая ложь"
 tenet_sacred_shadows_desc:0 "Ложь — наиболее сложное из существующих искусств. Те, чья ложь кажется правдой, святые. Тот же, кто может успешно лгать самому себе, поистине непобедим."
 doctrine_parameter_piety_gain_from_successful_intrigue_schemes:0 "Последователи получают благочестие, успешно завершая [Concept('intrigue', 'интриганские')|E] [Concept( 'schemes', 'происки' )|E]"
 doctrine_parameter_adherents_more_likely_to_join_schemes:0 "Последователи с большим энтузиазмом присоединяются к чужим [Concept( 'schemes', 'проискам' )|E]"

 tenet_pursuit_of_power_name:0 "Жажда власти"
 tenet_pursuit_of_power_desc:0 "Понятие законности преходяще и зависит от того, в чьих руках эта власть сосредоточена. Это значит, что жажда власти — единственная поистине праведная причина любого действия."

 tenet_pastoral_isolation_name:0 "Религиозное затворничество"
 tenet_pastoral_isolation_desc:0 "Мы желаем лишь уединения. Наши практики — наше дело. Они касаются других не больше, чем чужие дела касаются нас."
 doctrine_parameter_unattractive_for_character_conversions:0 "[characters|E] (но не [counties|El]) охотнее переходят из этой [faiths|El] в другие"

 tenet_natural_primitivism_name:0 "Естественный примитивизм"
 tenet_natural_primitivism_desc:0 "Цивилизация неестественна. Это богомерзкий плод, что породил человек, пытаясь обуздать необузданное естество. Мы провозглашаем натуризм и живем так, как предписывают [ROOT.Faith.PantheonTerm]: дикими и свободными."
 doctrine_parameter_naked_adherents_active:0 "Адепты не носят одежд"
 doctrine_parameter_natural_primitivism_law_cost_increase:0 "Стоимость закона: #N +50%#!"
 #AGOT Modified
 #doctrine_parameter_unlock_jizya_contract:1 "Unlocks the Jizya [vassal_contract|E] and [tax_decree|E]"
 doctrine_parameter_unlock_jizya_contract:1 "Разблокирует [Concept( 'vassal_contract', 'вассальный договор' )|E] и [Concept( 'tax_decree', 'налоговый указ' )|E] ирудира"
 

 #FP3 tenets

 tenet_communal_possessions_name: "Общее владение"
 tenet_communal_possessions_desc: "[ROOT.Faith.HighGodName] желает, чтобы каждый из нас получил равную долю того, что есть на земле. Мы должны делиться всем, в том числе и украденными богатствами сильных мира сего." 
 doctrine_parameter_piety_from_gifts_active: "Приверженцы набирают [Concept( 'piety', 'благочестие' )|E], раздавая [Concept( 'gifts', 'подарки' )|E] и [Concept( 'artifacts', 'артефакты' )|E]"
 doctrine_parameter_piety_from_marrying_lowborn_active: "Правители получают [Concept( 'piety', 'благочестие' )|E], заключая брак с [Concept( 'lowborn', 'худородными' )|E] [Concept( 'characters', 'персонажами' )|E]"

 tenet_sacrificial_ceremonies_name:0 "Церемонии жертвоприношения"
 tenet_sacrificial_ceremonies_desc:0 "Человеческие жертвоприношения, как добровольные, так и принудительные, приближают нас к божественному. Предложить себя на роль жертвы значит исполнить обычай и совершить доброе деяние, и столь же добродетельным является принесение в жертву тех, кто совершил непростительные преступления против богов."
 
 tenet_megaliths_name:0 "Строительство мегалитов"
 tenet_megaliths_desc:0 "Поклонение не должно ограничиваться стенами храмов — эти примитивные людские постройки отвлекают от окружающих нас божественных творений. Мы чествуем камень и чистое небо и размещаем камни, дарованные нашими создателями, так, чтобы порадовать их и стать ближе к постижению божественного."
 doctrine_parameter_can_build_megaliths:0 "Позволяет строить мегалиты в [Concept( 'temple', 'храмовых' )|E] владениях и великие мегалиты в столицах герцогств."
 province_is_of_a_megalith_faith_tt:0 "Это [county|El] должно исповедовать [Concept( 'faith', 'конфессию' )|E], которая верит в значимость мегалитов."

 tenet_fp3_fedayeen_name: "Фидаи"
 tenet_fp3_sacred_murder_name: "Священное убийство"
 tenet_fp3_fedayeen_desc: "Когда обычной войны недостаточно, наш долг перед божеством [ROOT.Faith.HighGodNameAlternate] велит нам уничтожать его врагов путем хитрости и обмана. Мы должны не бояться ни смерти, ни боли и быть готовы расстаться с жизнью ради великого дела." 
 doctrine_parameter_master_assassin_court_position_unlocked: "Открывает [Concept('court_position', 'придворную должность')|E]: #V [GetCourtPositionType( 'master_assassin_court_position' ).GetName()]#!"
 doctrine_parameter_death_is_glory: "Вероятность смерти или ранения в [Concept('battle', 'бою' )|E]: #N +10%#!"
 doctrine_parameter_sanctioned_assassinations: "При убийстве персонажей другой [Concept( 'faith', 'веры' )|E] посредством [Concept( 'schemes', 'происков' )|E] «[GetScheme('murder').GetTypeName]» не теряется [Concept( 'piety', 'благочестие' )|E]"
 
 # EP3 Tenets
 tenet_household_gods_name: "Боги домашнего очага"
 tenet_household_gods_desc: "Мы почитаем наших #EMP ларов#! и #EMP гениев#! — духов-покровителей, защищающих наши жилища. Но превыше всего мы восхваляем нашего славного императора, чьей душе вверена защита всей державы."

 # BP3 Parameter
 doctrine_parameter_allows_brewery: "$allows_brewery$ для [Concept('temple_holdings', 'храмовых владений')|E]"

 # TGP
 immaterial_harmony_name: "Духовная гармония"
 special_doctrine_immaterial_harmony_name: "Духовная гармония"
 special_doctrine_immaterial_harmony_desc: "Наши обычаи никак не противоречат учениям Будды и других мудрецов. Можно практиковать любое из них или даже все вместе без какого-либо вреда для души."
 doctrine_parameter_hostility_override_special_doctrine_immaterial_harmony: "Воспринимает [Concept('faiths', 'конфессии')|E] с доктриной духовной гармонии как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|Vl], а не как [GetHostilityLevelName( '(int32)1' )|Vl], [GetHostilityLevelName( '(int32)2' )|Vl] или [GetHostilityLevelName( '(int32)3' )|Vl], и воспринимается ими так же"

 tenet_extinction_of_dharma_name: "Смерть Дхармы"
 tenet_extinction_of_dharma_desc: "Демоны бродят по земле в обличии благочестивых и набожных. Срази одного, и приблизишься к Будде на шаг, срази десятерых, и приблизишься к Будде на десять шагов."

 tenet_cranial_trophies_name: "Трофейные черепа"
 tenet_cranial_trophies_desc: "Голова — вместилище души. Если отрубить ее и извлечь содержимое, можно заполучить могучую духовную энергию."
 doctrine_parameter_killing_bestows_heads: "Возможность получить [Concept('artifact', 'трофейный череп')|E], [Concept('executing', 'казнив')|E] иного персонажа, сразив его в [Concept('single_combat_duel', 'поединке')|E] или убив в [Concept('battle', 'битве')|E]"
 doctrine_parameter_decapitation_steals_prestige_as_piety: "При получении [Concept('artifact', 'трофейного черепа')|E] убийца получит дополнительное [Concept('piety', 'благочестие')|E] пропорционально [Concept('prestige', 'престижу')|E] покойного"

 tenet_benevolent_governance_name: "Благожелательное правление"
 tenet_benevolent_governance_desc: "У правителей народа есть моральная обязанность поддерживать добро и отрекаться от зла. Только следуя этому принципу, правитель может быть по-настоящему справедливым."
 tenet_filial_piety_name: "Почитание родителей"
 tenet_filial_piety_desc: "Почитание родителей и послушание старшим необходимы для воплощения людской добродетели. Пока наши родители живы, мы чинно им прислуживаем. После смерти мы даруем им подобающее погребение, а затем чинно почитаем."
 tenet_harmonious_society_name: "Гармоничное общество"
 #AGOT Modified
 #tenet_harmonious_society_desc: "Everything must be balanced: individuals, nature, society. The Son of Heaven sets the tempo and we follow his chant."
 tenet_harmonious_society_desc: "Всё должно быть сбалансировано: люди, природа, общество. Небеса задают ритм, и мы поддерживаем их напев."
 doctrine_parameter_sway_scheme_better: "[Concept('scheme_success_chance', 'Шанс на успех происков')|E] «[GetScheme('sway').GetTypeName]»: [success_chance_i]#P +15%#!"
 doctrine_parameter_sway_scheme_piety: "Успешные [Concept('schemes', 'происки')|E] #TOOLTIP:SCHEME_TYPE,sway #L влияния#!#! в отношении ваших [Concept('liege', 'сюзерена')|E] или [Concept('vassals', 'вассалов')|E] приносят [piety_i][Concept('piety', 'благочестие')|E]"
 doctrine_parameter_more_often_zealots: "[Concept('vassals', 'Вассалы')|E] с большей вероятностью будут придерживаться [GetVassalStance( 'zealot' ).GetTextIcon]фанатичных [Concept('vassal_stance', 'взглядов')|E]"
 tenet_harmonious_society_sway_boon: "В вашей [Concept('faith', 'конфессии')|E] есть доктрина «[GetFaithDoctrine('tenet_harmonious_society').GetBaseName]»: $VALUE|+0=$"
 tenet_pursuit_of_knowledge_name: "Жажда знаний"
 tenet_pursuit_of_knowledge_desc: "Те, кто от природы с рождения одарены знаниями, стоят выше всех. Те, кто сознательно ищут знания, стоят на втором месте. Те же, кто глупы и не стремятся научиться, — низшие среди всех людей."
