 doctrine_pluralism_name:0 "Религиозное отношение"
 doctrine_parameter_hostility_towards_us_mult:0 "Последователи других [Concept('faiths', 'конфессий')|E] получат штраф к отношению $VALUE|%V0$"
 doctrine_pluralism_fundamentalist_name:0 "Фундаментализм"
 doctrine_pluralism_fundamentalist_desc:0 "Наша вера единственно верная, и наше слово единственно правильное. [ROOT.Faith.ReligiousText] — единственный источник истины, и любое отклонение является святотатством."
 doctrine_parameter_pluralism_fundamentalist_proselytization_bonus:0 "Скорость обращения графства: #P +20%#!"
 doctrine_parameter_pluralism_fundamentalist_revocation_tyranny_minimal:2 "Можно, не повышая уровня [Concept( 'tyranny', 'тирании' )|El], #P лишать земельных титулов#! неверных, которые в наших глазах $hostility_hostile_tooltippable$ или $hostility_evil_tooltippable$"
 doctrine_parameter_pluralism_fundamentalist_faction_join_chance:1 "[counties|E] иных [Concept( 'faiths', 'конфессий' )|El] #N с большей вероятностью#! вступают во [factions|El]"
 doctrine_parameter_pluralism_fundamentalist_vulnerable_to_heresy:0 "#N Больше угрозы#! от ересей при низком [Concept( 'fervor', 'рвении' )|E]"
 doctrine_pluralism_righteous_name:0 "Праведность"
 doctrine_pluralism_righteous_desc:0 "Мы всего лишь смертные и не можем понять волю [ROOT.Faith.HighGodNamePossessive], но наши [ROOT.Faith.PriestNeuterPlural] вполне способны отличить священное от греховного."
 doctrine_parameter_pluralism_righteous_revocation_tyranny_reduced:2 "Можно, не повышая уровня [Concept( 'tyranny', 'тирании' )|El], #P лишать земельных титулов#! неверных, которые в наших глазах $hostility_evil_tooltippable$"
 doctrine_pluralism_pluralistic_name:0 "Плюрализм"
 doctrine_pluralism_pluralistic_desc:0 "Было бы глупо утверждать, что только мы способны правильно понимать божественную волю, а остальные неправы. У каждого свой способ поклонения."
 doctrine_parameter_pluralism_pluralistic_proselytization_penalty:0 "Скорость обращения графства: #N -20%#!"
 doctrine_parameter_pluralism_pluralistic_faction_join_chance:1 "Графства другой [faiths|El] #P с меньшей вероятностью#! вступают во [factions|El]"
 doctrine_parameter_pluralism_pluralistic_resistant_to_heresy:0 "#P Меньше угрозы#! от ересей при низком [Concept( 'fervor', 'рвении' )|E]"
 doctrine_parameter_pluralism_pluralistic_holy_wars_preserve_vassals:0 "Победа в [Concept( 'holy_war', 'священной войне' )|E] превратит [Concept( 'rulers', 'правителей' )|E]-иноверцев в ваших вассалов: вы не захватите их земли."
 
 doctrine_theocracy_name:0 "Традиции духовенства"
 doctrine_theocracy_temporal_name:0 "Теократия"
 doctrine_theocracy_temporal_desc:0 "Только утвержденные [ROOT.Faith.PriestNeuterPlural] могут следить за соблюдением религиозных доктрин и, следовательно, владеть святыми местами и заботиться о них."
 doctrine_parameter_theocracy_temple_lease:0 "Храмовые [holdings|El] переходят [Concept( 'realm_priest', 'державному священнику' )|E], который становится [Concept( 'vassal', 'вассалом' )|E]-[Concept( 'theocratic', 'теократом' )|E]"
 doctrine_theocracy_lay_clergy_name:0 "Мирское духовенство"
 doctrine_theocracy_lay_clergy_desc:0 "Любой усердный последователь более чем способен понимать, следовать и проповедовать доктрины нашей веры."
 doctrine_parameter_theocracy_temple_ownership:0 "Секулярные [rulers|El] напрямую контролируют храмовые [holdings|El] и получают соответствующие выгоды."
 #Intentionally left blank:
 doctrine_parameter_lay_clergy:0 ""
 doctrine_parameter_allowed_holding_type_church_holding:0 ""
 
 doctrine_clerical_function_name:0 "Функции духовенства"
 doctrine_clerical_function_taxation_name:1 "Контроль"
 doctrine_clerical_function_taxation_desc:1 "[ROOT.Faith.AltPriestTermPlural|U] получают власть от [ROOT.Faith.HighGodNamePossessive] и по исконному праву могут властвовать на земле."
 doctrine_clerical_function_alms_and_pacification_name:0 "Милостыня и усмирение"
 doctrine_clerical_function_alms_and_pacification_desc:0 "Наши [ROOT.Faith.PriestNeuterPlural|l] должны следить за тем, чтобы у бедных и отверженных была еда и крыша над головой."
 doctrine_clerical_function_recruitment_name:0 "Вербовка"
 doctrine_clerical_function_recruitment_desc:1 "[ROOT.Faith.PriestNeuterPlural] должны защищать нашу веру с оружием в руках. Необходимость служить примером другим дает им дополнительную силу в бою."
 doctrine_parameter_clergy_can_fight:0 "$knight_culture_player_plural$ и [commanders|El] могут быть представителями [Concept('clergy', 'духовенства')|E]"
 
 doctrine_clerical_gender_name:0 "Пол духовенства"
 doctrine_clerical_gender_male_only_name:0 "Только мужчины"
 doctrine_clerical_gender_male_only_desc:0 "Только мужчины могут принять на себя тяжкий груз ответственности, что несут на своих плечах [ROOT.Faith.PriestMalePlural] нашей конфессии."
 doctrine_parameter_clergy_must_be_male:0 "Только мужчинам можно передавать храмовые [holdings|El], только мужчины могут занимать должность «[court_chaplain|El]»"
 doctrine_clerical_gender_female_only_name:0 "Только женщины"
 doctrine_clerical_gender_female_only_desc:0 "Только женщины достаточно мудры, чтобы понять волю [ROOT.Faith.HighGodNamePossessive]. Они — [ROOT.Faith.PriestFemalePlural] нашей веры."
 doctrine_parameter_clergy_must_be_female:0 "Только женщинам можно передавать храмовые [holdings|El], только женщины могут занимать должность «[court_chaplain|El]»"
 doctrine_clerical_gender_either_name:0 "Кто угодно"
 doctrine_clerical_gender_either_desc:0 "В [ROOT.Faith.PriestNeuterPlural] может пойти любой, кто слышит божественный зов: в делах духовных пол не имеет значения."
 doctrine_parameter_clergy_can_be_either_gender:0 "Пол не влияет на то, кому можно передавать храмовые [holdings|El] и кого назначать на должность «[court_chaplain|El]»"
 
 doctrine_clerical_marriage_name:0 "Браки духовенства"
 doctrine_clerical_marriage_allowed_name:0 "Разрешены"
 doctrine_clerical_marriage_allowed_desc:0 "Институт брака священен, и [ROOT.Faith.PriestNeuterPlural] должны быть его частью, как и всякий благочестивый верующий."
 doctrine_parameter_clergy_can_marry:0 "Всякий, кто входит в [clergy|El], может [marry|El]"
 doctrine_clerical_marriage_disallowed_name:0 "Запрещены"
 doctrine_clerical_marriage_disallowed_desc:0 "[ROOT.Faith.PriestNeuter] — это тот, кто посвятил свою жизнь служению. Вступать в брак с другим смертным было бы в корне неверно."
 doctrine_parameter_clergy_can_marry_disabled:0 "Никто из тех, кто входит в [clergy|El], не может [marry|El]"
 
 doctrine_clerical_succession_name:0 "Назначение духовенства"
 doctrine_clerical_succession_temporal_appointment_name:0 "Светские, сменяемые"
 doctrine_clerical_succession_temporal_appointment_desc:1 "[ROOT.Faith.BishopNeuterPlural|U], безусловно, являются слугами державы, а потому сюзерен может нанимать или увольнять их — лишь с некоторыми ограничениями."
 doctrine_clerical_succession_spiritual_appointment_name:0 "Духовные, сменяемые"
 doctrine_clerical_succession_spiritual_appointment_desc:0 "Хотя их и избирает [ROOT.Faith.AltPriestTermPlural], негодные [ROOT.Faith.BishopNeuterPlural] все равно могут быть уволены светскими правителями."
 doctrine_clerical_succession_temporal_fixed_appointment_name:0 "Светские, пожизненные"
 doctrine_clerical_succession_temporal_fixed_appointment_desc:0 "Хотя [ROOT.Faith.BishopNeuterPlural] и назначаются правителем, их обязанности священны и неприкосновенны, и потому их назначение нельзя отменить."
 doctrine_clerical_succession_spiritual_fixed_appointment_name:0 "Духовные, пожизненные"
 doctrine_clerical_succession_spiritual_fixed_appointment_desc:0 "[ROOT.Faith.BishopNeuterPlural|U] служат божественной воле и являются ее представителями, и, когда [ROOT.Faith.AltPriestTermPlural] выбирает кандидата на должность, это назначение окончательное и абсолютное."
 doctrine_parameter_clerical_appointment_ruler:0 "[rulers|E] сами назначают своих [Concept( 'realm_priest', 'священников державы' )|El] или [Concept( 'court_chaplain', 'придворных капелланов' )|El]"
 doctrine_parameter_clerical_appointment_head_of_faith:1 "[head_of_faith|E] или духовенство назначают всех кандидатов на должности «[realm_priest|El]» и «[court_chaplain|El]»"
 doctrine_parameter_clerical_appointment_fixed_disabled:1 "[realm_priest|E] или [court_chaplain|El] могут быть уволены и заменены другими персонажами"
 doctrine_parameter_clerical_appointment_fixed:0 "Должности «[realm_priest|El]» и «[court_chaplain|El]» даются пожизненно"

 doctrine_theism_name: "Теизм"
 doctrine_monotheist_name: "Монотеизм"
 doctrine_monotheist_desc: "Поклоняются лишь единому богу. Прочие так называемые «боги» являются в лучшем случае пустыми идолами, а в худшем — происками некоего коварного обманщика, пытающегося отвратить верующих от [ROOT.Char.GetFaith.HighGodNamePossessive].[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_monotheist_warning')]"
 mandala_monotheist_warning: "\n\n$FAITH_MANDALA_MONOTHEIST_WARNING$"
 mandala_monotheist_warning_tt_global: "[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_monotheist_warning')]"
 mandala_monotheist_warning_tt_first: "$mandala_monotheist_warning_tt_global$"
 mandala_monotheist_warning_tt_third: "$mandala_monotheist_warning_tt_global$"
 doctrine_polytheist_name: "Политеизм"
 doctrine_polytheist_desc: "Мироздание полнится могущественными божествами и духами. Это может быть определённый пантеон устоявшихся богов, или вера в то, что духов существует бесчисленное множество, что они пронизывают всё вокруг нас и порой даже не носят имён."

 unreformed_faith_doctrine_name:1 "Нереформированная"
 unreformed_faith_name:1 "доктрина"
 unreformed_faith_doctrine_desc:1 "В нереформированной конфессии отсутствует организованное духовенство и каноны. Различные сообщества могут номинально исповедовать одну веру, но при этом практиковать совершенно разные религиозные обряды и суеверия."
 doctrine_parameter_unreformed:1 "Племенные [rulers|El] не могут менять тип [Concept( 'government', 'правительства' )|E]\n$EFFECT_LIST_BULLET$Дает [unreformed_pagan_combat_bonus|El]"
 doctrine_parameter_hostility_override_tenet_unreformed_syncretism:2 "Неязыческие [faiths|El] с догматом синкретических традиций воспринимаются как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|Vl], а не [GetHostilityLevelName( '(int32)3' )|Vl]"

 west_african_unreformed_faith_doctrine_name:0 "$unreformed_faith_doctrine_name$"
 west_african_unreformed_faith_doctrine_desc:0 "$unreformed_faith_doctrine_desc$"
 
 heresy_hostility_name:0 "Отношение к ереси"
 heresy_hostility_doctrine_name:0 "Ересь"
 heresy_hostility_doctrine_desc:0 "Опасайтесь ложных пророков, что исказят и извратят веру ради собственной выгоды. Те, кто делает это, — еретики, и их должно уничтожать."

 divine_destiny_name:0 "Божественная судьба"
 divine_destiny_doctrine_name:0 "Законные владыки мира"
 divine_destiny_doctrine_desc:0 "Мы несем мир и процветание всем народам. Мы — законные владыки мира."
 doctrine_parameter_divine_destiny_holy_war_cost_reduction:0 "Затраты [Concept( 'piety', 'благочестия' )|E] для начала священной войны: #P -50%#!"
 
 adoptionist_school_name:0 "Адопцианское кредо"
 special_doctrine_adoptionist_school_elipandic_doctrine_name:0 "Элипандистская школа"
 special_doctrine_adoptionist_school_elipandic_doctrine_desc:0 "Уделяя внимание нюансам христологии, $adoptionist$ в элипандистском варианте подчеркивает важность #EMP точных#! отличий от тринитарной догмы. Сложное и тщательно продуманное отличие считается намного предпочтительней простого и неубедительного доказательства."
 special_doctrine_adoptionist_school_felicitous_doctrine_name:0 "Феликсианская школа"
 special_doctrine_adoptionist_school_felicitous_doctrine_desc:0 "Феликсианский $adoptionist$ ставит практичность выше чистоты и понимает необходимость работать внутри враждебной системы, чтобы подорвать ее. Гнусная ложь ради благородных целей считается с тысячи раз ценнее, чем слепая правда."
 special_doctrine_adoptionist_school_radical_doctrine_name:0 "Радикальная школа"
 special_doctrine_adoptionist_school_radical_doctrine_desc:0 "Радикальные $adoptionist_adherent_plural$ не признают иного бога, кроме Отца, не приемлют божественность смертной плоти и считают, что лишь они настоящие $christianity_religion_adherent_plural$. Принять Христа, не согласившись с #EMP каждой#! буквой канона, считается отступничеством."

 special_doctrine_is_christian_faith_name:0 "Учение Иисуса"
 is_christian_faith_name:0 "$special_doctrine_is_christian_faith_name$"
 special_doctrine_is_christian_faith_desc:0 "В мире есть те, кто признает учение Иисуса, но не святость его самого. Мы не должны сурово обрушиваться на этих заблудших, ибо однажды они могут оставить кощунственные идеи и обратиться в истинную веру."
 doctrine_parameter_hostility_override_tenet_christian_syncretism:3 "Нехристианские [faiths|El] с догматом христианского синкретизма воспринимаются как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|Vl], а не [GetHostilityLevelName( '(int32)3' )|Vl]"

 special_doctrine_is_islamic_faith_name:0 "Учение Пророка"
 is_islamic_faith_name:0 "$special_doctrine_is_islamic_faith_name$"
 special_doctrine_is_islamic_faith_desc:0 "Хотя не все люди в этом мире следуют заветам Пророка, многие усердно служат воле Аллаха, сами того не подозревая. Быть может, со временем эти дикари смогут очиститься от скверны и стать правоверными мусульманами!"
 doctrine_parameter_hostility_override_tenet_islamic_syncretism:3 "Неисламские [faiths|El] с догматом исламского синкретизма воспринимаются как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|Vl], а не [GetHostilityLevelName( '(int32)3' )|Vl]"

 special_doctrine_is_jewish_faith_name:0 "Учение Моисея"
 is_jewish_faith_name:0 "$special_doctrine_is_jewish_faith_name$"
 special_doctrine_is_jewish_faith_desc:0 "Не все иноверцы пребывают во грехе. Среди них есть те, кто уважает избранный народ, а значит, заслуживает уважения в ответ."
 doctrine_parameter_hostility_override_tenet_jewish_syncretism:3 "Неиудейские [faiths|El] с догматом иудейского синкретизма воспринимаются как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|Vl], а не [GetHostilityLevelName( '(int32)3' )|Vl]"

 prophecy_of_malachi_name:0 "Пророчество Малахии"
 special_doctrine_not_allowed_to_hof_name:0 "Упразднение священства"
 not_allowed_to_hof_name:0 "$special_doctrine_not_allowed_to_hof_name$"
 prophecy_of_malachi_desc:0 "Согласно доктрине традиционного иудаизма, нового верхового священника можно избрать только с пришествием пророка или при обнаружении потомка Аарона, достойного стать священником."
 special_doctrine_not_allowed_to_hof_desc:0 "Высшее духовенство было полностью упразднено. Чтобы выбрать верховного священника, потребуется сначала восстановить традиционную структуру церкви."
 doctrine_parameter_block_from_create_hof_parameter:0 "Эта конфессия не может восстановить [Concept( 'head_of_faith', 'главу конфессии' )|E] при обычных обстоятельствах."

 special_doctrine_is_eastern_faith_name:0 "Сплетение религий"
 is_eastern_faith_name:0 "$special_doctrine_is_eastern_faith_name$"
 special_doctrine_is_eastern_faith_desc:0 "Нас объединяет не одна религия — духовная жизнь нашего общества соткана из множества конфессий. Мы можем называться разными именами и идти разными путями, которые, подчас, уводят далеко от наших собственных верований, но мы научились сосуществовать, как единый народ."
 doctrine_parameter_hostility_override_tenet_eastern_syncretism:0 "Невосточные [faiths|El] с догматом дхармического синкретизма воспринимаются как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|Vl], а не [GetHostilityLevelName( '(int32)3' )|Vl]"

 special_doctrine_is_sinitic_faith_name:0 "Синитская космология"
 is_sinitic_faith_name:0 "$special_doctrine_is_sinitic_faith_name$"
 special_doctrine_is_sinitic_faith_desc:0 "$special_doctrine_is_eastern_faith_desc$"
 doctrine_parameter_hostility_override_tenet_sinitic_syncretism:0 "Несинитские [faiths|El] с догматом синитского синкретизма воспринимаются как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|Vl], а не [GetHostilityLevelName( '(int32)3' )|Vl]"

 special_doctrine_is_gnostic_faith_name:0 "$tenet_gnosticism_name$"
 is_gnostic_faith_name:0 "$special_doctrine_is_gnostic_faith_name$"
 special_doctrine_is_gnostic_faith_desc:0 "$tenet_gnosticism_desc$"

 special_doctrine_fire_worship_name: "Священное пламя"
 fire_worship_name: "$special_doctrine_fire_worship_name$"
 special_doctrine_fire_worship_desc: "Нас объединяет поклонение огню — самому чистому элементу и символу божественной славы. Наш священный долг велит нам поддерживать вечные огни и рассеивать ложь и зло." 

 doctrine_parameter_same_hof_hostility_override:0 "Воспринимает другие [faiths|El] с общим [Concept( 'head_of_faith', 'главой конфессии' )|E] как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|Vl]"

 is_hostile_to_maitreya_name: "Враждебность к Майтрее"
 special_doctrine_maitreya_hostility_name: "Враждебное отношение к майтреянистам"
 special_doctrine_maitreya_hostility_desc: "Майтреянисты стремятся уничтожить всех прочих последователей учения Будды. И пусть не все они следуют одному пути, воззрения Майтреи неприемлемы."
 special_doctrine_is_maitreya_name: "Майтрея"
 special_doctrine_is_maitreya_desc: "Наш долг — возродить этот мир и способствовать наступлению эпохи Будды Майтреи."

 TOO_FEW_SPOUSES_PIETY:0 "Слишком мало супругов/супруг"

 CRUSADER_STATE_CRUSADER_TITLE_NAME:1 "[target_kingdom.GetNameNoTierNoTooltip] крестоносцев"
 CRUSADER_STATE_FAITH_TITLE_NAME:1 "[title_recipient.GetFaith.GetName|U]. [target_kingdom.GetNameNoTierNoTooltip|U]"

 religion_the_gods:0 "боги"
 religion_the_gods_2:0 "$religion_the_gods$" # Optional translation alt
 religion_the_gods_3:0 "$religion_the_gods$" # Optional translation alt
 religion_the_spirits:0 "духи"
