 global_religion.1000.t: "[local_character.GetFaith.GetAdherentNamePluralNoTooltip] в изгнании"
 global_religion.1000.desc_same_faith_counties: "Более [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] приверженцев #L [local_character.GetFaith.GetName|l]ой#! веры, изгнанных из державы [target_faith_associated_county.GetName], желают поселиться в наших краях. Их [Select_CString(local_character.IsFemale, 'предводительница', 'предводитель' )] по имени [local_character.GetFirstName] [Select_CString(local_character.IsFemale, 'обратилась', 'обратился' )] ко мне с просьбой: «[ROOT.Char.GetTitleAsNameNoTooltip], мы лишь хотим жить в безопасности, — говорит [Select_CString(local_character.IsFemale, 'она', 'он' )]. — Прошу, позвольте нам остаться здесь. Возможно, именно [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] станет нашим новым домом»."
 global_religion.1000.desc_same_faith_counties_alt: "#L [target_faith_associated_county_faith.GetName]ая#! знать во владении [target_faith_associated_county.GetName] устраивает религиозные гонения, требуя, [local_character.GetFaith.GetAdherentNamePlural|l] отказались от своей веры.\n\nТеперь более [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] изгнанных оттуда приверженцев #L [local_character.GetFaith.GetName|l]ой#! веры желают поселиться в наших краях. Их [Select_CString(local_character.IsFemale, 'предводительница', 'предводитель' )] по имени [local_character.GetFirstName] [Select_CString(local_character.IsFemale, 'обратилась', 'обратился' )] ко мне с просьбой: «[ROOT.Char.GetTitleAsNameNoTooltip], мы лишь хотим жить в безопасности, — говорит [Select_CString(local_character.IsFemale, 'она', 'он' )]. — Прошу, позвольте нам остаться здесь. Возможно, именно [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] станет нашим новым домом»."
 global_religion.1000.desc_any_counties: "#L [target_faith_associated_county_faith.GetName]ая#! знать во владении [target_faith_associated_county.GetName] устраивает религиозные гонения, требуя, [local_character.GetFaith.GetAdherentNamePlural|l] отказались от своей веры.\n\nТеперь более [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] изгнанных оттуда приверженцев #L [local_character.GetFaith.GetName|l]ой#! веры желают поселиться в наших краях. Их [Select_CString(local_character.IsFemale, 'предводительница', 'предводитель' )] по имени [local_character.GetFirstName] [Select_CString(local_character.IsFemale, 'обратилась', 'обратился' )] ко мне с просьбой: «[ROOT.Char.GetTitleAsNameNoTooltip], мы лишь хотим жить в безопасности, — умоляет [Select_CString(local_character.IsFemale, 'она', 'он' )]. — Прошу, позвольте нам остаться здесь. Возможно, именно [initial_county_target.GetNameNoTier] станет нашим новым домом».\n\nЕсли я удовлетворю эту просьбу, то #L [local_character.GetFaith.GetName|l]ая#! вера начнет распространяться по всей державе [ROOT.Char.GetPrimaryTitle.GetName]."
 global_religion.1000.desc_any_counties_alt: "Более [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] приверженцев #L [local_character.GetFaith.GetName|l]ой#! веры, изгнанных из державы [target_faith_associated_county.GetName], желают поселиться в наших краях. Их [Select_CString(local_character.IsFemale, 'предводительница', 'предводитель' )] по имени [local_character.GetFirstName] [Select_CString(local_character.IsFemale, 'обратилась', 'обратился' )] ко мне с просьбой: «[ROOT.Char.GetTitleAsNameNoTooltip], мы лишь хотим жить в безопасности, — умоляет [Select_CString(local_character.IsFemale, 'она', 'он' )]. — Прошу, позвольте нам остаться здесь. Возможно, именно [initial_county_target.GetNameNoTier] станет нашим новым домом».\n\nЕсли я удовлетворю эту просьбу, то #L [local_character.GetFaith.GetName|l]ая#! вера начнет распространяться по всей державе [ROOT.Char.GetPrimaryTitle.GetName]."
 global_religion.1000.special: "Я с радостью приму #L [local_character.GetFaith.GetNameNoTooltip|l]ое#! учение!"
 global_religion.1000.a: "Мы будем рады предоставить вам кров."
 global_religion.1000.b: "Мы не можем вас принять."
 global_religion.1000.violent: "Беззащитные изгнанники? Ограбим их."
 global_religion.1000.serenity_aspect: "Можете поселиться в нашей столице, городе [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."

 is_faith_dominant_gender_tt: "Пол [Select_CString(THIS.Char.IsLocalPlayer, '', 'персонажа ' )][THIS.Char.GetNamePossessiveNoFormat][Select_CString(THIS.Char.IsLocalPlayer, 'его персонажа', '' )] ([THIS.Char.Custom('FemaleMale')|l]) преобладает в [Select_CString(THIS.Char.IsFemale, 'ее', 'его' )] [Concept('faith', 'конфессии')|E] #weak ([THIS.Char.GetFaith.GetName|l])#!"

