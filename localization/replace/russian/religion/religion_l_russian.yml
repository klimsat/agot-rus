 doctrine_pilgrimage_name:0 "Отношение к паломничествам"
 doctrine_pilgrimage_local_rites_name: "Местные ритуалы"
 doctrine_pilgrimage_local_rites_desc: "Последователи этой конфессии предпочитают комфорт и надежность регулярных обрядов в местных святилищах опасным и долгим паломничествам."
 doctrine_parameter_local_shrine_offering:0 "Доступ к [Concept('decision', 'решению')|E] «[GetDecisionWithKey('visit_local_shrine_decision').GetName]», но [Concept('pilgrimage', 'паломнические')|E] [Concept('activity', 'занятия')|E] стоят дороже"
 local_shrine_offering_name:0 "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_local_rites_name$"
 doctrine_pilgrimage_forbidden_name:0 "Запрещены"
 doctrine_pilgrimage_forbidden_desc:0 "Присутствие [ROOT.Faith.HighGodNamePossessive] можно ощутить всюду, и сама идея о том, что какие-то места являются более божественными, является ересью."
 doctrine_pilgrimage_encouraged_name:0 "Поощряются"
 doctrine_pilgrimage_encouraged_desc:0 "Эта конфессия поощряет своих последователей посещать мирские места, обладающие духовной значимостью, чтобы показать свою преданность."
 doctrine_pilgrimage_mandatory_name:0 "Обязательны"
 doctrine_pilgrimage_mandatory_desc:0 "Все здоровые [ROOT.Faith.GetAdherentNamePlural|l] обязаны при первой же возможности совершить путешествие к святому месту. Невозможность совершить паломничество равносильна отказу отдать себя на волю [ROOT.Faith.HighGodNamePossessive]."
 doctrine_pilgrimage_mandatory_hajj_name:0 "Хадж"
 doctrine_pilgrimage_mandatory_hajj_desc:0 "Каждый здоровый мусульманин должен при жизни совершить хадж в Мекку. Хотя исключения по особым случаям не редки, любой [ROOT.Faith.GetAdherentNameNoTooltip|l], не сумевший совершить хадж, столкнется с недоверием окружающих."
 forbidden_from_pilgrimage_name:0 "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_forbidden_name$"
 doctrine_parameter_forbidden_from_pilgrimage:0 "Нет доступа к таким [Concept('activity', 'занятиям')|E], как [Concept('pilgrimage', 'паломничества')|E][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_pilgrimage_warning')]"
 doctrine_parameter_can_go_on_pilgrimage:0 "Есть доступ к таким [Concept('activity', 'занятиям')|E], как [Concept('pilgrimage', 'паломничества')|E]"
 mandatory_pilgrimage_name:0 "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_mandatory_name$"
 doctrine_parameter_mandatory_pilgrimage:1 "[trait|E] «[GetTrait('pilgrim').GetName( GetNullCharacter )]» дает дополнительные бонусы, а [Concept('activity', 'завершение')|E] [Concept( 'pilgrimage', 'паломничества' )|E] приносит больше [Concept('piety', 'благочестия')|E]."
 mandatory_hajj_name:0 "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_mandatory_name$"
 doctrine_parameter_mandatory_hajj:1 "[trait|E] «[GetTrait('hajjaj').GetName( GetNullCharacter )]» дает дополнительные бонусы, а [Concept('activity', 'завершение')|E] [Concept( 'hajj', 'хаджа' )|E] приносит больше [Concept('piety', 'благочестия')|E]."
 doctrine_parameter_basic_pilgrimage_rewards:0 ""
 mandala_pilgrimage_warning: "\n@alert_icon! #alert_trial Обращение в [Concept('faith', 'конфессию')|E], запрещающую паломничества, помешает вам расти как [Concept('ruler', 'правителю')|E] [Concept('mandala_government', 'мандалы')|E]#!\n"

 special_doctrine_has_jizya_doctrine_name: "$tenet_tax_nonbelievers_jizya_name$"
 special_doctrine_jizya_name: "$tenet_tax_nonbelievers_jizya_name$"
 special_doctrine_jizya_desc: "$tenet_tax_nonbelievers_desc$"
 has_jizya_doctrine_name: "$tenet_tax_nonbelievers_jizya_name$"
 doctrine_funeral_name: "Погребальные традиции"
 doctrine_funeral_stoic_name: "Стоическое погребение"
 doctrine_funeral_stoic_desc: "Тело умерло, но душа продолжает жить. Смерть — это время не для скорби и плача. Похороны должны почтить мертвого и предать его тело земле в ходе тихой и скромной церемонии."
 doctrine_funeral_bewailment_name: "Погребение с оплакиванием"
 doctrine_funeral_bewailment_desc: "Душа начала свой путь, и мы никогда не увидим ее в мире живых. Важно, чтобы все знакомые покойного проявили свою скорбь и публично оплакали его. Так они выкажут почтение и очистят свои души от скорби."
 doctrine_funeral_cremation_name: "Кремация"
 doctrine_funeral_cremation_desc: "Из праха мы явились, и в прах мы обратимся. Тела умерших сжигаются на погребальных кострах, а пепел рассеивается по земле, чтобы умерший продолжил свой путь."
 doctrine_funeral_sky_burial_name: "$tenet_sky_burials_name$"
 doctrine_funeral_sky_burial_desc: "$tenet_sky_burials_desc$"
 doctrine_funeral_mummification_name: "Мумификация"
 mummification_funeral_name: "Мумификация"
 doctrine_funeral_mummification_desc: "Тело прекратило функционировать, но остается сосудом, через который дух отправится в мир иной. Поэтому физическая форма должна быть столь же неизменна, как душа, ожидающая, что решит [ROOT.Faith.FateGodName]."
 doctrine_family_rites_name: "Семейные обряды"
 doctrine_family_rites_desc: "Смерть — это время траура и ритуалов для близких усопшего. При этом семейная иерархия имеет столь же важное значение в посмертии, как и при жизни, поэтому к старым людям следует относиться с почтением даже после их смерти."
 doctrine_parameter_burial_funeral: ""
 doctrine_parameter_stoic_funeral: "[Concept( 'activity', 'Проведение' )|E] [Concept( 'funeral', 'похорон' )|E] дает больше возможностей для получения [Concept( 'piety', 'благочестия' )|E]"
 doctrine_parameter_bewailment_funeral: "[Concept( 'activity', 'Проведение' )|E] [Concept( 'funeral', 'похорон' )|E] дает больше возможностей для снижения [Concept( 'stress', 'стресса' )|E]"
 doctrine_parameter_cremation_funeral: "[Concept( 'activity', 'Проведение' )|E] [Concept( 'funeral', 'похорон' )|E] расходует меньше [Concept( 'gold', 'золота' )|E]"
 doctrine_parameter_mummification_funeral: "[Concept( 'activity', 'Проведение' )|E] [Concept( 'funeral', 'похорон' )|E] расходует больше [Concept( 'gold', 'золота' )|E], а его завершение вознаграждает вас ценными [Concept( 'artifacts', 'артефактами' )|E]"
 doctrine_parameter_family_rites: "[Concept('activity', 'Проведение')|E] [Concept('funeral', 'похорон')|E] дает возможность получить [Concept('merit', 'заслуги')|E]"
