l_russian:
 bell_special_yearly.1000.t:0 "Колокол владения [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 #AGOT Modified
 #bell_special_yearly.1000.desc:0 "My [steward.GetCouncilTitle] [steward.GetFirstName] has suggested I survey a nearby abandoned church from the time of the Visigoths.\n\nAmidst the barrel-vaulted ceiling and the horseshoe arches, there is a once-beauteous bell tower, with several ruined bells missing their clappers.\n\nAs I wander through the ruin, I hear a clattering of hooves. Peering through a hole, I see [faction_member_1.GetTitledFirstName] is approaching. Might [faction_member_1.GetSheHe] think this place could be a hideout for his traitorous faction?"
 bell_special_yearly.1000.desc:0 "[Select_CString(steward.IsFemale, 'Моя', 'Мой' )] [steward.GetCouncilTitle|l] [steward.GetFirstName] [Select_CString(steward.IsFemale, 'предложила', 'предложил' )] мне осмотреть ближайшую брошенную септу, выстроенную во времена андалов.\n\nСреди сводчатых потолков и арочных сводов находится некогда прекрасная колокольня с несколькими поврежденным колоколами, оставшимися без языков.\n\nПрохаживаясь среди развалин, я слышу звук копыт. Через дыру в стене я вижу, что приближается [faction_member_1.GetTitledFirstName]. Возможно, [faction_member_1.GetSheHe|l] считает это место подходящим убежищем для своей фракции предателей?"
 # [faction_member_1_faction.GetName]
 bell_special_yearly.1000.a:0 "Я могу убить [faction_member_1.GetHerHis|l], и никто не узнает!"
 bell_special_yearly.1000.a.tt:0 "Вы подкрадываетесь к персонажу [faction_member_1.GetTitledFirstName] и пытаетесь убить [faction_member_1.GetHerHis|l]"
 bell_special_yearly.1000.b:0 "Мне стоит незаметно ретироваться."

 #AGOT Modified
 #bell_special_yearly.1500.desc:0 "I hide in the church antechamber, and can her only the thudding of my murderous heart, and [faction_member_1.GetTitledFirstNamePossessive] footsteps.\n\nAs [faction_member_1.GetSheHe] steps into the room, I strike [faction_member_1.GetHerHis] head with a piece of debris, and [faction_member_1.GetSheHe] is knocked to the ground.\n\nAs I strike again and again, a fleeting fancy clouds my blood-tinted visions. A dream of this old bell-tower making music again, with all of my foes' heads as the clappers."
 bell_special_yearly.1500.desc:0 "Я прячусь сразу за входом в септу и слышу лишь биение своего жаждущего убийства сердца и шаги — [faction_member_1.GetTitledFirstName] приближается.\n\nКогда [faction_member_1.GetSheHe|l] входит в помещение, я бью [faction_member_1.GetHerHis|l] по голове обломком камня, и [faction_member_1.GetSheHe|l] падает наземь.\n\nЯ бью снова и снова, мои глаза застилает кровавая пелена. Передо мной является образ септы, в ней снова бьют колокола, а вместо языков у них головы моих врагов."
 bell_special_yearly.1500.a:0 "Еще один глупец из фракции вольется в мой ансамбль!"
 bell_special_yearly.1500.a.tt:0 "Вы выискиваете новую жертву."
 bell_special_yearly.1500.discovery.tt:0 "Шанс раскрытия увеличивается"
 bell_special_yearly.1500.b:0 "Стоит вернуться домой и отдохнуть."
 bell_special_yearly.1500.b.tt:0 "Вы прекращаете собирать головы для колокола."

 bell_special_yearly.2000.desc:1 "По моему требованию [Select_CString(faction_member_2.IsFemale, 'мерзкая', 'мерзкий' )] [faction_member_2.GetTitledFirstName] прибывает ко двору. Я же переодеваюсь трубадуром. «[ROOT.Char.GetTitledFirstName] требует, чтобы вы услышали эту чудесное произведение, изобретенное в славной столице!»\n\nКогда [faction_member_2.GetSheHe|l] проходит внутрь, я вынуждаю [faction_member_2.GetHerHis|l] остаться в одиночестве. Затем я часами исполняю скучнейшие #italic кансо#!, пока [faction_member_2.GetSheHe|l] не уснет.\n\nЯ работаю быстро: душу врага одной из струн лютни, прячу голову жертвы [Select_CString(ROOT.Char.IsFemale, 'у себя под платьем', 'в складках плаща' )] и стрелой проношусь по коридорам."
 bell_special_yearly.2000.a:0 "Колоколу нужно больше голов!"
 bell_special_yearly.2000.b:0 "Такое прелестное преступление — не стоит рисковать и портить его."

#Dropping an organ out of a window
 bell_special_yearly.3000.desc:0 "[faction_member_3.GetTitledFirstName] принимает меня с монаршим визитом под предлогом снизить напряженность с [faction_member_3.GetHerHis|l] мятежной фракцией. В перерыве между переговорами я осматриваю [faction_member_3.GetHerHis|l] музыкальную комнату и прошу позволить мне помузицировать в одиночестве.\n\nИз комнаты открывается большое окно в сад, а рядом с окном стоит большой орган. Момент просто идеальный.\n\nКогда [faction_member_3.GetFirstNameNoTooltip] прогуливается под окном, наслаждаясь мигом одиночества, я сталкиваю орган. [faction_member_3.GetTitledFirstName] погибает под рухнувшим на н[faction_member_3.GetHerHis|l] инструментом. Хихикая от восторга, я спешу забрать голову, пока никто не заметил это происшествие."
 bell_special_yearly.3000.a:0 "Колокол будет великолепным!"
 bell_special_yearly.3000.b:0 "Странные происшествия с органами — обыденность."

#[faction_member_3_faction.GetName]
 bell_special_yearly.4000.desc:0 "Я прогуливаюсь по саду, бездумно касаясь роз и срывая их одну за другой.\n\nЯ думаю о том, что делать с моей колокольней. Услышат ли когда-нибудь ее звон?"
 bell_special_yearly.4000.desc_discoverer:0 "\n\nРазмышляя над вопросом, я замечаю, как [bell_discoverer.GetTitledFirstName], [Select_CString(bell_discoverer.IsFemale, 'продолжающая', 'продолжающий' )] оплакивать пропавших жертв, смотрит на меня с другого конца сада. Я усмехаюсь, борясь с желанием обо всем [bell_discoverer.GetHerHim|l] рассказать."
 #AGOT Modified
 #bell_special_yearly.4000.a:0 "I should put on a grand concert at the church!"
 bell_special_yearly.4000.a:0 "Стоит дать грандиозный концерт в септе!"
 bell_special_yearly.4000.a.tt:0 "Все узнают о ваших убийствах."
 bell_special_yearly.4000.b:0 "Никто не должен знать о моих личных забавах."
 bell_discovery_success_effect:0 "Колокол остается тайной"
 bell_discovery_failure_effect:0 "Колокол обнаружен"


 #AGOT Modified
 #bell_special_yearly.5000.desc:0 "I ride out one night to visit my bell and bask in its resplendent villainy. To my surprise, there are torches flickering already as I enter the ruin.\n\nAt first, I imagine the ghosts of the Visigoths are displeased I have defiled their church, but then [bell_discoverer.GetTitledFirstName] pulls back a hood. "I feel I have traveled to [bell_discoverer.GetFaith.NegativeAfterLife] and will be there all my life, after uncovering the abomination you have wrought. You shall join your victims, creature!"\n\nI am briefly aware of a slice of steel through my neck, and then nothing at all."
 bell_special_yearly.5000.desc:0 "Однажды ночью я скачу к своему колоколу, чтобы насладиться сим великолепным злодеянием. К моему удивлению, в развалинах уже горят факелы.\n\nПоначалу мне кажется, что это призраки андалов недовольны осквернением септы, но затем [bell_discoverer.GetTitledFirstName] стягивает капюшон. «После того как я [Select_CString(bell_discoverer.IsFemale, 'узнала', 'узнал' )] о твоем чудовищном преступлении, мне кажется, что это уже [bell_discoverer.GetFaith.NegativeAfterLife] и что я останусь здесь до конца своих дней. Ты присоединишься к своим жертвам, мерзкое отродье!»\n\nЯ успеваю почувствовать прикосновение стали к горлу, а затем мир исчезает."
 bell_special_yearly.5000.a:0 "Вы меня переиграли, [bell_discoverer.GetTitledFirstNameNoTooltip]."


 #AGOT Modified
 # bell_special_yearly.6000.desc:0 "A concert is held in the Visigothic ruin for all my court, promising a night of music in an old candlelit church.\n\nThe usual fare with minstrels proceeds while a few guests complain of the peculiar smell. We enjoy some light tunes with flutes and plucked strings, and the pieces become more mournful as the night goes on.\n\nAt the finale, servants follow my command to rush and ring the bells in time with the last song. The screams of my courtiers join the voice of the choir as all behold my rattling, chiming heads!"
 bell_special_yearly.6000.desc:0 "В андальских руинах проходит концерт для всего моего двора — ночь музыки в старой септе при свечах.\n\nМенестрели играют привычную музыку, а некоторые гости жалуются на странный запах. Мы наслаждаемся легкими мелодиями флейт и перебором струн, но постепенно мелодии становятся всё более трагичными.\n\nВ конце, повинуясь моей команде, слуги бьют в колокол, завершая последнюю песню. В поющий хор вливаются крики моих придворных, когда собравшиеся замечают мои отбивающие мелодию головы!"
 bell_special_yearly.6000.a:0 "Какая музыка!"
 bell_special_yearly.6000.b:0 "Если предадите меня, то присоединитесь к ним!"

