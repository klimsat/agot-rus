 #show_valyrian_steel_decision_tooltip:0 "Вам будет представлен список всех известных владельцев оружий из валирийской стали"

 reforge_valyrian_steel_decision:0 "Перековать валирийский меч"
 reforge_valyrian_steel_decision_desc:0 "Я хочу выковать новый клинок по своему вкусу"
 reforge_valyrian_steel_decision.tt:0 "Вы начнёте процесс перековки клинка из валирийской стали, находящегося в вашем распоряжении"
 reforge_valyrian_steel_decision_confirm:0 "Вызвать кузнеца!"
 reforge_valyrian_steel_decision_tooltip:0 "Вы начнёте процесс перековки клинка из валирийской стали, находящегося в вашем распоряжении"
 reforge_valyrian_steel_excellent_aptitude:0 "Ваш $court_smith_court_position$ должен обладать #V Отличной#! пригодностью"
 reforge_valyrian_steel_additional_requirements:0 "Ваш $court_smith_court_position$ должен обладать знаниями перековки валирийской стали или исповедовать конфессию с догматом «[GetFaithDoctrine('tenet_blood_magic_steel').GetBaseName]»"
 reforge_longthorn_good_aptitude: "Ваш $court_smith_court_position$ должен обладать #V хорошей#! пригодностью"

 #Dawn
 claim_dawn_unworthy_decision:0 "Претендовать на Рассвет"
 claim_dawn_unworthy_decision_desc:0 "Меч принадлежит мне по праву, «[Select_CString(ROOT.Char.IsFemale, 'достойна', 'достоин' )]» я или нет, я выдвину на него претензию."
 claim_dawn_unworthy_decision_tooltip:0 "Выдвинуть претензию на владение легендарным клинком Рассвет"
 claim_dawn_unworthy_decision_confirm:0 "Выдвинуть претензию"
 claim_dawn_worthy_decision:0 "Претендовать на Рассвет"
 claim_dawn_worthy_decision_desc:0 "Я верю, что [Select_CString(ROOT.Char.IsFemale, 'достойна', 'достоин' )]."
 claim_dawn_worthy_decision_tooltip:0 "Выдвинуть претензию на владение легендарным клинком Рассвет"
 claim_dawn_worthy_decision_confirm:0 "Я [Select_CString(ROOT.Char.IsFemale, 'достойна', 'достоин' )]!"

 #Brightroar
 recover_brightroar_decision:0 "Вернуть Светлый Рёв"
 recover_brightroar_decision_desc:0 "Я профинансирую отважного исследователя, который отправится в опасные руины Старой Валирии в поисках Светлого Рёва, фамильного меча дома Ланнистеров."
 recover_brightroar_decision_tooltip:0 "Запланировать экспедицию, чтобы вернуть Светлый Рёв"
 recover_brightroar_decision_confirm:0 "Подготовить корабль"

 #Longthorn
 decision_reforge_longthorn: "Восстановить Длинный Шип"
 decision_reforge_longthorn_desc: "Клинок Длинный Шип уцелел, ведь валирийская сталь выдерживает даже драконье пламя. Но наш дом принёс торжественную клятву, что его не перекуют, пока Хайгарден не будет отвоёван, а дом Гарденеров не вернёт былую славу."
 decision_reforge_longthorn_tooltip: "Длинный Шип будет перекован в пригодный для боя меч"
 decision_reforge_longthorn_confirm: "Призвать кузнецов!"

 decision_reforge_longthorn_alt: "Восстановить Длинный Шип"
 decision_reforge_longthorn_desc_alt: "Клинок Длинный Шип уцелел, ведь валирийская сталь выдерживает даже драконье пламя. Наконец-то он будет восстановлен в своём былом великолепии, к нему вновь вернётся его древнее великолепие."

 #Retrieve Hidden Artifact
 retrieve_hidden_artifact_decision:0 "Раскрыть скрытый артефакт"
 retrieve_hidden_artifact_decision_desc:0 "[ROOT.Char.Custom('HiddenArtifact')] принадлежит мне, и весь мир об этом не знает. Я больше не вижу причин скрыть этот артефакт. Пришло время раскрыть его."
 retrieve_hidden_artifact_decision_tooltip:0 "Раскрыть скрытый артефакт"
 retrieve_hidden_artifact_decision_confirm:0 "Да будет это всем известно!"

 #Retrieve Stored Artifacts
 retrieve_stored_artifacts_decision:0 "Извлечь артефакты из хранилища"
 retrieve_stored_artifacts_decision_desc:0 "Многие реликвии дома Таргариен лежат забытыми в подземельях под Красным замком. Короны и черепа древних драконов пылятся в тишине. Пришло время вернуть их на законное место в истории."
 retrieve_stored_artifacts_decision_tooltip:0 "Извлечь артефакты Таргариенов, хранящиеся в Красном замке"
 retrieve_stored_artifacts_decision_confirm:0 "Отправить слуг в подземелья"

