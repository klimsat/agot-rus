 abdicate_decision:0 "Отречься в пользу наследника"
 abdicate_decision_tooltip:0 "Мое правление должно подойти к концу."
 abdicate_decision_desc:0 "В силу сложившихся обстоятельств я не вижу другой альтернативы, кроме как передать бразды правления своему наследнику, и пусть книги по истории напишут сноску о моём правлении."
 abdicate_decision_confirm:0 "Позовите моего мейстера."
 agot_abdicate.1.t:0 "Отречься"
 agot_abdicate.1.desc:0 "[ROOT.Char.GetTitledFirstName] решает отречься от престола в вашу пользу."
 agot_abdicate.1.a:0 "Я [Select_CString(ROOT.Char.IsFemale, 'благодарна', 'благодарен' )]."

 agot_minor_decisions_events.0005.t:0 "Моё падение"
 agot_minor_decisions_events.0005.desc:0 "#italic [ROOT.Char.GetFullNameNicknamedNoTooltip] окончательно [Select_CString(ROOT.Char.IsFemale, 'погрузилась', 'погрузился' )] в безумие...#!\n\nЯ слышу шёпот по всему двору. Мои придворные считают меня обузой — если не из-за внешности, то из-за поведения. Если они так обо мне думают, возможно, мне стоит перестать поддерживать видимость приличия."
 agot_minor_decisions_events.0005.a:0 "Прочь, цирюльник!"

 recruit_forder_specialist_decision:0 "Нанять знатока бродов"
 recruit_forder_specialist_decision_desc:0 "Нанять опытного воина, который не только знает, как эффективно переправляться через реки, но и умеет сражаться во время таких переходов."
 recruit_forder_specialist_decision_tooltip:0 "К вашему двору присоединится персонаж с признаком «Знаток бродов»."
 recruit_forder_specialist_decision_confirm:0 "Надеюсь, я такого найду"

 agot_commission_special_artifact_decision:0 "Заказать особый артефакт"
 agot_commission_special_artifact_decision_tooltip:0 "Поручить придворному кузнецу создать новый особый артефакт"
 agot_commission_special_artifact_decision_effects_tooltip:0 "Вы закажете новый особый артефакт."
 agot_commission_special_artifact_decision_desc:0 "О правителе судят не только по его делам, но и по тому, что он носит. Корона или доспех — такая вещь служит и символом, и заявлением. Я велю изготовить новый артефакт, достойный моего положения."
 agot_commission_special_artifact_decision_confirm:0 "Призвать кузнеца!"
 agot_commission_special_artifact_button:0 "Выбрать артефакт"

 agot_commission_special_artifact_crown_choice_loc:0 "Корона для себя"
 agot_commission_special_artifact_crown_choice_tooltip:0 "Корона, вдохновлённая мной, моим происхождением, конфессией и титулами."
 agot_commissioned_personal_crown_recently:0 "Вы не можете заказать ещё одну корону для себя до [GetCurrentDateWithDiff( THIS.VarRemaining( 'agot_recently_commissioned_crown' ))]"

 agot_commission_special_artifact_crown_spouse_choice_loc:0 "Корона для [Select_CString(spouse_scope.IsFemale, 'моей супруги', 'моего супруга' )]"
 agot_commission_special_artifact_crown_spouse_choice_tooltip:0 "Корона, вдохновлённая происхождением, конфессией или титулами [Select_CString(spouse_scope.IsFemale, 'моей супруги', 'моего супруга' )]."
 agot_commissioned_spouse_crown_recently:0 "Вы не можете заказать ещё одну корону для [spouse_scope.GetName] до [GetCurrentDateWithDiff( GetVarTimeRemaining( spouse_scope.MakeScope, 'agot_recently_commissioned_crown') )]"

 agot_commission_special_artifact_armor_choice_loc:0 "Комплект доспехов"
 agot_commission_special_artifact_armor_choice_tooltip:0 "Выкованный на заказ комплект доспехов, подогнанный под владельца."
 agot_commissioned_armor_recently:0 "Вы не можете заказать ещё один комплект доспехов до [GetCurrentDateWithDiff( THIS.VarRemaining( 'agot_recently_commissioned_armor' ))]"

 disavow_incest_decision:0 "Отвергнуть кровосмешение"
 disavow_incest_decision_desc:0 "На протяжении веков родословная Таргариенов оставалась чистой благодаря практике инцеста, а Святая вера закрывала на это глаза в соответствии с Доктриной исключительности. Но теперь пришло время пересмотреть эту традицию. Стоит ли продолжать придерживаться старых обычаев или нам следует искать новые союзы и расширять горизонты нашего дома?"
 disavow_incest_decision_tooltip:0 "Запретить традицию браков между братьями и сёстрами в вашем доме."
 disavow_incest_decision_confirm:0 "Мы покончим с этой традицией"

 reinstate_incest_decision:0 "Восстановить кровосмешение"
 reinstate_incest_decision_desc:0 "Когда-то наш дом процветал благодаря чистоте родословной, которая сохранялась благодаря практике инцеста. Хотя мы отринули эту традицию, Доктрина исключительности нашей веры всё ещё остается в силе, что даёт нам право поддерживать этот древний обычай. Должны ли мы принять наше наследие и восстановить традиции, которые когда-то определяли нас?"
 reinstate_incest_decision_tooltip:0 "Разрешить традицию браков между братьями и сёстрами в вашем доме."
 reinstate_incest_decision_confirm:0 "Мы восстановим древние обычаи"

 agot_take_new_face_decision:0 "Принять новый лик"
 agot_take_new_face_decision_desc:0 "Я приму новое обличье, служа Многоликому богу."
 agot_take_new_face_decision_tooltip:0 "Вы выберете другое лицо персонажа того же пола."
 agot_take_new_face_decision_tt:0 "Если вы примете новое лицо, внешность и возраст вашего персонажа изменятся, но вы сохраните своего текущего персонажа, земли и титулы."
 agot_take_new_face_multiple_player_warning_tt:0 "@warning_icon! Это многопользовательская сессия, перенос игрока на нового персонажа не является автоматическим."
 agot_take_new_face_decision_confirm:0 "Покажите мне Зал ликов."
 agot_has_taken_face_recently:0 "Вы недавно приняли новый лик"

 agot_faceless_new_adventure_decision:0 "Начать приключение с чистого листа"
 agot_faceless_new_adventure_decision_desc:0 "Я оставлю свои старые пути и всех тех, кого я знаю, и обрету новое лицо, жизнь и цель в служении Многоликому богу."
 agot_faceless_new_adventure_decision_tooltip:0 "Вы откажетесь от своего нынешнего персонажа и начнёте приключение с чистого листа."
 agot_faceless_new_adventure_decision_tt:0 "Приняв новый лик:\n$EFFECT_LIST_BULLET$Вы откажетесь от своего текущего персонажа и переключитесь на нового. Сохранятся только ваше [Concept('gold', 'золото')|E], не-придворные [Concept('artifacts', 'артефакты')|E], [Concept('traits', 'свойства')|E] и [Concept('faith', 'конфессия')|E]. Остальное зависит от выбранного вами лика.\n$EFFECT_LIST_BULLET$ Вы начнёте играть за безземельного персонажа из нового дома."
 agot_faceless_new_adventure_decision_confirm:0 "Новая жизнь ждёт."

 agot_visit_house_of_baw:0 "Посетить Чёрно-белый дом"
