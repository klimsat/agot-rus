 adopt_personal_coa:0 "Принять личный герб"
 adopt_personal_coa_desc:0 "[agot_personal_coa|E] поможет мне ещё больше выделиться среди членов моей семьи и моего дома."
 adopt_personal_coa_confirm:0 "Принять"
 adopt_personal_coa_tooltip:0 "Принять личный герб"
 adopt_personal_coa_effect_tt:0 "Вы получите личный герб, который будет отображаться рядом с гербом вашего дома."
 pcoa_plain:0 "Простой герб"
 pcoa_plain_tooltip:0 "Вы получите личный герб, идентичный гербу вашего дома. Идеально подходит для персонализации."
 pcoa_nickname:0 "Герб по прозвищу"
 pcoa_nickname_tooltip:0 "Вы получите личный герб, основанный на вашем прозвище."
 pcoa_ancestral_quartering:0 "Разделённый на четверти герб от предков"
 pcoa_ancestral_quartering_tooltip:0 "Вы получите личный герб, разделённый на четыре части с гербами домов предков."
 pcoa_religious:0 "Герб по конфессии"
 pcoa_religious_tooltip:0 "Вы получите личный герб, основанный на вашей конфессии."
 pcoa_fourth_child:0 "Герб [Select_CString(CHARACTER.IsFemale, 'четвёртой дочери', 'четвёртого сына' )]"
 pcoa_fourth_child_tooltip:0 "Вы получите личный герб, который представляет собой герб вашего дома, повторенный четыре раза."
 adopt_personal_coa_decision_next_stop_button:0 "Продолжить"
