 control_realm_borders_close_decision:0 "Изолировать державу"
 control_realm_borders_decision:0 "Начать изоляцию"
 control_realm_borders_decision_desc:0 "$control_realm_borders_decision$"
 control_realm_borders_decision_tooltip:0 "Ограничить путешествия в вашу державу и предотвратить распространение [Concept('plague_apocalyptic', 'апокалиптичных')|E] [Concept('epidemic', 'поветрий')|E]."
 control_realm_borders_decision_alert_tt:0 "Ваша держава не должна быть свободна от [Concept('plague_apocalyptic', 'апокалиптичных')|E] [Concept('epidemic', 'поветрий')|E]."
 control_realm_borders_decision_confirm:0 "$control_realm_borders_decision$"
 # Opening Description
