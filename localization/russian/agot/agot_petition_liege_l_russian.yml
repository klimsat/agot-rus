l_russian:
 agot_petition_liege.0001.t: "Почтенный знаменосец,"
 agot_petition_liege.0001.desc: "Настоящим вам приказано прекратить все военные действия, в которых затрагивается [petition_vassal.GetTitledFirstName]. Я хочу, чтобы среди моих вассалов царил мир и чтобы они вели себя с достоинством, подобающему их благородному положению. Я не допущу, чтобы наши земли раздирала война."
 agot_petition_liege.0001.a: "Как прикажете, мой сюзерен."
 agot_petition_liege.0001.b: "Наши ссоры вас не касаются."
 agot_petition_liege.0002.t: "Мой сюзерен,"
 agot_petition_liege.0002.desc: "Я имею полное право вести войну. [petition_vassal.GetTitledFirstName] получит по заслугам."
 agot_petition_liege.0002.a: "[second_party.GetSheHe|U] смеет отказывать мне?!"
 agot_petition_liege.0003.t: "Почтенный знаменосец,"
 agot_petition_liege.0003.desc: "Хотя я предпочитаю, чтобы среди моих вассалов царил мир, некоторые из моих подданных продолжают подрывать мой авторитет. Похоже, [second_party.GetTitledFirstName] намеревается продолжить свою войну против вас, и я пока мало что могу сделать с этим. Сопротивляйтесь [second_party.GetHerHim], как можете, или заключите мир на своих условиях."
 agot_petition_liege.0003.a: "Я [Select_CString(ROOT.Char.IsFemale, 'ожидала', 'ожидал' )], что авторитет сюзерена будет более... действенным."
 agot_petition_liege.0004.t: "Мой сюзерен,"
 agot_petition_liege.0004.desc: "Ваша мудрость и доброта не подлежат сомнению. Ради блага державы и её народа я и [petition_vassal.GetTitledFirstName] немедленнно заключим мир, благодаря вашему заступничеству."
 agot_petition_liege.0004.a: "Я [Select_CString(ROOT.Char.IsFemale, 'знала', 'знал' )], что [second_party.GetSheHe] поймёт."