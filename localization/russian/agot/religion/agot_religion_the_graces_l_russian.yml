 ### THE RELIGION ###
 the_graces_religion: "Благодатьск"
 the_graces_religion_adj: "Благодати Гиса"
 the_graces_religion_adherent: "Благодатный"
 the_graces_religion_adherent_plural: "Благодатные"
 the_graces_religion_desc: "Задолго до восхождения Валирии и её Фригольда, именно Гис и его боги создали империю благодаря дисциплине и крови. Даже после падения империи и утраты их языка, гискарские боги продолжали существовать и даже стали свидетелями падения их ненавистных врагов."

 ### Faiths ###
 # General Ghiscari Faith
 sc_harpy: "Гарпийск"
 sc_harpy_adj: "Отпрыски Гарпии"
 sc_harpy_adherent: "Благодатный"
 sc_harpy_adherent_plural:0"Благодатные"
 sc_harpy_desc: "Со времён Граздана Великого Гарпия была той, кто охранял и защищал империю и гискарцев. Даже после падения империи и самого Гиса, Гарпия продолжает стоять над народом."

 # Unsullied Faith
 sc_spear: "Леди-копейск"
 sc_spear_adj: "Отпрыски Леди Копий"
 sc_spear_adherent: "Копейщик"
 sc_spear_adherent_plural: "Копейщики"
 sc_spear_desc: "Одна из младших богинь Гиса, Леди Копий, была широко почитаема Безупречными и другими профессиональными воинами на землях бывшей империи. Она их покровительница и защитница; даже когда всё остальное потеряно и унесено, она будет рядом с ними."