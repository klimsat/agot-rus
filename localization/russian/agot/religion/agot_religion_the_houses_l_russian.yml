 ### THE RELIGION ###
 the_houses_religion: "Домск"
 the_houses_religion_adj: "Кваатийские дома"
 the_houses_religion_adherent: "Кваатиец"
 the_houses_religion_adherent_plural: "Кваатийцы"
 the_houses_religion_desc: "Кваатийцы  — странный и экзотический народ, и их боги и вера не менее необычны. Покрытая эзотерическими и секретными обычаями, кваатийская религия интегрирована во все аспекты жизни, особенно в политику и экономику."

 ### Faiths ###
 # Warlocks
 qh_warlock: "Колдунск"
 qh_warlock_adj: "Дом Бессмертных"
 qh_warlock_adherent: "Испивающий"
 qh_warlock_adherent_plural: "Испивающие"
 qh_warlock_desc: "Глубоко в Доме Бессмертных, колдуны Кварта практикуют свои тёмные искусства и варят Вечернюю тень из черноствольных деревьев. Отсюда Бессмертные возглавляют орден в своих усилиях, как духовных, так и светских."

 # Enthroned
 qh_pureborn: "Тронск"
 qh_pureborn_adj: "Дом Возвышенных"
 qh_pureborn_adherent: "Возвышенный"
 qh_pureborn_adherent_plural: "Возвышенные"
 qh_pureborn_desc: "Квартийцы считают себя старейшим и наиболее цивилизованным народом в мире и почитают свою культуру и наследие так же, как вестеросцы почитают Семерых. Это почитание особенно важно среди Чистокровных, которые считают себя хранителями и судьями цивилизации и приличий. Из своего зала Тысячи Тронов они правят Царём Городов."

 # Memories
 qh_commoner: "Памятьск"
 qh_commoner_adj: "Дом Памяти"
 qh_commoner_adherent: "Оплакивающий"
 qh_commoner_adherent_plural: "Оплакивающие"
 qh_commoner_desc: "Простонародье Кварта следует за Возвышенными и Бессмертными, но их почитание более связано с памятью о времени, когда кваатийцы не были ограничен только Квартом, до того как земли вокруг них превратились в Красную пустошь, до того как дотракийцы разрушили их другие опорные пункты."