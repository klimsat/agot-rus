 ### THE RELIGION ###
 the_temples_religion: "Храмск"
 the_temples_religion_adj: "Храмы Летних богов"
 the_temples_religion_adherent: "Последователь"
 the_temples_religion_adherent_plural: "Последователи"
 the_temples_religion_desc: "Народы Летних островов поклоняются множеству богов и богинь, которые в основном отражают их тропические дома. Летние боги — это божества тепла и любви, и их народ глубоко предан им."

 ### Faiths ###
 # Summer Gods
 summer_gods_pan: "Летне-божск"
 summer_gods_pan_adj: "Храмы Лета и Любви"
 summer_gods_pan_adherent: "Последователь"
 summer_gods_pan_adherent_plural: "Последователи"
 summer_gods_pan_desc: "Вера Летних островов сосредоточена вокруг великого пантеона божеств, часто ассоциируемых с летом, любовью и страстью. Эти божества охраняют людей островов в целом, давая указания, чтобы войны оставались священными испытаниями, чтобы рабовладельцы были изгнаны, а любовь распространялась на всех."