 the_liturgies_religion_desc: "Боги Песнопений существовали ещё до Великой Ночи и пережили её до сегодняшнего дня. Они древние и могущественные, даже если их последователи значительно уменьшились."

 ### Faiths ###
 # Hundred Gods
 sarnori_faith: "Сотне-божск"
 sarnori_faith_adj: "Сотня богов Серебряного моря"
 sarnori_faith_adherent: "Проситель"
 sarnori_faith_adherent_plural: "Просители"
 sarnori_faith_desc: "Сотня богов когда-то жили в мире, и их голоса, Царицы-рыбачки, вели народы мира к процветанию. Но после Великой Ночи и смерти последней Царицы-рыбачки, Сотня богов покинули мир, и теперь последователи Песнопений поддерживают веру в их возвращение."