 ### THE RELIGION ###
 the_venerations_religion: "Почитанийск"
 the_venerations_religion_adj: "Почитания Иба"
 the_venerations_religion_adherent: "Почитатель"
 the_venerations_religion_adherent_plural: "Почитатели"
 the_venerations_religion_desc: "Религия иббенийцев — это странная и замкнутая вещь, часто принимающая форму почитания их вождей или природы, особенно моря."

 ### Faiths ###
 #God-King of Ib
 ib_ven_god_king: "Короле-божск"
 ib_ven_god_king_adj: "Почитание короля-бога"
 ib_ven_god_king_adherent: "Подданный"
 ib_ven_god_king_adherent_plural: "Подданные"
 ib_ven_god_king_desc: "Король-бог Иба вернулся и снова ведёт иббенийцев по правильному пути, чтобы овладеть миром."

 #The Sound
 ib_ven_sound: "Звукск"
 ib_ven_sound_adj: "Почитание Звука"
 ib_ven_sound_adherent: "Почитатель"
 ib_ven_sound_adherent_plural: "Почитатели"
 ib_ven_sound_desc: "Иббенийцы — странный народ, и если когда-то они поклонялись королям-богам, то теперь они отдают должное вере, которую называют Звук. Звук — это естественная гармония мира и всего, что его составляет, от волн на побережье до ветров на горах."