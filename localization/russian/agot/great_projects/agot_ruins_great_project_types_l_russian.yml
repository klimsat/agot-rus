 # Owner Success
 # scopes available: owner, onlooker, onlooker_2, project_location
 agot_great_project_events.1000.t.base: "Грандиозный проект"
 agot_great_project_events.1000.t.ruins: "$agot_great_project_events.1000.t.base$: [province.GetHolding.GetSpecialBuildingType.GetName] - восстановление"
 agot_great_project_events.1000.t.chroyane: "$agot_great_project_events.1000.t.base$: [GetBuilding('agot_ruins_chroyane_walls_04').GetName] - восстановление"
 agot_great_project_events.1000.t.special: "$agot_great_project_events.1000.t.base$: [province.GetHolding.GetSpecialBuildingType.GetName] - строительство"
 agot_great_project_events.1000.desc.ruins: "Я смотрю на [province.GetHolding.GetType.GetName|l], восстановленное в былом великолепии. Рабочие, освободившись от своих обязанностей, расходятся, оставляя после себя прекрасное и прочное сооружение, возведенное на руинах.\n\nЯ на мгновение останавливаюсь, чтобы полюбоваться этим новым дополнением к моей державе.\n\nДа, да, сойдет. Это [province.GetHolding.GetType.GetName|l] принадлежит мне, и я буду с гордостью править этими землями."
 agot_great_project_events.1000.desc.chroyane: "Я смотрю на [province.GetHolding.GetType.GetName|l], восстановленное в былом великолепии. Рабочие, освободившись от своих обязанностей, расходятся, оставляя после себя прекрасное и прочное сооружение, возведенное на руинах.\n\nЯ на мгновение останавливаюсь, чтобы полюбоваться этим новым дополнением к моей державе.\n\nДа, да, сойдёт. Но для восстановления города предстоит сделать гораздо больше."
 agot_great_project_events.1000.desc.special: "Я смотрю на [province.GetHolding.GetType.GetName|l], отстроенное заново. Рабочие, освободившись от своих обязанностей, расходятся, оставляя после себя красивое и прочное сооружение, впечатляющую часть города.\n\nЯ на мгновение останавливаюсь, чтобы полюбоваться этим новым дополнением к моей державе.\n\nДа, да, сойдет. Это [province.GetHolding.GetType.GetName|l] принадлежит мне, и я буду с гордостью править этими землями."
 agot_great_project_events.1000.a.ruins: "Достигнутый нами прогресс впечатляет."
 agot_great_project_events.1000.a.chroyane: "То, что осталось от руин, ждёт наших усилий."
 agot_great_project_events.1000.a.special: "Великолепие этого города продолжает расти."

