 agot_great_project_events.1010.desc.ruins: "[Select_CString(envoy.IsFemale, 'Посланница, которую', 'Посланник, которого' )] [Select_CString(overlord_scope.IsFemale, 'направила моя', 'направил мой' )] [ROOT.Char.Custom2('RelationToMe', overlord_scope)] [overlord_scope.GetTitledFirstName], взволнованно подходит ко мне рано утром.\n\n«[ROOT.Char.Custom('FormOfAddressForLiege')|U]!» #EMP [envoy.GetSheHe|U] переводит дыхание и кланяется мне.#! «[province.GetHolding.GetType.GetName|U] во владении [project_location.GetNameNoTooltip] наконец восстановлено!»\n\n«[Select_CString(overlord_scope.IsFemale, 'Наша милостивая', 'Наш милостивый' )] [overlord_scope.GetTitleAsNameNoTooltip|l] [Select_CString(overlord_scope.IsFemale, 'прислала', 'прислал' )] меня сюда, чтобы выразить свою признательность за ваш щедрый вклад в это дело!» Глаза [Select_CString(envoy.IsFemale, 'посланницы', 'посланника' )] горят страстным воодушевлением, когда [envoy.GetSheHe] описывает восстановленное здание, не скупясь на восторженные похвалы, которыми удостаивается [province.GetHolding.GetType.GetName|l].\n\nЯ хмыкаю и киваю, [Select_CString(ROOT.Char.IsFemale, 'довольная', 'довольный' )] своим вкладом в общее дело..."
 agot_great_project_events.1010.desc.chroyane: "[Select_CString(envoy.IsFemale, 'Посланница, которую', 'Посланник, которого' )] [Select_CString(overlord_scope.IsFemale, 'направила моя', 'направил мой' )] [ROOT.Char.Custom2('RelationToMe', overlord_scope)] [overlord_scope.GetTitledFirstName], взволнованно подходит ко мне рано утром.\n\n«[ROOT.Char.Custom('FormOfAddressForLiege')|U]!» #EMP [envoy.GetSheHe|U] переводит дыхание и кланяется мне.#! «[province.GetHolding.GetType.GetName|U] во владении [project_location.GetNameNoTooltip] полностью восстановлено!»\n\n«[Select_CString(overlord_scope.IsFemale, 'Наша милостивая', 'Наш милостивый' )] [overlord_scope.GetTitleAsNameNoTooltip|l] [Select_CString(overlord_scope.IsFemale, 'прислала', 'прислал' )] меня сюда, чтобы выразить свою признательность за ваш щедрый вклад в это дело!» Глаза [Select_CString(envoy.IsFemale, 'посланницы', 'посланника' )] горят страстным воодушевлением, когда [envoy.GetSheHe] описывает восстановленное здание, не скупясь на восторженные похвалы, которыми удостаивается [province.GetHolding.GetType.GetName|l].\n\nЯ хмыкаю и киваю, [Select_CString(ROOT.Char.IsFemale, 'довольная', 'довольный' )] своим вкладом в общее дело..."
