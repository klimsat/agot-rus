 building_type_agot_great_fleet_01: "Морской порт"
 building_type_agot_great_fleet_01_desc: "В этом порту находится огромный флот, демонстрирующий военно-морскую мощь на близлежащих морях и берегах."

 building_agot_great_fleet_01: "Морской порт"
 building_agot_great_fleet_01_desc: "В этом порту находится огромный флот, демонстрирующий военно-морскую мощь на близлежащих морях и берегах. Такое сооружение можно возвести только в рамках [Concept('great_project', 'грандиозного проекта')|E]."

 building_agot_great_fleet_02: "Обширный морской порт"
 building_agot_great_fleet_02_desc: "Этот порт был расширен, чтобы обслуживать гораздо более крупный флот, расширяя его географию и демонстрируя как военно-морскую мощь, так и растущее богатство на близлежащих морях и берегах. Такое сооружение можно возвести только в рамках [Concept('great_project', 'грандиозного проекта')|E]."

 building_agot_great_fleet_03: "Грозная армада"
 building_agot_great_fleet_03_desc: "В настоящее время в этом порту базируется огромный флот, превращающий его в важный инструмент ведения войны и торговли, который доминирует на близлежащих морях и берегах. Он представляет собой грозную военную силу, способную сокрушать вражеские флоты и навязывать свою волю морским державам. Такое сооружение можно возвести только в рамках [Concept('great_project', 'грандиозного проекта')|E]."