l_russian:

 ### Great Fleet ###
 great_project_type_construct_great_fleet_01: "Построить великий флот"
 great_project_type_construct_great_fleet_01_desc: "Берега моей [Concept('realm', 'державы')|E] должны быть защищены, и что может быть лучше для обеспечения безопасности и демонстрации силы на морях, чем строительство большого флота?"
 great_project_type_construct_great_fleet_01_coastal_barony: "Это должно быть прибрежное баронство"

 great_project_type_construct_great_fleet_02: "Расширить великий флот"
 great_project_type_construct_great_fleet_02_desc: "Создав мощный флот для защиты [Concept('domain', 'владения')|E], мы поняли, что его можно и нужно расширять. Что может лучше продемонстрировать наше богатство и могущество, чем увеличение флота?"
 great_project_type_construct_great_fleet_02_coastal_county: "Это должно быть прибрежное графство, в котором расположен $building_agot_great_fleet_01$"

 great_project_type_construct_great_fleet_03: "Построить армаду"
 great_project_type_construct_great_fleet_03_desc: "Теперь, когда великий флот расширен, он сияет как маяк развития в моих [Concept('domain', 'владениях')|E]. Но это означает, что нужно усилить их защиту. Мы должны собрать армаду, чтобы должным образом защитить воды вокруг моей державы!"
 great_project_type_construct_great_fleet_03_coastal_county: "Это должно быть прибрежное графство, в котором расположен $building_agot_great_fleet_02$"

 great_project_type_construct_great_fleet_01_contribution_materials: "Материалы"
 great_project_type_construct_great_fleet_01_contribution_materials_desc: "Ничего нельзя создать на пустом месте. Мы предоставим [Concept('great_project', 'грандиозному проекту')|E] все строительные материалы, необходимые для завершения работ по строительству флота."

 great_project_type_construct_great_fleet_01_contribution_workforce: "Рабочая сила"
 great_project_type_construct_great_fleet_01_contribution_workforce_desc: "Корабли сами себя не построят! Мы обеспечим [Concept('great_project', 'грандиозный проект')|E] рабочей силой, необходимой для выполнения этой важной задачи."

 great_project_type_construct_great_fleet_01_contribution_engineers: "Морские инженеры"
 great_project_type_construct_great_fleet_01_contribution_engineers_desc: "Опытные корабелы и морские инженеры, привлечённые к этому [Concept('great_project', 'грандиозному проекту')|E], привнесли бы ценный опыт в строительство флота."

 great_project_type_construct_great_fleet_01_contribution_military_wharf: "Военная пристань"
 great_project_type_construct_great_fleet_01_contribution_military_wharf_desc: "Добавив особую гавань и сухой док к [Concept('great_project', 'грандиозному проекту')|E], мы повысим надёжность и долговечность флота."

 great_project_type_construct_great_fleet_01_contribution_merchant_quays: "Торговый причал"
 great_project_type_construct_great_fleet_01_contribution_merchant_quays_desc: "Добавив особый торговый квартал к [Concept('great_project', 'грандиозному проекту')|E], мы увеличим доходы и поток торговли в морском порту."

