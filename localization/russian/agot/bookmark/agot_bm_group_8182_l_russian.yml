l_russian:
 agot_bm_group_8182: "182 г. от З.Э."
 agot_bm_8182: "Колокола войны"
 agot_bm_8182_desc: "Ройну и её притоки охватило противостояние. В Лорате первый магистр Тис О’рел стремится развить свой военный успех после победоносной войны с Норвосом, но его следующая цель — иббенийская колония на Секире — может оказаться более сложной задачей, чем он рассчитывал.\n\nТем временем в Квохоре разгорелась борьба за власть между Хараттом Экной, который хочет наказать Норвос за преступления города, и Кореной Осторлат, которая считает, что Норвос и Квохор — единственная надежда в противостоянии с молодым завоевателем из Лората.\n\nНа юге волантинский губернатор Гар-Сагона выступил против своих ройнарских союзников во главе с Асухарой Архе Меали и ведёт войну не на жизнь, а на смерть с теми, на кого когда-то полагался.\n\n#bold Когда хаос сражений перерастёт в мрачный хор, мир услышит, по ком звенят колокола войны.#!"

 bookmark_182_thys_o_rell: "Первый магистр Тис"
 bookmark_182_thys_o_rell_subheading: "Первый магистр Лората"
 bookmark_182_thys_o_rell_desc: "[Concept( 'story_content_thys_o_rell_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_thys_o_rell_182', '$bm_story_content_available_copy|q$' )|E]\nМолодой правитель Лората прославился после победы над Норвосом в сражении, которое произошло два с половиной года назад. Подобно истинному завоевателю — или, возможно, слишком амбициозному полководцу — Тис положил глаз на Секиру. #bold Но по мере того, как последняя кампания превращается в изнурительное испытание, не сделают ли амбиции лоратцев вольный город уязвимым перед лицом тех, кого они презирают?#!"

 bookmark_182_korena_ostorlat: "Магистр Корена"
 bookmark_182_korena_ostorlat_subheading: "Магистр Грьевуроса"
 bookmark_182_korena_ostorlat_desc: "[Concept( 'story_content_korena_ostorlat_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_korena_ostorlat_182', '$bm_story_content_available_copy|q$' )|E]\nКорена Осторлат стала про-норвошийским кандидатом на выборах в Квохоре. Её расчет прост: молодой первый магистр Лората представляет прямую угрозу для региона, и остановить его может только союз Квохора и Норвоша. #bold Прежде чем противостоять угрозе со стороны Лората, Корена должна победить на выборах, которые определят её судьбу.#!"
 
 bookmark_182_haratt_ekna: "Магистр Харатт"
 bookmark_182_haratt_ekna_subheading: "Магистр Эродунавара"
 bookmark_182_haratt_ekna_desc: "[Concept( 'story_content_haratt_ekna_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_haratt_ekna_182', '$bm_story_content_available_copy|q$' )|E]\nХаратт Экна является не только одним из главных кандидатов на предстоящих выборах в Квохоре, но и главным соперником воинственных норвошийцев. Он часто и громогласно заявляет, что Норвос должен понести ответственность за многочисленные преступления против Квохора. #bold Если Харатт станет первым магистром, колокола войны зазвонят снова.#!"

 bookmark_182_krahas_segal: "Губернатор Крахас"
 bookmark_182_krahas_segal_subheading: "Губернатор Гар-Сагона"
 bookmark_182_krahas_segal_desc: "[Concept( 'story_content_krahas_segal_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_krahas_segal_182', '$bm_story_content_available_copy|q$' )|E]\nКрахас Сегал владеет стратегически важным герцогством Гар-Сагон — герцогством, которое волантинцы отвоевали благодаря союзу с Ройнарской конфедерацией. Но теперь за герцогство разгорелась ожесточённая борьба, поскольку Крахас выступил против своих бывших союзников, которых он стремится полностью уничтожить. #bold Удастся ли ему осуществить свой план и сокрушить ройнаров словно волну, разбивающуюся о скалу?#!"

 bookmark_182_arhe_meali: "Леди Асухара"
 bookmark_182_arhe_meali_subheading: "Леди Пиу-Сара"
 bookmark_182_arhe_meali_desc: "[Concept( 'story_content_arhe_meali_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_arhe_meali_182', '$bm_story_content_available_copy|q$' )|E]\nАсухара Архе Меали — яростный лидер Ройнарской конфедерации. Когда-то они были верными союзниками волантинцев, но теперь их предали, и они столкнулись с угрозой существованию, исходящей от той самой крепости, которую они когда-то завоевали, — Гар-Сагона. #bold Сможет ли Асухара привести конфедерацию к победе, несмотря на предательство и возможное изгнание?#!"