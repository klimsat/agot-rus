l_russian:
 agot_battlefield_duel.0002.t: "[Select_CString(sc_loser.IsFemale, 'Побеждённая противница', 'Побеждённый враг' )]"
 agot_battlefield_duel.0002.desc: "[Select_CString(sc_loser.IsFemale, 'Поверженная', 'Поверженный' )] [sc_loser.GetTitledFirstName] [Select_CString(sc_loser.IsFemale, 'распростёрлась', 'распростёрся' )] передо мной. [Select_CString(sc_loser.IsFemale, 'Поверженная, но не мёртвая', 'Поверженный, но не мёртвый' )]. Вокруг нас бушует битва, и нельзя терять время. Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] либо убить, либо пленить [sc_loser.GetHerHis]."
 agot_battlefield_duel.0002.a: "Воины! Немедленно заковать [sc_loser.GetHerHis] в цепи."
 agot_battlefield_duel.0002.b: "Пленные... С ними так долго возиться... Лучше просто покончить покончить с [Select_CString(sc_loser.IsFemale, 'ней', 'ним' )]."
 agot_battlefield_duel.0003.t: "[Select_CString(sc_loser.IsFemale, 'Побеждённая противница', 'Побеждённый враг' )]"
 agot_battlefield_duel.0003.desc: "Передо мной  [Select_CString(sc_loser.IsFemale, 'распростёрлась изуродованная', 'распростёрся изуродованный' )] [sc_loser.GetTitledFirstName], [Select_CString(sc_loser.IsFemale, 'поверженная', 'поверженный' )] моей собственной рукой. Хотя это всего лишь [Select_CString(sc_loser.IsFemale, 'одна воительница', 'один воин' )], такие победы могут переломить ход битвы."
 agot_battlefield_duel.0003.a: "Ещё одна насечка на моем оружии." 
 agot_battlefield_duel.0004.t: "Поражение в битве"
 agot_battlefield_duel.0004.desc: "Я лежу [Select_CString(ROOT.Char.IsFemale, 'поверженная', 'поверженный' )] на земле, чувствуя вкус крови на языке, а надо мной нависает [sc_victor.GetTitledFirstName]. [Select_CString(ROOT.Char.IsFemale, 'Поверженная', 'Поверженный' )], но всё ещё [Select_CString(ROOT.Char.IsFemale, 'живая', 'живой' )] и во власти моего врага...\n\n[sc_victor.GetTitledFirstName] зовёт своих солдат.\n\n«Немедленно заковать [sc_loser.GetHerHis] в цепи»."
 agot_battlefield_duel.0004.a: "Итак... мне предстоит стать [Select_CString(ROOT.Char.IsFemale, 'пленницей', 'пленником' )]..."
 agot_battlefield_duel.0005.t: "Поражение в битве"
 agot_battlefield_duel.0005.desc: "Я лежу [Select_CString(ROOT.Char.IsFemale, 'поверженная', 'поверженный' )] на земле, чувствуя вкус крови на языке, а надо мной нависает [sc_victor.GetTitledFirstName]. [Select_CString(ROOT.Char.IsFemale, 'Поверженная', 'Поверженный' )], но всё ещё [Select_CString(ROOT.Char.IsFemale, 'живая', 'живой' )] и во власти моего врага.\n\n[sc_victor.GetTitledFirstNameNoTooltip] заносит оружие для нанесения добивающего удара..."
 agot_battlefield_duel.0005.a: "Это конец..." 