l_russian:

 ### Sailing ###
 small_boat_modifier: "Небольшая лодка"
 small_boat_modifier_desc: "Этот персонаж зафрахтовал небольшое парусное судно."

 handcarved_flute: "Резная флейта"
 handcarved_flute_desc: "Этот персонаж сам вырезал деревянную флейту."

 supply_of_citrus: "Запас апельсинов"
 supply_of_citrus_desc: "Этот персонаж приобрёл запас апельсинов для предстоящего путешествия."

 reached_valyria: "Путешествие в Валирию"
 reached_valyria_desc: "Этот персонаж командовал экспедицией и лицезрел населённую призраками Валирию."

 guest_reached_valyria: "Достижение Валирии"
 guest_reached_valyria_desc: "Этот персонаж лицезрел то, что осталось от Валирии."

 province_sabotaged_by_raiders: "Саботаж из-за налётчиков"
 province_sabotaged_by_raiders_desc: "Развитие и численность гарнизона снижены из-за саботажа налётчиков."

 merchant_ship_hijacking: "Захваченное торговое судно"
 merchant_ship_hijacking_desc: "Эта провинция извлекает выгоду из захваченного торгового судна, захваченного во время морского налёта."

 levied_pirates: "Завербованные пираты"
 levied_pirates_desc: "Этот персонаж подкупил пиратскую команду и нанял её на временную службу."

 the_white_beast_modifier: "Белый зверь"
 the_white_beast_modifier_desc: "Этому персонажу не удалось убить Белого зверя."

 sunken_ship_sighted: "Замечен затонувший корабль"
 sunken_ship_sighted_desc: "В близлежащем море видели тонущий корабль. Всё, что на нём было, сейчас покоится под волнами."