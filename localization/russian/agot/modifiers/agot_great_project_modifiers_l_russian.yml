l_russian:

 agot_build_great_fleet_merchant_quays_modifier: "Торговые причалы"
 agot_build_great_fleet_merchant_quays_modifier_desc: "В домашнем порту флота появились специальные причалы для швартовки купцов и торговых судов, что привело к росту торговли в этом графстве."
 agot_build_great_fleet_military_wharf_modifier: "Военная пристань"
 agot_build_great_fleet_military_wharf_modifier_desc: "Верфи в этом графстве оборудованы великолепными причалами, подходящими для строительства и ремонта военных кораблей всех размеров."
 agot_build_great_fleet_engineers_modifier: "Морские инженеры"
 agot_build_great_fleet_engineers_modifier_desc: "В верфях этого графства работают квалифицированные морские инженеры, которые разбираются не только в строительстве новых кораблей, но и в оборудовании, необходимом для поддержания большого флота на плаву в течение десятилетий."

 great_fleet_01_constructed_modifier: "$building_type_agot_great_fleet_01$"
 great_fleet_01_constructed_modifier_desc: "В этом графстве находится домашний порт морского флота." #$building_type_agot_great_fleet_01$
 great_fleet_02_constructed_modifier: "$building_agot_great_fleet_02$" #$building_type_agot_great_fleet_02$
 great_fleet_02_constructed_modifier_desc: "В этом графстве находится домашний порт обширного флота." #$building_type_agot_great_fleet_02$
 great_fleet_03_constructed_modifier: "$building_agot_great_fleet_03$" #$building_type_agot_great_fleet_03$
 great_fleet_03_constructed_modifier_desc: "В этом графстве находится домашний порт грозной армады." #$building_type_agot_great_fleet_03$

