 # Gene Values
 # Dragonfire
 dragon_fire_color_template_de_gui: "Цвет пламени"
 dragon_fire_color_template_de_gui_tt: "#bold По умолчанию#! пламя соответствует расцветке вашего дракона.\n\n#bold Пользовательский#! режим позволяет вам выбрать цвет пламени с помощью ползунка."
 dragon_fire_color_value_de_gui: "Цвет пламени"
 dragon_fire_color_value_de_gui_tt: "#bold По умолчанию#! процентное соотношение отражает, насколько #emp сильно#! пламя перекликается с цветом вашего дракона — при 0% пламя будет естественного оранжевого цвета.\n\nПри #bold пользовательском#! режиме процентное соотношение отражает #emp сам цвет#!, охватывая один полный оборот цветового круга — и 0%, и 100% - это натуральный оранжевый, а 50% - синий.\n\nЦвет наиболее насыщен у пасти и переходит в естественное пламя вдоль шлейфа."
 dragon_fire_smoke_template_de_gui: "Дым"
 dragon_fire_smoke_template_de_gui_tt: "#bold Автоматический#! режим отображает дым только на тёмном драконе, где он выглядит естественно.\n\n#bold Пользовательский#! режим позволяет настроить количество дыма на любом драконе с помощью ползунка."
 dragon_fire_smoke_value_de_gui: "Дым"
 dragon_fire_smoke_value_de_gui_tt: "В #bold автоматическом#! режиме этот ползунок #emp игнорируется#!, что приводит к образованию более плотного дыма для тёмных драконов.\n\n В #bold пользовательском#! режиме процентное соотношение отражает #emp количество#! дыма, поднимающегося от пламени: нет при 0% и полностью при 100%."
