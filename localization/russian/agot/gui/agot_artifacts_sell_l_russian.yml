 agot_events_artifacts_sell.1001.t: "Продажа драконьего яйца"
 agot_events_artifacts_sell.1001.desc.1: "Хранитель сокровищ из Мирийского аукциона привозит в мою державу группу экспертов по оценке. Они тщательно осматривают драконье яйцо, пытаясь убедиться в его подлинности. После этого хранитель сокровищ говорит мне:\n\n"
 agot_events_artifacts_sell.1001.desc.2: "«Это настоящее драконье яйцо, #bold бесценное#!, и мы готовы купить его по самой высокой рыночной цене»."
 agot_events_artifacts_sell.1001.desc.3: "«Это действительно драгоценное яйцо дракона, но для нас оно не #italic такая#! уж редкость. Если вы всё ещё хотите продать его, мы купим его за семдесять процентов от самой высокой исторической цены»."
 agot_events_artifacts_sell.1001.desc.4: "«Это настоящее драконье яйцо, и вы можете считать, что его стоимость неизмерима, но мы видели #italic одно за другим#!. Мы можем купить его только за пятьдесять процентов от исторической цены, не больше»."
 agot_events_artifacts_sell.1001.desc.5: "«Мы неоднократно видели подобные вещи, они очень ценны, но мы с сожалением вынуждены сообщить вам, что больше не будем их покупать: наши хранилища уже заполнены ими. Если только вы не готовы продать их нам за пятнадцать процентов от первоначальной цены...»"
 agot_events_artifacts_sell.1001.a: "Я [Select_CString(ROOT.Char.IsFemale, 'удовлетворена', 'удовлетворён' )] этим предложением."
 agot_events_artifacts_sell.1001.b: "Может быть, я в растерянности, но ситуация вынуждает меня, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] это сделать."
 agot_events_artifacts_sell.1001.c: "Я думаю, что предложение слишком низкое, но, к сожалению, у меня нет выбора."
 agot_events_artifacts_sell.1001.d: "Вы... ну хорошо... Я [Select_CString(ROOT.Char.IsFemale, 'согласна', 'согласен' )]."
 agot_events_artifacts_sell.1001.e: "Я не продам моё драконье яйцо."

 agot_events_artifacts_sell.1002.t: "Продажа драконьего яйца"
 agot_events_artifacts_sell.1002.desc: "Хранитель сокровищ из Мирийского аукциона отказался приехать посмотреть на ваше драконье яйцо. Они прислали письмо с извинениями, но в данный момент не хотят покупать больше драконьих яиц."
 agot_events_artifacts_sell.1002.a: "Будь они прокляты!"

 agot_events_artifacts_sell.1003.t: "Продажа клинка из валирийской стали"
 agot_events_artifacts_sell.1003.desc: "Услышав, что я хочу продать свой меч из валирийской стали за несколько золотых, все мои придворные наперебой стали уговаривать меня не делать этого.\n"
 agot_events_artifacts_sell.1003.desc.westeros: "Как [Select_CString(ROOT.Char.IsFemale, 'леди', 'лорд' )], продажа меча из валирийской стали непременно опозорит меня на весь Вестерос и даже навлечёт позор на мою династию."
 agot_events_artifacts_sell.1003.desc.essos: "Как [Select_CString(ROOT.Char.IsFemale, 'леди', 'лорд' )], продажа меча из валирийской стали непременно опозорит меня на весь Эссос и даже навлечёт позор на мою династию."
 agot_events_artifacts_sell.1003.desc.else: "Как [Select_CString(ROOT.Char.IsFemale, 'леди', 'лорд' )], продажа меча из валирийской стали непременно опозорит меня на весь мир и даже навлечёт позор на мою династию."
 agot_events_artifacts_sell.1003.a: "Я [Select_CString(ROOT.Char.IsFemale, 'приняла', 'принял' )] решение."
 agot_events_artifacts_sell.1003.b: "Это действительно #bold плохое#! решение."

 agot_events_artifacts_sell.0005.opening: "Примите мои искренние соболезнования,"
 agot_events_artifacts_sell.0005.desc: "Ваши действия привели в ярость добрых хранителей сокровищ Мирийского аукциона. Отныне вашей семье навсегда запрещено торговать на аукционе."
 agot_events_artifacts_sell.0005.a: "Я не понимаю, о чём они говорят..."

 agot_stolen_artifact_from_artifact_keeper_desc: "Ваша семья была внесена в чёрный список Мирийского аукциона."
 house_be_banned_exchange_artifact: "Ваша семья будет включена в чёрный список Мирийского аукциона."
 targs_sold_dargon_egg: "Проданное яйцо дракона"

 agot_events_artifacts_sell.0006.opening: "Примите мои искренние соболезнования,"
 agot_events_artifacts_sell.0006.desc: "Позорные деяния, что [Select_CString(who_hurt_artifact_keeper.IsFemale, 'совершила', 'совершил' )] [who_hurt_artifact_keeper.GetName] - член вашей семьи, навсегда испортили отношения вашей семьи с Мирийским аукционом. Отныне ваша семья будет внесена в чёрный список аукциона."
 agot_events_artifacts_sell.0006.a: "Презренные трусы!"

 agot_stolen_artifact_from_artifact_keeper_dec_desc: "Ваша семья не была занесена в чёрный список."

 agot_artifact_value_breakdown_head: "Расценки"

 agot_events_artifacts_sell.0007.opening: "С глубоким прискорбием"
 agot_events_artifacts_sell.0007.desc: "Я вынужден сообщить вам, что в настоящее время Мирийский аукцион не располагает достаточными средствами для приобретения вашего артефакта. Мы стремимся поддерживать дружеские торговые отношения в будущем."
 agot_events_artifacts_sell.0007.a: "Я понимаю."

 agot_no_money_buy_artifact_from_artifact_keeper_desc: "Ваш артефакт не был продан."
 agot_sell_artifacts_cooldown_tooltip: "За последний год вы уже продали один артефакт."
 agot_buy_artifacts_ban_tooltip:0 "@warning_icon! Ваша конфессия не позволяет вам покупать артефакты."

 agot_events_artifacts_sell.0008.opening: "С предельной искренностью"
 agot_events_artifacts_sell.0008.desc: "Я с сожалением сообщаю вам, что вы - при всем богатстве вашей казны и хвастливых обещаниях в придачу - не обладаете достаточной суммой, чтобы приобрести этот артефакт."
 agot_events_artifacts_sell.0008.a: "Что ещё я могу сказать..."

