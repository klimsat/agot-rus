l_russian:

 agot_knighthood_maintenance.0005.t: "Несчастье для моего оруженосца"
 agot_knighthood_maintenance.0005.desc: "К сожалению, [my_squire.GetName] болен. Проявления болезни препятствуют тому, чтобы [my_squire.GetSheHe] стал рыцарем. Таким образом, я больше не могу держать [my_squire.GetHerHis] при себе в качестве оруженосца..."
 agot_knighthood_maintenance.0005.a: "Это так печально!"
 agot_knighthood_maintenance.0005.a.tt: "Поскольку у вашего оруженосца есть свойство, исключающее посвящение в рыцари, [my_squire.GetSheHe] больше не может быть вашим оруженосцем."

 agot_knighthood_maintenance.0006.t: "Мое несчастье"
 agot_knighthood_maintenance.0006.desc: "К сожалению, у меня развилось заболевание, которое лишает меня возможности однажды стать рыцарем. Таким образом, я больше не могу оставаться оруженосцем рыцаря [my_knight.GetName]..."
 agot_knighthood_maintenance.0006.a: "Это так печально!"
 agot_knighthood_maintenance.0006.a.tt: "Поскольку у вас есть свойство, исключающее посвящение в рыцари, вы больше не можете быть оруженосцем."

 agot_knighthood_maintenance.0008.t: "Конец рыцарской опеки"
 agot_knighthood_maintenance.0008.desc: "Из-за непрекращающихся враждебных действий мой оруженосец [my_squire.GetName] больше не может оставаться под моей заботой."
 agot_knighthood_maintenance.0008.a: "Досадно."
 agot_knighthood_maintenance.0008.desc_nemesis: "Поскольку [my_squire.GetName] и вы стали заклятыми врагами, [my_squire.GetSheHe] больше не может быть вашим оруженосцем."
 agot_knighthood_maintenance.0008.desc_rivalry: "Поскольку [my_squire.GetName] и вы стали соперниками, [my_squire.GetSheHe] больше не может быть вашим оруженосцем."
 agot_knighthood_maintenance.0008.desc_war_against_knight: "Поскольку [my_squire.GetName] и вы находитесь в состоянии войны, [my_squire.GetSheHe] больше не может быть вашим оруженосцем."
 agot_knighthood_maintenance.0008.desc_liege_war_against_knight: "Поскольку вы и сюзерен персонажа [my_squire.GetName] находитесь в состоянии войны, [my_squire.GetSheHe] больше не может быть вашим оруженосцем."
 agot_knighthood_maintenance.0008.desc_liege_war_against_knight_liege: "Поскольку сюзерен персонажа [my_squire.GetName] и ваш сюзерен находятся в состоянии войны, [my_squire.GetSheHe] больше не может быть вашим оруженосцем."

 agot_knighthood_maintenance.0009.t: "Конец рыцарской опеки"
 agot_knighthood_maintenance.0009.desc: "Из-за непрекращающейся вражды [my_knight.GetName] больше не может наставлять меня на пути к рыцарству."
 agot_knighthood_maintenance.0009.a: "Проклятье!"

 agot_knighthood_maintenance.0009.desc_nemesis: "Поскольку [my_knight.GetName] и вы стали заклятыми врагами, [my_knight.GetSheHe] больше не может быть вашим рыцарем-наставником."
 agot_knighthood_maintenance.0009.desc_rivalry: "Поскольку [my_knight.GetName] и вы стали соперниками, [my_knight.GetSheHe] больше не может быть вашим рыцарем-наставником."
 agot_knighthood_maintenance.0009.desc_war_against_knight: "Поскольку [my_knight.GetName] и вы находитесь в состоянии войны, [my_knight.GetSheHe] больше не может быть вашим рыцарем-наставником."
 agot_knighthood_maintenance.0009.desc_liege_war_against_knight: "Поскольку мой сюзерен и [my_knight.GetName] находятся в состоянии войны, [my_knight.GetSheHe] больше не может быть вашим рыцарем-наставником."
 agot_knighthood_maintenance.0009.desc_liege_war_against_knight_liege: "Поскольку мой сюзерен и сюзерен персонажа [my_knight.GetName] находятся в состоянии войны, [my_knight.GetSheHe] больше не может быть вашим рыцарем-наставником."

 agot_knighthood_maintenance.0010.t: "Смерть моего рыцаря"
 agot_knighthood_maintenance.0010.desc: "Мой наставник и рыцарь, [dead_knight.GetName], умер!\n\n Это означает, что теперь я #V оруженосец без рыцаря#!. Без наставника моё обучение рыцарскому делу прекратилось. Если мне повезёт, другой рыцарь может взять меня в качестве своего оруженосца. Если же я не найду нового рыцаря в ближайшее время, то это будет означать #N окончание#! моего обучения рыцарству."
 agot_knighthood_maintenance.0010.a: "Это разочаровывает, но я в трауре."
 agot_knighthood_maintenance.0010.a.tt: "Вы #P сохраните#! #V свойство оруженосца и достигнутый прогресс#!. Если другой рыцарь проявит к вам интерес, вы можете продолжить своё обучение в качестве #V его оруженосца#!."
 agot_knighthood_maintenance.0010.b: "Это разачаровывает, но мне нужно найти другого рыцаря!"
 agot_knighthood_maintenance.0010.b.tt: "Ближайшие рыцари узнают о вашем положении и могут предложить вам место оруженосца."

 agot_knighthood_maintenance.0011.t: "Необычная просьба"
 agot_knighthood_maintenance.0011.desc: "[knightless_squire.GetName] обратился ко мне с необычной просьбой. [knightless_squire.GetHerHis|U] рыцарь-наставник умер, оставив [knightless_squire.GetHerHis] без кого-либо, кто мог бы однажды посвятить [knightless_squire.GetHerHis] в рыцари! [knightless_squire.GetSheHe|U] боится стать тем, кто всю свою жизнь провёл оруженосцем, и умоляет меня взять [knightless_squire.GetHerHis] себе в оруженосцы."
 agot_knighthood_maintenance.0011.a: "Хорошо, я сделаю это."
 agot_knighthood_maintenance.0011.b: "Нет, мне не нужен оруженосец."
 agot_knighthood_maintenance.0011.b.tt: "Вы #N не#! возьмёте персонажа [knightless_squire.GetNameNoTooltip] к себе в качестве оруженосца."

 agot_knighthood_maintenance.0012.t: "Обещание на смертном одре"
 agot_knighthood_maintenance.0012.desc: "Мой рыцарь [dead_knight.GetName] послал за мной. [dead_knight.GetSheHe|U] лежит на смертном одре и времени осталось мало. Рядом ещё несколько человек, все торжественно стоят вокруг.\n\nЗадыхаясь, [dead_knight.GetNameNoTooltip] провозглашает меня #V рыцарем!#! Радость, которую я испытываю, быстро сменяется чувством сожаления и печали, когда слуга сообщает мне, что [dead_knight.GetSheHe] не проживёт и часа."
 agot_knighthood_maintenance.0012.a: "Я стал рыцарем!"
 agot_knighthood_maintenance.0012.a.tt: "Вас посвятили в рыцари!"

 agot_knighthood_maintenance.0300.t: "Обдумывание моего положения оруженосца"
 agot_knighthood_maintenance.0300.desc: "Прошло некоторое время с тех пор, как мой рыцарь-наставник умер. За это время я не смог найти нового рыцаря, чтобы продолжить обучение. Как бы это ни разочаровывало, пришло время принять то, что я не могу продолжать это путешествие в одиночку."
 agot_knighthood_maintenance.0300.a: "Пришло время отказаться от моего статуса оруженосца."
 agot_knighthood_maintenance.0300.a.tt: "Вы перестаёте быть оруженосцем, но всё ещё можете стать им в будущем."
 agot_knighthood_maintenance.0300.b: "Возможно, пришло время мне купить рыцарское звание..."
 agot_knighthood_maintenance.0300.b.tt: "Вы купите рыцарское звание."
 agot_knighthood_maintenance.0300.c: "Кажется, я никогда не стану рыцарем, но мне настолько нравится быть оруженосцем, что я не брошу это."
 agot_knighthood_maintenance.0300.c.tt: "Вы навсегда останетесь оруженосцем."

 agot_knighthood_maintenance.0400.t: "Плохая исполнительность"
 agot_knighthood_maintenance.0400.desc: "Недостаточные усилия, которые я прилагал в последние несколько лет, не остались незамеченными. К сожалению, пришло время расплаты! Мне сообщили, что из-за этого я больше не смогу служить оруженосцем."
 agot_knighthood_maintenance.0400.a: "Это неприятно."

 agot_knighthood_maintenance.0500.t: "Очень важный оруженосец"
 agot_knighthood_maintenance.0500.desc: "После наследования моего титула становится ясно, что я больше не могу оставаться оруженосцем. Чтобы соответствовать своему статусу, я должен как можно скорее стать рыцарем."
 agot_knighthood_maintenance.0500.a: "Я прикажу своему наставнику сделать меня рыцарем!"
 agot_knighthood_maintenance.0500.b: "Я прикажу вассалу посвятить меня в рыцари."
 agot_knighthood_maintenance.0500.c: "Если я прикажу, то [ROOT.Char.Custom('KingsguardName')]  посвятит меня в рыцари."
 agot_knighthood_maintenance.0500.d: "Я прикажу рыцарю при моём дворе посвятить меня в рыцари."
 agot_knighthood_maintenance.0500.e: "Я куплю своё рыцарское звание!"
 agot_knighthood_maintenance.0500.f: "На самом деле, я больше не буду стремиться к рыцарскому званию."

 agot_knighthood_maintenance.0501.opening: "[my_relation.Custom2('AppropriateGreeting', ROOT.Char)],"
 agot_knighthood_maintenance.0501.desc: "После наследования моего титула становится ясно, что я больше не могу оставаться оруженосцем. Чтобы соответствовать моему новому статусу, я смиренно прошу вас немедленно даровать мне рыцарское звание!"
 agot_knighthood_maintenance.0501.a: "Очень хорошо..."
 
 agot_knighthood_maintenance.0550.t: "Оруженосец вернулся домой"
 agot_knighthood_maintenance.0550.desc: "Мой ребёнок, [cancelled_squire_child.GetUIName], отозван из-под опеки рыцаря по имени [childs_knight.GetUINamePossessive].\n\nТаким образом, [cancelled_squire_child.GetUINameNoTooltip] более не является оруженосцем."
 agot_knighthood_maintenance.0550.a: "Он перестанет быть оруженосцем, на данный момент."

 agot_knighthood_maintenance.0551.opening: "Рыцарю-наставнику моего ребёнка,"
 agot_knighthood_maintenance.0551.desc: "По причинам, связанным с моим домом, [cancelled_squire_child.GetName] будет отозван ко двору, тем самым ваша рыцарская опека над ним будет прекращена."
 agot_knighthood_maintenance.0551.a: "Это достойно сожаления."