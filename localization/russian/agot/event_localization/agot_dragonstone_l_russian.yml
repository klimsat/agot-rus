l_russian:
 agot_dragonstone.0002.t: "[heir.Custom('GetPrincessPrince')] Драконьего Камня"
 agot_dragonstone.0002.desc: "Со времён Эйниса I Драконий Камень был резиденцией наследника Железного трона. Теперь, когда [heir.GetFirstName] в том возрасте, когда может самостоятельно управлять Драконьим Камнем, мне пора либо даровать [heir.GetHerHim] титул [Select_CString(heir.IsFemale, 'принцессы', 'принца' )] Драконьего Камня в знак признания [heir.GetHerHis] положения в державе, либо сохранить титул за собой для использования в будущем."
 agot_dragonstone.0002.a: "Традиция должна быть соблюдена; [heir.GetFirstNameNoTooltip] получит Драконий Камень."
 agot_dragonstone.0002.b: "К чёрту традиции; я оставлю Драконий Камень себе."
 agot_dragonstone.0003.t: "[heir.Custom('GetPrincessPrince')] Драконьего Камня"
 agot_dragonstone.0003.desc: "Теперь, когда я восседаю на Железном троне, пришло время, чтобы [Select_CString(heir.IsFemale, 'моя наследница', 'мой наследник' )], [heir.GetFirstNameNoTooltip], [Select_CString(heir.IsFemale, 'заняла', 'занял' )] своё положение [Select_CString(heir.IsFemale, 'принцессы', 'принца' )] Драконьего Камня, или я могу сохранить традиционный дом Завоевателя для себя в качестве королевского убежища."
 agot_dragonstone.0003.a: "Традиция должна быть соблюдена; [heir.GetFirstNameNoTooltip] получит Драконий Камень."
 agot_dragonstone.0003.b: "К чёрту традиции; я оставлю Драконий Камень себе."
 agot_dragonstone.0007.t: "[heir.Custom('GetPrincessPrince')] Драконьего Камня"
 agot_dragonstone.0007.desc: "Теперь, когда [deceased_heir.GetFirstNameNoTooltip] [Select_CString(deceased_heir.IsFemale, 'умерла', 'умер' )], [heir.GetFirstNameNoTooltip] - [heir.Custom('GetPrincessPrince')] Драконьего Камня по праву. Я не [Select_CString(ROOT.Char.IsFemale, 'уверена, готова', 'уверен, готов' )] ли я назвать ещё одного наследника, так скоро после того, как [Select_CString(deceased_heir.IsFemale, 'умерла', 'умер' )] [Select_CString(deceased_heir.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', deceased_heir)]. Возможно, будет лучше, если [heir.GetFirstNameNoTooltip] будет ближе ко мне..."
 agot_dragonstone.0007.a: "Традиция должна быть соблюдена; [heir.GetFirstNameNoTooltip] получит Драконий Камень."
 agot_dragonstone.0007.b: "[heir.GetFirstNameNoTooltip] ещё не [Select_CString(heir.IsFemale, 'готова', 'готов' )] получить Драконий Камень."
 agot_dragonstone.0008.t: "[heir.Custom('GetPrincessPrince')] и [Select_CString(heir.IsFemale, 'наследница', 'наследник' )]"
 agot_dragonstone.0008.desc: "По обычаю и праву [Select_CString(heir.IsFemale, 'наследница', 'наследник' )] Железного трона [Select_CString(heir.IsFemale, 'должна', 'должен' )] сначала усмирить свою волю на Драконьем Камне. Сегодня [heir.GetFirstName] [Select_CString(heir.IsFemale, 'приняла', 'принял' )] эту мантию и теперь правит как [heir.Custom('GetPrincessPrince')] Драконьего Камня, как и те, кто был до н[heir.GetHerHis]. Вкус власти, взгляд на то, что ждет нас - однажды, когда мое время истечет, [heir.GetSheHe] унаследует не просто эту древнюю вотчину - [heir.GetSheHe] унаследует всю державу.\n\nВзоры придворных обращены теперь к н[heir.GetHerHim], наблюдают, взвешивают. Докажет ли [heir.GetSheHe], что [Select_CString(heir.IsFemale, 'достойна', 'достоин' )] того бремени, которое [heir.GetSheHe] однажды понесёт?"
 agot_dragonstone.0008.a: "[heir.GetHerHis|U] путь проложен - остальное покажет время."
 agot_dragonstone.0008.b: "Интересно, [Select_CString(heir.IsFemale, 'какой правительницей', 'каким правителем' )] [heir.GetSheHe] станет."

 agot_dragonstone.0009.t: "Лишение наследства"
 agot_dragonstone.0009.desc: "[monarch.GetName] [Select_CString(monarch.IsFemale, 'издала', 'издал' )] королевский указ, лишающий меня наследства!\n\nЧто ещё хуже, [monarch.GetSheHe] [Select_CString(monarch.IsFemale, 'приказала', 'приказал' )] мне вернуть Драконий Камень короне, поскольку он принадлежит наследнику Железного трона."
 agot_dragonstone.0009.a: "[monarch.GetSheHe|U] может оставить себе Драконий Камень, но я [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам' )] решу свою судьбу."
 agot_dragonstone.0009.b: "Как унизительно. Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] подчиниться и вернуться ко двору."
 agot_dragonstone.0009.c: "Теперь я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] столкнуться с последствиями лишения наследства."
 agot_dragonstone.0009.c_tt: "@warning_icon! #warning Это приведёт к концу игры!#!"