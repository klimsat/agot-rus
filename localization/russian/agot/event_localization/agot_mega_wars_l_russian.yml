l_russian:

 # Character Interactions
 agot_mw_join_loyalists: "AI: Присоединиться к лоялистам"
 agot_mw_join_loyalists_desc: "AI: Присоединиться к лоялистам"
 agot_mw_join_rebel: "AI: Присоединиться к восставшим"
 agot_mw_join_rebel_desc: "AI: Присоединиться к восставшим"

 AGOT_CANNOT_SWEAR_FEALTY_TO_PRE_WAR_LIEGE: "Вы не можете присягать на верность в разгар гражданской войны."

 # Classic Call the Banners event chain
 MW_MEGA_WAR_STARTED_TITLE: "Держава в состоянии войны!"
 MW_MEGA_WAR_STARTED_MAJOR_DESC: "[war.GetName|U] переросла в [Concept('agot_major_mw', 'большую')|E] [Concept('agot_mega_wars', 'мега-войну')|E]."
 MW_MEGA_WAR_STARTED_MINOR_DESC: "[war.GetName|U] переросла в [Concept('agot_minor_mw', 'малую')|E] [Concept('agot_mega_wars', 'мега-войну')|E]."
 agot_mega_wars.0002.t: "Держава в состоянии войны"
 agot_mega_wars.0002.desc: "[ROOT.Char.GetPrimaryTitle.GetNameNoTier] находится в состоянии войны. Мы должны послать воронов великим лордам, сплотив их на защиту короны."
 agot_mega_wars.0002.a: "Созвать знамена!"
 agot_mega_wars.0002.a.tt: "[mw_rebel_leader.GetName] [Select_CString(mw_rebel_leader.IsFemale, 'начала', 'начал' )] против вас [Concept('agot_mega_wars', 'мега-войну')|E]!"
 agot_mega_wars.0003.desc.a.10: "Наше время пришло! [mw_rebel_leader.GetTitledFirstName], [Select_CString(mw_rebel_leader.IsFemale, 'поддержанная', 'поддержанный' )] нами, [Select_CString(mw_rebel_leader.IsFemale, 'предъявила', 'предъявил' )] требования нашей фракции короне, которую олицетворяет [mw_crown.GetTitledFirstName]. Однако [mw_crown.GetNameRegnal] [Select_CString(mw_crown.IsFemale, 'отказала', 'отказал' )] нам. Чтобы получить желаемое, мы должны прибегнуть к дипломатии стали и железа..."
 agot_mega_wars.0003.desc.a.11: "[mw_rebel_leader.GetFullName] [Select_CString(mw_rebel_leader.IsFemale, 'восстала', 'восстал' )] против короны, которую олицетворяет [mw_crown.GetFullName], в восстании, известном как «[war.GetName]». Поскольку [mw_diarch_target.GetName] полагается на моё регентство, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] решить, сохранят ли [mw_diarch_target.GetPrimaryTitle.GetNameNoTier] верность короне, которую олицетворяет [mw_crown.GetTitledFirstName], присоединятся ли к восставшим, коих возглавляет [mw_rebel_leader.GetTitledFirstName], или останутся нейтральными и позволят течению времени определить моё решение. Я также [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] решить, какова будет моя роль в этом противостоянии..."
 agot_mega_wars.0003.desc.a.12: "[mw_rebel_leader.GetFullName] [Select_CString(mw_rebel_leader.IsFemale, 'восстала', 'восстал' )] против короны, которую олицетворяет [mw_crown.GetFullName], в восстании, известном как «[war.GetName]». Поскольку [mw_diarch_target.GetName] полагается на моё регентство, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] решить, сохранят ли [mw_diarch_target.GetPrimaryTitle.GetNameNoTier] верность короне, которую олицетворяет [mw_crown.GetTitledFirstName], присоединятся ли к восставшим, коих возглавляет [mw_rebel_leader.GetTitledFirstName], или останутся нейтральными и позволят течению времени определить моё решение."
 agot_mega_wars.0003.desc.a.13: "[Select_CString(mw_crown.IsFemale, 'Моя', 'Мой' )] [SCOPE.sC('dragonstone_prince').Custom2('RelationToMeShort', SCOPE.sC('mw_crown'))], [Select_CString(mw_crown.IsFemale,'королева','король')], [Select_CString(mw_crown.IsFemale, 'объявила', 'объявил' )], что мы вступаем в войну. [mw_rebel_leader.GetFullName] [Select_CString(mw_rebel_leader.IsFemale, 'восстала', 'восстал' )] против нас в восстании, известном как [war.GetName]!\n\nКак [Select_CString(dragonstone_prince.IsFemale,'принцесса','принц')] Драконьего Камня, мои войска необходимы для защиты державы. Сейчас тяжёлое время, и каждый воин должен быть готов сражаться за наш дом и честь.\n\nПламя войны настигает нас, и мы должны стойко противостоять врагу."
 agot_mega_wars.0003.desc.a.14: "Время пришло! [mw_crown.GetTitledFirstName] [Select_CString(mw_crown.IsFemale, 'получила', 'получил' )] требования фракции, которую возглавляет [mw_rebel_leader.GetTitledFirstName]. После [mw_crown.GetHerHis] отказа восставшие попытаются получить желаемое... с помощью дипломатии стали..."
 agot_mega_wars.0003.desc.a.15: "[mw_rebel_leader.GetTitledFirstName] [Select_CString(mw_rebel_leader.IsFemale, 'восстала', 'восстал' )] против короны, которую олицетворяет [mw_crown.GetFullName] в восстании, известном как «[war.GetName]». Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] принять решение: сохранить верность короне, которую олицетворяет [mw_crown.GetFullName], присоединиться к восставшим, коих возглавляет [mw_rebel_leader.GetFullName] или оставаться [Select_CString(ROOT.Char.IsFemale, 'нейтральной', 'нейтральным' )] и позволить течению времени определить моё решение."
 agot_mega_wars.0003.desc.a.20: "[mw_rebel_leader.GetFullName] и [mw_crown.GetFullName] начали войну. Поскольку [mw_diarch_target.GetName] слишком [Select_CString(mw_diarch_target.IsFemale, 'мала', 'мал' )], регентство ложится на мои плечи, мне предстоит решить, поддержит ли [mw_diarch_target.GetPrimaryTitle.GetNameNoTier] корону, которую олицетворяет [mw_crown.GetFullNamePossessiveNoTooltip], сохранить ли верность узам, которыми связаны мы и [mw_rebel_leader.GetFullNameNoTooltip], или сохранить нейтралитет и позволить течению времени направлять моё решение."
 agot_mega_wars.0003.desc.a.21: "[mw_rebel_leader.GetTitledFirstName] и [mw_crown.GetFullName] начали войну. Мне нужно выбрать: получит ли [mw_crown.GetFullName] нашу поддержку, или нашей верности заслуживает [mw_rebel_leader.GetTitledFirstName], или же будет лучше сохранить нейтралитет и позволить течению времени направлять моё решение."
 agot_mega_wars.0003.desc.b.1: "Однако, поскольку ранее [mw_loyalty_target_1.GetName] [Select_CString(mw_loyalty_target_1.IsFemale, 'приняла', 'принял' )] мою клятву верности, теперь от меня ожидают, что я сдержу своё слово..."
 agot_mega_wars.0003.desc.c.1: "\n\nМой сюзерен [ROOT.Char.GetLiege.GetTitledFirstName] и я воюем, я не могу ничего предпринять..."
 agot_mega_wars.0003.desc.c.2: "\n\n[ROOT.Char.GetLiege.GetTitledFirstName] решает поддержать корону..."
 agot_mega_wars.0003.desc.c.3: "\n\n[ROOT.Char.GetLiege.GetTitledFirstName] решает сохранить нейтралитет..."
 agot_mega_wars.0003.desc.c.4: "\n\n[ROOT.Char.GetLiege.GetTitledFirstName] решает поддержать мятежников..."
 agot_mega_wars.0003.desc.c.5: "\n\n[ROOT.Char.GetLiege.GetTitledFirstName] решает провозгласить независимость..."
 agot_mega_wars.0003.a: "Восставшие дорого заплатят за это."
 agot_mega_wars.0003.a.tt: "Вы предаёте персонажа [mw_rebel_leader.GetFullName] и [mw_rebel_leader.GetHerHis] заговорщиков."
 agot_mega_wars.0003.a.dragonstone_positive: "Надеюсь, мои воины хорошо послужат [Select_CString(mw_crown.IsFemale,'королеве','королю')]."
 agot_mega_wars.0003.a.dragonstone_negative: "[mw_crown.GetSheHe|U] не имеет права, Драконий Камень должен быть моим!"
 agot_mega_wars.0003.ba: "Мой выбор уже сделан..."
 agot_mega_wars.0003.bb: "Всё решат приливы войны..."
 agot_mega_wars.0003.bc: "Не вижу причин вмешиваться."
 agot_mega_wars.0003.b.tt: "Вы не будете участвовать в этой войне и продолжите поддерживать персонажа [mw_old_stance_leader.GetFullName]."
 agot_mega_wars.0003.c: "Дело восстания праведно!"
 agot_mega_wars.0003.c.tt: "Вы присоединяетесь к восстанию на стороне персонажа [mw_rebel_leader.GetFullName]."
 agot_mega_wars.0003.c.tt.independence: "Поскольку эта война за независимость, вы также получите независимость, если одержите победу!"
 agot_mega_wars.0003.da: "[ROOT.Char.GetLiege.GetTitledFirstName], я последую за вами!"
 agot_mega_wars.0003.db: "Сейчас самое время проложить наш собственный путь!"
 agot_mega_wars.0003.d.tt: "Вы начинаете свою собственную войну за независимость против персонажа [mw_crown.GetFullName]."
 agot_mega_wars.0003.tt.negative: "Поскольку ранее я [Select_CString(ROOT.Char.IsFemale, 'поклялась', 'поклялся' )] в верности персонажу [mw_is_loyal_to.GetName], моё поведение будет расценено как бесчестное."
 agot_mega_wars.0003.tt: "Началась [Concept('agot_mega_wars', 'мега-война')|E]."

 MW_DEBUG_JOIN_LOYALISTS: "ИИ вероятно: #N Присоединится к лоялистам#!"
 MW_DEBUG_STAY_NEUTRAL: "ИИ вероятно: #N Сохранит нейтралитет#!"
 MW_DEBUG_JOIN_REBELS: "ИИ вероятно: #N Присоединится к восстанию#!"
 MW_DEBUG_DECLARES_INDEPENDENCE: "ИИ вероятно: #N Провозгласит независимость#!"

 agot_mega_wars.0004.desc: "Перед лицом разгорающейся войны от меня ожидают, что я отправлю на подмогу свои войска. Мне нужно решить, сколько войск я выделю..."
 agot_mega_wars.0004.a: "[mw_target_scope.GetTitledFirstName] получит всех моих людей!"
 agot_mega_wars.0004.b: "[mw_target_scope.GetSheHe|U] и без того получает достаточно."

 agot_mega_wars.0005.desc.a: "В связи с развернувшейся войной [ROOT.Char.GetDiarchy.GetDiarch.GetFirstName], мой [ROOT.Char.GetDiarchy.GetDiarch.GetDiarchTitle], решает, что [mw_crown.GetFullName] получит #L [ROOT.Char.GetPrimaryTitle.GetAdjective|l]ую#! поддержку в противостоянии, известном как «[war.GetName]»."
 agot_mega_wars.0005.desc.b: "В связи с развернувшейся войной [ROOT.Char.GetDiarchy.GetDiarch.GetFirstName], мой [ROOT.Char.GetDiarchy.GetDiarch.GetDiarchTitle], решает, что [ROOT.Char.GetPrimaryTitle.GetNameNoTier] должны оставаться нейтральными."
 agot_mega_wars.0005.desc.c: "В связи с развернувшейся войной [ROOT.Char.GetDiarchy.GetDiarch.GetFirstName], мой [ROOT.Char.GetDiarchy.GetDiarch.GetDiarchTitle], решает, что [mw_rebel_leader.GetFullName] получит #L [ROOT.Char.GetPrimaryTitle.GetAdjective|l]ую#! поддержку в противостоянии, известном как «[war.GetName]»."
 agot_mega_wars.0005.desc: "\nКак только я возьму власть в свои руки, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] пересмотреть это решение и принять его в зависимости от того, как приливы и отливы времени изменят положение дел..."
 agot_mega_wars.0005.a: "Всё так, как есть..."

 # Event chain for independence declaration, no taxation without representation...
 agot_mega_wars.0010.t: "Восстание [mw_independence_rebel_leader.GetDynastyName]а"
 agot_mega_wars.0010.desc: "[mw_crown.GetPrimaryTitle.GetNameNoTier] в хаосе. [mw_independence_rebel_leader.GetFullName] [Select_CString(mw_independence_rebel_leader.IsFemale, 'отказалась', 'отказался' )] от своей верности короне, которую олицетворяет [mw_crown.GetFullName], и [Select_CString(mw_independence_rebel_leader.IsFemale, 'подняла', 'поднял' )] восстание."
 agot_mega_wars.0010.a: "Посмотрим, чем это обернётся..."

 agot_mega_wars.0011.t: "Восстание [mw_independence_rebel_leader.GetDynastyName]а"
 agot_mega_wars.0011.desc.a: "[mw_crown.GetPrimaryTitle.GetNameNoTier] в хаосе. [mw_independence_rebel_leader.GetFullName] [Select_CString(mw_independence_rebel_leader.IsFemale, 'отказалась', 'отказался' )] от своих клятв верности, которые когда-то [Select_CString(mw_crown.IsFemale, 'приняла', 'принял' )] [mw_crown.GetFullName], и [Select_CString(mw_independence_rebel_leader.IsFemale, 'подняла', 'поднял' )] восстание."
 agot_mega_wars.0011.desc.b: "[mw_crown.GetPrimaryTitle.GetNameNoTier] в хаосе. [mw_independence_rebel_leader.GetTitledFirstName] и [mw_independence_rebel_loc_scope.GetTitledFirstName] отказались от своей верности короне, которую олицетворяет [mw_crown.GetTitledFirstName], и подняли восстание."
 agot_mega_wars.0011.desc.c: "[mw_crown.GetPrimaryTitle.GetNameNoTier] в хаосе. [mw_independence_rebel_leader.GetTitledFirstName] в числе прочих отказывается от своей верности короне, которую олицетворяет [mw_crown.GetTitledFirstName], и поднимает восстание."
 agot_mega_wars.0011.a: "[mw_independence_rebel_leader.GetSheHe|U] пожалеет об этом дне!"
 agot_mega_wars.0011.a.tt: "Вы вступите в войну с персонажем [temp_loc_scope.GetTitledFirstName]!"
 agot_mega_wars.0011.b: "Я [Select_CString(ROOT.Char.IsFemale, 'устала', 'устал' )] от этого, пусть [independence_rebel_leader.GetSheHe] уходит..."
 agot_mega_wars.0011.b.tt: "[temp_loc_scope.GetTitledFirstName] получает независимость!"

 agot_mega_wars.0012.opening: "[mw_independence_rebel_leader.GetName],"
 agot_mega_wars.0012.desc.a: "[mw_independence_rebel_leader.GetPrimaryTitle.GetNameNoTier] мой по праву, я не отдам его без боя!"
 agot_mega_wars.0012.desc.b: "Чтобы предотвратить дальнейшее кровопролитие, у меня нет другого выбора, кроме как отказаться от своего суверенитета над верховным лордством [mw_independence_rebel_leader.GetPrimaryTitle.GetNameNoTier]."
 agot_mega_wars.0012.a: "Тогда это война!"
 agot_mega_wars.0012.b: "Мудрый выбор."

 agot_mega_wars.0020.opening: "Вопрос верности..."
 agot_mega_wars.0020.desc: "[ROOT.Char.Custom('ComplimentAdjective')][Select_CString(ROOT.Char.IsFemale, 'ая', 'ый' )] [ROOT.Char.GetName] слишком долго [faction_target.GetName] правит державой [faction_targeted_title.GetName], хотя [Select_CString(ROOT.Char.IsFemale, 'наша законная', 'наш законный' )] [ROOT.Char.Custom('GetQueenKing')|l] - именно вы. Поэтому [faction_target.GetTitledFirstName] [Select_CString(faction_target.IsFemale, 'получила', 'получил' )] от нас требование отречься от трона в вашу пользу. К сожалению, [faction_target.GetSheHe] [Select_CString(faction_target.IsFemale, 'отказалась', 'отказался' )], и война теперь неизбежна.\nПоведёте ли вы нас в этой борьбе?"
 agot_mega_wars.0020.a: "Я заберу то, что принадлежит мне по праву!"
 agot_mega_wars.0020.b: "Это слишком рискованно. Не впутывайте меня в это..."
 agot_mega_wars.0020.c: "Мои руки связаны..."
 agot_mega_wars.0021.opening: "Вопрос верности..."
 agot_mega_wars.0021.desc.a: "[ROOT.Char.Custom('ComplimentAdjective')][Select_CString(ROOT.Char.IsFemale, 'ая', 'ый' )] [ROOT.Char.GetName], наконец-то мои притязания будут удовлетворены. Пусть [faction_target.GetFirstName] довольствуется последними днями своего правления, скоро на трон взойдёт [faction_claimant.Custom('GetQueenKing')] [faction_claimant.GetFirstName].\nЯ приведу нас к победе!"
 agot_mega_wars.0021.desc.b: "[ROOT.Char.Custom('ComplimentAdjective')][Select_CString(ROOT.Char.IsFemale, 'ая', 'ый' )] [ROOT.Char.GetName], наконец-то мои притязания будут удовлетворены.\nПри нынешнем положении дел я не могу поддержать вас в этой борьбе."
 agot_mega_wars.0021.a: "Да будет так."

 # Mega War Aftermath
 agot_mega_wars.0500.t: "Быть [Select_CString(ROOT.Char.IsFemale, 'королевой', 'королём' )] или не быть [Select_CString(ROOT.Char.IsFemale, 'ей', 'им' )]"
 agot_mega_wars.0500.desc.a: "Я [Select_CString(ROOT.Char.IsFemale, 'вышла победительницей', 'вышел победителем' )] из своей войны с кровожадной династией [defender.GetHouse.GetBaseName]."
 agot_mega_wars.0500.desc.ba: "Силы, верные мне, хотят сделать #italic меня#! [Select_CString(ROOT.Char.IsFemale, 'королевой', 'королём' )]. Они говорят, что [claim_ancestor.GetFirstName] [claim_ancestor.GetDynastyName], [Select_CString(claim_ancestor.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMe', claim_ancestor)] даёт мне право претендовать на трон..."
 agot_mega_wars.0500.desc.bb: "\n\nНо я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] спросить себя, действительно ли я хочу быть [Select_CString(ROOT.Char.IsFemale, 'королевой', 'королём' )]? Думаю, [chosen_LP.GetFirstName] [chosen_LP.GetDynastyName] гораздо больше меня подходит для правления державой."
 agot_mega_wars.0500.desc.bc: "\n\nНо я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] спросить себя, действительно ли я хочу быть [Select_CString(ROOT.Char.IsFemale, 'королевой', 'королём' )]? Думаю, [option_LP_1.GetFirstName] [option_LP_1.GetDynastyName] и [option_LP_2.GetFirstName] [option_LP_2.GetDynastyName] гораздо больше меня подходят для правления державой."
 agot_mega_wars.0500.desc.bd: "\n\nНо я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] спросить себя, действительно ли я хочу быть [Select_CString(ROOT.Char.IsFemale, 'королевой', 'королём' )]? На мой взгляд, такие лорды, как [option_LP_1.GetFirstName] [option_LP_1.GetDynastyName] и [option_LP_2.GetFirstName] [option_LP_2.GetDynastyName], гораздо больше меня подходят для правления державой."
 agot_mega_wars.0500.desc.be: "\n\nНикто не может оспорить моё решение, поэтому я заберу [primary_target_title.GetName] себе."
 agot_mega_wars.0500.desc.c: "Никто не будет оспаривать мой выбор сделать королём любого из этих великих людей, если я так решу..."
 agot_mega_wars.0500.desc.d: "К несчастью, [ROOT.Var('si_selected_character').Char.GetTitledFirstName] отвергает предложение, [ROOT.Var('si_selected_character').Char.GetSheHe] не будет править державой. Следовательно, я ещё раз [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] принять решение...."
 agot_mega_wars.0500.a: "[defender.GetTitledFirstName] будет [Select_CString(defender.IsFemale, 'свергнута', 'свергнут' )] с трона и этого должно быть достаточно."
 agot_mega_wars.0500.b: "Они правы, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] править."
 agot_mega_wars.0500.ca: "[chosen_LP.GetTitledFirstName] [Select_CString(chosen_LP.IsFemale, 'должна', 'должен' )] править."
 MEGA_WARS_0500_ca_TOOLTIP: "[chosen_LP.GetTitledFirstName] отреагирует на ваш выбор."
 MEGA_WARS_0500_cb_TOOLTIP: "Вы выберете нового правителя державы [primary_target_title.GetName]."
 agot_mega_wars.0500.cb: "Я выберу кого-нибудь другого..."

 agot_mega_wars.0501.t: "Быть [Select_CString(ROOT.Char.IsFemale, 'королевой', 'королём' )] или не быть [Select_CString(ROOT.Char.IsFemale, 'ей', 'им' )]"
 agot_mega_wars.0501.desc: "Я тщательно обдумываю, кто станет лучшим правителем державы [primary_target_title.GetName]..."
 agot_mega_wars.0501.a: "... это естественный выбор."
 MEGA_WARS_0501_a_TOOLTIP: "Выбранный персонаж отреагирует на ваш выбор."

 agot_mega_wars.0502.t: "Быть [Select_CString(ROOT.Char.IsFemale, 'королевой', 'королём' )] или не быть [Select_CString(ROOT.Char.IsFemale, 'ей', 'им' )]"
 agot_mega_wars.0502.desc: "[attacker.GetTitledFirstName] просит меня принять корону и бразды правления державой [primary_target_title.GetName]. Как мне отреагировать?"
 agot_mega_wars.0502.a: "Пошлите ворона... Я [Select_CString(ROOT.Char.IsFemale, 'согласна', 'согласен' )]."
 agot_mega_wars.0502.b: "У меня есть другие обязательства..."

 agot_mega_wars.0503.t: "Быть [Select_CString(ROOT.Char.IsFemale, 'королевой', 'королём' )] или не быть [Select_CString(ROOT.Char.IsFemale, 'ей', 'им' )]"
 agot_mega_wars.0503.desc.a: "Поскольку теперь я [Select_CString(ROOT.Char.IsFemale, 'взошла', 'взошёл' )] на Железный трон, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] решить, кто возглавит [old_demesne_main_title.GetName] вместо меня..."
 agot_mega_wars.0503.desc.ba: "Мои братья, Станнис и Ренли"
 agot_mega_wars.0503.desc.bb: "Мой брат, [living_brother.GetFirstName]"
 agot_mega_wars.0503.desc.bc: "[option_dynasty_member.GetName]"
 agot_mega_wars.0503.desc.c: "\nно я также всегда могу положиться на своих родственников из дома Эстермонт"
 agot_mega_wars.0503.a: "Я выберу члена своей семьи."
 agot_mega_wars.0503.b: "Кто-нибудь из моей династии подойдет."
 agot_mega_wars.0503.c: "Я отдам титул одному из своих вассалов."
 agot_mega_wars.0503.d: "Я оставлю титул у себя."
 agot_mega_wars.0503.desc.msg: "[old_demesne_main_title.GetHolder.GetLadyLord|U] [old_demesne_main_title.GetHolder.GetFirstName] [Select_CString(old_demesne_main_title.GetHolder.IsFemale, 'получила', 'получил' )] в дар титул [old_demesne_main_title.GetName]."

 agot_mega_wars.0504.t: "Быть [Select_CString(ROOT.Char.IsFemale, 'королевой', 'королём' )] или не быть [Select_CString(ROOT.Char.IsFemale, 'ей', 'им' )]"
 agot_mega_wars.0504.desc: "Я тщательно обдумываю, кто станет лучшим правителем для владения [old_demesne_main_title.GetName]..."
 agot_mega_wars.0504.a: "... это естественный выбор."
 agot_mega_wars.0504.b: "Может быть, кто-то другой подойдет больше..."

 agot_mega_wars.0505.t: "Вопрос Драконьего Камня"
 agot_mega_wars.0505.desc: "Теперь, когда вопрос владения [old_demesne_main_title.GetName] решён, остаётся последний вопрос: что станет с Драконьим Камнем, древней резиденцией дома Таргариенов и резиденцией наследника Железного трона?\n"
 agot_mega_wars.0505.a: "[chosen_sibling.GetName] будет править им."
 agot_mega_wars.0505.b: "... я получу его"
 agot_mega_wars.0505.c: "В конце концов, почему бы мне не оставить его себе?"

 agot_mega_wars.0506.t: "Королевские последствия"
 agot_mega_wars.0506.desc: "Война выиграна, королевская семья свергнута. Знамя узурпатора теперь развевается над Королевской гаванью.\n\nТеперь необходимо принять трудное решение: что делать с бывшей королевской семьей? PLACEHOLDER Решите, что делать с бывшей королевской семьей; оставите их в покое, убьёте их всех или изгоните их"
 agot_mega_wars.0506.a: "Оставить их в покое."
 agot_mega_wars.0506.b: "Убить их всех."
 agot_mega_wars.0506.c: "Изгнать их из державы."

 agot_mega_wars.0510.t: "Новый правитель"
 agot_mega_wars.0510.desc.a: "Лордам и леди державы [primary_target_title.GetNameNoTooltip],"
 agot_mega_wars.0510.desc.b: "\nЯ, [choosing_ruler.GetFullName], настоящим постановляю, что:"
 agot_mega_wars.0510.desc.c: "\n $EFFECT_LIST_BULLET$ Отныне я буду править державой [primary_target_title.GetName]"
 agot_mega_wars.0510.desc.d: "\n $EFFECT_LIST_BULLET$ [chosen_crown_ruler.GetName] будет отныне править державой [primary_target_title.GetName]"
 agot_mega_wars.0510.desc.e: "\n $EFFECT_LIST_BULLET$ [war_loser.GetName] [Select_CString(war_loser.IsFemale, 'будет низложена', 'будет низложен' )], и трон займёт [primary_target_title.GetHolder.GetTitledFirstName]"
 agot_mega_wars.0510.desc.f: "\n $EFFECT_LIST_BULLET$ [Select_CString(old_demesne_main_title.GetHolder.IsFemale, 'Леди', 'Лорд' )] [old_demesne_main_title.GetHolder.GetFirstName] получит [old_demesne_main_title.GetName]"
 agot_mega_wars.0510.a: "Я буду держать свои амбиции при себе."
 agot_mega_wars.0510.b: "Интересно, как [primary_target_title.GetHolder.GetTitledFirstName] будет править..."

 agot_mega_wars.0600.t: "Последствия войны"
 agot_mega_wars.0600.desc: "Наконец-то мы добились победы перед лицом тех, кто пытался восстать против меня и нарушить моё праведное правление. Теперь, когда изменники в пределах моей досягаемости, пришло время выбрать, какая судьба их постигнет. Проявить ли к ним милосердие, наказать ли за их прегрешения..."
 agot_pui_events.0600.desc.mw_rebels_won: "Вопреки всему, мы свергли тиранов, претендовавших на трон, разорвав их хватку и закрепив за мной положение [Select_CString(ROOT.Char.IsFemale, 'законной правительницы', 'законного правителя' )]. Залы власти теперь открыты для нас, а те, кто противился нашему делу, повержены.\n\nНастало время решить судьбу тех, кто пытался заковать нас в цепи. Проявим ли мы милосердие или воздадим по справедливости за те страдания, которые они причинили?"
 agot_mega_wars.0600.a: "Привести их ко мне!"

 agot_mega_wars.0601.t: "Последствия войны"
 agot_mega_wars.0601.desc: "[selected_traitor.GetTitledFirstName] опускается передо мной на колени, [Select_CString(selected_traitor.IsFemale, 'готовая', 'готовый' )] выслушать мой приговор за свою измену. Передо мной много вариантов относительно того, какое наказание [selected_traitor.GetSheHe] примет; некоторые в лёгкой форме, некоторые в тяжёлой. Какой из них выбрать, будет зависеть от того, насколько серьёзной была [selected_traitor.GetHerHis] измена против трона."
 agot_mega_wars.0601.a: "[selected_traitor.GetLiege.GetTitledFirstNameNoTooltip] решит вопрос о [selected_traitor.GetHerHis] наказании."
 agot_mega_wars.0601.b: "Пусть [selected_traitor.GetLiege.GetTitledFirstNameNoTooltip] самолично решает вопрос о наказании своих вассалов."
 agot_mega_wars.0601.b.tt: "[selected_traitor.GetLiege.GetTitledFirstNameNoTooltip] решит вопрос о наказании персонажа [temp_traitors_scope.GetTitledFirstNamePossessiveNoTooltip]."
 agot_mega_wars.0601.c: "[selected_traitor.GetSheHe|U] может ещё немного подождать в моих подземельях."
 agot_mega_wars.0601.d: "Да будет исполнена моя воля."
 agot_mega_wars.0601.e: "#N DEBUG #! Пропустить всех изменников"

 agot_mega_wars.0602.t: "agot_mega_wars.0602"
 agot_mega_wars.0602.desc: "agot_mega_wars.0602.desc"
 agot_mega_wars.0602.a: "agot_mega_wars.0602.a"

 agot_mega_wars.0603.t: "Вынесенный приговор"
 agot_mega_wars.0603.desc.a: "В наказание за моё преступление государственной измены, [ROOT.Var('crown_target').Char.GetName] постановляет, что "
 agot_mega_wars.0603.desc.b: "[ROOT.Var('selected_hostage').Char.GetName] станет заложником при дворе, которым правит [ROOT.Var('crown_target').Char.GetTitledFirstName]."
 agot_mega_wars.0603.desc.c: "\n\nЯ буду [Select_CString(ROOT.Char.IsFemale, 'лишена', 'лишён' )] титула [selected_title.GetName]."
 agot_mega_wars.0603.desc.d: "\n\nЯ буду [Select_CString(ROOT.Char.IsFemale, 'лишена', 'лишён' )] своих основных титулов."
 agot_mega_wars.0603.desc.e: "\n\nЯ буду [Select_CString(ROOT.Char.IsFemale, 'лишена', 'лишён' )] своих второстепенных титулов."
 agot_mega_wars.0603.desc.f: "\n\nМой дом будет лишён всех земель и титулов."
 agot_mega_wars.0603.desc.g: "\n\nВсе мои титулы, кроме нынешнего, будут отозваны."
 agot_mega_wars.0603.desc.h: "\n\nЯ буду [Select_CString(ROOT.Char.IsFemale, 'лишена', 'лишён' )] половины своих земель."
 agot_mega_wars.0603.desc.i: "\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] отказаться от такого артефакта, как [ROOT.Char.MakeScope.Var('selected_artifact').Artifact.GetName], который получит [ROOT.Var('crown_target').Char.GetName]."
 agot_mega_wars.0603.desc.j: "\n\nЯ буду [Select_CString(ROOT.Char.IsFemale, 'казнена', 'казнён' )]."
 agot_mega_wars.0603.desc.k: "\n\nМоя семья будет казнена."
 agot_mega_wars.0603.desc.l: "\n\nВся моя династия будет уничтожена."
 agot_mega_wars.0603.desc.m: "\n\nМеня отправят на Стену, чтобы я надел чёрное."
 agot_mega_wars.0603.desc.n: "\n\nЯ буду [Select_CString(ROOT.Char.IsFemale, 'изгнана', 'изгнан' )] из державы [ROOT.Var('crown_target').Char.GetPrimaryTitle.GetNameNoTier]."
 agot_mega_wars.0603.desc.o: "\n\nМоя семья будет изгнана из державы [ROOT.Var('crown_target').Char.GetPrimaryTitle.GetNameNoTier]."
 agot_mega_wars.0603.desc.p: "\n\nВся моя династия будет изгнана из державы [ROOT.Var('crown_target').Char.GetPrimaryTitle.GetNameNoTier]."
 agot_mega_wars.0603.a.1a: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] принять [ROOT.Var('crown_target').Char.GetHerHis] правосудие."
 agot_mega_wars.0603.a.1b: "Я мало что могу сделать."
 MEGA_WARS_0300_a1_IMPRISONED: "Поскольку вы заключены в тюрьму, вам не избежать наказания."
 MEGA_WARS_0300_b: "Если вы вступаете в войну и проигрываете, наказание неизбежно. Это легко может стать концом вашего рода, земель и наследия... Тщательно подумайте об этом."
 agot_mega_wars.0603.b: "Возмутительно! Я скорее умру, чем сдамся!"

 agot_mega_wars.0604.t: "Неповиновение"
 agot_mega_wars.0604.desc.a: "После вынесенного вами приговора приходят новости о том, что [mw_new_rebel_leader.GetName] [Select_CString(mw_new_rebel_leader.IsFemale, 'бросила', 'бросил' )] вызов вашему правосудию и снова поднимает восстание..."
 agot_mega_wars.0604.desc.b: "После вынесенного вами приговора приходят новости о том, что некоторые бывшие мятежники бросили вызов вашему правосудию и снова подняли восстание..."
 agot_mega_wars.0604.a.1: "Как [mw_new_rebel_leader.GetSheHe] [Select_CString(mw_new_rebel_leader.IsFemale, 'посмела', 'посмел' )]! Я [ROOT.Char.GetTitleAsNameNoTooltip]!"
 agot_mega_wars.0604.a.2: "Как они смеют! Я их [ROOT.Char.GetTitleAsNameNoTooltip]!"
 agot_mega_wars.0604.b.1: "Я [Select_CString(ROOT.Char.IsFemale, 'устала', 'устал' )] от этого, пусть [mw_new_rebel_leader.GetSheHe] уходит... [ROOT.Char.Custom('MWGetRebelsLoyalists')]"
 agot_mega_wars.0604.b.2: "Я [Select_CString(ROOT.Char.IsFemale, 'устала', 'устал' )] от этого, отпустите их... [ROOT.Char.Custom('MWGetRebelsLoyalists')]"
 POST_REBEL_JOINS_TOOLTIP: "[post_rebel_scope.GetName] скорее всего, присоединится к вашему делу."

 agot_mega_wars.0605.t: "Наказание изменников"
 agot_mega_wars.0605.desc: "Война окончена, я [Select_CString(ROOT.Char.IsFemale, 'победила', 'победил' )]. Итак, как наказать изменников?\nИзменник: [selected_traitor.GetName]"
 agot_mega_wars.0605.a: "Вы не должны этого видеть."

