l_russian:

 #########################
 ## Hedge Knight Events ##
 #########################

 # Hedge knight wants to squire your heir
 agot_knighthood.0016.t: "Межевой рыцарь"
 agot_knighthood.0016.desc: "Последние несколько дней в моих залах гостит межевой рыцарь. Кажется, мой сын [potential_child_squire.GetName] привязался к нему. Межевой рыцарь также привязался к моему сыну. Мой сын очарован его захватывающими историями об учтивости и рыцарстве.\n\n В последний день его прибывания при моём дворе межевой рыцарь предлагает остаться и позволить моему сыну стать его оруженосцем.\n\n Этот человек кажется достаточно благородным и это сделало бы моего сына очень, очень счастливым. Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] подумать об этом. "
 agot_knighthood.0016.a: "Да, вы должны остаться и взять его в оруженосцы!"
 agot_knighthood.0016.a.tt: "[hedge_knight.GetName] присоединится к вашему двору и примет вашего сына в качестве своего [Concept('squire', 'оруженосца')|E]."
 agot_knighthood.0016.b: "Нет, я не думаю, что вы подходящий рыцарь."
 agot_knighthood.0016.b.tt: "[hedge_knight.GetName] оставит ваш двор"

 # Hedge knight wants to knight your non-heir son
 agot_knighthood.0700.t: "Межевой рыцарь и младший сын"
 agot_knighthood.0700.desc: "Межевой рыцарь по имени [hedge_knight.GetName] недавно посетил мой двор. Представитель #L [hedge_knight.GetCulture.GetCollectiveNoun|l]ого#! народа по происхождению, он путешествовал по державе, ища лорда, которому он мог бы служить. Об этом человеке я знаю лишь то, что он, конечно же, является рыцарем и, якобы, происходит из мелкой дворянской семьи Западных земель.\n\nЯ не [Select_CString(ROOT.Char.IsFemale, 'обращала', 'обращал' )] на него никакого внимания, и поэтому [Select_CString(ROOT.Char.IsFemale, 'ожидала', 'ожидал' )], что в ближайшее время он продолжит свой путь. Однако он улучил момент, когда я [Select_CString(ROOT.Char.IsFemale, 'была одна', 'был один' )] и предложил, чтобы мой сын, [potential_child_knight.GetName] был посвящён им в рыцари, в обмен на то, что ему будет позволено оставаться столько, сколько он пожелает!"
 agot_knighthood.0700.a: "Я полагаю, что такая договорённость может быть достигнута."
 agot_knighthood.0700.b: "Нет, я не соглашусь на это."

 # Hedge knight wants to knight you
 agot_knighthood.0701.t: "Межевой рыцарь и лорд"
 agot_knighthood.0701.desc: "Межевой рыцарь по имени [hedge_knight.GetName] недавно посетил мой двор. Представитель #L [hedge_knight.GetCulture.GetCollectiveNoun|l]ого#! народа по рождению, он путешествует по державе по неизвестным причинам.\n\nХотя я не [Select_CString(ROOT.Char.IsFemale, 'обращала', 'обращал' )] на него внимания, похоже, что он обратил внимание на меня. Рано утром одному из моих слуг была доставлена грубая записка, которую подписал никто иной, как [hedge_knight.GetFirstName], в которой мне предлагается стать рыцарем. За соответствующую цену, говорится в записке, я могу стать рыцарем."
 agot_knighthood.0701.a: "Я соглашусь на эту сделку."
 agot_knighthood.0701.b: "Нет, я не соглашусь на это."

 #####################
 # Dynasty Knighting #
 #####################

 #0017-19
 agot_knighthood.0017.t: "Династическое рыцарство"
 agot_knighthood.0017.desc: "[Select_CString(potential_squire.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('potential_squire'))] [potential_squire.GetName] ещё не является оруженосцем. Возможно, что предложив сделать [potential_squire.GetHerHis] своим оруженосцем, я смогу улучшить наши отношения?"
 agot_knighthood.0017.a: "Да, я предложу [potential_squire.GetHerHim] стать оруженосцем."
 agot_knighthood.0017.a.tt: "Вы просите персонажа [potential_squire.GetName] стать вашим [Concept('squire', 'оруженосцем')|E]"
 agot_knighthood.0017.b: "Нет, это пустая трата времени."
 agot_knighthood.0017.b.tt: "Вы не предложите персонажу [potential_squire.GetName] стать вашим оруженосцем."

 agot_knighthood.0018.opening: "[potential_knight_for_child.GetName],"
 agot_knighthood.0018.desc: "Я заметил, что вы ещё не оруженосец! Если вы хотите это исправить, то необходимо как можно скорее найти для этого подходящего рыцаря...\n\n К счастью, судьба связала нас кровью! Если хотите, я могу сделать вас своим оруженосцем и однажды, если вы это заслужите, я посвящу вас в рыцари."
 agot_knighthood.0018.a: "Ура, принимаю!"
 agot_knighthood.0018.b: "Извините, но нет."
 agot_knighthood.0018.b_toast: "[potential_squire.GetName] отвечает"
 agot_knighthood.0018.b_toast_tt: "[potential_squire.GetName] отклонил ваше предложение"

 agot_knighthood.0019.opening: "[knight_offerer.GetName],"
 agot_knighthood.0019.desc: "Я принимаю предложение стать вашим оруженосцем. В наших жилах течёт одна и та же кровь, поэтому мы должны стремиться укрепить эти узы!"
 agot_knighthood.0019.a: "Замечательно!"

 ##############################
 # Squire Notification Events #
 ##############################

 agot_knighthood.became_a_squire_toast.t: "Оруженосец"
 agot_knighthood.became_a_squire_toast.tt: "[my_knight.GetName] сделал меня своим оруженосцем"

 agot_knighthood.0300.t: "Прогресс оруженосца"
 agot_knighthood.0300.desc: "Мой оруженосец [my_squire.GetName] доказал свою ценность! [my_squire.GetSheHe|U] обучился всему, что должен уметь оруженосец и я считаю, что пришло время посвятить [my_squire.GetHerHis] в рыцари."
 agot_knighthood.0300.a: "Я посвящу [my_squire.GetHerHis] в рыцари."
 agot_knighthood.0300.a.tt: "[my_squire.GetName] будет посвящён в рыцари!"

 agot_knighthood.0320.t: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_relation'))|U] посвящён в рыцари!"
 agot_knighthood.0320.desc_same_house: "До меня дошли вести о том, что мой [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_relation'))], [my_relation.GetTitledFirstName] был посвящён в рыцари! Дом [ROOT.GetCharacter.GetHouse.GetName] очень гордится им."
 agot_knighthood.0320.desc_not_same_house: "До меня дошли вести о том, что мой [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_relation'))], [my_relation.GetTitledFirstName] был посвящён в рыцари! Мы все очень гордимся им."
 agot_knighthood.0320.a: "[my_relation.GetSheHe] молодец!"

 ##################
 # Toast Tooltips #
 ##################

 agot_knighthood.increase_progtoknighthood_toast.tt: "Ваш прогресс к рыцарству увеличивается."
 agot_knighthood.decrease_progtoknighthood_toast.tt: "Ваш прогресс к рыцарству уменьшается"

 agot_knighthood.0021.a_toast: "Предоставлено место оруженосца"
 agot_knighthood.0021.a_toast.tt: "Вы стали оруженосцем персонажа [potential_knight.GetName]"
 agot_knighthood.0021.b_toast: "[nearby_knight.GetName] ответил."
 agot_knighthood.0021.b_toast.tt: "[nearby_knight.GetName] отклонил вашу просьбу."

 ##Used in the Squire Interaction (Via char menu)
 agot_knighthood_squire_offer_accept_toast: "Просьба об оруженосце удоволетворена"
 agot_knighthood_squire_offer_accept_toast.tt: "У вас появился оруженосец!"
 agot_knighthood_squire_offer_reject_toast: "Просьба об оруженосце отклонена"
 agot_knighthood_squire_offer_reject_toast.tt: "Ваше предложение о положении оруженосца #N было отклонено!#!"
 
 agot_knighthood_offer_rejected_toast: "Предложение посвятить в рыцари отклонено"
 agot_knighthood_offer_rejected_toast.tt: "Ваше предложение о посвящении в рыцари #N было отклонено!#!"

 #Used in places outside the 'grant knighthood' interaction
 agot_knighthood_made_a_knight_generic_toast: "Вы посвятили кого-то в рыцари!"
 agot_knighthood_made_a_knight_generic_toast.tt: "Вы посвятили кого-то в рыцари"

 #################################
 ## Battlefield Knighting Event ##
 #################################

 agot_knighthood.0601.t: "Рыцарство на поле боя"
 agot_knighthood.0601.desc: "После битвы во владении [battle_province.GetName] один из моих помощников представляет мне список солдат, которые показали себя очень хорошо. Имя [soldier_to_be_knighted.GetName] запомнилось мне особенно.\n\nМой помощник рекомендует посвятить их в рыцари на поспешной церемонии на поле боя; по его словам, посвящение в рыцари этих солдат, стоящих среди резни и руин битвы, поднимет боевой дух в наших рядах."
 agot_knighthood.0601.a: "Да, [soldier_to_be_knighted.GetFirstName] достоин стать рыцарем."
 agot_knighthood.0601.a.tt: "Вы посвятите персонажа [soldier_to_be_knighted.GetName] в рыцари."
 agot_knighthood.0601.b: "Нет, я не посвящу его в рыцари."

 agot_knighthood.0602.t: "Доблесть на поле боя"
 agot_knighthood.0602.desc: "После битвы во владении [battle_province.GetName] наш командир, [side_commander.GetName], [Select_CString(side_commander.IsFemale, 'вызвала', 'вызвал' )] к себе несколько человек, включая меня.\n\n[side_commander.GetSheHe|U] [Select_CString(side_commander.IsFemale, 'сообщила', 'сообщил' )] нам, что [side_commander.GetSheHe] [Select_CString(side_commander.IsFemale, 'впечатлена', 'впечатлён' )] нашей доблестью на поле боя и что благодаря этому мы будем посвящены в рыцари!"
 agot_knighthood.0602.a: "Теперь я рыцарь!"
 agot_knighthood.0602.a.tt: "Вы были посвящены в рыцари!"

 ######################################
 ## Special Squire Assignment Events ##
 ######################################

 agot_knighthood.0800.t: "Обучение детей рыцарскому делу"
 agot_knighthood.0800.desc: "Мой ребёнок, [squire.GetName], недавно достиг возраста, в котором он может стать оруженосцем. Возможно, я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] бы приказать члену моей Королевской гвардии заняться им? Я считаю, что [knight.GetName] был бы хорошим кандидатом."
 agot_knighthood.0800.a: "Да!"
 agot_knighthood.0800.b: "Нет!"

 agot_knighthood.0801.t: "Обучение детей рыцарскому делу"
 agot_knighthood.0801.desc: "Мой ребёнок, [squire.GetName], недавно достиг возраста, в котором он может стать оруженосцем. Возможно, я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] бы приказать одному из моих вассалов заняться им? Я считаю, что [knight.GetName] был бы хорошим кандидатом."
 agot_knighthood.0801.a: "Да!"
 agot_knighthood.0801.b: "Нет!"

 agot_knighthood.0802.opening: "[sender.Custom2('AppropriateGreeting', ROOT.Char)],"
 agot_knighthood.0802.desc: "Настоящим я приказываю: [squire.GetName] должен стать вашим оруженосцем! Я надеюсь, что [squire.GetName] узнает от вас все тонкости рыцарства!"
 agot_knighthood.0802.a: "Я получил приказ."
 
 # Other Events

 agot_knighthood.0820.t: "Рыцарю нужен оруженосец"
 agot_knighthood.0820.desc: "Пока я осматриваю окрестности, ко мне подходит маленький ребёнок.\n\n«[Select_CString(ROOT.Char.IsFemale, 'Миледи', 'Милорд' )], — начинает ребёнок, — вы ведь участвуете в турнире во владении [tournament_province.GetName]?»\n\n«Участвую, но тебе-то что до этого, [wannabe_squire.Custom('GirlBoy')]?» — отвечаю я, прерывая осмотр, чтобы разобраться с ребёнком.\n\n«Возьмите меня с собой, [Select_CString(ROOT.Char.IsFemale, 'миледи', 'милорд' )], — говорит [wannabe_squire.GetSheHe]. — Рыцарю нужен оруженосец, а я мог бы служить вам на турнире... Я умею чистить и седлать лошадей, готовить, а когда придёт время поединка, смогу помочь вам с оружием и доспехами, сир»."
 agot_knighthood.0820.a: "Мне и правда нужен оруженосец на турнир, но тебе придётся меня слушаться."
 agot_knighthood.0820.b: "Прочь, ты мне не нужен."

 ##LOC KEYS FOR KNIGHTING

 contest_winner_ceremony_knighthood_tt: "Посвящён в рыцари персонажем [host.GetShortUIName|U]"