l_russian:
 #Marked for Review

 # Lorath Intro - Thys O'rel
 agot_bells_of_war.0001.t: "Расширяя лабиринт"
 agot_bells_of_war.0001.desc: "После успешной кампании против Норвоса я [Select_CString(ROOT.Char.IsFemale, 'направила', 'направил' )] мощь Лората против иббенийской колонии на Секире, которую возглавляет [Select_CString(ibbenese_colony_leader.IsFemale, 'загадочная', 'загадочный' )] [ibbenese_colony_leader.GetName].\n\nОднако моя кампания против иббенийцев продвигается медленнее, чем я [Select_CString(ROOT.Char.IsFemale, 'рассчитывала', 'рассчитывал' )]. [ibbenese_colony_leader.GetTitledFirstNameNoTooltip] использует сложный рельеф местности в своих интересах, а мои капитаны раздражающе медленно приспосабливаются к новым условиям.\n\nЕсли мы в ближайшее время не одержим победу над иббенийцами, боюсь, враги Лората воспользуются тем, что я далеко от дома."
 agot_bells_of_war.0001.a: "Иббенийцы будут сломлены!"

 # Norvos Intro - Egoh Dazh Reo
 agot_bells_of_war.0002.t: "Колокола войны"
 agot_bells_of_war.0002.desc: "Почти три года назад войска Лората одержали победу над Норвосом в сражении. В рамках своей предвыборной программы я [Select_CString(ROOT.Char.IsFemale, 'пообещала', 'пообещал' )] исправить несправедливость, с которой мы столкнулись со стороны лоратцев. С самого начала своего правления я с нетерпением [Select_CString(ROOT.Char.IsFemale, 'ждала', 'ждал' )] этого момента и [Select_CString(ROOT.Char.IsFemale, 'готовилась', 'готовился' )] к нему.\n\nТеперь донесения моих разведчиков и шпионов свидетельствуют о том, что [lorathi_leader.GetName] [Select_CString(lorathi_leader.IsFemale, 'увязла', 'увяз' )] в сражениях с иббенийцами на Секире. Очевидно, что мнимые завоеватели откусили больше, чем могут проглотить.\n\nКак бы то ни было, силы Лората по-прежнему представляют угрозу для Норвоса, если мы будем действовать в одиночку. [Select_CString(qohor_m1.IsFemale, 'Моя союзница', 'Мой союзник' )] из Квохора, [qohor_m1.GetName], является одним из фаворитов предстоящих выборов и [Select_CString(qohor_m1.IsFemale, 'пообещала', 'пообещал' )] поддержать контрнаступление против Лората. Нам остаётся только дождаться подходящего момента."
 agot_bells_of_war.0002.a: "Скоро зазвонят колокола войны!"

 # Qohor M1 - Korena Ostorlat
 agot_bells_of_war.0003.t: "Надвигающиеся выборы"
 agot_bells_of_war.0003.desc: "[old_qohor_guy.GetName] умирает.\n\nХотя моя кандидатура является строго неофициальной пока [Select_CString(old_qohor_guy.IsFemale, 'жива', 'жив' )] [old_qohor_guy.GetTitledFirstNameNoTooltip], мои шпионы по всему городу сообщают, что я — [Select_CString(ROOT.Char.IsFemale, 'одна', 'один' )] из главных претендентов на пост первого магистра. [Select_CString(qohor_m2.IsFemale, 'Моя единственная конкурентка', 'Мой единственный конкурент' )] — [qohor_m2.GetName], моя идеологическая противоположность.\n\nЧтобы продемонстрировать свою силу, я [Select_CString(ROOT.Char.IsFemale, 'пообещала', 'пообещал' )] поддержку норвошийцам в организации контрнаступления против Лората. Благодаря мощной военной кампании я смогу заручиться поддержкой чужеземных союзников Кхохора и одним махом подавить внутренних смутьянов. По крайней мере, я на это надеюсь."
 agot_bells_of_war.0003.a: "Приближаются выборы..."

 # Qohor M2 - Haratt Ekna
 agot_bells_of_war.0004.t: "Надвигающиеся выборы"
 agot_bells_of_war.0004.desc: "К счастью, [old_qohor_guy.GetName] скоро умрёт. По предварительным данным от моих союзников, [Select_CString(qohor_m1.IsFemale, 'моя единственная реальная конкурентка', 'мой единственный реальный конкурент' )] на пост первого магистра — [qohor_m1.GetName].\n\nПытаясь заручиться поддержкой своей кандидатуры, я не [Select_CString(ROOT.Char.IsFemale, 'скрывала', 'скрывал' )] своего презрения к сближению державы с Норвосом. Если меня изберут, Норвос заплатит за свои преступления против Квохора."
 agot_bells_of_war.0004.a: "Скоро наступит час моего возвышения!"

 # Qohor Old Guy - Emondar Johibors
 agot_bells_of_war.0005.t: "Надвигающиеся выборы"
 agot_bells_of_war.0005.desc: "Моя жизнь подходит к концу, но, что ещё важнее, закончится и моё правление на посту первого магистра — и мир это знает.\n\nМои соотечественники делают ставки на то, как скоро я умру, а чужеземцы пытаются привлечь на свою сторону кандидатов на предстоящих выборах. Похоже, держава хочет двигаться дальше без меня."
 agot_bells_of_war.0005.a: "Я всё ещё на своём посту, пока что."

 # Aegon IV
 agot_bells_of_war.0006.t: "Турнир оруженосцев"
 agot_bells_of_war.0006.desc: "Скоро [daemon_blackfyre.GetName], чьей матерью является моя кузина [daena_targaryen.GetName], будет праздновать свои именины. Хоть я и [Select_CString(ROOT.Char.IsFemale, 'держалась', 'держался' )] от мальчика на расстоянии, он мне по-прежнему дорог... пожалуй, даже больше, чем #italic мои другие#! дети, осмелюсь сказать.\n\nЯ хочу порадовать мальчика и сделать ему подарок, который он не забудет. Зная о его страсти к фехтованию, я [Select_CString(ROOT.Char.IsFemale, 'приказала', 'приказал' )] своим советникам подготовить грандиозный турнир для самых выдающихся оруженосцев державы. Среди них, разумеется, будет и [daemon_blackfyre.GetFirstNameNoTooltip]."
 agot_bells_of_war.0006.a: "Удачи, [daemon_blackfyre.GetFirstNameNoTooltip]."

 # Rhoyne
 agot_bells_of_war.0007.t: "Первая дочь наносит удар"
 agot_bells_of_war.0007.desc: "Волантинцы обернулись против нас. Хотя [rhoynar_confederation.GetName] ценой огромных потерь захватила стратегически важную крепость Гар-Сагон, волантинцы перехватили контроль над ней и объявили нас своими врагами.\n\n[volantis_invader.GetName] [Select_CString(volantis_invader.IsFemale, 'прибыла', 'прибыл' )] с внушительным войском и, не теряя времени, [Select_CString(volantis_invader.IsFemale, 'дала', 'дал' )] понять, что ройнары теперь враги Волантиса...\n\nДругие ройнары откликнулись на мой призыв и присоединились ко мне в попытке дать отпор изменникам. [rhoynar_confederation.GetName] должна победить, иначе нам конец.\n\nВолантинцы утверждают, что они наследники драконов..."
 agot_bells_of_war.0007.a: "Так что отправим их на встречу со своими предками!"

 # Rhoyne - Volantis Governor
 agot_bells_of_war.0008.t: "Нападение на ройнаров"
 agot_bells_of_war.0008.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'начала', 'начал' )] вторжение, чтобы [rhoynar_confederation.GetName] была сокрушена раз и навсегда. Хотя они сыграли важную роль в захвате Гар-Сагона, нельзя допустить, чтобы их влияние распространялось в этом регионе, не говоря уже о том, чтобы они контролировали сам Гар-Сагон.\n\nВ моём распоряжении внушительное войско, и я завоюю эти земли для Волантиса!"
 agot_bells_of_war.0008.a: "Надеюсь, я быстро разделаюсь с этими конфедератами."

 agot_bells_of_war.0009.t: "Турнир оруженосцев"
 agot_bells_of_war.0009.desc: "[aegon_iv.GetName] устроил турнир для оруженосцев в Королевской Гавани. Он пригласил многих знатных оруженосцев державы, к которым относятся и мои сыновья [baelor.GetName] и [maekar.GetName]. Среди участников также числится [daemon_blackfyre.GetName], которого многие считают незаконнорожденным сыном моего отца.\n\nЯ не знаю, что задумал мой отец, но уверен, что это не сулит ничего хорошего нашим отношениям..."
 agot_bells_of_war.0009.a: "Какие козни строит отец?"

 agot_bells_of_war.0010.t: "Турнир оруженосцев"
 agot_bells_of_war.0010.desc: "[squire_tourney_participant.GetName] [Select_CString(squire_tourney_participant.IsFemale, 'получила', 'получил' )] приглашение принять участие в грандиозном турнире оруженосцев в Королевской Гавани. Лучшие молодые воины со всей державы соберутся, чтобы сразиться друг с другом, и [squire_tourney_participant.GetFirstNameNoTooltip] получит шанс проявить себя.\n\nПолучить такое приглашение — редкая честь для оруженосца. Я не могу избавиться от смешанного чувства гордости и беспокойства. [squire_tourney_participant.GetFirstNameNoTooltip] ещё [Select_CString(squire_tourney_participant.IsFemale, 'молода', 'молод' )], а турнир может быть опасным местом.\n\nТем не менее от такой возможности нельзя отказываться. Если [squire_tourney_participant.GetFirstNameNoTooltip] проявит себя, это может стать началом многообещающего будущего."
 agot_bells_of_war.0010.two_squires_desc: "[squire_tourney_participant.GetName] и [squire_tourney_participant_2.GetName] получили приглашение принять участие в грандиозном турнире оруженосцев в Королевской Гавани. Лучшие молодые воины со всей державы соберутся, чтобы сразиться друг с другом, и они получат шанс проявить себя.\n\nПолучить такое приглашение — редкая честь для оруженосцев. Я не могу избавиться от смешанного чувства гордости и беспокойства. Они ещё молоды, а турнир может быть опасным местом.\n\nТем не менее от такой возможности нельзя отказываться. Если кто-то из них проявит себя, это может стать началом многообещающего будущего."
 agot_bells_of_war.0010.a: "Не посрами нас, [squire_tourney_participant.GetFirstNameNoTooltip]!"
 agot_bells_of_war.0010.two_squires_a: "Не посрамите нас!"

 agot_bells_of_war.0020.t: "Начало турнира"
 agot_bells_of_war.0020.desc: "Турнир оруженосцев начался, и жребий распределил пары следующим образом:\n\n[squire_1.GetName][squire_1.Custom('AGOTGetSurname')] и [squire_2.GetName][squire_2.Custom('AGOTGetSurname')]\n[squire_3.GetName][squire_3.Custom('AGOTGetSurname')] и [squire_4.GetName][squire_4.Custom('AGOTGetSurname')]\n[squire_5.GetName][squire_5.Custom('AGOTGetSurname')] и [squire_6.GetName][squire_6.Custom('AGOTGetSurname')]\n[squire_7.GetName][squire_7.Custom('AGOTGetSurname')] и [squire_8.GetName][squire_8.Custom('AGOTGetSurname')]\n[squire_9.GetName][squire_9.Custom('AGOTGetSurname')] и [squire_10.GetName][squire_10.Custom('AGOTGetSurname')]\n[squire_11.GetName][squire_11.Custom('AGOTGetSurname')] и [squire_12.GetName][squire_12.Custom('AGOTGetSurname')]\n[squire_13.GetName][squire_13.Custom('AGOTGetSurname')] и [squire_14.GetName][squire_14.Custom('AGOTGetSurname')]\n[squire_15.GetName][squire_15.Custom('AGOTGetSurname')] и [squire_16.GetName][squire_16.Custom('AGOTGetSurname')]"
 agot_bells_of_war.0020.a: "Да начнётся турнир!"

 agot_bells_of_war.0021.t: "Финалисты турнира"
 agot_bells_of_war.0021.desc: "После серии состязаний два оруженосца вышли в финал турнира!\n\nСкоро [top_bracket_finalist.GetName] и [bottom_bracket_finalist.GetName] сразятся за титул победителя."
 agot_bells_of_war.0021.desc_daemon_blackfyre_flavor: "\n\nМой сын прекрасно чувствует себя в этой среде. Без сомнения, он, пожалуй, лучший фехтовальщик своего возраста. Он словно родился с мечом в руке... Если он выиграет этот турнир, его нужно будет наградить призом, соответствующим его выдающимся успехам."
 agot_bells_of_war.0021.a: "Как интересно!"

 agot_bells_of_war.0022.t: "[Select_CString(champion.IsFemale, 'Победительница', 'Победитель' )] турнира"
 agot_bells_of_war.0022.desc: "Звучит торжественная музыка, и [champion.GetName] становится [Select_CString(champion.IsFemale, 'победительницей', 'победителем' )] турнира! [loser.GetName] [Select_CString(loser.IsFemale, 'побеждена', 'побеждён' )], и [champion.GetSheHe] становится [Select_CString(champion.IsFemale, 'абсолютной победительницей', 'абсолютным победителем' )] и может претендовать на свои призы: золото, славу и признание."
 agot_bells_of_war.0022.desc_generic_aegon_bastard_flavor: "\n\n[champion.GetNameNoTooltip] блестяще [Select_CString(champion.IsFemale, 'проявила', 'проявил' )] себя. [champion.GetHerHis|U] успехи впечатлили не только меня, но и моих вассалов и придворных. Все видят в [Select_CString(champion.IsFemale, 'ней', 'нём' )] #italic истинного#! отпрыска дома Таргариен... но я вижу в [Select_CString(champion.IsFemale, 'ней любимую дочь, достойную', 'нём любимого сына, достойного' )] почтения."
 agot_bells_of_war.0022.a: "Поздравляю, наслаждайся своим призом."
 agot_bells_of_war.0022.generic_targaryen_description: "Выступление, заслуживающее приза, достойного дома Таргариен!"
 agot_bells_of_war.0022.baelor_or_maekar_extra_snark: "[champion.GetFirstNameNoTooltip] — #italic настоящий#! воин, в отличие от своего отца. Он должен быть за это вознагражден!"
 agot_bells_of_war.0022.b: "[champion.GetFirstNameNoTooltip] заслуживает королевской милости #italic и#! признания."
 agot_bells_of_war.0022.c: "Мне стоит раздать ожидаемые призы и ничего более."

 agot_bells_of_war.0023.t: "Турнирные неприятности"
 agot_bells_of_war.0023.desc: "Прошло некоторое время с тех пор, как [champion.GetName] [Select_CString(champion.IsFemale, 'получила', 'получил' )] от меня королевскую милость и признание. Хотя [champion.GetSheHe] несомненно [Select_CString(champion.IsFemale, 'заслужила', 'заслужил' )] все почести и похвалы, члены моей семьи и придворные выразили недоверие и были шокированы моей щедростью. Они почти не скрывают свою зависть и выставляют её напоказ, как будто это может меня напугать."
 agot_bells_of_war.0023.a: "Кого это волнует? Я король!"

 agot_bells_of_war.0024.t: "Конец турнира"
 agot_bells_of_war.0024.squire_winner_desc: "[champion.GetName] [Select_CString(champion.IsFemale, 'одержала', 'одержал' )] победу в турнире, одолев всех соперников, вставших у н[champion.GetHerHis] на пути. Я очень горжусь тем, что [champion.GetSheHe] [Select_CString(champion.IsFemale, 'завоевала', 'завоевал' )] титул [Select_CString(champion.IsFemale, 'победительницы', 'победителя' )]. Это выдающееся достижение для столь юного возраста, и я надеюсь, что оно станет первым из многих."
 agot_bells_of_war.0024.squire_loser_desc: "[champion.GetName] [Select_CString(champion.IsFemale, 'одержала', 'одержал' )] победу в турнире, доказав, что [Select_CString(champion.IsFemale, 'она лучшая молодая воительница', 'он лучший молодой воин' )] державы. [my_squire.GetName], возможно, и не [Select_CString(my_squire.IsFemale, 'стала победительницей', 'стал победителем' )], но [my_squire.GetSheHe] может гордиться тем, что [Select_CString(my_squire.IsFemale, 'сражалась', 'сражался' )] в такой грозной компании."
 agot_bells_of_war.0024.blackfyre_sword_reaction_desc: "\n\nПо решению короля [champion.GetNameNoTooltip] [Select_CString(champion.IsFemale, 'получила', 'получил' )] валирийский меч Чёрное Пламя. Когда-то им владел Эйгон Завоеватель, и меч передавался от короля к наследнику. Чёрное Пламя — это не просто клинок. Это символ королевской власти Таргариенов и легитимности."
 agot_bells_of_war.0024.daemon_reaction_desc: "\n\nКороль официально признал Деймона своим сыном и решил отметить это событие, подарив ему валирийский меч Чёрное Пламя. Когда-то им владел Эйгон Завоеватель и он переходил от короля к наследнику. Чёрное Пламя - это нечто большее, чем просто клинок. Это символ королевской власти Таргариенов и их легитимности."
 agot_bells_of_war.0024.a: "Отличное выступление!"
 agot_bells_of_war.0024.b: "Досадно..."
 agot_bells_of_war.0024.c: "Отец, что ты наделал..."

 agot_bells_of_war.0031.t: "Восхождение Осторлат"
 agot_bells_of_war.0031.desc: "День клонится к вечеру, голоса подсчитаны, и теперь решается судьба Квохора — а во многом и судьба всего региона. Пока я жду, [ROOT.Char.Custom('IdleActivity')], ко мне подходит служитель с новостями:\n\nВыборы окончены, и я [Select_CString(ROOT.Char.IsFemale, 'победила', 'победил' )]! Теперь я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] выполнить свои предвыборные обещания..."
 agot_bells_of_war.0031.a: "Послать весточку в Норвос, Квохор выступит против Лората."
 agot_bells_of_war.0031.a_tt: "Норвос в союзе с вами начнёт войну против Лората."

 agot_bells_of_war.0032.t: "Восхождение Экны"
 agot_bells_of_war.0032.desc: "День клонится к вечеру, голоса подсчитаны, и теперь решается судьба Квохора — а во многом и судьба всего региона. Пока я жду, [ROOT.Char.Custom('IdleActivity')], ко мне подходит служитель с новостями:\n\nВыборы окончены, и я [Select_CString(ROOT.Char.IsFemale, 'победила', 'победил' )]! Теперь я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] выполнить свои предвыборные обещания..."
 agot_bells_of_war.0032.a: "Послать весточку в Норвос, Кхохор больше не потерпит оскорблений!"

 agot_bells_of_war.0033.t: "$agot_bells_of_war.0002.t$"
 agot_bells_of_war.0033.desc: "[Select_CString(qohor_leader.IsFemale, 'Моя союзница', 'Мой союзник' )], [qohor_leader.GetName], [Select_CString(qohor_leader.IsFemale, 'одержала', 'одержал' )] победу на выборах в Квохоре. [qohor_leader.GetSheHe|U] [Select_CString(qohor_leader.IsFemale, 'пообещала', 'пообещал' )] оказать немедленную поддержку в нападении на Лорат, чтобы отомстить за унижение, которое норвошийцам [Select_CString(lorath_leader.IsFemale, 'нанесла молодая магистр-завоевательница', 'нанёс молодой магистр-завоеватель' )] [lorath_leader.GetNameNicknamed].\n\nВеликий Норвос снова возьмётся за оружие!"
 agot_bells_of_war.0033.a: "Пусть зазвенят колокола войны!"

 agot_bells_of_war.0034.t: "$agot_bells_of_war.0002.t$"
 agot_bells_of_war.0034.desc: "[norvos_leader.GetName] из Норвоса [Select_CString(norvos_leader.IsFemale, 'получила', 'получил' )] известие о моей победе на недавних выборах, а также о том, что я вновь выражаю поддержку в противостоянии с Лоратом. [lorath_leader.GetNameNicknamed] слишком [Select_CString(lorath_leader.IsFemale, 'увлеклась', 'увлёкся' )] своими экспансионистскими амбициями, так что настало время нанести удар!"
 agot_bells_of_war.0034.a: "Я слышу колокола войны!"
 agot_bells_of_war.0034.a.tt: "Вы и [norvos_leader.GetNameNoTooltip] стали союзниками"

 agot_bells_of_war.0035.t: "Союз Норвоса и Квохора"
 agot_bells_of_war.0035.desc: "Служитель спешит поделиться последними новостями: [norvos_leader.GetName] и [qohor_leader.GetName] заключили союз, чтобы остановить мои завоевания. Они объявили войну Лорату и намерены вернуть утраченные территории Норвоса."
 agot_bells_of_war.0035.a: "Ужасные новости."

 agot_bells_of_war.0036.t: "Наступление Квохора"
 agot_bells_of_war.0036.desc: "Выборы в Квохоре прошли не по плану.\n\n[Select_CString(ostorlat.IsFemale, 'Моя союзница', 'Мой союзник' )], [ostorlat.GetName], [Select_CString(ostorlat.IsFemale, 'потерпела', 'потерпел' )] поражение. [qohor_leader.GetName], [Select_CString(qohor_leader.IsFemale, 'кандидатка, которая', 'кандидат, который' )] заявляет, что принципиально выступает против Норвоса, [Select_CString(qohor_leader.IsFemale, 'одержала', 'одержал' )] верх. [qohor_leader.GetTitledFirstNameNoTooltip] не [Select_CString(qohor_leader.IsFemale, 'стала', 'стал' )] терять времени после вступления в должность и [Select_CString(qohor_leader.IsFemale, 'начала', 'начал' )] наступление на Норвос!"
 agot_bells_of_war.0036.a: "Это катастрофа."

 agot_bells_of_war.0037.t: "Несбывшиеся планы на выборы"
 agot_bells_of_war.0037.desc: "Наконец-то я [Select_CString(ROOT.Char.IsFemale, 'получил', 'получил' )] вести о результатах выборов в Квохоре.\n\n[Select_CString(ostorlat.IsFemale, 'Моя союзница', 'Мой союзник' )], [ostorlat.GetName], [Select_CString(ostorlat.IsFemale, 'потерпела', 'потерпел' )] поражение. Верх [Select_CString(qohor_leader.IsFemale, 'одержала представительница', 'одержал представитель' )] неизвестной третьей стороны, [qohor_leader.GetName]. Не знаю, какая судьба ждет Квохор, но знаю, что теперь Норвос в одиночку противостоит Лорату."
 agot_bells_of_war.0037.a: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] немедленно остановить Лорат."
 agot_bells_of_war.0037.b: "Мы не сможем победить лишь своими силами."

 agot_bells_of_war.0050.t: "Победа над нарушителями союза"
 agot_bells_of_war.0050.desc: "Ройнарская конфедерация одержала победу над волантинскими изменниками. Мы захватили Гар-Сагон.\n\nТеперь вопрос в том, стоит ли нам распустить конфедерацию и править как единая держава."
 agot_bells_of_war.0050.a: "Распустить конфедерацию."
 agot_bells_of_war.0050.b: "Сохранить конфедерацию."

 agot_bells_of_war.0051.t: "Победа над Ройнарской конфедерацией"
 agot_bells_of_war.0051.desc: "Мои войска одержали победу от имени Волантиса. Угроза для Гар-Сагона устранена, и я [Select_CString(ROOT.Char.IsFemale, 'заставила', 'заставил' )] ройнаров покинуть эти земли."
 agot_bells_of_war.0051.a: "Триархи будут довольны."

 agot_bells_of_war.0052.t: "Конец Ройнарской конфедерации"
 agot_bells_of_war.0052.desc: "[confederation_leader.GetName] [Select_CString(confederation_leader.IsFemale, 'объявила', 'объявил' )] о нашей победе над волантинскими изменниками.\n\nПосле окончания войны [confederation_leader.GetNameNoTooltip] [Select_CString(confederation_leader.IsFemale, 'объявила', 'объявил' )] Гар-Сагон своим владением и [Select_CString(confederation_leader.IsFemale, 'провозгласила', 'провозгласил' )] роспуск Ройнарской конфедерации. [confederation_leader.GetSheHe|U] также [Select_CString(confederation_leader.IsFemale, 'заявила', 'заявил' )] притязания на власть над теми немногими, кто в прошлом были [confederation_leader.GetHerHis] соратниками по конфедерации. К лучшему или худшему, но то, что осталось от Ройнарской конфедерации, теперь объединено в новую державу, которую возглавляет [Select_CString(confederation_leader.IsFemale, 'леди', 'лорд' )] [confederation_leader.GetNameNoTooltip]!"
 agot_bells_of_war.0052.a: "Над Ройной восходит новая заря."