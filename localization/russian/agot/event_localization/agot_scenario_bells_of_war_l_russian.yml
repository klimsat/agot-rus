l_russian:
 #Marked for Review

 # Lorath Intro - Thys O'rel
 agot_bells_of_war.0001.t:0 "Expanding the Maze"
 agot_bells_of_war.0001.desc:0 "Following my successful campaign against Norvos, I've turned the might of Lorath against the Ibbenese colony in the Axe, led by the fabled [ibbenese_colony_leader.GetName].\n\nHowever, my campaign against the men of Ibben is going slower than I initially anticipated. [ibbenese_colony_leader.GetTitledFirstNameNoTooltip] has utilized the difficult terrain to his advantage, and my captains have been annoyingly slow to adjust.\n\nIf we cannot triumph over the Ibbenese soon, I fear Lorath's enemies may take advantage of my attention being far from home."
 agot_bells_of_war.0001.a:0 "The Ibbenese will be broken!"

 # Norvos Intro - Egoh Dazh Reo
 agot_bells_of_war.0002.t:0 "The Bells of War"
 agot_bells_of_war.0002.desc:0 "Nearly three years ago, the armies of Lorath defeated Norvos in battle. As part of my campaign pledge, I promised to right the wrongs inflicted upon us by the Lorathi. Since the start of my term, I have been eagerly waiting and preparing for that moment.\n\nNow, reports from my scouts and spies indicate that [lorathi_leader.GetName] is bogged down against the Ibbenese in the Axe. It is clear that the would-be conquerors have bitten off more than they could chew.\n\nBe that as it may, the forces of Lorath are still a threat to Norvos if we stand alone. My ally in Qohor, [qohor_m1.GetNamePossessive], is among the frontrunners in the coming election and has pledged support for a counterattack against Lorath. All we need to do is wait for the opportune moment."
 agot_bells_of_war.0002.a:0 "The bells of war will soon toll!"

 # Qohor M1 - Korena Ostorlat
 agot_bells_of_war.0003.t:0 "The Looming Election"
 agot_bells_of_war.0003.desc:0 "[old_qohor_guy.GetName] is dying.\n\nThough my candidacy is strictly unofficial until the death of [old_qohor_guy.GetTitledFirstNameNoTooltip], my spies across the city have reported that I am a leading candidate to ascend to the position of First Magister. My only competitor is [qohor_m2.GetName], my ideological opposite.\n\nIn a move to show my strength, I have pledged support to the Norvoshi to launch a counterattack against the Lorathi. With a strong military campaign, I can shore up support among Qohor's foreign allies and quell domestic troublemakers in one fell swoop. Or so I hope."
 agot_bells_of_war.0003.a:0 "The election approaches..."

 # Qohor M2 - Haratt Ekna
 agot_bells_of_war.0004.t:0 "The Looming Election"
 agot_bells_of_war.0004.desc:0 "[old_qohor_guy.GetName] will be dead soon, thankfully. Preliminary reports from my allies have found that my only real competition for the position of First Magister is [qohor_m1.GetName].\n\nIn an attempt to win support for my candidacy, I have wasted no effort in sharing my disdain for the realm's closeness to Norvos. Should I be elected, Norvos will be made to pay for its transgressions against Qohor."
 agot_bells_of_war.0004.a:0 "Soon my ascendancy will come!"

 # Qohor Old Guy - Emondar Johibors
 agot_bells_of_war.0005.t:0 "The Looming Election"
 agot_bells_of_war.0005.desc:0 "My life is coming to an end, but more importantly, my time as First Magister will end — and the world knows it.\n\nMy own countrymen bet on how soon I will die, and foreigners try to court the candidates of the coming election. The realm is eager to move on without me, it seems."
 agot_bells_of_war.0005.a:0 "I'm still here, for now."

 # Aegon IV
 agot_bells_of_war.0006.t:0 "The Squires' Tourney"
 agot_bells_of_war.0006.desc:0 "The birthday of my cousin [daena_targaryen.GetNamePossessive] son, [daemon_blackfyre.GetName], is approaching. Though I have kept my distance from the boy, I am still fond of him... perhaps even more so than #italic my other#! children, I daresay.\n\nI wish to honor the boy and give him a present he will not forget. Knowing his passion for swordsmanship, I have commanded my advisors to prepare a grand tourney for the most notable squires of the realm, [daemon_blackfyre.GetFirstNameNoTooltip] included, of course."
 agot_bells_of_war.0006.a:0 "Good luck, [daemon_blackfyre.GetFirstNameNoTooltip]."

 # Rhoyne
 agot_bells_of_war.0007.t:0 "The First Daughter Strikes"
 agot_bells_of_war.0007.desc:0 "The Volantenes have turned cloak against us. Though the [rhoynar_confederation.GetName] bled to take the strategic fortress of Gar Sagon, the Volantenes have seized control of the fortress and declared us their enemies.\n\n[volantis_invader.GetName] has arrived with an impressive host and wastes little time making it clear that the Rhoynar are now the enemies of Volantis...\n\nThe other Rhoynar have heeded my call and joined me in an attempt to repel our betrayers. The [rhoynar_confederation.GetName] must prevail, or it will be our total doom.\n\nThe Volantenes claim that they are heirs of the dragons..."
 agot_bells_of_war.0007.a:0 "So we shall let them meet their ancestors!"

 # Rhoyne - Volantis Governor
 agot_bells_of_war.0008.t:0 "Attack on the Rhoynar"
 agot_bells_of_war.0008.desc:0 "I have launched an invasion to squash the [rhoynar_confederation.GetName] once and for all. Though they were instrumental in taking Gar Sagon, their power cannot be allowed to grow in this region, let alone control Gar Sagon itself.\n\nAn impressive host is at my command, and I shall prevail in conquering these hinterlands for Volantis!"
 agot_bells_of_war.0008.a:0 "I hope to make quick work of these confederates."

 agot_bells_of_war.0009.t:0 "The Squires' Tourney"
 agot_bells_of_war.0009.desc:0 "[aegon_iv.GetName] has launched a squires' tourney in King's Landing. He has invited many notable squires of the realm, including my sons [baelor.GetName] and [maekar.GetName]. Also among the participants is [daemon_blackfyre.GetName], whom many believe to be my father's unacknowledged son.\n\nI am not sure what my father is planning, but I know it will not bode well for our relationship..."
 agot_bells_of_war.0009.a:0 "What schemes is father getting at?"

 agot_bells_of_war.0010.t:0 "The Squires' Tourney"
 agot_bells_of_war.0010.desc:0 "[squire_tourney_participant.GetName] has been invited to take part in a grand squires' tourney in King's Landing. The finest young warriors from across the realm will gather to compete, and [squire_tourney_participant.GetFirstNameNoTooltip] will have the chance to prove [squire_tourney_participant.GetHerselfHimself] among them.\n\nIt is a rare honor for a squire to receive such an invitation. I cannot help but feel a mixture of pride and concern. [squire_tourney_participant.GetFirstNameNoTooltip] is still young, and a tourney can be a dangerous place.\n\nStill, this is an opportunity that cannot be passed up. If [squire_tourney_participant.GetFirstNameNoTooltip] distinguishes [squire_tourney_participant.GetHerselfHimself], it may be the beginning of a promising future."
 agot_bells_of_war.0010.two_squires_desc:0 "[squire_tourney_participant.GetName] and [squire_tourney_participant_2.GetName] have both been invited to take part in a grand squires' tourney in King's Landing. The finest young warriors from across the realm will gather to compete, and both will have the chance to prove themselves among them.\n\nIt is a rare honor for a squire to receive such an invitation. I cannot help but feel a mixture of pride and concern. They are still young, and a tourney can be a dangerous place.\n\nStill, this is an opportunity that cannot be passed up. If either of them distinguishes themselves, it may be the beginning of a promising future."
 agot_bells_of_war.0010.a:0 "Do us proud, [squire_tourney_participant.GetFirstNameNoTooltip]!"
 agot_bells_of_war.0010.two_squires_a:0 "Do us proud!"

 agot_bells_of_war.0020.t:0 "The Tourney Starts"
 agot_bells_of_war.0020.desc:0 "The Squires' Tourney has started, with the following initial matchups drawn:\n\n[squire_1.GetName][squire_1.Custom('AGOTGetSurname')] vs. [squire_2.GetName][squire_2.Custom('AGOTGetSurname')]\n[squire_3.GetName][squire_3.Custom('AGOTGetSurname')] vs. [squire_4.GetName][squire_4.Custom('AGOTGetSurname')]\n[squire_5.GetName][squire_5.Custom('AGOTGetSurname')] vs. [squire_6.GetName][squire_6.Custom('AGOTGetSurname')]\n[squire_7.GetName][squire_7.Custom('AGOTGetSurname')] vs. [squire_8.GetName][squire_8.Custom('AGOTGetSurname')]\n[squire_9.GetName][squire_9.Custom('AGOTGetSurname')] vs. [squire_10.GetName][squire_10.Custom('AGOTGetSurname')]\n[squire_11.GetName][squire_11.Custom('AGOTGetSurname')] vs. [squire_12.GetName][squire_12.Custom('AGOTGetSurname')]\n[squire_13.GetName][squire_13.Custom('AGOTGetSurname')] vs. [squire_14.GetName][squire_14.Custom('AGOTGetSurname')]\n[squire_15.GetName][squire_15.Custom('AGOTGetSurname')] vs. [squire_16.GetName][squire_16.Custom('AGOTGetSurname')]"
 agot_bells_of_war.0020.a:0 "Let the tourney begin!"

 agot_bells_of_war.0021.t:0 "The Tourney Finalists"
 agot_bells_of_war.0021.desc:0 "After a series of competitive bouts, two squires have emerged as the tourney's finalists!\n\n[top_bracket_finalist.GetName] will soon face [bottom_bracket_finalist.GetName] to claim the mantle of champion."
 agot_bells_of_war.0021.desc_daemon_blackfyre_flavor:0 "\n\nMy son is thriving in this environment. Without a doubt, he is perhaps the best swordsman of his age. It's as if he were born with a sword in hand... Should he win this tourney, he will need to be rewarded with a prize that matches his stunning performance."
 agot_bells_of_war.0021.a:0 "How exciting!"

 agot_bells_of_war.0022.t:0 "The Tourney's Champion"
 agot_bells_of_war.0022.desc:0 "The sounds of jubilant music play as [champion.GetName] is crowned the tourney's champion! Having defeated [loser.GetName], [champion.GetSheHe] is the undisputed victor and can now claim [champion.GetHerHis] prizes: gold, fame, and praise."
 agot_bells_of_war.0022.desc_generic_aegon_bastard_flavor:0 "\n\n[champion.GetNamePossessiveNoTooltip] performance has been nothing but exemplary. [champion.GetHerHis|U] performance has impressed not only me but my vassals and courtiers as well. All see [champion.GetHerHim] as a #italic true#! scion of House Targaryen... but I see [champion.GetHerHim] as a favored [champion.Custom('DaughterSon')] and one worth honoring."
 agot_bells_of_war.0022.a:0 "Congratulations, and enjoy your prizes."
 agot_bells_of_war.0022.generic_targaryen_description:0 "A showing deserving of a prize befitting House Targaryen!"
 agot_bells_of_war.0022.baelor_or_maekar_extra_snark:0 "[champion.GetFirstNameNoTooltip] is a #italic true #!warrior, unlike [champion.GetHerHis] father. He must be rewarded for it!"
 agot_bells_of_war.0022.b:0 "[champion.GetFirstNameNoTooltip] deserves royal favor #italic and #!recognition."
 agot_bells_of_war.0022.c:0 "I must give the expected prizes and nothing more."

 agot_bells_of_war.0023.t:0 "Tourney Troubles"
 agot_bells_of_war.0023.desc:0 "Some time has passed since I bestowed my royal favor and recognition upon [champion.GetName]. Though [champion.GetSheHe] undoubtedly deserved every accolade and praise granted, members of my own family and court have expressed disbelief and shock at my generosity. They do little to hide their jealousy and wear it proudly, as if it will intimidate me."
 agot_bells_of_war.0023.a:0 "Who cares? I am king!"

 agot_bells_of_war.0024.t:0 "The Tourney's End"
 agot_bells_of_war.0024.squire_winner_desc:0 "[champion.GetName] has emerged victorious from the tourney, defeating every challenger who stood in [champion.GetHerHis] path. I could not be prouder to see [champion.GetHerHim] claim the champion's honors. It is a fine achievement for one so young, and I hope it will be the first of many."
 agot_bells_of_war.0024.squire_loser_desc:0 "[champion.GetName] has emerged victorious in the tourney, proving [champion.GetHerselfHimself] the finest young warrior in the realm. [my_squire.GetName] may not have reached the final victory, but [my_squire.GetSheHe] can still take pride in having competed among such formidable company."
 agot_bells_of_war.0024.blackfyre_sword_reaction_desc:0 "\n\nThe king has chosen to bestow the Valyrian steel sword Blackfyre upon [champion.GetNameNoTooltip]. Once wielded by Aegon the Conqueror and passed from king to heir, Blackfyre is more than a blade. It is a symbol of the Targaryen monarchy and legitimacy."
 agot_bells_of_war.0024.daemon_reaction_desc:0 "\n\nThe king has officially acknowledged Daemon as his son, and has chosen to mark the occasion by bestowing upon him the Valyrian steel sword Blackfyre. Once wielded by Aegon the Conqueror and passed from king to heir, Blackfyre is more than a blade. It is a symbol of the Targaryen monarchy and legitimacy."
 agot_bells_of_war.0024.a:0 "A fine showing!"
 agot_bells_of_war.0024.b:0 "Unfortunate..."
 agot_bells_of_war.0024.c:0 "Father, what have you done..."

 agot_bells_of_war.0031.t:0 "Ostorlat Ascendant"
 agot_bells_of_war.0031.desc:0 "The day grows long, as votes have been cast to determine the future of Qohor — in many ways, to determine the future of the entire region. As I wait, [ROOT.Char.Custom('IdleActivity')], an attendant approaches me with news:\n\nThe election is over, and I have triumphed! Now, I must honor my election promises..."
 agot_bells_of_war.0031.a:0 "Send word to Norvos, Qohor will stand against Lorath."
 agot_bells_of_war.0031.a_tt:0 "Norvos will soon start a war against Lorath, and you will be called as an ally."

 agot_bells_of_war.0032.t:0 "Ekna Ascendant"
 agot_bells_of_war.0032.desc:0 "The day grows long, as votes have been cast to determine the future of Qohor — in many ways, to determine the future of the entire region. As I wait, [ROOT.Char.Custom('IdleActivity')], an attendant approaches me with news:\n\nThe election is over, and I have triumphed! Now, I must honor my election promises..."
 agot_bells_of_war.0032.a:0 "Send word to Norvos, Qohor will no longer be insulted!"

 agot_bells_of_war.0033.t:0 "$agot_bells_of_war.0002.t$"
 agot_bells_of_war.0033.desc:0 "My ally, [qohor_leader.GetName], has prevailed in the Qohorik election. [qohor_leader.GetSheHe|U] has pledged immediate support in attacking Lorath, to avenge the embarrassment that the Norvoshi suffered against the young conqueror-magister [lorath_leader.GetNameNicknamed].\n\nGreat Norvos will rise once more to arms!"
 agot_bells_of_war.0033.a:0 "Sound the bells of war!"

 agot_bells_of_war.0034.t:0 "$agot_bells_of_war.0002.t$"
 agot_bells_of_war.0034.desc:0 "[norvos_leader.GetName] of Norvos has received word of my victory in the recent election, along with my reaffirmed support against Lorath. [lorath_leader.GetNameNicknamed] has overextended [lorath_leader.GetHerHis] expansionist ambitions, so the time is ripe for us to strike!"
 agot_bells_of_war.0034.a:0 "I hear the bells of war!"
 agot_bells_of_war.0034.a.tt:0 "You and [norvos_leader.GetNameNoTooltip] have become allies"

 agot_bells_of_war.0035.t:0 "The Norvos-Qohor Alliance"
 agot_bells_of_war.0035.desc:0 "An attendant rushes to share the latest news: [norvos_leader.GetName] and [qohor_leader.GetName] have formed an alliance to stop my conquests. They have jointly declared war against Lorath and intend to reconquer Norvos' lost territories."
 agot_bells_of_war.0035.a:0 "Terrible news."

 agot_bells_of_war.0036.t:0 "Qohor on the Offensive"
 agot_bells_of_war.0036.desc:0 "The election in Qohor did not go according to plan.\n\nMy ally, [ostorlat.GetName], was defeated by [qohor_leader.GetName], a candidate who describes themselves as fundamentally opposed to Norvos. [qohor_leader.GetTitledFirstNameNoTooltip] has wasted little time since taking office and has launched an offensive against Norvos!"
 agot_bells_of_war.0036.a:0 "This is a disaster."

 agot_bells_of_war.0037.t:0 "Bygone Election Plans"
 agot_bells_of_war.0037.desc:0 "The election results in Qohor have reached me at last.\n\nMy ally, [ostorlat.GetName], was defeated by an unknown third party, [qohor_leader.GetName]. Though I cannot say what fate awaits Qohor, I know that Norvos now stands alone against Lorath."
 agot_bells_of_war.0037.a:0 "I must stop Lorath now."
 agot_bells_of_war.0037.b:0 "We have no chance on our own."

 agot_bells_of_war.0050.t:0 "Victory Against the Alliance Breaker"
 agot_bells_of_war.0050.desc:0 "The Rhoynar Confederation has triumphed against the Volantene traitors. We have seized Gar Sagon for ourselves.\n\nThe question is now whether or not we should disband our confederation and rule as one realm."
 agot_bells_of_war.0050.a:0 "Disband the confederation."
 agot_bells_of_war.0050.b:0 "Preserve the confederation."

 agot_bells_of_war.0051.t:0 "Victory Against the Rhoynar Confederation"
 agot_bells_of_war.0051.desc:0 "My forces have triumphed on behalf of Volantis. The threat to Gar Sagon has been squashed, and I have sent the Rhoynar fleeing from the area."
 agot_bells_of_war.0051.a:0 "The Triarchs will be pleased."

 agot_bells_of_war.0052.t:0 "The End of the Rhoynar Confederation"
 agot_bells_of_war.0052.desc:0 "[confederation_leader.GetName] has proclaimed our victory over the Volantene traitors.\n\nWith the war over, [confederation_leader.GetNameNoTooltip] has claimed Gar Sagon as [confederation_leader.GetHerHis] own fief, and has proclaimed the dissolution of the Rhoynar Confederation. [confederation_leader.GetSheHe|U] has also claimed dominion over we few who stood by [confederation_leader.GetHerHis] side as [confederation_leader.GetHerHis] fellow confederates in days past. For better or worse, what remains of the Rhoynar Confederation has now been consolidated into a new realm under the leadership of [confederation_leader.GetLadyLord|U] [confederation_leader.GetNameNoTooltip]!"
 agot_bells_of_war.0052.a:0 "A new day dawns on the Rhoyne."