l_russian:

#####################
# At the Crossroads #
#####################
 agot_travel_events.0001.t: "Путешествие: На перепутье"
 agot_travel_events.0001.desc: "Когда мы едем по Речным землях, вдали, прямо на перепутье, вырисовывается трехэтажный постоялый двор.\n\nВскоре в воздухе раздаются громкие голоса и запах печёных пирогов... такой сладкий, что я почти чувствую их вкус. \n\nНе сомневаюсь, что мои спутники не отказались бы от хорошего отдыха."
 agot_travel_events.0001.a: "Прекрасное место для отдыха."
 agot_travel_events.0001.a.tt: "Вы останавливаетесь в трактире."
 agot_travel_events.0001.b: "Отдохнём, когда доберёмся до места назначения."
 agot_travel_events.0001.b.tt: "Вы продолжаете свой путь."

 agot_travel_events.0002.t: "Путешествие: Трактир"
 agot_travel_events.0002.desc: "Мы приехали в самый подходящий момент, в трактире кипит жизнь и раздаётся смех.\n\nСзади я замечаю группу пьющих рыцарей, и, судя по их лицам, они, должно быть, прибыли задолго до нас... Может быть, мне стоит присоединиться к ним? \n\nС другой стороны [fellow_traveler.GetName] приглашает меня разделить с [Select_CString(fellow_traveler.IsFemale, 'ней', 'ним' )] медовуху. Возможно, я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] бы воспользоваться случаем и провести больше времени с [Select_CString(fellow_traveler.IsFemale, 'ней', 'ним' )]?"
 agot_travel_events.0002.a: "Я останусь со своими спутниками."
 agot_travel_events.0002.gregarious: "Трактирщик! Подай лучшего пива!"
 agot_travel_events.0002.gregarious.tt: "Ваши спутники улучшат своё [opinion|El] о вас на #P 20#!"
 agot_travel_events.0002.b: "Подойти к рыцарям."
 agot_travel_events.0002.b.tt: "Они выглядят дружелюбно?"
 agot_travel_events.0002.c: "[fellow_traveler.GetName], не составите мне компанию?."
 agot_travel_events.0002.c.tt: "Вместо этого вы выйдете на прогулку."
 agot_travel_events.0002.gluttonous: "Здесь подают лимонные пирожные?"
 agot_travel_events.0002.gluttonous.tt: "Лимонные пироги, пирожочки..."

 agot_travel_events.0003.t: "На перепутье: [Select_CString(sellsword.IsFemale, 'Разочарованная наёмница', 'Разочарованный наёмник' )]"
 agot_travel_events.0003.desc: "Среди шумной компании я встречаю [Select_CString(sellsword.IsFemale, 'наёмницу, которая', 'наёмника, который' )], судя по всему, является лидером группы. [Select_CString(sellsword.IsFemale, 'Она', 'Он' )] представляется как [sellsword.GetFullName]. [sellsword.GetHerHis|U] угрюмое лицо быстро выдаёт [sellsword.GetHerHis] проблемы.\n\n«По правде говоря, [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой' )] [ROOT.Char.GetTitleAsNameNoTooltip], мы добились меньшего успеха, чем я [Select_CString(sellsword.IsFemale, 'надеялась', 'надеялся' )]. Большинство моих людей либо погибли, либо дезертировали. Если в ближайшее время я не найду работу, чтобы занять оставшихся, боюсь, они все уйдут... или ещё хуже.»\n\nСделав ещё один глоток, [sellsword.GetSheHe] добавляет: «Возможно, такая жизнь не по мне, и это было бы к лучшему, по крайней мере, я [Select_CString(sellsword.IsFemale, 'смогла', 'смог' )] бы вернуться домой.» И всё же, несмотря на горечь, я вижу в [Select_CString(sellsword.IsFemale, 'её', 'его' )] глазах проблеск решимости..."
 agot_travel_events.0003.a: "Не отчаивайся, у меня найдётся для вас подходящая работа."
 agot_travel_events.0003.b: "Я найму твоих людей, ступай и будь [Select_CString(sellsword.IsFemale, 'свободна', 'свободен' )]."
 agot_travel_events.0003.c: "Наёмникам нельзя доверять."

 agot_travel_events.0004.t: "На перепутье: Пьяный рыцарь"
 agot_travel_events.0004.desc: "Когда я подхожу к стойке, лицо самого высокого рыцаря становится красным, [drunk_knight.GetSheHe] вдруг вскакивает с [drunk_knight.GetHerHis] места и заявляет: «Так, так! Гляньте, кто тут у нас! [Select_CString(ROOT.Char.IsFemale, 'Сама', 'Сам' )] [ROOT.Char.GetName]!»\n\nХотя, кажется, [drunk_knight.GetSheHe] знает меня, я не могу припомнить [drunk_knight.GetHerHis]. Не [Select_CString(ROOT.Char.IsFemale, 'успела', 'успел' )] я ответить, как рыцарь выхватывает меч и бросает мне вызов: «Интересно, правда ли, что ты так [Select_CString(ROOT.Char.IsFemale, 'хороша', 'хорош' )], как о тебе говорят? Или, может, ты просто [Select_CString(ROOT.Char.IsFemale, 'трусиха', 'трус' )] в модных доспехах?»\n\nВ трактире постепенно наступает тишина, и я чувствую на себе взгляды всех присутствующих."
 agot_travel_events.0004.a: "Если ищешь драки, ты её получишь!"
 agot_travel_events.0004.a.success: "Вы одолели рыцаря!"
 agot_travel_events.0004.a.failure: "Рыцарь унижает вас."
 agot_travel_events.0004.b: "Хочешь доказать свою правоту? Почему бы тебе не присоединиться ко мне?"
 agot_travel_events.0004.b.success: "Вы убеждаете рыцаря!"
 agot_travel_events.0004.b.failure: "Рыцарь насмехается над вами."
 agot_travel_events.0004.c: "[ROOT.Char.GetFirstNameNoTooltip]? Ты меня, наверное, с кем-то путаешь..."
 agot_travel_events.0004.c.success: "Вы убеждаете рыцаря!"
 agot_travel_events.0004.c.success.tt: "Рыцарь оставляет вас в покое."
 agot_travel_events.0004.c.failure: "Вы унижаете себя."

 agot_travel_events.0005.t: "На перепутье: Танец пальцев"
 agot_travel_events.0005.desc: "Возвращаясь в трактир после прогулки, я слышу громкий стук: двое мужчин бросают друг в друга топоры! Когда я останавливаюсь, чтобы понаблюдать за их ловкой игрой, один из них замечает меня и окликает: «Не желаете присоединиться?»\n\n«Танец пальцев - так мы его называем,» - поясняет [drunk_ironborn.GetFirstName]. «Всё, что вам нужно сделать, - это поймать топор или перепрыгнуть через него, не пропустив ни одного шага.»\n\n«О, я [Select_CString(drunk_ironborn.IsFemale, 'уверена', 'уверен' )], что [Select_CString(ROOT.Char.IsFemale, 'такая прекрасная воительница', 'такой прекрасный воин' )], как вы, сможет сделать это без проблем!» - со смехом добавляет [drunk_ironborn.GetSheHe]."
 agot_travel_events.0005.a: "Звучит достаточно просто!"
 agot_travel_events.0005.b: "Если я выиграю, заберу твой топор!"
 agot_travel_events.0005.success: "Вам удаётся выиграть."
 ironborn_axe: "Топор железнорожденных"
 ironborn_axe_description: "Традиционный топор с Железных островов, изготовленный из хорошей стали. Когда-то принадлежал [Select_CString(drunk_ironborn.IsFemale, 'железнорожденной путешественнице', 'железнорожденному путешественнику' )] по имени [drunk_ironborn.GetFullName]. [ROOT.Char.GetFullName] [Select_CString(ROOT.Char.IsFemale, 'выиграла', 'выиграл' )] топор в танце пальцев."
 agot_travel_events.0005.failure: "Топор ловит вас"
 agot_travel_events.0005.c: "ХА! Метание топора? Из тебя бы получился отличный шут!"
 agot_travel_events.0005.c.success: "[drunk_ironborn.GetSheHe|U]... соглашается..."
 agot_travel_events.0005.c.failure: "Вы оскорбляете железнорожденных"
 cultural_acceptance_mocked_customs: "Осмеянные обычаи"
 agot_travel_events.0005.d: "На перепутьях встречаются странные попутчики..."
 agot_travel_events.0005.d.tt: "Оставьте железнорожденным их игры."

 agot_travel_events.0006.t: "Путешествие: Неприятности в трактире"
 agot_travel_events.0006.desc: "Как только мы подходим ближе, обстановка становится неспокойной. Когда я толкаю дверь, нас встречают опрокинутые столы и осколки стекла.\n\n[Select_CString(innkeeper.IsFemale, 'Трактирщица', 'Трактирщик' )] приветствует нас с обеспокоенным выражением на лице: «Прошу прощения, путники, боюсь, вы не найдёте здесь тёплого приёма, на который рассчитывали. Недавно на трактир напала группа разбойников, нам удалось отбиться от них, но я опасаюсь, что они скоро вернутся, чтобы отомстить».\n\n«Однако нам не помешают умелые руки»."
 agot_travel_events.0006.a: "Мы останемся и поможем."
 agot_travel_events.0006.a.brave: "Защищать тех, кто в этом нуждается, - мой священный обет."
 agot_travel_events.0006.a.tt: "Вы согласны встретиться с разбойниками."
 agot_travel_events.0006.b: "Я могу помочь... за соответствующую сумму."
 agot_travel_events.0006.b.success: "[Select_CString(innkeeper.IsFemale, 'Трактирщица', 'Трактирщик' )] оплачивает вашу защиту."
 agot_travel_events.0006.b.failure: "Вы разгневали [Select_CString(innkeeper.IsFemale, 'трактирщицу', 'трактирщика' )], и [innkeeper.GetSheHe] [Select_CString(innkeeper.IsFemale, 'отказала', 'отказал' )] вам в постое."
 agot_travel_events.0006.c: "На самом деле... Мы только проезжаем мимо."

 agot_travel_events.0007.t: "На перепутье: Засада"
 agot_travel_events.0007.desc: "Пока мы готовимся, [fellow_knight.GetName] подходит ко мне и предлагает: «[Select_CString(ROOT.Char.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.GetTitleAsNameNoTooltip], сидеть здесь и ждать, пока мы сможем нанести удар первыми, было бы ошибкой. Я [Select_CString(fellow_knight.IsFemale, 'собрала', 'собрал' )] на постоялом дворе несколько человек, которые хорошо знают эти земли. Позвольте мне пойти с ними и обойти разбойников с фланга, пока они не добрались до нас.»"
 agot_travel_events.0007.a: "Я не буду рисковать вашими жизнями, мы встретим врага вместе."
 agot_travel_events.0007.a.tt: "Вы продолжаете ждать прибытия разбойников."
 agot_travel_events.0007.b: "Хорошо, я буду ждать вашего возвращения."
 agot_travel_events.0007.b.tt: "Возможно, [fellow_knight.GetSheHe] [Select_CString(fellow_knight.IsFemale, 'права', 'прав' )]..."
 agot_travel_events.0007.b.success: "Засада удалась"
 agot_travel_events.0007.b.fail: "Ваш рыцарь не вернулся"

 agot_travel_events.0008.t: "На перепутье: Лже-рыцарь"
 agot_travel_events.0008.desc: "Долго ждать не пришлось. Довольно скоро разбойники, которыми командует сир [evil_bandit.GetFullNameNicknamed], скоро вернутся за добычей.\n\nМои люди повернулись ко мне, с нетерпением ожидая моей команды. Как мне поступить?"
 agot_travel_events.0008.a: "Я лично выступлю против предводителя."
 agot_travel_events.0008.a.tt: "Вы начнёте дуэль с персонажем [evil_bandit.GetFirstName]."
 agot_travel_events.0008.b: "Атаковать остальными силами."
 agot_travel_events.0008.b.success: "Вы победили разбойников."
 agot_travel_events.0008.b.failure: "Вашу атаку отбивают и заставляют спешно уходить."
 agot_travel_events.0008.c: "БЕГИТЕ! БЕГИТЕ!!"
 agot_travel_events.0008.c.escape: "Вам с трудом удаётся спастись..."
 agot_travel_events.0008.c.wounded: "В вас попала стрела!"

 #agot_travel_events.0009 - Maintenance event

 agot_travel_events.0010.t: "На перепутье: Отбытие"
 agot_travel_events.0010.desc: "Пока мы готовимся к отбытию, [innkeeper.GetFirstName] подходит ко мне с небольшой деревянной шкатулкой в руках.\n\n«Я знаю, что здесь немного, но это всё, что у нас осталось после недавнего налёта. Пожалуйста, примите это как знак нашей благодарности. Без вашей помощи кто знает, что могло бы здесь произойти...»"
 agot_travel_events.0010.greed_desc: "Пока мы готовимся к отбытию, [innkeeper.GetFirstName] подходит ко мне, чтобы выразить свою благодарность.\n\n«Без вашей помощи кто знает, что могло бы здесь произойти... Пусть ваши путешествия будут безопасными, я позабочусь о том, чтобы другие узнали о вашем мужестве»."
 agot_travel_events.0010.a: "Прощай."
 agot_travel_events.0010.aa: "Желанная награда."
 agot_travel_events.0010.b: "Не нужно. Это было правильно."
 agot_travel_events.0010.b.tt: "Ваша свита принимает к сведению вашу рыцарственность и улучшает [opinion|El] о вас на #P 10#!."

 agot_travel_events.0011.t: "На перепутье: Потраченное время"
 agot_travel_events.0011.desc.intro: "Проходит несколько дней, но мимо трактира проходит лишь несколько пьяниц, а разбойников поблизости не видно. Неужели опасения [Select_CString(innkeeper.IsFemale, 'трактирщицы', 'трактирщика' )] были беспочвенны? Или, может быть, наше присутствие отпугнуло их? Неизвестно...\n\n"
 agot_travel_events.0011.wasgreedy: "Пока мы седлаем коней, [innkeeper.GetFirstName] подходит ко мне с небольшой деревянной шкатулкой в руках.\n\n«Здесь немного, но это всё, что у нас осталось после недавнего налёта. Пожалуйста, примите это за ваши хлопоты»."
 agot_travel_events.0011.a: "Прощай."
 agot_travel_events.0011.b: "Прощай."
 
 agot_travel_events.1000.t: "Винтерфелл: Прибытие"
 agot_travel_events.1000.desc: "Винтерфелл - резиденция дома [winterfell_lord.GetHouse.GetName] и сердце Севера, гордо возвышающееся среди просторов.\n\nПодъезжая к замку по Королевскому тракту, я проезжаю через Зимний городок, просторное и в данный момент практически пустое поселение за стенами. Когда я продвигаюсь дальше на восток, стены начинают доминировать над горизонтом. Внешняя достигает восьмидесяти футов, а внутренняя - ещё на двадцать выше. Они тёмные и серые; выветрившийся камень говорит о большом возрасте замка.\n\nВосточные ворота открыты и гостеприимны, а внутри вас ждёт [winterfell_lord.GetFullName] с солью и хлебом. После того, как на вас распространится право гостя, [winterfell_lord.GetSheHe] предоставит вам возможность исследовать замок. "
 agot_travel_events.1000.godswood: "Я исследую знаменитую #bold богорощу#!, где обитают Старые боги."
 agot_travel_events.1000.tombs: "Я исследую знаменитую #bold крипту#!, где история стоит на страже вечности."
 agot_travel_events.1000.glass_gardens: "Я пройдусь по знаменитым #bold теплицам#!, которые являются сердцем замка."
 agot_travel_events.1000.wintertown: "На самом деле я бы [Select_CString(ROOT.Char.IsFemale, 'предпочла', 'предпочёл' )] осмотреть Зимний городок и его более... #italic плотские#! достопримечательности."
 agot_travel_events.1000.opt_out: "У меня нет времени тратить время на изучение."

 agot_travel_events.1001.t: "Винтерфелл: Богороща"
 agot_travel_events.1001.intro_old_gods: "Проходя по богороще, я не могу отделаться от ощущения, что [Select_CString(ROOT.Char.IsFemale, 'вернулась', 'вернулся' )] домой: тёмная и первобытная красота богорощи таинственным образом зовёт меня к себе.\n\n"
 agot_travel_events.1001.intro_other: "Проходя через богорощу, я не могу отделаться от ощущения, что нарушаю границы, но тем не менее тёмная и первозданная красота богорощи всё равно зовёт меня.\n\n"
 agot_travel_events.1001.desc: "Пробираясь сквозь деревья, я оказываюсь перед небольшой полянкой, окружавшей горячие источники, рядом с которыми росло огромное чардрево. Подойдя поближе к пруду и дереву, я [Select_CString(ROOT.Char.IsFemale, 'почувствовала', 'почувствовал' )], что меня побуждают к действию."
 agot_travel_events.1001.a: "Сами Старые боги взывают ко мне через #bold чардрево#!."
 agot_travel_events.1001.b: "Тепло и омоложение #bold горячих источников#! невозможно отрицать."

 agot_travel_events.1002.t: "Винтерфелл: Богороща"
 agot_travel_events.1002.desc: "Стоя на коленях перед чардревом, я чувствую покой.\n\nЯ слышу всё, что происходит в лесу, гораздо отчетливее: шум ветра в ветвях, шум воды на камнях, топот животных в лесу, и через всё это, #italic да#!, Старые боги, #bold истинные#! боги, говорят со мной."
 agot_travel_events.1002.a: "Я чувствую себя [Select_CString(ROOT.Char.IsFemale, 'перерождённой', 'перерождённым' )] #L [GetReligionByKey('the_pact_religion').GetName|l][Select_CString(ROOT.Char.IsFemale, 'ой', 'ым' )]#! [Select_CString(ROOT.Char.IsFemale, 'последовательницей', 'последователем' )]."
 agot_travel_events.1002.b: "Нет, лишь [ROOT.Char.GetFaith.HighGodName] заслуживают почитания!"
 agot_travel_events.1002.c: "Я чувствую себя вновь [Select_CString(ROOT.Char.IsFemale, 'приобщённой', 'приобщённым' )] к #L [GetReligionByKey('the_pact_religion').GetName|l]им#! убеждениям."

 agot_travel_events.1003.t: "Винтерфелл: Богороща"
 agot_travel_events.1003.desc: "Лёжа в пруду, я чувствую, как вместе с тёплой водой смываются все накопившиеся за долгое время тревоги и переживания. По контрасту с прохладным воздухом над головой, объятия горячих источников дарят такой комфорт, какого я не [Select_CString(ROOT.Char.IsFemale, 'испытывала', 'испытывал' )] уже много лет. Я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] бы плавать здесь целую вечность, но теперь, когда я [Select_CString(ROOT.Char.IsFemale, 'расслабилась', 'расслабился' )], я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] снова заняться делами."
 agot_travel_events.1003.a: "Я чувствую новое чувство спокойствия за будущее."

 agot_travel_events.1004.t: "Винтерфелл: Крипта"
 agot_travel_events.1004.desc: "Я прохожу мимо древней Первой Твердыни, иду среди заросших лишайником надгробий, где покоятся слуги старых Королей Зимы.\n\nПередо мной возникает старая дверь из железноствола: вход в лабиринты крипты. Что-то заставляет меня открыть дверь и войти внутрь. С каждым шагом вниз меня охватывает холод, и я спускаюсь из мира живых в катакомбы мёртвых.\n\nПрогуливаясь среди склепов, я обнаружил, что темные коридоры превратились в лабиринт. Слабый свет факелов не дает никаких ориентиров. Когда я подхожу к перекрестку, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] выбрать, куда пойти - #bold направо#! или #bold налево#!."
 agot_travel_events.1004.a: "Я пойду направо, мне кажется, я что-то вижу в той стороне."
 agot_travel_events.1004.b: "Слева есть факел; это, должно быть, путь к нему!"

 agot_travel_events.1005.t: "Винтерфелл: Крипта"
 agot_travel_events.1005.intro: "Пройдя дальше по коридору, я оказываюсь лицом к лицу со статуей человека, короля в короне. По обе стороны от трона - каменные лютоволки, а на коленях - меч, давно заржавевший. Несколько слов, выгравированных на его боку, слегка стерлись, но всё ещё поддаются расшифровке:\n\n"
 agot_travel_events.1005.jon: "#bold [stark_ancestor.GetFullNameNicknamed].#! Я не могу не смотреть на статую с большим уважением. Передо мной король, изгнавший с востока налётчиков и работорговцев и построивший Волчье Логово, древний предшественник Белой Гавани. Этот человек был грозным воином и сильным королём."
 agot_travel_events.1005.brandon: "#bold [stark_ancestor.GetFullNameNicknamed].#! Я не могу не смотреть на статую с большим уважением. Это прославленный король, который объединился с Джорамуном, королём-За-Стеной, чтобы покончить с Королём Ночи и его Мёртвой королевой. Вместе они защитили царство людей от ужасов, которые непременно должен был сотворить Король Ночи."
 agot_travel_events.1005.theon: "#bold [stark_ancestor.GetFullNameNicknamed].#! Я не могу не смотреть на статую с большим уважением. Голодный Волк знаменит даже за пределами Севера: он объединил Север перед приходом андалов, а затем победил этих захватчиков - и напал даже на сам Андалос в Эссосе. Он сражался повсюду и со всеми, от андалов до Железнорождённых и даже больше; он был настоящим повелителем войны."
 agot_travel_events.1005.rodrik: "#bold [stark_ancestor.GetFullNameNicknamed].#! Я не могу не смотреть на статую с большим уважением. О Родрике Старке поют и по сей день, особенно когда возникают какие-либо проблемы с железнорождёнными. Говорят, что он отвоевал Медвежий остров у кальмаров в рукопашной борьбе и подарил его дому Мормонт. "
 agot_travel_events.1005.a: "Здесь чувствуется история."

 agot_travel_events.1006.t: "Винтерфелл: Крипта"
 agot_travel_events.1006.desc: "Вскоре в глубине склепа меня находит паж и объявляет, что скоро будет подан ужин. К счастью, паж знает дорогу и снова выводит меня на поверхность."
 agot_travel_events.1006.a: "Я не забуду этот день."

 agot_travel_events.1007.t: "Винтерфелл: Крипта"
 agot_travel_events.1007.desc: "Я явно [Select_CString(ROOT.Char.IsFemale, 'выбрала', 'выбрал' )] не тот путь, потому что теперь я ещё больше [Select_CString(ROOT.Char.IsFemale, 'заблудилась', 'заблудился' )] в этих коридорах. Факелы расположены беспорядочно и ведут меня всё дальше и дальше вниз. #italic Каждый шаг вниз всё больше морозит меня.#!\n\nЯ чувствую странный жар, исходящий от стен и потолка, который увлекает меня всё дальше в глубины. Зайдя за угол, я вижу то, что меньше всего [Select_CString(ROOT.Char.IsFemale, 'ожидала', 'ожидал' )] найти в крипте под Винтерфеллом...\n\nПередо мной лежит #bold яйцо дракона#!! Помещенное в какой-то держатель, оно явно было оставлено здесь с какой-то целью, но что это может быть за цель, я не могу даже предположить. "
 agot_travel_events.1007.a: "Конечно, его цель - оставаться в этом месте."
 agot_travel_events.1007.b: "В конце концов, почему бы и нет? Почему бы мне не взять его?"

 agot_travel_events.1008.t: "Винтерфелл: Теплицы"
 agot_travel_events.1008.desc: "Войдя в теплицы, я вдруг [Select_CString(ROOT.Char.IsFemale, 'почувствовала', 'почувствовал' )] себя слишком [Select_CString(ROOT.Char.IsFemale, 'одетой', 'одетым' )]. Мехи и плащи, которые я [Select_CString(ROOT.Char.IsFemale, 'носила', 'носил' )], чтобы противостоять холоду замка, теперь кажутся слишком жаркими в этом стеклянном сооружении.\n\nПо всему периметру медные трубы выпускают пар и горячий воздух, который поднимается из-под земли. Даже в самые холодные дни зимы здесь выращиваются овощи и другие продукты. А когда я продвигаюсь дальше к задней стенке, то вижу знаменитые #bold;color:{0.52,0.65,0.86} зимние розы#!. Их бледно-голубые лепестки поражают своим внешним видом больше, чем у любой другой розы, которую я когда-либо [Select_CString(ROOT.Char.IsFemale, 'видела', 'видел' )]."
 agot_travel_events.1008.a: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] изучить конструкцию и понять, возможно ли её воспроизвести."
 agot_travel_events.1008.b: "Может быть, я могу попросить взять цветок домой..."
 agot_travel_events.1008.c: "Теплицы представляют собой поистине удивительное зрелище."
 agot_travel_events_unlocked_glass_garden: "Вы разблокируете герцогскую постройку «Теплицы»."

 agot_travel_events.1009.t: "Винтерфелл: Зимний городок"
 agot_travel_events.1009.desc: "Выйдя из старинного замка, я [Select_CString(ROOT.Char.IsFemale, 'направилась', 'направился' )] в Зимний городок. Несмотря на то, что он далеко не полон, здесь всё ещё много людей: фермеры выставляют свой урожай, торговцы продают свои товары, случайные музыканты напевают мелодии...\n\nНаведя справки, я вскоре нахожу искомое место: #bold Розы#!. Местные жители уверяли меня, что я хорошо проведу время, и с моим кошельком монет я в этом [Select_CString(ROOT.Char.IsFemale, 'уверена', 'уверен' )]."
 agot_travel_events.1009.a: "Пора потратить немного денег..."
 agot_travel_events.1009.b: "Может, вместо этого просто выпить в таверне..."

 # A Dragon, I saw a dragon!
 agot_travel_events.0012.t: "Дракон, я видела дракона!"
 agot_travel_events.0012.desc: "Проходя через провинцию [location.GetName], я [Select_CString(ROOT.Char.IsFemale, 'подслушала', 'подслушал' )] разговор между пожилой женщиной и молодым человеком.\n\n«Дракон, я видела дракона!» - воскликнула старуха. «Что? Что опять случилось, мама?» «Он был огромный, как гора, и чёрный, словно ночь. Он пролетел прямо над холмом!» - продолжает она в панике.\n\n«Ох, на этот раз драконы?» - отвечает её сын, закатывая глаза. «Ну мама. Если ты будешь продолжать в том же духе, все решат, что ты сошла с ума. И некогда мне слушать про твои фантазии - у меня дел полно», - говорит он с насмешкой и поворачивается, чтобы уйти.\n\n«Вот увидишь! Это был дракон!» - кричит она ему в спину. «Он убьёт всех нас, и тогда ты мне поверишь!»"
 agot_travel_events.0012.a: "Дракон?! Мы должны немедленно его отыскать!"
 agot_travel_events.0012.a.f: "В течение следующей недели вы ведёте поиски дракона."
 agot_travel_events.0012.a.toast.title: "Здесь нет драконов"
 agot_travel_events.0012.a.toast.desc: "Вы отправились на поиски дракона, но ничего не нашли."
 agot_travel_events.0012.b: "О, бедная старушка, позволь мне отплатить за помощь."
 agot_travel_events.0012.b.f: "Вы платите за душевную помощь для старушки."
 agot_travel_events.0012.c: "Какая странная беседа."
 agot_travel_events.0012.c.f: "Вы продолжаете свой путь."
 agot_travel_events.0012.d: "Нет, она права! Я тоже это [Select_CString(ROOT.Char.IsFemale, 'видела', 'видел' )]!"
 agot_travel_events.0012.d.f: "Вы подтверждаете разглагольствования старушки."

 # Travel to the Myr Scholastic Guilds
 agot_travel_events.0013.t: "Мир: Гильдии схоластов"
 agot_travel_events.0013.desc: "Пробираясь по городу, я натыкаюсь на группу ученых и школяров, погруженных в дискуссию. Это члены Гильдии схоластов, и они обсуждают тонкости недавнего открытия. Слушая их, я понимаю, что у меня есть уникальная возможность поучиться у этих ученых."
 agot_travel_events.0013.a: "Я приглашу нескольких учёных в свой город."
 agot_travel_events_unlocked_observatory: "Вы разблокируете герцогскую постройку «Обсерватория»."
 agot_travel_events.0013.b: "Остановиться и включиться в обсуждение."
 agot_travel_events.0013.c: "Я продолжу свой путь."

 # Maester Court Position Option
 maester_option_tt: "Вам потребуется [GetCourtPositionType('maester_court_position').GetName] с возможностью путешествовать"

 agot_travel_events.2000.t: "[Select_CString(EqualTo_string('он', wild_dragon.Custom('GetDragonSheHe')), 'Зловещий', 'Зловещая')] [wild_dragon.GetNameNoTooltip]: Засада"
 agot_travel_events.2000.desc: "Путешествие через владение [location.GetNameNoTooltip] до сих пор проходило спокойно, без всяких затруднений. Однако лошади заметно забеспокоились. Я узнаю причину слишком поздно...\n\nПриближаясь к нам, [wild_dragon.GetNameNicknamed] властно рассекает небо. Хуже того, судя по [Select_CString(EqualTo_string('он', wild_dragon.Custom('GetDragonSheHe')), 'его', 'её')] движениям, мы не остались незамеченными."
 agot_travel_events.2000.fight: "Слишком поздно, приготовиться к бою."
 agot_travel_events.2000.fight.tt: "Вы вступите в бой с драконом [wild_dragon.GetNameNoTooltip]"
 agot_travel_events.2000.run: "БЕГИТЕ!"

 # Warband Tryouts
 agot_travel_events.3000.t: "Испытания отряда"
 agot_travel_events.3000.desc: "Когда моя свита путешествует по землям, которым правит [3000_county_liege.GetTitledFirstName], мы слышим отдалённый стук и лязг грубого оружия, раздающийся за ближайшим поворотом. Когда мы сворачиваем за угол, я вижу, что там на вершине небольшого холма стоит [Select_CString(3000_county_liege.IsFemale, 'сама', 'сам' )] [3000_county_liege.GetTitledFirstNameNoTooltip] и наблюдает за отрядом вольного народа, соревнующихся в разных физических испытаниях. Каждый из них напряжён, пытаясь справиться с задачей, красные лица и потные брови усеивают немытую массу потенциальных воинов. Похоже, мы наткнулись на то, как [3000_county_liege.GetTitledFirstNameNoTooltip] проводит испытания для нового отряда."
 agot_travel_events.3000.kneeler.desc: "Пока я пробираюсь по негостеприимным землях одичалых, и каждый шаг становится для нас с отрядом более коварным, чем предыдущий, за ближайшим поворотом мы слышим стук и лязг грубого оружия и недвусмысленное ворчание. Выхватив мечи, мы бросаемся за угол с клинками в руках. Но вместо ожидаемой битвы мы обнаруживаем [Select_CString(3000_county_liege.IsFemale, 'одичалую, выглядящую', 'одичалого, выглядящего' )] более царственно, возвышаясь над толпой дикарей. [3000_county_liege.GetSheHe|U], похоже, пристально наблюдает за испытанием мастерства, как одичалые становятся багровыми от попыток доказать свою силу."
 agot_travel_events.3000.a: "Мне нужен один из них!"
 agot_travel_events.3000.a.tt: "Вы используете свой престиж, чтобы выбрать одного из участников."
 agot_travel_events.3000.b: "Скажите, [3000_county_liege.GetFirstNameNoTooltip], не будет ли для вас честью, если я..."
 agot_travel_events.3000.b.tt: "Вы попытаетесь убедить персонажа [3000_county_liege.GetFirstNameNoTooltip] позволить вам завербовать участника"
 agot_travel_events.3000.b.success.tt: "[3000_county_liege.GetNameNoTooltip] соглашается"
 agot_travel_events.3000.b.failure.tt: "[3000_county_liege.GetNameNoTooltip] [Select_CString(3000_county_liege.IsFemale, 'оскорблена', 'оскорблен' )] предложением"
 agot_travel_events.3000.c: "Хотите узнать, кто здесь [Select_CString(ROOT.Char.IsFemale, 'лучшая воительница', 'лучший воин' )]? Позвольте мне показать вам."
 agot_travel_events.3000.c.tt: "Вы примете участие в поединке"
 agot_travel_events.3000.d: "Оставим их наедине."
 agot_travel_events.3000.d.tt: "Вы продолжите свой путь."

 agot_travel_events.3001.t: "$agot_travel_events.3000.t$: участники испытаний"
 agot_travel_events.3001.desc: "Приближаясь к участникам, многие из которых с жалким почтением отворачиваются от моего взгляда, я вижу троих, подающих надежды, и указываю на каждого по очереди. [3000_county_liege.GetName] вызывает их выступить вперёд, и они представляются как [skilled_fighter.GetName], [Select_CString(skilled_fighter.IsFemale, 'опасная воительница, известная', 'опасный воин, известный' )] своим мастерством, [fit_fighter.GetName], [Select_CString(fit_fighter.IsFemale, 'известная', 'известный' )] своей силой, и [Select_CString(big_fighter.IsFemale, 'высокая воительница', 'высокий воин' )] по имени [big_fighter.GetName]."
 agot_travel_events.3001.a: "Ну что ж, приступайте, я, очевидно, выберу победителя."
 agot_travel_events.3001.a.tt: "Победитель испытаний присоединится к вам"
 agot_travel_events.3001.b: "Удача переменчива в испытаниях, я уже знаю, кто здесь лучший."
 agot_travel_events.3001.b.tt: "Вы выберете своего фаворита испытаний"

 agot_travel_events.3002.t: "$agot_travel_events.3000.t$: [Select_CString(tryouts_winner.IsFemale, 'победительница', 'победитель' )]"
 agot_travel_events.3002.desc: "После изнурительных часов труда и лишений - каждый из них был потрачен на борьбу с тяжелым весом, длительные забеги и испытания стали - финалисты выходят на поединок. Двое бойцов занимают свои позиции, воздух становится тонким от напряжения. Клинки выхватываются, и танец начинается. Через мгновение, показавшееся вечностью, [tryouts_winner.GetName] оставляет своего противника одного в грязи."
 agot_travel_events.3002.a: "Вот и [Select_CString(tryouts_winner.IsFemale, 'победительница', 'победитель' )]."

 agot_travel_events.3003.t: "$agot_travel_events.3000.t$: выбор"
 agot_travel_events.3003.desc: "Я обращаю свой взор на трёх фаворитов. Нет никаких сомнений, что они лучшие воины владения [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. Теперь я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] выбрать своего фаворита."
 agot_travel_events.3003.a: "Ничто не сравнится с боевым мастерством, [skilled_fighter.GetFirstNameNoTooltip] - мой выбор."
 agot_travel_events.3003.b: "[fit_fighter.GetNamePossessive] [Select_CString(fit_fighter.IsFemale, 'сильна', 'силён' )], я выберу [fit_fighter.GetHerHis]."
 agot_travel_events.3003.c: "С кем-то такого размера мне, возможно, даже не придётся драться. [big_fighter.GetFirstNameNoTooltip] - лучший выбор!"

 agot_travel_events.3010.t: "$agot_travel_events.3000.t$: участие в состязаниях"
 agot_travel_events.3010.desc: "Протиснувшись к началу группы, я начинаю готовиться к испытаниям, [Select_CString(ROOT.Char.IsFemale, 'свидетельницей', 'свидетелем' )] которых я [Select_CString(ROOT.Char.IsFemale, 'стала', 'стал' )] по прибытии. Но прежде чем я успеваю начать, [3000_county_liege.GetName] поднимает руку, объявляя, что в связи с моим положением я перехожу прямо на этап поединков, где мне предстоит сразиться с одним лучших воинов из числа потенциальных налётчиков. [Select_CString(first_duelist.IsFemale, 'Вышедшая', 'Вышедший' )] вперёд [Select_CString(first_duelist.IsFemale, 'участница', 'участник' )] - грозного вида [Select_CString(first_duelist.IsFemale, 'воительница', 'воин' )] по имени [first_duelist.GetName]."
 agot_travel_events.3010.a: "Ха! Посмотрим, из чего сделан [ROOT.Char.GetCurrentLocation.GetAdjectiveNoTooltip]ий народ."
 agot_travel_events.3010.a.tt: "Начнется поединок с персонажем [first_duelist.GetNameNoTooltip]"
 agot_travel_events.3010.b: "Если подумать, было невежливо прерывать их."
 agot_travel_events.3010.b.tt: "Вы уклонитесь от поединка"

 agot_travel_events.3012.t: "$agot_travel_events.3000.t$: триумф"
 agot_travel_events.3012.desc: "Звон металла эхом разносится по воздуху, когда наши клинки сталкиваются. Мы ходим туда-сюда, мечи танцуют между нами, и в момент полной ясности я вижу просвет. Моё оружие находит путь, и поединок заканчивается. Празднуя победу, я оглядываюсь по стороном и [3000_county_liege.GetNamePossessive] всем своим видом даёт понять, что это не тот результат, на который [3000_county_liege.GetSheHe] [Select_CString(3000_county_liege.IsFemale, 'рассчитывала', 'рассчитывал' )]. Тем не менее было бы расточительством не использовать эту победу в своих интересах."
 agot_travel_events.3012.a: "Неужели это всё, на что способны [first_duelist.GetCulture.GetNameNoTooltip]? Жалко."
 agot_travel_events.3012.a.tt: "Ваше оскорбление запомнится надолго"
 agot_travel_events.3012.b: "[Select_CString(3000_county_liege.IsFemale, 'Слабая предводительница', 'Слабый вождь' )], слабый отряд, [3000_county_liege.GetFirstNameNoTooltip]."
 agot_travel_events.3012.b.tt: "[3000_county_liege.GetNameNoTooltip] не сможет легко отделаться от этого оскорбления"
 agot_travel_events.3012.c: "Я здесь [Select_CString(ROOT.Char.IsFemale, 'лучшая', 'лучший' )], теперь это мой отряд."
 agot_travel_events.3012.c.tt: "Вы заберетё с собой лучших участников"
 agot_travel_events.3012.d: "Хороший бой, [first_duelist.GetFirstNameNoTooltip], [3000_county_liege.GetNameNoTooltip] очень [Select_CString(3000_county_liege.IsFemale, 'везучая', 'везучий' )], что [Select_CString(3000_county_liege.IsFemale, 'ей', 'ему' )] служат такие [Select_CString(first_duelist.IsFemale, 'воительницы', 'воины' )], как ты."
 agot_travel_events.3012.d.tt: "[first_duelist.GetNameNoTooltip] присоединится к персонажу [3000_county_liege.GetNameNoTooltip]"

 agot_travel_events.3013.t: "$agot_travel_events.3000.t$: унижение"
 agot_travel_events.3013.desc: "Мой клинок со звоном падает на землю, и я [Select_CString(ROOT.Char.IsFemale, 'вынуждена', 'вынужден' )] уступить. Мои щеки пылают от свежего смущения при виде оценивающих взглядов и смеющихся лиц собравшихся воинов. После такого унижения остается только один выход."
 agot_travel_events.3013.a: "Умм... продолжайте в том же духе, а мы отправимся в путь."
 agot_travel_events.3013.a.tt: "Вы уходите, униженные"

 agot_travel_events.3014.t: "$agot_travel_events.3000.t$: поединок недействителен" # No one should ever see this
 agot_travel_events.3014.desc: "Что-то пошло не так, и поединок отменяется."
 agot_travel_events.3014.a: "Ну что ж, в путь."
 agot_travel_events.3014.a.tt: "Вы продолжите свой путь"

 # Laughter in the Trees
 agot_travel_events.4000.t: "Смех среди деревьев"
 agot_travel_events.4000.desc: "Пока мы пробираемся через густой лес, меня не покидает ощущение, что за нами наблюдают. С каждым мгновением шелест деревьев все больше напоминает шепот, а тревожные выражения на лицах моих спутников говорят о том, что они тоже разделяют мое ощущение. В этот момент из глубины леса до нас доносится безошибочный смех, высокий, словно детский. Вскоре другие, такие же детские голоса присоединяются к хору забавного хихиканья, которое тревожным эхом разносится вокруг нас."
 agot_travel_events.4000.unknownchildren.desc: "Я пытаюсь разглядеть какие-нибудь силуэты среди деревьев, но лес слишком густой. Источник смеха остается столь же загадочным, сколь и тревожным."
 agot_travel_events.4000.knownchildren.desc: "Учитывая, где мы находимся, вывод может быть только один: за нами наблюдают наши неуловимые соседи, Дети Леса."
 agot_travel_events.4000.a: "Вы смеете смеяться надо мной? Я вам покажу!"
 agot_travel_events.4000.a.first_ranger: "Вы смеете смеяться над Первым разведчиком? Я вам покажу!"
 agot_travel_events.4000.a.tt: "Вы бежите за голосами, чтобы наказать наглецов"
 agot_travel_events.4000.b: "Дети не представляют угрозы, мы можем разбить здесь лагерь."
 agot_travel_events.4000.b.tt: "Вы разбиваете свой лагерь на ночь, как обычно, и позволяете наблюдателям удовлетворить свое любопытство"
 agot_travel_events.4000.c.knownchildren: "Этим маленьким уродцам нельзя доверять, поспешим уйти."
 agot_travel_events.4000.c.unknownchildren: "Нам нужно покинуть этот проклятый лес."
 agot_travel_events.4000.c.tt: "Вы приказываете своим спутникам ускорить шаг и продолжить путь"

 agot_travel_events.4001.t: "$agot_travel_events.4000.t$: в погоне за ветром"
 agot_travel_events.4001.desc: "[Select_CString(ROOT.Char.IsFemale, 'Охваченная', 'Охваченный' )] гневом, я с мстительным намерением ныряю за деревья. Хихиканье не прекращается, и, как бы быстро я ни [Select_CString(ROOT.Char.IsFemale, 'бежала', 'бежал' )], оно остается слишком далеким, чтобы я [Select_CString(ROOT.Char.IsFemale, 'смогла', 'смог' )] разглядеть злоумышленников. Разочарование разжигает мой гнев, но в конце концов необходимость перевести дух берет верх над погоней, и я понимаю, что [Select_CString(ROOT.Char.IsFemale, 'оставила', 'оставил' )] своих спутников далеко позади. Я [Select_CString(ROOT.Char.IsFemale, 'одна, окруженная', 'один, окруженный' )] заметно менее веселым и более презрительным смехом."
 agot_travel_events.4001.a: "Покажитесь, или я прикажу сжечь весь этот лес!"
 agot_travel_events.4001.a.tt: "Вы пытаетесь заставить скрывающихся явить себя"
 agot_travel_events.4001.b: "Я... Мне не следовало ввязываться в это."
 agot_travel_events.4001.b.tt: "Униженные, вы пытаетесь найти дорогу назад"

 agot_travel_events.4002.t: "$agot_travel_events.4000.t$: не смешно"
 agot_travel_events.4002.desc: "Смех внезапно прекращается. Мгновение спустя до меня доносится слабый шепот, а затем - безошибочный звук скрипа дерева и скольжения по дереву в унисон."
 agot_travel_events.4002.a: "О, думаете, вы мо-#XB АКХ!#!"
 agot_travel_events.4002.a.tt: "Когда лес вокруг вас темнеет, вы слышите залп смеха, раздающийся в последний раз"

 agot_travel_events.4003.t: "$agot_travel_events.4000.t$: вечер с песней"
 agot_travel_events.4003.desc: "Шепот и хихиканье следуют за нами, пока мы добираемся до первой поляны, пригодной для лагеря. Наши старания подготовиться к наступлению ночи не могут не веселить Детей: смех нарастает каждый раз, когда мы приступаем к новому заданию, но к тому времени, как мы устраиваемся, он стихает и уступает место более отдаленным звукам пения. Насытившись новизной, Дети Леса решили провести вечер за песней, как это часто делаем мы. Но мы не смеем соперничать с ними, ведь их пение прекраснее, чем все, что мы когда-либо слышали. Когда мы сидим у костра, я слышу, как [other_traveller.GetName] со слезами в глазах шепчет: «Я бы все [Select_CString(other_traveller.IsFemale, 'отдала', 'отдал' )], чтобы продолжать слушать это»." 
 agot_travel_events.4003.a: "На этой ноте мы должны оставить дары."
 agot_travel_events.4003.a.tt: "Вы пожертвуете часть припасов Детям"
 agot_travel_events.4003.b: "Менестрели такого уровня заслуживают особой награды."
 agot_travel_events.4003.b.tt: "Дети Леса получат [artifact_gift.GetName]"
 agot_travel_events.4003.c: "Шшш... просто насладимся музыкой."
 agot_travel_events.4003.c.tt: "Вы заснёте под песни"

 agot_travel_events.4004.t: "$agot_travel_events.4000.t$: приятное пробуждение"
 agot_travel_events.4004.desc: "Наступает новый день, и щебетание утренних птиц пробуждает меня от восхитительного сна. Я улыбаюсь еще до того, как открываю глаза. Осмотрев лагерь, я обнаруживаю, что мои спутники пребывают в таком же настроении. Детей Леса нигде не слышно, но воспоминания о вчерашнем вечере не дают покоя."
 agot_travel_events.4004.gotreward.desc: "\n\nВы замечаете, что подарок, оставленный вами на плоском камне на окраине лагеря, исчез, а на его месте лежит кожаный свёрток. Развернув его, внутри оказывается [reward_artifact.GetName]."
 agot_travel_events.4004.a.gotreward: "Как щедро с их стороны."
 agot_travel_events.4004.a.noreward: "Как мило."
 agot_travel_events.4004.a.tt: "Вы продолжите свой путь"

 travel_events.4012.desc_alt: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip] — дикий край. И всё же меня не покидает ощущение, что за нами следят. Я вглядываюсь в чащу и вижу, что там прячется — не очень-то успешно, надо сказать, — [Select_CString(feral_child_scope.IsFemale, 'хрупкая маленькая', 'хрупкий маленький' )] [feral_child_scope.Custom('GirlBoy')], [Select_CString(feral_child_scope.IsFemale, 'которая', 'который' )] не сводит глаз с нашей процессии.\n\nОдин из караванщиков сообщает, что, по словам местных, в этих местах обитает [Select_CString(feral_child_scope.IsFemale, 'некая', 'некий' )] [feral_child_scope.GetFirstNameNoTooltip] — ребенок, которого вдали от людей воспитало животное [feral_child_scope.Custom('GetAnimalType')].\n\nНесчастное существо явно заинтересовалось нами и даже пытается говорить что-то на ломаном всеобщем языке, хотя по большей части это просто набор слов без какого-то смысла."