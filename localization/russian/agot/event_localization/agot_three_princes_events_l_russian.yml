 agot_a_new_harvest_prince_is_elected_tt: "Новый князь Урожая будет избран в ближайшее время"
 agot_a_new_harvest_prince_is_elected_soon_tt: "Новый князь Урожая будет избран через три дня"
 agot_a_new_harvest_prince_is_elected_eight_tt: "Выборы княжества Урожая начнутся через восемь дней"

 agot_a_new_fisher_prince_is_elected_tt: "Новый князь Рыбаков будет избран в ближайшее время"
 agot_a_new_fisher_prince_is_elected_soon_tt: "Новый князь Рыбаков будет избран через три дня"
 agot_a_new_fisher_prince_is_elected_eight_tt: "Выборы княжества Рыбаков начнутся через восемь дней"

 agot_a_new_prince_of_streets_is_elected_tt: "Новый князь Улиц будет избран в ближайшее время"
 agot_a_new_prince_of_streets_is_elected_soon_tt: "Новый князь Улиц будет избран через три дня"
 agot_a_new_prince_of_streets_is_elected_eight_tt: "Выборы княжества Улиц начнутся через восемь дней"

 agot_three_princes.1000.t: "Кончина [Select_CString(dead_prince.IsFemale, 'княгини', 'князя' )] Урожая"
 agot_three_princes.1000.desc: "[Concept('agot_harvest_prince', 'Князь Урожая')|E] [Select_CString(dead_prince.IsFemale, 'скончалась', 'скончался' )], положив конец своему пребыванию на посту одного из трёх церемониальных князей Лората. Будучи [Select_CString(ROOT.Char.IsFemale, 'землевладелицей', 'землевладельцем' )] на островах #ONCLICK:TITLE,k_lorath #TOOLTIP:LANDED_TITLE,k_lorath #L Лората#!#!#!, я имею право отдать свой голос на выборах [dead_prince.GetHerHis] преемника. Кого из кандидатов, выдвинутых землевладельцами, я [Select_CString(ROOT.Char.IsFemale, 'хотела', 'хотел' )] бы видеть на этом привилегированном, пусть и чисто церемониальном, посту?"
 agot_three_princes.1000.a: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] тщательно обдумать свой выбор."

 agot_three_princes.1001.t: "Выборы князя Урожая"
 agot_three_princes.1001.desc: "Избиратели-землевладельцы с островов Лората выдвинули своих кандидатов, и теперь пришло время каждому избирателю отдать свой голос. Пост князя Урожая в наши дни не пользуется большим авторитетом, но титул по-прежнему считается почётным. За кого я отдам свой голос?"
 agot_three_princes.1001.a: "[harvest_prince_candidate_one.GetFullNameNicknamed] таит в себе достоинство."
 agot_three_princes.1001.b: "[harvest_prince_candidate_two.GetFullNameNicknamed] понимает нужды земли."
 agot_three_princes.1001.c: "Князем Урожая [Select_CString(harvest_prince_candidate_three.IsFemale, 'должна', 'должен' )] стать [harvest_prince_candidate_three.GetFullNameNicknamed]."

 agot_three_princes.1003.t: "[Select_CString(lorath_new_harvest_prince.IsFemale, 'Новая княгиня', 'Новый князь' )] Урожая!"
 agot_three_princes.1003.desc: "Бюллетени собраны, голоса подсчитаны, и результат очевиден. [lorath_new_harvest_prince.GetFirstName] [Select_CString(lorath_new_harvest_prince.IsFemale, 'провозглашена новой княгиней', 'провозглашён новым князем' )] Урожая! Под радостные возгласы собравшихся выборщиков [lorath_new_harvest_prince.GetHerHis] сопроводят во владение [GetTitleByKey('c_palliera').GetName], где [lorath_new_harvest_prince.GetSheHe] займёт своё законное место в зале Урожая."
 agot_three_princes.1003.a: "Избиратели изъявили свою волю."

 agot_three_princes.2000.t: "Кончина [Select_CString(dead_prince.IsFemale, 'княгини', 'князя' )] Рыбаков"
 agot_three_princes.2000.desc: "[Concept('agot_fisher_prince', 'Князь Рыбаков')|E] [Select_CString(dead_prince.IsFemale, 'скончалась', 'скончался' )], положив конец своему пребыванию на посту одного из трёх церемониальных князей Лората. Как [Select_CString(ROOT.Char.IsFemale, 'гражданка', 'гражданин' )] #ONCLICK:TITLE,k_lorath #TOOLTIP:LANDED_TITLE,k_lorath #L Лората#!#!#!, [Select_CString(ROOT.Char.IsFemale, 'владеющая', 'владеющий' )] кораблём, я имею право голосовать на выборах [dead_prince.GetHerHis] преемника. Кого из кандидатов, выдвинутых избирателями-судовладельцами, я [Select_CString(ROOT.Char.IsFemale, 'хотела', 'хотел' )] бы видеть на этом привилегированном, пусть и чисто церемониальном, посту?"
 agot_three_princes.2000.a: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] тщательно обдумать свой выбор."

 agot_three_princes.2001.t: "Выборы князя Рыбаков"
 agot_three_princes.2001.desc: "Избиратели-судовладельцы с островов Лората выдвинули своих кандидатов, и теперь пришло время каждому из них отдать свой голос. Пост князя Рыбаков, возможно, утратил былой авторитет, но этот титул по-прежнему является символом мореходных традиций Лората. За кого я отдам свой голос?"
 agot_three_princes.2001.a: "Никто не знает море лучше, чем [fisher_prince_candidate_one.GetFullNameNicknamed]."
 agot_three_princes.2001.b: "[fisher_prince_candidate_two.GetFullNameNicknamed] обладает задатками [Select_CString(fisher_prince_candidate_two.IsFemale, 'прекрасной княгини', 'прекрасного князя' )] Рыбаков."
 agot_three_princes.2001.c: "[fisher_prince_candidate_three.GetFullNameNicknamed] слышит зов морей."

 agot_three_princes.2003.t: "[Select_CString(lorath_new_fisher_prince.IsFemale, 'Новая княгиня', 'Новый князь' )] Рыбаков!"
 agot_three_princes.2003.desc: "Бюллетени собраны, голоса подсчитаны, и результат очевиден. [lorath_new_fisher_prince.GetFirstName] [Select_CString(lorath_new_fisher_prince.IsFemale, 'провозглашена новой княгиней', 'провозглашён новым князем' )] Рыбаков! Под радостные возгласы собравшихся выборщиков [lorath_new_fisher_prince.GetHerHis] сопроводят во владение [GetTitleByKey('c_qapahienn').GetName], где [lorath_new_fisher_prince.GetSheHe] займёт своё законное место в зале Рыбаков."
 agot_three_princes.2003.a: "Избиратели изъявили свою волю."

 agot_three_princes.3000.t: "Кончина [Select_CString(dead_prince.IsFemale, 'княгини', 'князя' )] Улиц"
 agot_three_princes.3000.desc: "[Concept('agot_streets_prince', 'Князь Улиц')|E] [Select_CString(dead_prince.IsFemale, 'скончалась', 'скончался' )], положив конец своему пребыванию на посту одного из трёх церемониальных князей Лората. Как [Select_CString(ROOT.Char.IsFemale, 'свободная гражданка', 'свободный гражданин' )] #ONCLICK:TITLE,k_lorath #TOOLTIP:LANDED_TITLE,k_lorath #L Лората#!#!#!, я имею право отдать свой голос на выборах [dead_prince.GetHerHis] преемника. Кого из кандидатов, выдвинутых свободным народом островов Лората, я [Select_CString(ROOT.Char.IsFemale, 'хотела', 'хотел' )] бы видеть на этом привилегированном, пусть и чисто церемониальном, посту?"
 agot_three_princes.3000.a: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] тщательно обдумать свой выбор."

 agot_three_princes.3001.t: "Выборы князя Улиц"
 agot_three_princes.3001.desc: "Свободные граждане островов Лората выдвинули своих кандидатов, и теперь пришло время каждому избирателю отдать свой голос. Пост князя Улиц, возможно, не слишком влиятелен, но его обладатель остаётся символом простого народа, населяющего улицы и рынки Лората. За кого я отдам свой голос?"
 agot_three_princes.3001.a: "[prince_of_streets_candidate_one.GetFullNameNicknamed] пользуется доверием простонародья."
 agot_three_princes.3001.b: "[prince_of_streets_candidate_two.GetFullNameNicknamed] знает улицы Лората лучше большинства."
 agot_three_princes.3001.c: "[prince_of_streets_candidate_three.GetFullNameNicknamed] имеет голос, который услышит народ."

 agot_three_princes.3003.t: "[Select_CString(lorath_new_prince_of_streets.IsFemale, 'Новая княгиня', 'Новый князь' )] Улиц!"
 agot_three_princes.3003.desc: "Бюллетени собраны, голоса подсчитаны, и результат очевиден. [lorath_new_prince_of_streets.GetFirstName] [Select_CString(lorath_new_prince_of_streets.IsFemale, 'провозглашена новой княгиней', 'провозглашён новым князем' )] Улиц! Под радостные возгласы собравшихся выборщиков [lorath_new_prince_of_streets.GetHerHis] сопроводят во владение [GetTitleByKey('c_west_catch').GetName], где [lorath_new_prince_of_streets.GetSheHe] займёт своё законное место в зале Улиц."
 agot_three_princes.3003.a: "Избиратели изъявили свою волю."