l_russian:

 # Sailing Activity Events
 agot_sailing.0800.t: "Прибытие в порт"
 agot_sailing.0800.desc: "Я шагаю по дорожкам в гавани, расположенной в провинции [location.GetName], вокруг меня свежий океанский воздух. Пока корабль, на котором я отправлюсь в путешествие, подготавливается командой, у меня и моих спутников еще есть время провести время в гавани.\n\nЯ слышу крики чаек над нами и вижу, как волны разбиваются о причалы внизу. Море лежит передо мной, а вместе с ним и бесконечный потенциал, который оно предлагает. Скоро мы окажемся там, в открытых водах."
 agot_sailing.0800.a: "Море зовёт."
 agot_sailing.0800.b: "У нас недостаточно матросов, чтобы управлять кораблем."
 nice_try_tt: "Ни одна принадлежащая вам карта сокровищ не ведёт туда, куда вы отправились"

 agot_sailing.1005.t: "Портовые соблазны"
 agot_sailing.1005.desc: "Пока я прогуливаюсь по докам, размышляя о предстоящем путешествии, мне встречается приятной внешности [hooker.GetWomanMan]. В [hooker.GetHerHis] глазах пробегает озорная искорка.\n\n«Не хочешь немного поразвлечься, [Select_CString(ROOT.Char.IsFemale, 'морячка', 'морячок')]?»\n\nДел перед отправлением, конечно, еще по горло, но можно было бы уличить пару минут..."
 agot_sailing.1005.a: "Почему же лишь #EMP немного#!, [hooker.GetFirstNameNoTooltip]? До скорой встречи!"
 agot_sailing.1005.b: "Маленькая невинная интрижка ещё никого не убила!"
 agot_sailing.1005.c: "Скройся с глаз моих, [hooker.GetWomanMan]!"
 sailing_gained_concubine_log: "[hooker.GetFirstName] становится [Concept('concubine', Select_CString(hooker.IsFemale, 'наложницей', 'наложником' ))|E]"
 sailing_had_sexual_encounter: "«Романтическая» встреча с персонажем [hooker.GetFirstName]"

 agot_sailing.1006.t: "Клинок в постели"
 agot_sailing.1006.desc: "Откинувшись на подушки, с приятной усталостью в мышцах и широкой улыбкой удовольствия на устах я наблюдаю, как [hooker.GetFirstNameNoTooltip] взбирается на меня и развязывает свой халат.\n\nВсе надежды на второй раунд, однако, рассыпаются вдребезги как только выражение [hooker.GetHerHis] лица изменяется и [hooker.GetSheHe] высоко поднимает кинжал над головой, со смехом обрушивая клинок.\n\n«Дар от Безликих, [Select_CString(ROOT.Char.IsFemale, 'глупая', 'глупый' )] [ROOT.Char.GetTitleAsNameNoTooltip|l]!»"
 agot_sailing.1006.a: "[hooker.GetFirstNameNoTooltip]! Постой... нет!"
 agot_sailing.1006.a.desc: "Вы делаете всё в ваших силах, чтобы отвратить клинок:"
 agot_sailing.1006.duel_success: "Вопреки ожиданиям, вам удаётся отобрать кинжал и запереть [hooker.GetHerHis] в темнице"
 agot_sailing.1006.duel_failure: "Вы чувствуете, как кинжал погружается глубоко в вашу грудь, а зрение быстро тускнеет"

 agot_sailing.1007.t: "Скрашивая досуг"
 agot_sailing.1007.desc: "Я брожу по докам, ожидая пока закончат погрузку припасов на борт корабля. Моё задумчивое состояние прерывается звуком ножичка, скользящего по дереву. Решив пойти на звук, я встречаю члена своего экипажа. [whittler.GetFirstNameNoTooltip] вырезает небольшие замысловатые фигурки из куска древесины.\n\nОторвав взгляд от своей работы, [whittler.GetFirstNameNoTooltip] с улыбкой подзывает меня к себе. «Приветствую, [whittler.Custom2('spoken_address_by_familiarity', ROOT.Char)]. Не желаете ли попробовать себя в резьбе по дереву?»\n\nПохоже, что для этого занятия требуется недюжинная ловкость, но попытка — не пытка..."
 agot_sailing.1007.a: "Я вырежу что нибудь для своего ребёнка."
 agot_sailing.1007.b: "Я сделаю памятный подарок для любимого человека."
 agot_sailing.1007.c: "Я вырежу флейту, чтобы накладывать слова на музыку."
 agot_sailing.1007.d: "Сделаю что нибудь простецкое, чтобы скоротать время."
 agot_sailing.1007.e: "Не буду я тратить время на всякую ерунду."

 agot_sailing.1008.t: "Потасовка в баре"
 agot_sailing.1008.desc: "Уже завтра мы отправимся в плаванье, а сегодня я праздно провожу время в местной таверне со своей командой. Окружающие навеселе, смех льется рекой и каждый пытается перещеголять другого своими захватывающими историями.\n\nВнезапно, над общим шумом пьяной толпы, слышатся разгоряченные споры у барной стойки. Сфокусировав взгляд я понимаю, что один из спорщиков — [brawler.GetFirstNameNoTooltip], член моей команды.\n\nЛегкий спор быстро перерастает в оглушительную перепалку, слюна разбрызгивается в стороны. В дело быстро вступают кулаки, и [brawler.GetFirstNameNoTooltip] зовет на помощь в схватке с группой пьяных дебоширов."
 agot_sailing.1008.a: "Может решим спор не прибегая к грубой силе?"
 agot_sailing.1008.a.success: "Вам удаётся быстро охладить накал и успокоить дебоширов"
 agot_sailing.1008.a.failure: "Ваши воззвания игнорируются, а за вашу дерзость вам обоим сполна достаётся"
 agot_sailing.1008.b: "Уже бегу, [brawler.GetFirstNameNoTooltip]!"
 agot_sailing.1008.b.success: "Вы и [brawler.GetFirstNameNoTooltip] запросто расправляетесь с дебоширами"
 agot_sailing.1008.b.failure: "Вы и [brawler.GetFirstNameNoTooltip] знатно отхватываете от дебоширов"
 agot_sailing.1008.c: "Каждый сам за себя, [brawler.GetFirstNameNoTooltip]..."

 agot_sailing.1009.t: "Состязание выпивох"
 agot_sailing.1009.desc: "Время незаметно ускользает за полночь, а количество выпитого алкоголя сказалось на членах экипажа обычным образом: они рассказывают истории, бахвалятся былыми достижениями и меряются... воинским мастерством.\n\nСлегка покачиваясь, член моей команды [challenger.GetFirstNameNoTooltip] поднимается на ноги, держа в руке кружку, и с грохотом ставит её на стол.\n\n«Ещё ни одно пойло меня не уложило! [challenger.Custom2('spoken_address_by_familiarity', ROOT.Char)|U], наполняй свою чашу... 25 золотых тому, кто останется на ногах!»"
 agot_sailing.1009.a: "Думаешь у тебя есть шанс? Похоже, тебе #EMP уже#! хватит..."
 agot_sailing.1009.a.success: "Наполняя одну кружку за другой, вы наконец слышите, как [challenger.GetFirstNameNoTooltip] с грохотом падает на пол."
 agot_sailing.1009.a.failure: "Выпивка спешно ударяет в голову и вы отключаетесь."
 agot_sailing.1009.b: "Я и не надеюсь перепить тебя, [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('challenger'))]!"

 agot_sailing.1010.t: "Предсказание судьбы"
 agot_sailing.1010.desc: "Прогуливаясь вдоль водной глади, я осматриваю корабельные мачты, что качаются вверх и вниз на волнах. Вдруг я слышу зазывающий голос старухи, раздающейся от небольшой кибитки, что примостилась у обочины.\n\nПо мере моего приближения, она собирает горсть резных камушков с украшенного столика и складывает их в бархатный мешочек. Встряхнув мешочек, она достает из него пять камней и выкладывает их в аккуратную линию.\n\n«Доброго дня, [Select_CString(ROOT.Char.IsFemale, 'морячка', 'морячок')]. Это не просто камни. Они наделены магией глубин, и могут принести знамение в преддверии вашего путешествия, если вы, конечно, позолотите ручку...»"
 agot_sailing.1010.a: "Послушаем же, что скажут камни..."
 agot_sailing.1010.a.success.t: "Знамение благоприятно!"
 agot_sailing.1010.a.success: "Камни предсказывают не только успех в путешествии, но и в грядущие годы"
 agot_sailing.1010.a.failure.t: "Дурное предзнаменование!"
 agot_sailing.1010.a.failure: "Камни предсказывают неудачу в путешествии и годы после него"
 agot_sailing.1010.b: "Не буду я тратить монеты на шарлатанство и горсть камней!"

 agot_sailing.1011.t: "Портовые яства"
 agot_sailing.1011.desc: "На утро отправления, я и [fellow_diner.GetFirstNameNoTooltip], член моей команды, идём по порту к моему судну.\n\nМы обсуждали предстоящие приключения и вдруг я [Select_CString(ROOT.Char.IsFemale, 'заметила', 'заметил')], как [fellow_diner.GetHerHis] ноздри расширились, а на лице расплылась широкая улыбка. Потянув меня за локоть, [fellow_diner.GetSheHe] идёт на запах и оказывается у импровизированного ветхого прилавка, притаившегося промеж двух портовых складов.\n\n«Поверить не могу, что это место ещё стоит! Здесь продают вкуснейший суп, который мне когда либо доводилось пробовать! То что надо перед дальним плаванием!»\n\nЯ наблюдаю за тем, как [fellow_diner.GetSheHe] нетерпеливо хватает миску и принимается уплетать ее содержимое. Мне, однако, приходится слегка замешкаться. Кухня отвратительно грязна, а вокруг стоит сбивающий с ног запах специй и пряностей. И тем не менее, [fellow_diner.GetFirstNameNoTooltip] наслаждается похлебкой... Когда еще мне доведется отведать настоящей уличной еды?"
 agot_sailing.1011.a: "Одну ложечку... Один раз живём!"
 agot_sailing.1011.a.success.t: "Похлебка невероятно вкусная!"
 agot_sailing.1011.a.success: "Похлебка была очень вкусной и сытной — то что надо перед долгим путешествием"
 agot_sailing.1011.a.too_spicy.t: "Похлебка оказалась слишком острой!"
 agot_sailing.1011.a.too_spicy: "Крупные капли пота стекают по вашему лбу — похлебка оказалась невероятно острой и неприятной"
 agot_sailing.1011.a.failure.t: "Что-то мне нехорошо..."
 agot_sailing.1011.a.failure: "Еда низкого качества оставила во рту неприятное послевкусие и непреодолимое чувство тошноты. Только этого перед отправлением и не хватало"
 agot_sailing.1011.b: "Ты в своём уме? Это не кухня, а хлев какой-то!"

 agot_sailing.1012.t: "Воздушная атака!"
 agot_sailing.1012.desc: "Прогуливаясь вдоль пирса и перебирая в уме перечень припасов, которые необходимо погрузить на борт для предстоящего путешествия, я чувствую, как мне на голову что-то падает. Подняв руку к голове, я осторожно ощупываю липкий затылок, кручу головой в тщетных попытках осознать, что же за идиот покусился на мою жизнь!\n\nРядом со мной член экипажа [laugher.GetFirstNameNoTooltip] [Select_CString(laugher.IsFemale, 'разразилась', 'разразился' )] смехом, направляясь к концу причала.\n\n«[ROOT.Char.GetTitleAsNameNoTooltip], мне кажется ваш обидчик скрывается там!»\n\nПроводив [Select_CString(laugher.IsFemale, 'её', 'его' )] жест взглядом, я наконец понимаю, что злоумышленницей является никто иная как чайка, одиноко угнездившаяся на другом конце причала. Опустив руку я осознаю, что мне на голову только что нагадили."
 agot_sailing.1012.a: "Самый смертоносный воин, которого видывал свет!"
 agot_sailing.1012.b: "Да как ты СМЕЕШЬ потешаться надо мной? Я с тебя шкуру спущу!"

 agot_sailing.1013.t: "Опытный мореход"
 agot_sailing.1013.desc: "Изучая судовую роль, я с ужасом обнаруживаю, что нам не хватает нескольких матросов, чего обычно не случается. И хотя это не скажется на предстоящей экспедиции критически, я бы [Select_CString(ROOT.Char.IsFemale, 'предпочла', 'предпочёл' )] собрать полноценный экипаж.\n\nЗаглянув в обычные злачные места в порту, я [Select_CString(ROOT.Char.IsFemale, 'услышала', 'услышал' )] о потенциальном новобранце по имени [recruit.GetFirstNameNoTooltip]. Это опытный мореход с десятками успешных плаваний. Мне наконец удаётся [recruit.GetHerHis] выследить, но к моему сожалению [recruit.GetSheHe] уже [Select_CString(recruit.IsFemale, 'нанялась', 'нанялся' )] в команду другого судна!\n\nЗаслышав ваше приближение, [recruit.GetFirstNameNoTooltip] заинтересованно поднимает бровь.\n\n«Могу ли я вам чем-то помочь?»"
 agot_sailing.1013.a: "Я хочу предложить тебе уникальную возможность..."
 agot_sailing.1013.a.success: "Вам удаётся убедить моряка присоединиться к вашей команде"
 agot_sailing.1013.a.failure: "Вам не удается убедить моряка"
 agot_sailing.1013.b: "Скажи мне, сколько тебе платят? Я [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )] удвоить сумму!"
 agot_sailing.1013.c: "У нас достаточно матросов, всё будет хорошо."

 agot_sailing.1014.t: "День на ярмарке"
 agot_sailing.1014.desc: "Я решаю пройтись по местному рынку, пока корабль загружают провиантом.\n\nТорговцы перекрикивают друг друга, пытаясь выгоднее продать свои товары. На развале представлено множество экзотических вещиц, от неизвестных мне блюд до книг на невиданных мной языках. Есть здесь и широкий ассортимент алкоголя. Команде наверняка понравится, если я вернусь с чем-то подобным!\n\nХочется ли мне прикупить что нибудь из этого?"
 agot_sailing.1014.a: "Заманчивая книженция!"
 agot_sailing.1014.a.tt: "Шансы улучшить свойство «[GetTrait('lifestyle_mariner').GetName( GetNullCharacter )]» повышаются."
 agot_sailing.1014.a.success.toast: "Вы получили дополнительный опыт свойства «[GetTrait('lifestyle_mariner').GetName( GetNullCharacter )]»"
 agot_sailing.1014.a.failure.toast: "Вы получили дополнительный опыт свойства «[GetTrait('lifestyle_mariner').GetName( GetNullCharacter )]»"
 agot_sailing.1014.b: "Передайте выпивку! [ROOT.Char.GetFaith.HighGodName]! Мы пьём в твою честь!"
 agot_sailing.1014.c: "Апельсины? Занятный фрукт!"
 agot_sailing.1014.d: "Карта сокровищ? Что я смогу там найти?"
 agot_sailing.1014.d.tt.success.toast: "Вы получили настоящую карту сокровищ"
 agot_sailing.1014.d.tt.failure.toast: "Вы получили фальшивую карту сокровищ"
 agot_sailing.1014.e: "Мне ничего не нужно, спасибо."

 agot_sailing.1015.t: "Старый нищий"
 agot_sailing.1015.desc: "Когда я и [dockyard_guest.GetFirstName] прогуливались по гавани в провинции [location.GetName], к нам подошёл старый нищий. «Собираетесь отплыть в великий океан, [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой' )] [ROOT.Char.GetTitleAsNameNoTooltip|l]?» - хрипло говорит старик, - «В свое время я проводил на борту больше времени, чем на суше... за несколько монет я мог бы научить кое-каким морским хитростям...?»\n\n[ROOT.Char.Custom2('direct_address_by_familiarity', dockyard_guest)|U] встаёт между нами. «Попрошайничество запрещено законом, и этот старый окунь это знает. Прогоните его, [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой' )] [ROOT.Char.GetTitleAsNameNoTooltip|l]!»"
 agot_sailing.1015.a: "Что ж, давай послушаем, стоят ли твои хитрости платы."
 agot_sailing.1015.b: "[dockyard_guest.GetFirstNameNoTooltip] [Select_CString(dockyard_guest.IsFemale, 'права', 'прав' )]. Собирай вещи и проваливай."
 agot_sailing.1015.c: "Ему нечему меня научить. Мы отправимся в путь."

 agot_sailing.1016.t: "На корабль?"
 agot_sailing.1016.desc: "«Я #italic нечасто#! плавал на лодках!»\n\nСпор между двумя портовыми рабочими привлёк внимание многих; гавань во владении [location.GetName] умолкла при виде этого зрелища.\n\n«Нет, то, на чём ты плавал, - это не на лодках. Ты не можешь #bold не #italic быть#!#! на лодке!» От такого несогласия у меня разинут рот, и я начинаю размышлять о сложности самой жизни. Кто эти глупые портовые рабочие и о чём именно они спорят?"
 agot_sailing.1016.a: "Это просто глупо."
 agot_sailing.1016.b: "Нет, нет, в его словах есть резон!"
 agot_sailing.1016.b.tt: "Может ли смерть быть лодкой?"

 agot_sailing.1990.t: "Первый помощник"
 agot_sailing.1990.desc: "Прежде чем отправиться в плавание, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] выбрать своего первого помощника — того, кто будет рядом со мной в открытом море и разделит бремя командования.\n\nСегодня здесь собрались члены семьи, друзья и опытные моряки. Некоторые из них обладают явными морскими навыками, в то время как другие находятся здесь из-за лояльности, расположения или амбиций. Каждый может служить по-своему, как только мы окажемся за пределами безопасного порта."
 agot_sailing.1990.a: "Ты станешь моим первым помощником!"

 agot_sailing.1991.t: "В великий океан"
 agot_sailing.1991.desc: "Когда корабль выходит из порта, мне на глаза попадаются [host.GetTitledFirstNameNicknamed] и [host.GetHerHis] [Select_CString(first_mate.IsFemale, 'первая помощница', 'первый помощник' )], [first_mate.GetFirstName] — их взгляды прикованы к горизонту, когда начинается наше приключение."
 agot_sailing.1991.a: "Мне не терпится увидеть, на кого мы охотимся!"
 agot_sailing.1991.b: "Это будет хороший набег!"
 agot_sailing.1991.c: "Нас ждут тайны древней Валирии..."
 agot_sailing.1991.d: "Затонувшие сокровища будут нашими!"

 agot_sailing.2001.t: "Приглашение сыграть в кости"
 agot_sailing.2001.desc: "Когда я иду по главной палубе корабля, я слышу звуки толпы, доносящиеся снизу. Все матросы на палубе, не находящиеся на вахте, собрались вокруг стола, и среди паров дыма и выпивки идёт оживленная игра в кости.\n\n«Подходите, капитан, - зовет [first_mate.GetFirstName], - мы покажем вам, как это делается!».\n\nИз толпы раздается крик «Не оставляйте [ROOT.Char.GetHerHis] без золота, часть из него - моё жалованье!», за которым следует рев смеха."
 agot_sailing.2001.a: "Конечно! Я сыграю в кости!"
 agot_sailing.2001.b: "Вы не поймаете меня на азартных играх!"
 agot_sailing.2001.c: "Это возможность получше узнать мою команду."

 agot_sailing.2002.t: "Корабль в беде"
 agot_sailing.2002.desc: "Во время путешествия вдоль берега недалеко от порта один из моих дозорных кричит, что заметил местное судно, барахтающееся вдалеке.\n\nДаже отсюда видно, что судно повреждено бурным морем или налётчиками, его команда едва держит его на плаву, когда они носятся по палубе, пытаясь сделать ремонт. Очевидно, что они находятся в уязвимом положении и нуждаются в помощи."
 agot_sailing.2002.a: "Остановиться и попытаться им помочь!"
 agot_sailing.2002.a.tt_success: "Вы спасаете экипаж"
 agot_sailing.2002.a.tt_failure: "Корабль тонет вместе с командой и грузом"
 agot_sailing.2002.b: "Мы можем сохранить добычу, если убьём выживших..."
 agot_sailing.2002.b.tt_success: "Вы атакуете лодку и убиваете её команду"
 agot_sailing.2002.b.tt_failure: "Вы атакуете лодку, но получаете ранение в суматохе"
 agot_sailing.2002.c: "Просто проплывём мимо."

 agot_sailing.2003.t: "Левиафан"
 agot_sailing.2003.desc: "Я глубоко вдыхаю, пока иду по палубе, бодрящий морской ветер и соленый воздух бьют мне в лицо. Сегодня прекрасный день для отплытия!\n\nКороткое путешествие было волнующим изменением темпа жизни при дворе, когда мы замечаем его: далекий шлейф воды, за которым следует небольшой островок винно-тёмной плоти, выкатывающийся из волны.\n\nОдин из величайших зверей всех глубин.\n\nКит!"
 agot_sailing.2003.a: "Несите гарпуны!"
 agot_sailing.2003.a.tt_success: "Вы забиваете кита и вытаскиваете его на берег"
 agot_sailing.2003.a.tt_failure: "Зверь убегает от вас"
 agot_sailing.2003.b: "Пусть этим занимаются другие, только принесите мне тушу."
 agot_sailing.2003.c: "Какая #EMP славная#! добыча!"
 agot_sailing.2003.c.tt: "Вы сталкиваетесь с #EMP истинным#! левиафаном глубин"
 agot_sailing.2003.c.tt_success: "$agot_sailing.2003.a.tt_success$"
 agot_sailing.2003.c.tt_failure: "$agot_sailing.2003.a.tt_failure$"
 agot_sailing.2003.d: "Существо с устрашающим величием, оставить его."
 agot_sailing.2003.d.tt: "Кит свободно уплывает."

 agot_sailing.2004.t: "Битва в открытом море"
 agot_sailing.2004.desc: "Когда мы плывем по широко открытому Белегаэру, море кажется спокойным и чистым. Когда я стою на палубе, греясь в лучах солнца, тишину разрывает крик.\n\n«Капитан!» - кричит мой первый помощник. «Неизвестный корабль приближается к нам на большой скорости!»\n\nБыстро подбегая к перилам своего корабля, я осматриваю горизонт, прежде чем, наконец, заметить быстро приближающуюся темную фигуру. Видно, что это такое - пиратский корабль. Они скоро будут над нами. Должны ли мы сражаться или бежать?"
 agot_sailing.2004.a: "Пусть приходят!"
 agot_sailing.2004.a.success: "Вы отбиваетесь от пиратов"
 agot_sailing.2004.a.failure: "Пираты разграбили ваши ценности"
 agot_sailing.2004.b: "Поднять паруса!"

 agot_sailing.2005.t: "Матрос за бортом!"
 agot_sailing.2005.desc: "Теперь далеко в море бурные волны качают нас взад и вперед. Иногда трудно удержаться на ногах, но выполнимо.\n\nВнезапно раздается панический голос, и, крутясь, вы замечаете, как один из ваших матросов падает с края! Бросившись в сторону, вы видите, как его голова пробивается сквозь поверхность, разбрасываемая волнами.\n\nВы должны действовать быстро, иначе он непременно погибнет в губительных глубинах."
 agot_sailing.2005.a: "Держись, я иду!"
 agot_sailing.2005.a.tt_success: "Вы спасаете члена экипажа"
 agot_sailing.2005.a.tt_failure: "Вы не смогли спасти члена экипажа"
 agot_sailing.2005.b: "Ты, хватай эту палку! Ты, готовь шлюп!"
 agot_sailing.2005.b.tt_success: "Ваша попытка спасения удалась"
 agot_sailing.2005.b.tt_failure: "Ваша попытка спасения не удалась"
 agot_sailing.2005.c: "Слишком поздно - задраить люки!"

 agot_sailing.2006.t: "Игра в карты"
 agot_sailing.2006.desc: "Когда я удаляюсь в свою каюту на ночь, я слышу звуки толпы, доносящиеся с нижней палубы. Все матросы с палубы, не находящиеся на вахте, собрались за столом, и на фоне паров дыма и выпивки идет оживлённая игра в карты.\n\n«Присоединяйтесь, капитан», - зовет [first_mate.GetFirstName]. «Мы покажем вам, как это делается!»\n\nИз толпы раздаются крики «Только не оставь [ROOT.Char.GetHerHis] без единого гроша, часть из них - моё жалование!», за которыми следует громогласный смех."
 agot_sailing.2006.a: "Освободите место, я в деле"
 agot_sailing.2006.a.tt_success: "Вы выиграли игру"
 agot_sailing.2006.a.tt_failure: "Вы теряете своё золото"
 agot_sailing.2006.b: "Итак, где же мои верные дополнительные тузы?"
 agot_sailing.2006.b.tt_success: "Ваша уловка остаётся незамеченной"
 agot_sailing.2006.b.tt_failure: "Вас поймали на попытке жульничества"
 agot_sailing.2006.c: "Продолжайте играть, ребята, я просто выпью"

 agot_sailing.2007.t: "Невыносимый разлад"
 agot_sailing.2007.desc: "Пока что путешествие проходило гладко, но я [Select_CString(ROOT.Char.IsFemale, 'начала', 'начал' )] замечать, что команда начинает ворчать. Вскоре ко мне подходит переутомлённый член экипажа. У него блестящая борода, но натруженные руки моряка, повидавшего слишком много причалов. Его голос хриплый, но его раздражение очевидно.\n\n«Это прекрасная команда, да, и они трудолюбивы. Они просто жаждут углубиться в Эссос, а не в наш текущий рейс. Их желание идти дальше придало некоторым ребятам немного энергии».\n\nЯ знаю, что он говорит правду, но команде нет оправдания. При посадке им показали свитки с маршрутом корабля, и они должны знать, что мы не посетим дальний Эссос, пока не наберёмся опыта. Если что-то не будет сделано, я боюсь, что команда может взбунтоваться!"
 agot_sailing.2007.a: "Проинструктировать команду двигаться вперёд."
 agot_sailing.2007.a.tt_success: "Команда преодолевает свои желания"
 agot_sailing.2007.a.tt_failure: "Когда будет остальная часть Эссоса?"

 agot_sailing.2008.t: "Спокойствие моря"
 agot_sailing.2008.desc: "Вот уже несколько дней мы не ощущаем ни малейшего дуновения ветра, наполняющего наши паруса. Я вижу, что команда становится беспокойной, но я не знаю, что с этим делать. [first_mate.GetFirstName] просится ко мне в каюту, с серьёзным выражением лица.\n\n«Капитан, люди обеспокоены. Они говорят, [ROOT.Char.GetFaith.WaterGodName] гневается на нас, нам нужно сделать подношения, чтобы умилостивить [ROOT.Char.GetFaith.WaterGodHerHis]».\n\nВсё это звучит, как чепуха, но подобный жест должен повысить боевой дух."
 agot_sailing.2008.a: "Ладно, воздадим [ROOT.Char.GetFaith.WaterGodHerHim] золото и молитвы..."
 agot_sailing.2008.b: "И слышать больше ничего не хочу, подождём ветра!"
 agot_sailing.2008.c: "Объяснить команде, что [ROOT.Char.GetFaith.WaterGodName] не управляет ветрами."

 agot_sailing.2009.t: "Звезды сияют одинаково"
 agot_sailing.2009.desc: "Уже ночь, когда я выхожу из своей каюты. На палубе непривычно тихо. Я вижу, как один из членов моей команды спокойно сидит, подняв свои глаза к звёздам.\n\n«Тихая ночь, не так ли?»\n\n[stargazer.GetSheHe|U] в изумлении поворачивается ко мне. «Капитан! Простите, я не [Select_CString(stargazer.IsFemale, 'обратила', 'обратил' )] внимания... до того, как я [Select_CString(stargazer.IsFemale, 'попала', 'попал' )] сюда, я никогда по-настоящему не [Select_CString(stargazer.IsFemale, 'ценила', 'ценил' )] звёзды, понимаете?»\n\nЯ киваю в знак согласия, глядя на точечки света далеко вверху. «Позвольте мне рассказать вам кое-что о звёздах...»"
 agot_sailing.2009.a: "Вы можете использовать их для навигации!"
 agot_sailing.2009.a.mariner_progress: "Вы получаете опыт свойства «[GetTrait('lifestyle_mariner').GetName( GetNullCharacter )]»."
 agot_sailing.2009.a.success.toast: "Вы делитесь своими взглядами о мореплавании"
 agot_sailing.2009.b: "Они - творения [ROOT.Char.GetFaith.NightGodNamePossessive] — видите это скопление звёзд? Это..."
 agot_sailing.2009.c: "Однажды мы будем плавать среди них, как плаваем по морям."

 agot_sailing.2010.t: "Морское происшествие"
 agot_sailing.2010.desc: "Вот уже неделю на корабле только ясное небо и устойчивый ветер, плавание проходит легко, а боевой дух на борту высок.\n\nВнезапный порыв ветра застаёт всех врасплох. Я слышу позади себя крик отчаяния и повернувшись, вижу, как [sailor.GetFirstNameNoTooltip] [Select_CString(sailor.IsFemale, 'растянулась', 'растянулся' )] на палубе, [sailor.GetHerHis] нога вывернута под странным углом.\n\n[first_mate.GetFirstName] находится рядом со мной, [Select_CString(first_mate.IsFemale, 'встревоженная', 'встревоженный' )], ожидая моих указаний."
 agot_sailing.2010.a: "Несите парусину и деревянные шесты, быстро!"
 agot_sailing.2010.a.success: "Вы делаете достойную работу"
 agot_sailing.2010.a.failure: "Вы делаете только хуже"
 agot_sailing.2010.b: "Оставьте [sailor.GetHerHis], [sailor.GetSheHe] в следующий раз будет менее [Select_CString(sailor.IsFemale, 'неуклюжей', 'неуклюжим' )]"
 agot_sailing.2010.c: "[first_mate.GetFirstNameNoTooltip], займись этим. Я не могу с этим справиться!"

 agot_sailing.2011.t: "Внезапный туман"
 agot_sailing.2011.desc: "Через некоторое время после выхода из порта наше судно окутывает стремительно поднимающийся туман, который, казалось бы, появился из ниоткуда. Небо затуманилось, как и океан вокруг нас, и быстро становится ясно, что нужно принимать решение.\n\nДержать ли нам курс в надежде, что туман скоро рассеется, или развернуть корабль, рискуя задержаться, но, по крайней мере, не заблудиться в тумане окончательно?"
 agot_sailing.2011.a: "Держим курс! Туман скоро рассеется..."
 agot_sailing.2011.a.success: "Вы выходите из густого тумана"
 agot_sailing.2011.a.failure: "Ваше судно затерялось в тумане"
 agot_sailing.2011.b: "Нам лучше развернуть корабль и смириться с задержкой."
 agot_sailing.2011.c: "Любой моряк знает, что туман - это не повод для страха. Полный вперёд!"

 # Ship in Danger Outcomes
 agot_sailing.2020.t: "$agot_sailing.2002.t$: Спасение команды"
 agot_sailing.2020.desc: "Вдалеке замечен ещё один корабль! Кажется, что он вот-вот затонет, и после короткого обсуждения [host.GetTitledFirstNameNicknamed] решает попытаться спасти команду тонущего судна.\n\n"
 agot_sailing.2020.desc.jerk: "Я с презрением наблюдаю, как наши моряки подводят судно достаточно близко к обломкам, чтобы бросить верёвки в бурлящую воду и вытащить всю команду обречённого судна одного за другим.\n\nКакая пустая трата нашего драгоценного времени и сил..."
 agot_sailing.2020.desc.normal: "Я с удовлетворением и изумлением наблюдаю, как наши моряки подводят судно достаточно близко к месту крушения, чтобы бросить верёвки в бурлящую воду и вытащить одного за другим всю команду обречённого судна.\n\nОни благодарят наших моряков за спасение и обещают сойти с корабля в следующем порту."
 agot_sailing.2020.a: "Отличная работа!"
 agot_sailing.2020.b: "О чём только [Select_CString(host.IsFemale, 'думала', 'думал' )] [host.GetFirstNameNoTooltip]..."
 agot_sailing.2020.c: "Это так увлекательно - наблюдать за тем, как быстро тонет корабль..."

 agot_sailing.2021.t: "$agot_sailing.2002.t$: Затерянные в море"
 agot_sailing.2021.desc: "Вдалеке замечен ещё один корабль! Похоже, он вот-вот затонет, и после короткого обсуждения [host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'решила', 'решил')] попытаться спасти команду тонущего судна.\n\nКогда мы приближаемся к обломкам, раздаётся громкий треск. Главная мачта разбитого судна рушится на остатки палубы, и к нашему ужасу, весь корабль разрывается на части и поглощается голодными волнами.\n\nСпасти удаётся лишь немногих, остальные моряки уходят на дно вместе со своим кораблём!"
 agot_sailing.2021.a: "Боги милостивые! Какая катастрофа!"
 agot_sailing.2021.b: "Море - жестокая хозяйка..."

 agot_sailing.2022.t: "$agot_sailing.2002.t$: Штурм корабля"
 agot_sailing.2022.desc: "Вдалеке замечен ещё один корабль! Похоже, он вот-вот затонет, и после короткого обсуждения [host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'решила', 'решил')] разграбить обломки, прикончив всех выживших.\n\nЯ наблюдаю, как наши моряки быстро расправляются с обессиленной командой, разбирая обломки в поисках любой добычи. Когда они возвращаются, я вижу на их лицах улыбки удачливых людей."
 agot_sailing.2022.a: "Неправедная добыча..."
 agot_sailing.2022.b: "Потеря одного человека - сокровище другого!"

 agot_sailing.2023.t: "$agot_sailing.2002.t$: Ускользнувшие"
 agot_sailing.2023.desc: "Вдалеке замечен ещё один корабль! Похоже, он вот-вот затонет, и после короткого обсуждения я наблюдаю, как моряки подводят судно ближе. [host.GetTitledFirstNameNicknamed] приказывает взять его на абордаж и завязывается схватка. Я вижу, как [host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'получила', 'получил')] ранение, прежде чем [host.GetSheHe] и моряки возвращаются с добычей, сколько смогли унести."
 agot_sailing.2023.a: "Возможно, так будет лучше."

 agot_sailing.2024.t: "$agot_sailing.2002.t$: Прохожие"
 agot_sailing.2024.desc: "Вдалеке замечен ещё один корабль! Похоже, он вот-вот затонет, но после короткого обсуждения [host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'решила', 'решил')] обойти обломки стороной.\n\nЯ наблюдаю, как наш корабль проходит мимо тонущего судна, а его команда кричит, следуя за своим кораблём в пучину."
 agot_sailing.2024.a: "Я надеюсь, что наш корабль окажется более прочным, чем их."
 agot_sailing.2024.b: "Море - жестокая хозяйка..."
 agot_sailing.2024.c: "Мы могли бы забрать их добычу..."
 agot_sailing.2024.d: "[host.GetFirstNameNoTooltip] [Select_CString(host.IsFemale, 'была права', 'был прав' )], что [Select_CString(host.IsFemale, 'прошла', 'прошёл' )] мимо."

 # The Leviathan Outcomes
 agot_sailing.2025.t: "$agot_sailing.2003.t$: Разделка зверя"
 agot_sailing.2025.desc: "Когда я прогуливаюсь по главной палубе корабля, я слышу возбуждённые крики моряков. Замечен кит!\n\n[host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'отдала', 'отдал')] приказ попытаться охотиться на огромное чудовище. Матросы готовят гарпуны, и один из снарядов пронзает спину кита. Вода вокруг окрашивается в красный цвет на мгновение, и после короткой борьбы животное обмякает.\n\nЯ наблюдаю, как матросы прикрепляют к туше ещё канаты, чтобы оттащить её к берегу для разделки."
 agot_sailing.2025.a: "Даже таких могучих зверей можно одолеть."
 agot_sailing.2025.b: "Величественная смерть — дурное знамение."

 agot_sailing.2026.t: "$agot_sailing.2003.t$: Зверь ускользает"
 agot_sailing.2026.desc: "Когда я прогуливаюсь по главной палубе корабля, я слышу возбуждённые крики моряков. Замечен кит!\n\n[host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'отдала', 'отдал')] приказ попытаться охотиться на огромное чудовище. Матросы готовят гарпуны, но ни один не попадает в цель. Вскоре кит ныряет и исчезает из виду."
 agot_sailing.2026.a: "Досадный исход!"
 agot_sailing.2026.b: "Возможно, так даже лучше..."

 agot_sailing.2027.t: "$agot_sailing.2003.t$: Поиск туши"
 agot_sailing.2027.desc: "Когда я прогуливаюсь по главной палубе корабля, я слышу возбуждённые крики моряков. Замечен кит!\n\n[host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'отдала', 'отдал')] приказ попытаться охотиться на огромное чудовище. Матросы готовят гарпуны и пускают их, пока один снаряд не попадает точно в цель. Море на мгновение окрашивается в красный цвет, но киту удаётся сломать гарпун и уйти от преследователей.\n\nПосле долгих поисков команда находит тушу, выброшенную на берег, и начинает её разделку."
 agot_sailing.2027.a: "Ему не удалось уйти от нас навсегда."

 agot_sailing.2028.t: "$agot_sailing.2003.t$: Великая добыча"
 agot_sailing.2028.desc: "Когда я прогуливаюсь по главной палубе корабля, я слышу возбуждённые крики моряков. Замечен великолепный белый кит!\n\n[host.GetTitledFirstNameNicknamed] — [Select_CString(host.IsFemale, 'опытная охотница', 'опытный охотник')], и [host.GetSheHe], без сомнения, справится с задачей. Гарпуны готовы; вверх взлетает фонтан солёной воды, выдавая местонахождение зверя. [host.GetFirstNameNoTooltip] [Select_CString(host.IsFemale, 'прицелилась', 'прицелился')] и вонзает зазубренный наконечник глубоко в плоть левиафана, крепко привязывая канат к его телу. Когда наш корабль приближается, [host.GetFirstNameNoTooltip] [Select_CString(host.IsFemale, 'вытащила', 'вытащил')] копьё и наносит смертельный удар."
 agot_sailing.2028.a: "Чудо в белом и красном!"
 agot_sailing.2028.b: "Такое величие следовало оставить в покое..."

 agot_sailing.2029.t: "$agot_sailing.2003.t$: Мимолётная глупость"
 agot_sailing.2029.desc: "Когда я прогуливаюсь по главной палубе корабля, я слышу возбуждённые крики моряков. Замечен великолепный белый кит!\n\n[host.GetTitledFirstNameNicknamed] — [Select_CString(host.IsFemale, 'опытная охотница', 'опытный охотник')], и [host.GetSheHe], без сомнения, справится с задачей. Гарпуны готовы; вверх взлетает фонтан солёной воды, выдавая местонахождение зверя. [host.GetFirstNameNoTooltip] [Select_CString(host.IsFemale, 'прицелилась', 'прицелился')], но зазубренный наконечник пролетает мимо. Левиафан издаёт глубокую печальную песнь и навсегда исчезает под водой."
 agot_sailing.2029.a: "Возможно, [host.GetFirstNameNoTooltip] не так [Select_CString(host.IsFemale, 'искусна', 'искусен')], как казалось."

 agot_sailing.2030.t: "$agot_sailing.2003.t$: Встреча со зверем"
 agot_sailing.2030.desc: "Когда я прогуливаюсь по главной палубе корабля, я слышу возбуждённые крики моряков. Замечен кит!\n\nХотя охота могла бы принести богатство, [host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'решила', 'решил')] оставить зверя в покое. Я с изумлением наблюдаю, как величественное создание проплывает мимо корабля, выпуская в воздух дыхание и фонтан солёной воды. Наконец, оно ныряет под спокойные волны и исчезает из виду."
 agot_sailing.2030.a: "Какое безмятежное зрелище!"
 agot_sailing.2030.b: "[host.GetFirstNameNoTooltip] [Select_CString(host.IsFemale, 'поступила', 'поступил')] глупо, отпустив зверя."

 # Pirates! Outcomes
 agot_sailing.2031.t: "$agot_sailing.2004.t$"
 agot_sailing.2031.desc: "Я всматриваюсь в бескрайний горизонт, как вдруг раздаются тревожные крики. Вдалеке замечен корабль, идущий прямо на нас. «Пираты!» — кричат моряки, глядя на капитана в поисках указаний.\n\n«Не волнуйтесь, ребята!» — уверенно говорит [host.GetTitledFirstNameNicknamed]. — «Им с нами не справиться!»\n\nИ действительно, после короткой схватки пираты отброшены и отступают, исчезая в бескрайнем спокойном океане."
 agot_sailing.2031.a: "И не возвращайтесь!"

 agot_sailing.2032.t: "$agot_sailing.2004.t$"
 agot_sailing.2032.desc: "Я всматриваюсь в бескрайний горизонт, как вдруг раздаются тревожные крики. Вдалеке замечен корабль, идущий прямо на нас. «Пираты!» — кричат моряки, глядя на капитана в поисках указаний.\n\n«Готовьтесь к бою!» — командует [host.GetTitledFirstNameNicknamed], обнажая клинок. Вскоре пираты уже бросаются на нас.\n\nНо после короткой схватки пираты одолевают нашу команду, грабят наши ценности и исчезают в бескрайнем океане."
 agot_sailing.2032.a: "Разрази их чума!"

 agot_sailing.2033.t: "$agot_sailing.2004.t$"
 agot_sailing.2033.desc: "Я всматриваюсь в бескрайний горизонт, как вдруг раздаются тревожные крики. Вдалеке замечен корабль, идущий прямо на нас. «Пираты!» — кричат моряки, глядя на капитана в поисках указаний.\n\n«Поднять все паруса!» — командует [host.GetTitledFirstNameNicknamed]. — «Мы уйдём от них!» И действительно, наш корабль оказывается достаточно быстрым, чтобы держать пиратское судно на безопасном расстоянии. Вскоре разбойники сдаются и исчезают за горизонтом."
 agot_sailing.2033.a: "Тост на корабле!"

 # Crewmate Overboard! Outcomes
 agot_sailing.2034.t: "$agot_sailing.2005.t$"
 agot_sailing.2034.desc: "Я стою в задумчивости у носа корабля, как вдруг внезапный крик выводит меня из оцепенения. «Человек за бортом! Человек за бортом!»\n\nЯ спешу к источнику шума и вижу, как [host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'прыгнула', 'прыгнул')] с палубы в воду. Когда [host.GetSheHe] наконец появляется, [host.GetSheHe] тащит тонущего матроса обратно к кораблю."
 agot_sailing.2034.a: "Великий подвиг!"

 agot_sailing.2035.t: "$agot_sailing.2005.t$"
 agot_sailing.2035.desc: "Я стою в задумчивости у носа корабля, как вдруг внезапный крик выводит меня из оцепенения. «Человек за бортом! Человек за бортом!»\n\nЯ спешу к источнику шума и вижу, как [host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'прыгнула', 'прыгнул')] с палубы в воду. Когда [host.GetSheHe] наконец появляется, я понимаю, что [host.GetSheHe] [Select_CString(host.IsFemale, 'вернулась', 'вернулся')] с пустыми руками..."
 agot_sailing.2035.a: "Ещё один моряк погиб..."

 agot_sailing.2036.t: "$agot_sailing.2005.t$"
 agot_sailing.2036.desc: "Я стою в задумчивости у носа корабля, как вдруг внезапный крик выводит меня из оцепенения. «Человек за бортом! Человек за бортом!»\n\nЯ спешу к источнику шума и вижу, как [host.GetTitledFirstNameNicknamed] отдаёт приказы с палубы, организуя срочное спасение. Вскоре [host.GetSheHe] втаскивает тонущего матроса обратно на борт, спасая ему жизнь."
 agot_sailing.2036.a: "Впечатляюще!"

 agot_sailing.2037.t: "$agot_sailing.2005.t$"
 agot_sailing.2037.desc: "Я стою в задумчивости у носа корабля, как вдруг внезапный крик выводит меня из оцепенения. «Человек за бортом! Человек за бортом!»\n\nЯ спешу к источнику шума и вижу, как [host.GetTitledFirstNameNicknamed] отдаёт приказы с палубы, организуя срочное спасение. Но к ужасу команды, тонущий матрос уже исчез под волнами..."
 agot_sailing.2037.a: "Досадная потеря..."

 agot_sailing.2038.t: "$agot_sailing.2005.t$"
 agot_sailing.2038.desc: "Я стою в задумчивости у носа корабля, как вдруг внезапный крик выводит меня из оцепенения. «Человек за бортом! Человек за бортом!»\n\nЯ спешу к источнику шума и вижу, как [host.GetTitledFirstNameNicknamed] отдаёт приказы с палубы. «Оставьте его! У нас нет времени на рискованные спасательные операции»."
 agot_sailing.2038.a: "Море действительно может быть жестоким..."

 # Insufferable Discord Outcomes
 agot_sailing.2040.t: "$agot_sailing.2007.t$: Конец причитаний"
 agot_sailing.2040.desc: "Плавание пока проходит хорошо, но со временем я начинаю замечать ропот среди команды. Моряки работают усердно, но некоторые из них сеют раздоры.\n\nЯ слышу одну и ту же жалобу снова и снова: «Когда мы исследуем Эссос? Мы хотим увидеть больше Эссоса!»\n\n[host.GetTitledFirstNameNicknamed] вскоре устаёт от бесконечных вопросов и убеждает команду сосредоточиться на запланированном пункте назначения."
 agot_sailing.2040.a: "Это должно их заткнуть."

 agot_sailing.2041.t: "$agot_sailing.2007.t$: Когда же Эссос?"
 agot_sailing.2041.desc: "Плавание пока проходит хорошо, но со временем я начинаю замечать ропот среди команды. Моряки работают усердно, но некоторые из них сеют раздоры.\n\nЯ слышу одну и ту же жалобу снова и снова: «Когда мы исследуем Эссос? Мы хотим увидеть больше Эссоса!»\n\n[host.GetTitledFirstNameNicknamed] тоже [Select_CString(host.IsFemale, 'раздражена', 'раздражён')], но приказывает команде не обращать внимания на нытьё и игнорировать раздоры."
 agot_sailing.2041.a: "Когда же закончатся эти вопросы?"

 # Becalmed Mood Outcomes
 agot_sailing.2042.t: "$agot_sailing.2008.t$: Жертвоприношение"
 agot_sailing.2042.desc: "Уже несколько дней мы не чувствуем ни малейшего дуновения ветра, чтобы наполнить наши паруса. Я вижу, что команда становится беспокойной, но я не знаю, что можно сделать.\n\n[host.GetTitledFirstNameNicknamed] разговаривает с первым помощником, который пытается убедить капитана принести жертву богам, чтобы они даровали кораблю новый ветер. И действительно, [host.GetFirstNameNoTooltip] [Select_CString(host.IsFemale, 'согласилась', 'согласился')] на это предложение, и делается подношение."
 agot_sailing.2042.a: "Надеюсь, это поможет..."

 agot_sailing.2043.t: "$agot_sailing.2008.t$: Ожидание"
 agot_sailing.2043.desc: "Уже несколько дней мы не чувствуем ни малейшего дуновения ветра, чтобы наполнить наши паруса. Я вижу, что команда становится беспокойной, но я не знаю, что можно сделать.\n\n[host.GetTitledFirstNameNicknamed] разговаривает с первым помощником, который пытается убедить капитана принести жертву богам, чтобы они даровали кораблю новый ветер. Но [host.GetFirstName] [Select_CString(host.IsFemale, 'покачала', 'покачал')] головой на это предложение. «Я больше не хочу слушать эту чушь! Мы будем ждать, пока ветер сам нас найдёт»."
 agot_sailing.2043.a: "Надеюсь, мы не застряли здесь..."

 agot_sailing.2044.t: "$agot_sailing.2008.t$: Благочестивый урок"
 agot_sailing.2044.desc: "Уже несколько дней мы не чувствуем ни малейшего дуновения ветра, чтобы наполнить наши паруса. Я вижу, что команда становится беспокойной, но я не знаю, что можно сделать.\n\n[host.GetTitledFirstNameNicknamed] разговаривает с первым помощником, который пытается убедить капитана принести жертву богам, чтобы они даровали кораблю новый ветер. Но [host.GetFirstName] [Select_CString(host.IsFemale, 'покачала', 'покачал')] головой на это предложение и пытается объяснить команде, что никакое морское божество не повелевает ветрами."
 agot_sailing.2044.a: "Мудро ли это?"

 # Sailing Accident Outcomes
 # Available scopes: host, first_mate, sailor (who broke their leg)
 agot_sailing.2045.t: "$agot_sailing.2010.t$"
 agot_sailing.2045.desc: "Уже несколько дней стоит ясная погода и ровный ветер, плавание проходит легко, и настроение команды на высоте.\n\nКогда внезапный порыв ветра наконец приходит, он застаёт всех врасплох. Я слышу крик о помощи неподалёку, оборачиваюсь и вижу, что [sailor.GetFirstName] [Select_CString(sailor.IsFemale, 'распростёрлась', 'распростёрся')] на палубе, с ногой, вывернутой под неестественным углом. [host.GetTitledFirstNameNicknamed] стоит на коленях рядом с [Select_CString(sailor.IsFemale, 'пострадавшей морячкой', 'пострадавшим моряком')], пытаясь вправить ногу.\n\nС неприятным хрустом нога возвращается в более естественное положение, почти мгновенно облегчая боль матроса."
 agot_sailing.2045.a: "Отлично, капитан!"

 agot_sailing.2046.t: "$agot_sailing.2010.t$"
 agot_sailing.2046.desc: "Уже несколько дней стоит ясная погода и ровный ветер, плавание проходит легко, и настроение команды на высоте.\n\nКогда внезапный порыв ветра наконец приходит, он застаёт всех врасплох. Я слышу крик о помощи неподалёку, оборачиваюсь и вижу, что [sailor.GetFirstName] [Select_CString(sailor.IsFemale, 'распростёрлась', 'распростёрся')] на палубе, с ногой, вывернутой под неестественным углом. [host.GetTitledFirstNameNicknamed] стоит на коленях рядом с [Select_CString(sailor.IsFemale, 'пострадавшей морячкой', 'пострадавшим моряком')], пытаясь вправить ногу.\n\nС неприятным хрустом нога поворачивается, но болезненные крики матроса показывают, что капитан [Select_CString(host.IsFemale, 'сделала', 'сделал' )] лишь хуже..."
 agot_sailing.2046.a: "О нет!"

 agot_sailing.2047.t: "$agot_sailing.2010.t$"
 agot_sailing.2047.desc: "Уже несколько дней стоит ясная погода и ровный ветер, плавание проходит легко, и настроение команды на высоте.\n\nКогда внезапный порыв ветра наконец приходит, он застаёт всех врасплох. Я слышу крик о помощи неподалёку, оборачиваюсь и вижу, что [sailor.GetFirstName] [Select_CString(sailor.IsFemale, 'распростёрлась', 'распростёрся')] на палубе, с ногой, вывернутой под неестественным углом. [host.GetTitledFirstNameNicknamed] стоит над [Select_CString(sailor.IsFemale, 'пострадавшей морячкой', 'пострадавшим моряком')] с недовольным выражением на лице. «В следующий раз будь осторожнее! Океан — не место для неуклюжих моряков...»"
 agot_sailing.2047.a: "Жёсткие, но правдивые слова."

 agot_sailing.2048.t: "$agot_sailing.2010.t$"
 agot_sailing.2048.desc: "Уже несколько дней стоит ясная погода и ровный ветер, плавание проходит легко, и настроение команды на высоте.\n\nКогда внезапный порыв ветра наконец приходит, он застаёт всех врасплох. Я слышу крик о помощи неподалёку, оборачиваюсь и вижу, что [sailor.GetFirstName] [Select_CString(sailor.IsFemale, 'распростёрлась', 'распростёрся')] на палубе, с ногой, вывернутой под неестественным углом. [host.GetTitledFirstNameNicknamed] стоит рядом с [Select_CString(sailor.IsFemale, 'пострадавшей морячкой', 'пострадавшим моряком')] с ошеломлённым выражением на лице. Вскоре прибывает [first_mate.GetName], и наш капитан приказывает [first_mate.GetHerHim] разобраться с ситуацией..."
 agot_sailing.2048.a: "Надеюсь, ногу можно вправить."

 # Sudden Fog Outcomes
 agot_sailing.2049.t: "$agot_sailing.2011.t$: Побег"
 agot_sailing.2049.desc: "Вскоре после выхода из порта наш корабль окутывает пелена быстро поднимающегося тумана, который словно возникает из ниоткуда. Небо скрыто, как и океан вокруг нас. Вскоре становится ясно, что нужно что-то делать.\n\n[host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'решила', 'решил')] сохранить курс, надеясь выбраться из тумана, не сбившись с пути. И действительно, риск оправдывается, туман начинает рассеиваться, и корабль возвращается на нужный курс."
 agot_sailing.2049.a: "Какая удача!"

 agot_sailing.2050.t: "$agot_sailing.2011.t$: Заблудившиеся"
 agot_sailing.2050.desc: "Вскоре после выхода из порта наш корабль окутывает пелена быстро поднимающегося тумана, который  словно возникает из ниоткуда. Небо скрыто, как и океан вокруг нас. Вскоре становится ясно, что нужно что-то делать.\n\n[host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'решила', 'решил')] сохранить курс, надеясь выбраться из тумана, не сбившись с пути. Но даже после многих часов плавания туман, кажется, бесконечен..."
 agot_sailing.2050.a: "Выпустит ли он нас когда-нибудь?"

 agot_sailing.2051.t: "$agot_sailing.2011.t$: Разворот"
 agot_sailing.2051.desc: "Вскоре после выхода из порта наш корабль окутывает пелена быстро поднимающегося тумана, который словно возникает из ниоткуда. Небо скрыто, как и океан вокруг нас. Вскоре становится ясно, что нужно что-то делать.\n\n[host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'решила', 'решил')] развернуть корабль, чтобы избежать опасности сбиться с курса. Это, несомненно, вызовет задержку, но по крайней мере мы не заблудимся в тумане на несколько дней."
 agot_sailing.2051.a: "Мудрое решение!"

 agot_sailing.2052.t: "$agot_sailing.2011.t$: Манёвр"
 agot_sailing.2052.desc: "Вскоре после выхода из порта наш корабль окутывает пелена быстро поднимающегося тумана, который словно возникает из ниоткуда. Небо скрыто, как и океан вокруг нас. Вскоре становится ясно, что нужно что-то делать.\n\n[host.GetTitledFirstNameNicknamed] — бывалый мореход, и [host.GetSheHe] не проявляет признаков беспокойства. «Истинному моряку нечего бояться тумана», — заявляет [host.GetSheHe]. «Держим курс, прямо вперёд! Туман скоро рассеется»."
 agot_sailing.2052.a: "Надеюсь, вы правы."

 agot_sailing.2100.t: "Расслабляющий бриз"
 agot_sailing.2100.desc: "Морской ветер нежно ласкает мои волосы, когда я стою на самом переднем крае нашего корабля, наслаждаясь атмосферой. #italic Вот зачем я [Select_CString(ROOT.Char.IsFemale, 'отправилась', 'отправился' )] в это путешествие!#! - думаю я про себя. Я редко чувствую себя [Select_CString(ROOT.Char.IsFemale, 'такой... расслабленной', 'таким... расслабленным' )].\n\nЯ на мгновение закрываю глаза и позволяю своим мыслям блуждать, концентрируясь только на шуме разбивающихся волн, легком покачивании досок под ногами и слабых криках чаек с близлежащих берегов. Да. Это... это оно."
 agot_sailing.2100.a: "Я чувствую, как моё напряжение отступает..."

 agot_sailing.2101.t: "Момент для беседы"
 agot_sailing.2101.opening: "Когда наше судно проплывает мимо большого города со значительным маяком вдали, большинство пассажиров любуются видом. [woo_target.GetFirstName] [Select_CString(woo_target.IsFemale, 'прислонилась', 'прислонился' )] рядом: сейчас идеальный момент для непринужденной беседы."
 agot_sailing.2101.married: "Я подхожу, пока [woo_target.GetHerHis] [woo_target.GetPrimarySpouse.GetWifeHusband], [woo_target.GetPrimarySpouse.GetTitledFirstName], [Select_CString(woo_target.GetPrimarySpouse.IsFemale, 'отвлечена', 'отвлечён' )]."
 agot_sailing.2101.married_absent: "[woo_target.GetHerHis|U] [woo_target.GetPrimarySpouse.GetWifeHusband], [woo_target.GetPrimarySpouse.GetTitledFirstName], находится так далеко..."
 agot_sailing.2101.currentspouse: "Возможно, сегодня я одержу победу над [Select_CString(woo_target.IsFemale, 'своей женщиной', 'своим мужчиной' )]!"
 agot_sailing.2101.desc: "\n\n«Ах, [woo_target.GetTitledFirstName], это редкая возможность поболтать в тесноте морского судна. Надеюсь, вы находите удовольствие в этом чудесном путешествии», - говорю я непринужденным тоном.\n\nЯ абсолютно [Select_CString(ROOT.Char.IsFemale, 'уверена', 'уверен' )], что [woo_target.GetHerHis] улыбка несет в себе нечто большее, чем простая вежливость."
 agot_sailing.2101.a: "Нет ничего лучше, чем плавание по открытым водам!"
 agot_sailing.2101.a.tt: "#F Воззвать к активной стороне персонажа [woo_target.GetFirstNameNoTooltip].#!"
 agot_sailing.2101.b: "Увидеть чудеса мира с друзьями - значит жить по-настоящему."
 agot_sailing.2101.b.tt: "#F Воззвать к социальной стороне персонажа [woo_target.GetFirstNameNoTooltip].#!"
 agot_sailing.2101.c: "Иногда мне жаль трудолюбивых моряков."
 agot_sailing.2101.c.tt: "#F Воззвать к сострадательности персонажа [woo_target.GetFirstNameNoTooltip].#!"
 agot_sailing.2101.d: "Если бы я [Select_CString(ROOT.Char.IsFemale, 'была', 'был' )] достаточно [Select_CString(ROOT.Char.IsFemale, 'умелой', 'умелым' )], я бы [Select_CString(ROOT.Char.IsFemale, 'помогла', 'помог' )] удержать корабль на плаву."
 agot_sailing.2101.d.tt: "#F Воззвать к усердию персонажа [woo_target.GetFirstNameNoTooltip].#!"
 agot_sailing.2101.e: "Богатства океана могут прокормить целые города, если понадобится."
 agot_sailing.2101.e.tt: "#F Возввать к хозяйственности персонажа [woo_target.GetFirstNameNoTooltip].#!"
 agot_sailing.2102.reply_sailor: "«$agot_sailing.2101.a$»\n\n"
 agot_sailing.2102.reply_socialite: "«$agot_sailing.2101.b$»\n\n"
 agot_sailing.2102.reply_pity: "«$agot_sailing.2101.c$»\n\n"
 agot_sailing.2102.reply_wastrel: "«$agot_sailing.2101.d$»\n\n"
 agot_sailing.2102.reply_steward: "«$agot_sailing.2101.e$»\n\n"
 agot_sailing.2102.opening: "[woo_actor.GetTitledFirstName] подходит ко мне, когда наш корабль проплывает мимо большого города с величавым маяком вдалеке, отвлекая большинство других пассажиров.\n\n[woo_actor.GetSheHe|U] на мгновение задумывается, прежде чем предложить:"
 agot_sailing.2102.sailor: "$agot_sailing.2102.reply_sailor$Я не могу отрицать, что волнение, действие - это радость."
 agot_sailing.2102.socialite: "$agot_sailing.2102.reply_socialite$Я знаю символизм, на который [woo_actor.GetSheHe] намекает."
 agot_sailing.2102.pity: "$agot_sailing.2102.reply_pity$Возможно, [woo_actor.GetSheHe] отличается от остальных."
 agot_sailing.2102.wastrel: "$agot_sailing.2102.reply_wastrel$Это [Select_CString(woo_actor.IsFemale, 'женщина, которая', 'мужчина, который' )] собирается добиться успеха."
 agot_sailing.2102.steward: "$agot_sailing.2102.reply_steward$В упорядоченности природы есть своя красота."
 agot_sailing.2102.fallback: "Мне трудно придумать, что ответить."
 agot_sailing.2102.a: "Я не могу отрицать, что [woo_actor.GetSheHe] обладает определенным шармом..."
 intent_sailing_conversation: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'проявили', Select_CString(TARGET_CHARACTER.IsFemale, 'проявила', 'проявил' ))] к [Select_CString(CHARACTER.IsLocalPlayer, '', 'персонажу ' )][CHARACTER.GetShortUINamePossessive][Select_CString(CHARACTER.IsLocalPlayer, 'ему персонажу', '' )] больше интереса, чем к беседе во время совместного морского путешествия."

 agot_sailing.2103.sailor: "$agot_sailing.2102.reply_sailor$\n\nЯ не могу удержаться от того, чтобы не поморщиться..."
 agot_sailing.2103.socialite: "$agot_sailing.2102.reply_socialite$\n\nТакое высокомерие..."
 agot_sailing.2103.pity: "$agot_sailing.2102.reply_pity$\n\nНаучитесь принимать комплименты!"
 agot_sailing.2103.wastrel: "$agot_sailing.2102.reply_wastrel$\n\n"
 agot_sailing.2103.steward: "$agot_sailing.2102.reply_steward$\n\n"
 agot_sailing.2103.fallback: "[woo_actor.GetSheHe|U] просто улыбается мне со знанием дела, заставляя меня чувствовать себя #EMP очень#! неловко."
 agot_sailing.2103.a: "Что за [Select_CString(woo_actor.IsFemale, 'нелепая женщина', 'нелепый мужчина' )]."

 agot_sailing.2104.reply: "Похоже, [woo_target.GetTitledFirstName] тепло [Select_CString(woo_target.IsFemale, 'отреагировала', 'отреагировал' )] на мой гамбит"
 agot_sailing.2104.sailor: "$agot_sailing.2104.reply$, глаза горят, а [woo_target.GetSheHe] энергично кивает."
 agot_sailing.2104.socialite: "$agot_sailing.2104.reply$ и, кажется, [Select_CString(woo_target.IsFemale, 'посмотрела', 'посмотрел' )] на меня по-новому."
 agot_sailing.2104.pity: "$agot_sailing.2104.reply$, сетуя на несправедливое распределение труда в наше время."
 agot_sailing.2104.wastrel: "$agot_sailing.2104.reply$, явно [Select_CString(woo_target.IsFemale, 'удивленная', 'удивленный' )] тем, что [Select_CString(woo_target.IsFemale, 'нашла', 'нашел' )] родственную душу."
 agot_sailing.2104.steward: "$agot_sailing.2104.reply$, радуясь, что [Select_CString(woo_target.IsFemale, 'нашла', 'нашел' )] [Select_CString(ROOT.Char.IsFemale, 'ту', 'того' )], кто тоже находит радость в подобных вещах."
 agot_sailing.2104.fallback: "$agot_sailing.2104.reply$, долго и глубоко глядя мне в глаза."
 agot_sailing.2104.desc: "\n\nКогда [woo_target.GetSheHe] уходит, напряжение чувствуется в каждой любезности - я [Select_CString(ROOT.Char.IsFemale, 'знала', 'знал' )], что найду нужные слова, чтобы покорить [woo_target.GetHerHis]!"
 agot_sailing.2104.a: "Кажется, [woo_target.GetSheHe] у меня на крючке..."

 agot_sailing.2105.reply: "Похоже, [woo_target.GetTitledFirstName] не [Select_CString(woo_target.IsFemale, 'впечатлена', 'впечатлен' )] моим ответом"
 agot_sailing.2105.sailor: "$agot_sailing.2105.reply$, так как [woo_target.GetSheHe] избегает моего взгляда, когда [woo_target.GetSheHe] благодарит меня и быстро уходит."
 agot_sailing.2105.socialite: "$agot_sailing.2105.reply$, так как [woo_target.GetSheHe] пренебрежительно закатывает глаза."
 agot_sailing.2105.pity: "$agot_sailing.2105.reply$, так как [woo_target.GetSheHe] быстро теряет интерес, сдувшись от моих слов."
 agot_sailing.2105.wastrel: "$agot_sailing.2105.reply$, так как [woo_target.GetSheHe] словно [Select_CString(woo_target.IsFemale, 'остекленела', 'остекленел' )] и, кажется, [Select_CString(woo_target.IsFemale, 'слушала', 'слушал' )] лишь вполуха."
 agot_sailing.2105.steward: "$agot_sailing.2105.reply$, так как [woo_target.GetSheHe] словно [Select_CString(woo_target.IsFemale, 'остекленела', 'остекленел' )] и, кажется, [Select_CString(woo_target.IsFemale, 'слушала', 'слушал' )] лишь вполуха."
 agot_sailing.2105.fallback: "$agot_sailing.2105.reply$, так как [woo_target.GetSheHe] побыстрее хочет покинуть мою компанию."
 agot_sailing.2105.desc: "\n\nСтоя в одиночестве после [woo_target.GetHerHis] прощания, я не могу не чувствовать себя [Select_CString(ROOT.Char.IsFemale, 'дурой', 'дураком' )] за такую оплошность..."
 agot_sailing.2105.a: "О чём я только [Select_CString(ROOT.Char.IsFemale, 'думала', 'думал' )]...?"

 agot_sailing.2201.t: "Настоящий приз"
 agot_sailing.2201.desc: "Когда мы выходим из порта в открытые воды, я из укрытия наблюдаю за тем, как [ROOT.Char.Custom2('DescriptorNegative', murder_target)] [murder_target.GetTitledFirstName] стоит у грот-мачты корабля, не обращая внимания на меня.\n\n"
 agot_sailing.2201.agent: "[murder_schemer.GetTitledFirstName] не присутствует здесь, но это может быть та возможность, которую мы ждали.\n\n"
 agot_sailing.2201.a: "Сегодня как раз такой день."
 sailing_murder_accomplice_tt: "[THIS.Char.GetShortUIName|U] [Select_CString( THIS.Char.IsLocalPlayer, 'попытаетесь', 'попытается')] убить персонажа [murder_target.GetShortUIName]"

 agot_sailing.2202.opening: "Я [Select_CString(ROOT.Char.IsFemale, 'провела', 'провел' )] много дней, наблюдая за тем, как [murder_target.GetTitledFirstName] занимается повседневными делами на корабле. Наконец наступает особенно туманный вечер, и я [Select_CString(ROOT.Char.IsFemale, 'уверена', 'уверен' )], что моя жертва находится одна в своей каюте.\n\n"
 agot_sailing.2202.desc: "Войдя в неё, я вижу, что [murder_target.GetSheHe] крепко спит в своей постели."
 agot_sailing.2202.a: "Одним взмахом кинжала я навсегда избавлюсь от н[murder_target.GetHerHis]!"
 agot_sailing.2202.a.tt: "#EMP Я не [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] упускать прекрасную возможность, которая представилась...#!"
 agot_sailing.2202.b: "Нет, не стоит рисковать..."
 agot_sailing.2202.b.tt: "#EMP Что, если [murder_target.GetSheHe] [Select_CString(murder_target.IsFemale, 'должна', 'должен' )] жить?#!"
 sailing_kill_murder_missed: "[murder_target.GetFirstNameOrMeNoTooltip] оказывается [Select_CString(murder_target.IsFemale, 'везучей', 'везучим' )]"
 sailing_kill_murder_injured: "[murder_target.GetFirstNameOrMeNoTooltip] «случайно» [Select_CString(murder_target.IsFemale, 'ранена', 'ранен' )]"
 sailing_kill_murder_killed: "[murder_target.GetFirstNameOrMeNoTooltip] «трагически» [Select_CString(murder_target.IsFemale, 'погибла', 'погиб' )]"
 sailing_kill_murder_escape: "[murder_target.GetFirstNameOrMeNoTooltip] скрывается"
 sailing_target_attendee_killed_tt: "@death_icon![murder_target.GetShortUIName] [Select_CString( murder_target.IsLocalPlayer, 'умираете', 'умирает')]"
 sailing_target_attendee_injured_chance_tt: "[murder_target.GetShortUIName] [Select_CString( murder_target.IsLocalPlayer, 'можете', 'может')] получить ранение"

 agot_sailing.2203.desc: "Я делаю шаг так быстро, как только могу, и оказываюсь рядом с кроватью, на которой спит [murder_target.GetTitledFirstName]. В тот момент, когда я достаю кинжал, я вижу, что [murder_target.GetSheHe] [Select_CString(murder_target.IsFemale, 'зашевелилась', 'зашевелился' )]."
 agot_sailing.2203.agent: "[abduct_schemer.GetFirstName] рассчитывает на меня, я не хочу [Select_CString(abduct_schemer.IsFemale, 'её', 'его' )] подвести..."
 agot_sailing.2203.success: "\n\n«[ROOT.Char.GetFirstNameNoTooltip]?! Что в-» [murder_target.GetFirstNameNoTooltip] падает обратно на кровать, а мой кинжал глубоко вонзается в [murder_target.GetHerHis] сердце.\n\nДело сделано ещё до того, как [murder_target.GetSheHe] успевает произнести свои последние слова, и я быстро заметаю следы, выбрасывая тело за борт через единственное окно каюты."
 agot_sailing.2203.failure: "\n\n«[ROOT.Char.GetFirstNameNoTooltip]?! Выродок!» [murder_target.GetFirstNameNoTooltip] каким-то образом умудряется откатиться в сторону, когда мой кинжал бьет вперед. Затем [murder_target.GetFirstNameNoTooltip] вскарабкивается на ноги.\n\nНо [murder_target.GetSheHe] выбегает из двери каюты, пока я пытаюсь восстановить равновесие, испуганно оглядываясь через плечо, и кричит во всю мощь своих легких. Я не успею поймать [murder_target.GetHerHis]..."
 agot_sailing.2203.a: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] вернуться на палубу, пока никто не заподозрил..."
 agot_sailing.2203.b: "Проклятье! Проклятье! Проклятье!"

 agot_sailing.2204.t: "Кинжал во тьме"
 agot_sailing.2204.desc: "Уже поздний вечер, и я [Select_CString(ROOT.Char.IsFemale, 'удалилась', 'удалился' )] в свою каюту, чтобы немного отдохнуть. Когда я уже почти [Select_CString(ROOT.Char.IsFemale, 'заснула', 'заснул' )], меня напугал необычный шум за спиной. Я открываю глаза как раз вовремя, чтобы увидеть, как [murder_actor.GetTitledFirstName] стоит надо мной с занесённым над головой кинжалом, направленным на меня."
 agot_sailing.2204.success: "\n\nЯ слишком поздно замечаю, насколько [Select_CString(murder_actor.IsFemale, 'решительна', 'решителен' )] [murder_actor.GetFirstNameNoTooltip], не успеваю увернуться от [murder_actor.GetHerHis] удара и с грохотом падаю обратно на кровать, кинжал вонзается глубоко в сердце.\n\nМоё зрение затуманивается, когда я в последний раз вижу, как ухмыляется [murder_actor.GetFirstName], на [murder_actor.GetHerHis] губах играет слабая, но жестокая улыбка. «Прощай, [ROOT.Char.GetFirstNameNoTooltip]»."
 agot_sailing.2204.failure: "\n\n[murder_actor.GetFirstNameNoTooltip] пытается убить меня! Я отчаянно уворачиваюсь, получаю скользящий удар кончиком кинжала, который падает на меня, и неловко падаю на землю, но успеваю вскочить на ноги, когда [murder_actor.GetSheHe], ругаясь, теряет равновесие.\n\nЯ выбегаю из каюты, отчаянно пытаясь найти помощь у тех, кто еще не спит."
 agot_sailing.2204.a: "«Чтт-! Н-»"
 agot_sailing.2204.b: "Продолжить бежать!"
 sailing_ends_tt: "[GetActivityType('activity_agot_sailing').GetName] завершается"

 agot_sailing.2301.t: "Минутка для беседы"
 agot_sailing.2301.desc: "Солнце светит ярко, наш корабль быстро плывет по открытым водам, набирая скорость. [befriend_target.GetFirstName] стоит неподалёку: это мой шанс произвести на н[befriend_target.GetHerHis] впечатление.\n\n«[befriend_target.GetTitledFirstNameNoTooltip]! Как поживаете? Не так часто нам выпадает шанс поговорить», - начинаю я непринуждённо.\n\n[befriend_target.GetSheHe|U], кажется, [Select_CString(befriend_target.IsFemale, 'удивлена', 'удивлён' )], но не [Select_CString(befriend_target.IsFemale, 'настроена', 'настроен' )] враждебно к нашей беседе."

 agot_sailing.2302.reply_sailor: "«$agot_sailing.2101.a$»\n\n"
 agot_sailing.2302.reply_pity: "«$agot_sailing.2101.c$»\n\n"
 agot_sailing.2302.reply_wastrel: "«$agot_sailing.2101.d$»\n\n"
 agot_sailing.2302.reply_steward: "«$agot_sailing.2101.e$»\n\n"

 agot_sailing.2302.opening: "[befriend_actor.GetTitledFirstName] подходит ко мне, когда корабль мчится по мирному океану.\n\n[befriend_actor.GetSheHe|U] тепло улыбается, задумчиво произнося:"

 agot_sailing.2302.sailor: "$agot_sailing.2302.reply_sailor$Это не то утверждение, с которым я могу согласиться."
 agot_sailing.2302.pity: "$agot_sailing.2302.reply_pity$Я не могу отрицать правдивость [befriend_actor.GetHerHis] слов - это жестокая работа."
 agot_sailing.2302.wastrel: "$agot_sailing.2302.reply_wastrel$Это, безусловно, верно: все те полезные вещи, которые я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] бы делать вместо этого..."
 agot_sailing.2302.steward: "$agot_sailing.2302.reply_steward$Упорядочивание природы - это то, в чем я могу найти радость."
 agot_sailing.2302.fallback: "Я не знаю, что сказать."
 agot_sailing.2302.a: "Возможно, у нас больше общего, чем я [Select_CString(ROOT.Char.IsFemale, 'думала', 'думал' )]."

 agot_sailing.2303.opening: "[befriend_actor.GetTitledFirstName] приближается ко мне, когда наш корабль уверенно плывёт к месту назначения."
 agot_sailing.2303.sailor: "$agot_sailing.2302.reply_sailor$\n\nНе могу не согласиться..."
 agot_sailing.2303.pity: "$agot_sailing.2302.reply_pity$\n\nТакая слабость, мир жесток."
 agot_sailing.2303.wastrel: "$agot_sailing.2302.reply_wastrel$\n\nВсем нам нужно находить время для развлечений."
 agot_sailing.2303.steward: "$agot_sailing.2302.reply_steward$\n\nКак скучно..."
 agot_sailing.2303.fallback: "[befriend_actor.GetSheHe|U] с надеждой ухмыляется, явно ожидая ответной симпатии."
 agot_sailing.2303.a: "Что это там?"

 agot_sailing.2304.reply: "Похоже, [befriend_target.GetTitledFirstName] имеет со мной много общего"
 agot_sailing.2304.sailor: "$agot_sailing.2304.reply$, с упоением погружаясь в тонкости правильного способа постановки на якорь и закрепления корабля в порту."
 agot_sailing.2304.pity: "$agot_sailing.2304.reply$, разделяя мою жалость к тем, кто вынужден так много работать."
 agot_sailing.2304.wastrel: "$agot_sailing.2304.reply$, сетуя на то, что [befriend_target.GetHerHis] время лучше потратить в другом месте."
 agot_sailing.2304.steward: "$agot_sailing.2304.reply$ и охотно делится информацией о морских торговых путях."
 agot_sailing.2304.fallback: "$agot_sailing.2304.reply$, расслабляясь в моей компании."
 agot_sailing.2304.desc: "\n\nКогда мы продолжим путь, нас будет трудно разлучить - я [Select_CString(ROOT.Char.IsFemale, 'знала', 'знал' )], что найду нужные слова, чтобы покорить [befriend_target.GetHerHis]!"
 agot_sailing.2304.a: "Думаю, я [Select_CString(ROOT.Char.IsFemale, 'покорила', 'покорил' )] [befriend_target.GetHerHis]..."

 agot_sailing.2305.reply: "Похоже, [befriend_target.GetTitledFirstName] не [Select_CString(befriend_target.IsFemale, 'впечатлилась', 'впечатлился' )] от моих слов"
 agot_sailing.2305.sailor: "$agot_sailing.2305.reply$, так как [befriend_target.GetSheHe] просто вежливо улыбается, прочищая горло, явно подыскивая вежливый способ закончить наш разговор."
 agot_sailing.2305.pity: "$agot_sailing.2305.reply$, так как [befriend_target.GetSheHe] бросает на меня странный взгляд и чешет свою голову."
 agot_sailing.2305.wastrel: "$agot_sailing.2305.reply$, так как [befriend_target.GetSheHe] выглядит совершенно [Select_CString(befriend_target.IsFemale, 'потрясенной', 'потрясенным' )] моими словами."
 agot_sailing.2305.steward: "$agot_sailing.2305.reply$, так как [befriend_target.GetSheHe] быстро теряет интерес, явно не желая говорить о торговых путях."
 agot_sailing.2305.fallback: "$agot_sailing.2305.reply$, так как [befriend_target.GetSheHe] молчит."
 agot_sailing.2305.desc: "\n\nСтоя в одиночестве после того, как [befriend_target.GetSheHe] [Select_CString(befriend_target.IsFemale, 'перешла', 'перешёл' )] к общению с другими, я чувствую себя глупо..."
 agot_sailing.2305.a: "Отлично, [ROOT.Char.GetFirstNameNoTooltip]."

 sailing_woo_success_key_title: "$agot_sailing.2301.t$"
 sailing_woo_failure_key_title: "$agot_sailing.2301.t$"
 sailing_murder_restrain_key_title: "$agot_sailing.2301.t$"
 sailing_kill_murder_killed_title: "$agot_sailing.2301.t$"
 sailing_kill_murder_missed_title: "$agot_sailing.2301.t$"
 sailing_befriend_success_key_title: "$agot_sailing.2301.t$"
 sailing_befriend_failure_key_title: "$agot_sailing.2301.t$"

 agot_sailing.3100.t: "Прокладка курса к Валирии"
 agot_sailing.3100.desc: "Я вижу, как [first_mate.GetFirstNameNoTooltip] приходит в восторг, когда [first_mate.GetSheHe] начинает сплачивать остальную команду, которая быстро принимается за работу, разворачивая паруса и поднимая якорь.\n\nЯ спускаюсь под палубу и в свою каюту, открываю люк, чтобы солнечный свет залил множество морских карт, разложенных на капитанском столе. [first_mate.GetFirstNameNoTooltip] входит и присоединяется ко мне.\n\n«Итак, вперёд, к обречённым землям Валирии, капитан?»"
 agot_sailing.3100.a: "Следуйте каждому моему указанию!"
 agot_sailing.3100.a.success: "Вы успешно прокладываете маршрут"
 agot_sailing.3100.a.success.tt: "Вы уверенно выходите в открытое море."
 agot_sailing.3100.a.failure.tt: "Вам не удаётся найти приемлемый маршрут."

 agot_sailing.3101.t: "Курс проложен"
 agot_sailing.3101.desc: "После изучения моих морских карт и сравнения их с моими записями по истории Валирии, я прокладываю восточный курс к Четырнадцати Огням.\n\nДостав перо, я отмечаю это место большим крестом и поворачиваюсь к своему первому помощнику с уверенным видом.\n\n«Мы поплывём мимо берегов Вольных городов, к заливу Работорговцев, затем возьмём курс 260 узлов в Дымное море!»"
 agot_sailing.3101.a: "С этого начинается наше путешествие."

 agot_sailing.3102.t: "Путь всё ещё скрыт"
 agot_sailing.3102.desc: "После изучения моих морских карт и сравнения их с моими записями по истории Валирии, я просто не могу с уверенностью определить вероятное место для хорошей якорной стоянки в пределах Четырнадцати Огней. Воистину, это как искать иголку в стоге сена.\n\nКраем глаза я вижу, как [first_mate.GetFirstNameNoTooltip] начинает терять уверенность, когда [first_mate.GetSheHe] осознаёт, насколько я [Select_CString(ROOT.Char.IsFemale, 'несведуща', 'несведущ')]. [first_mate.GetSheHe|U] медленно кладёт руку мне на плечо.\n\n«Может... поищем его в другой раз?»"
 agot_sailing.3102.a: "Полагаю, [first_mate.GetSheHe] [Select_CString(first_mate.IsFemale, 'права', 'прав')]. Мы бы поплыли на смерть."

 agot_sailing.3200.t: "Чудовищный кракен"
 agot_sailing.3200.desc: "Пока мы плывём, я не могу избавиться от чувства беспокойства, время от времени поглядывая на глубокие воды. Вдалеке я вижу, как что-то на мгновение прорывается сквозь поверхность, и по моей спине пробегает холодок дурного предчувствия. Я снова замечаю это, подхожу ближе и теперь могу разглядеть что-то чешуйчатое, движущееся в воде.\n\nКогда я начинаю различать его более отчётливо, страх почти сбивает меня с ног — крупный, как огромный корабль, с длинным телом, усеянным щупальцами, и увенчанной гребнем головой, он не похож ни на что, что я когда-либо [Select_CString(ROOT.Char.IsFemale, 'видела', 'видел' )] раньше. Один из мифических кракенов, дальний родственник гораздо более мелких кальмаров, обитающих в наши дни во многих морях. Я [Select_CString(ROOT.Char.IsFemale, 'думала', 'думал' )], что это всего лишь легенда!\n\nТеперь я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] сделать быстрый выбор, поскольку вижу, как он приближается, и его глаза полны злобного желания, когда он смотрит на мой корабль. [Select_CString(ROOT.Char.IsFemale, 'Должна', 'Должен' )] ли я бороться и продолжать идти дальше или повернуть назад и попытаться убежать?"
 agot_sailing.3200.a: "Лучники! Стрелы на тетиву! Мы сразим это чудовище!"
 agot_sailing.3200.a.success: "Вам удалось повергнуть кракена"
 agot_sailing.3200.a.success.tt: "Вы с командой празднуете великую победу."
 agot_sailing.3200.a.failure: "Вам не удаётся остановить натиск кракена"
 agot_sailing.3200.a.failure.tt: "@death_icon! Кракен пускает на дно ваше судно, а вы сами находитесь на грани смерти."
 agot_sailing.3200.b: "Нужно убираться отсюда! У нас нет ни малейшего шанса!"
 agot_sailing.3200.b.tt: "Вы пытаетесь увести корабль в порт."
 agot_sailing.3200.b.success.tt: "Вам удаётся унести ноги и спасти корабль."
 agot_sailing.3200.b.failure.tt: "Вам удается спастись, но корабль приходит в плачевное состояние."
 agot_sailing.3200.c: "Самое время испытать силу рога..."
 agot_sailing.3200.c_success: "Вы успешно связали разум кракена и приказываете ему уйти"
 agot_sailing.3200.c_failure: "Вам не удалось подчинить разум кракена, и он топит ваш корабль"

 agot_sailing.3201.t: "Убийца кракена"
 agot_sailing.3201.t_horn: "[Select_CString(ROOT.Char.IsFemale, 'Повелительница', 'Повелитель' )] кракенов"
 agot_sailing.3201.desc: "Моя команда осыпает чудовище стрелами, когда оно пытается напасть на корабль, а я всё это время пытаюсь найти возможность нанести ему более мощный удар. Наконец, когда он пытается схватить меня своим беззубым клювом, я едва успеваю увернуться и вонзаю [ROOT.Char.Custom('signature_weapon')] ему в глаз.\n\nВоя в агонии, зверь мечется, отбрасывая меня на палубу. Однако мой удар попал в цель — зверь издаёт последний вопль, прежде чем рухнуть в море, его труп всплывает на поверхность.\n\nМоя команда разразилась восторженными возгласами, некоторые из них достали личные запасы выпивки, чтобы отпраздновать это событие. [Select_CString(first_mate.IsFemale, 'Моя первая помощница', 'Мой первый помощник' )], [first_mate.GetFirstNameNoTooltip], хлопает меня по плечу. «Отлично, [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой' )] [ROOT.Char.GetTitleAsNameNoTooltip|l]! У чудовища не было ни единого шанса!»"
 agot_sailing.3201.desc_horn: "Когда команда отступает за мою спину, я подношу рог кракена к губам и издаю глубокий, громоподобный клич. Звук разносится по морю, и мгновение спустя огромное чудовище начинает уплывать, исчезая в глубинах, откуда оно появилось. Теперь не может быть никаких сомнений в том, что рог обладает истинной силой.\n\nКоманда разражается восторженными возгласами, а некоторые даже открывают припрятанные запасы выпивки в знак празднования. [Select_CString(first_mate.IsFemale, 'Моя первая помощница', 'Мой первый помощник' )], [first_mate.GetFirstNameNoTooltip], крепко хлопает меня по плечу. «Отлично, [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой' )] [ROOT.Char.GetTitleAsNameNoTooltip|l]! У чудовища не было ни единого шанса!»"
 agot_sailing.3201.a: "И правда, звучит неплохо! А наш путь теперь открыт..."
 agot_sailing.3201.b: "Хватит ерунду молоть, лучше выпивку неси!"

 agot_sailing.3202.t: "Вкусная закуска"
 agot_sailing.3202.desc: "Чудовищный кракен легко уклоняется от стрел, которые моя команда отчаянно пускает в него, хватая членов экипажа направо и налево!\n\nВскоре он настигает меня. Я уворачиваюсь один раз, затем второй, затем третий... ничего."
 agot_sailing.3202.a: "Нет... только не так!"
 agot_sailing.3202.a.success.tt: "Каким-то чудом вам удаётся спасти собственную шкуру."
 agot_sailing.3202.a.failure.tt: "@death_icon! Кракен проглатывает вас целиком. Не видать вам больше света."

 agot_sailing.3300.t: "Тающие запасы"
 agot_sailing.3300.desc: "Мы провели в море уже долгие дни, но сильный встречный ветер серьёзно препятствует возможному продвижению. Более того, первый помощник предупреждает, что запасы провизии скудеют, а до место назначения нам её практически наверняка не хватит. Среди членов экипажа уже начались стычки. Если я что нибудь не придумаю, плавание обязательно закончится катастрофой.\n\nРано или поздно мне придётся выбрать кнут или пряник. Я могу придумать честный способ распределения оставшихся запасов провизии, который поможет нам протянуть ещё какое-то время, либо навести дисциплину жесткой рукой, прибегнув к методам, аналогичным принятым в армии.\n\nВозможно припасов хватит и на то, чтобы вернуться домой, но не поздно ли сдаваться?"
 agot_sailing.3300.a: "Наверняка мы сможем растянуть то, что ещё осталось..."
 agot_sailing.3300.a.success: "Вы успешное распределяете оставшиеся припасы"
 agot_sailing.3300.a.success.tt: "Вам хватит провизии и пресной воды до конца путешествия."
 agot_sailing.3300.a.failure: "Вы совершаете ошибку при подсчёте количества припасов"
 agot_sailing.3300.a.failure.tt: "@death_icon! Вы и вся ваша команда умрёте в море от голода."
 agot_sailing.3300.b: "Спасение кроется в дисциплине! Корабль теперь на военном положении!"
 agot_sailing.3300.b.success: "Вам удаётся добиться соблюдения порядка среди команды"
 agot_sailing.3300.b.success.tt: "Благодаря вашим познаниям в логистике и естественное стремление команды к порядку помогли растянуть запасы еды."
 agot_sailing.3300.b.failure: "Ситуация выходит из под вашего контроля"
 agot_sailing.3300.b.failure.tt: "@death_icon! Ваши неуклюжие попытки насаждения дисциплины приводят к бунту на корабле и команда решает, что тиранию она не приемлет."
 agot_sailing.3300.c: "Мы пытались, но оно того не стоит."
 agot_sailing.3300.c.tt: "Вы возвращаетесь в порт."
 agot_sailing.3300.d: "[man_meat.GetName] выглядит ужасно аппетитно..."
 agot_sailing.3300.d.tt: "Вы решаете съесть персонажа [man_meat.GetNameNoTooltip] чтобы накормить команду"

 agot_sailing.3301.t: "Тщательные рационы"
 agot_sailing.3301.desc: "Путем хитроумных вычислений, мне удалось растянуть наши ограниченные запасы по-честному, внедрив особое распределение провизии на корабле.\n\nИ хотя нам всем пришлось затянуть пояса потуже, никто из команды не пожалуется на несправедливость."
 agot_sailing.3301.a: "Один — мне, один — тебе."

 agot_sailing.3302.t: "Голод"
 agot_sailing.3302.desc: "Когда я [Select_CString(ROOT.Char.IsFemale, 'распределила', 'распределил' )] внушительных размеров рационы для каждого члена команды, глаза многих наполнились надеждой. Но воодушевление вскоре сменилось отчаяньем, когда запасы оскудели, а земли не было видно на многие мили.\n\nГорло пересохло, а желудок сводит страшнейшей судорогой. Мне осталось недолго, а большая часть команды уже мертва.\n\nКак это произошло?"
 agot_sailing.3302.a: "Неужели я [Select_CString(ROOT.Char.IsFemale, 'пропустила', 'пропустил' )] единицу в уме?"

 agot_sailing.3303.t: "Концы с концами"
 agot_sailing.3303.desc: "Несмотря на некоторое сопротивление на первых этапах, твердой рукой и принципиальной убежденностью мне удалось вернуть контроль над распределением запасов провианта.\n\nИ хотя мораль опустилась ниже прежнего, а урчание полупустых желудков стало будничным аккомпанементом, мы наконец-то можем продолжить свой путь."
 agot_sailing.3303.a: "Другого выхода не было."

 agot_sailing.3304.t: "Бунт"
 agot_sailing.3304.desc: "Мои попытки вернуть контроль над командой посредством жестких мер закончились катастрофой. Голодные и обделённые члены команды решили не дожидаться момента, когда мы прибудем в легендарные земли, которые запланировали отыскать. Вместо этого они подняли бунт!\n\nКрепко связав меня по рукам и ногам, они оставили меня лежать среди снастей, пока решают что со мной делать. Их, по видимому, [Select_CString(mutiny_leader.IsFemale, 'предводительница', 'предводитель' )], [mutiny_leader.GetFirstNameNoTooltip] рывком поднимает меня на ноги и ведёт к наскоро сколоченной доске, свисающий над бортом корабля. Путь назад мне отрезает вытянутый меч в [mutiny_leader.GetHerHis] руках.\n\n«Шагай, тиран...»"
 agot_sailing.3304.a: "Трусы! Изменники!"

 agot_sailing.3305.desc: "Мы долго были в море, и из-за сильного встречного ветра наше продвижение было незначительным, даже меньше, чем мы надеялись. Что ещё хуже, запасы провизии на исходе...\n\n[host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'пыталась', 'пытался' )] убедить экипаж ввести жесткие рационы, но этого слишком мало, слишком поздно. Последние запасы закончились, и скоро не станет и нас."
 agot_sailing.3305.a: "Прошу, хоть кусочек..."

 agot_sailing.3306.t: "Товарищи на воде"
 agot_sailing.3306.desc: "Путешествие пошло наперекосяк, и наши припасы превратились в объедки... Некоторые на корабле даже начали грызть оборванные концы веревки после неудачных попыток поймать крысу.\n\n[man_meat.GetTitledFirstName] беспрестанно жалуется на свои муки голода, как будто остальные из нас не испытывают такой же боли. Этого достаточно, чтобы свести человека #emp с ума!#!\n\nПохоже, [man_meat.GetHerHis] жалобы истощили все [man_meat.GetHerHis] силы, и [man_meat.GetSheHe] [Select_CString(man_meat.IsFemale, 'потеряла', 'потерял' )] сознание, растянувшись на палубе. Я не могу не заметить, какими... нежными выглядят [man_meat.GetHerHis] худые ножки. #emp Ах, вкус плоти... Несомненно, это то, что мне нужно, чтобы взбодриться!#!"
 agot_sailing.3306.a: "Мясо снова в меню, ребята!"
 agot_sailing.3306.d.tt: "Вы съедаете персонажа [man_meat.GetTitledFirstName] и даёте своей команде выбор."

 agot_sailing.3307.desc: "Путешествие пошло наперекосяк, и наши припасы превратились в объедки... Некоторые на корабле даже начали грызть оборванные концы веревки после неудачных попыток поймать крысу.\n\n[man_meat.GetTitledFirstName] беспрестанно жалуется на свои муки голода, как будто остальные из нас не чувствуют той же боли. Этого достаточно, чтобы свести человека #emp с ума!#!\n\nКак только [man_meat.GetFirstNameNoTooltip] [Select_CString(man_meat.IsFemale, 'отключилась', 'отключился' )], растянувшись на палубе, я [Select_CString(ROOT.Char.IsFemale, 'заметила', 'заметил' )], что [host.GetTitledFirstNameNicknamed] угрожающе смотрит на н[man_meat.GetHerHis]. #emp Конечно же, [host.GetSheHe] не собирается [man_meat.GetHerHis] есть!#!\n\nУбийство происходит быстро: говорят, что от страха вкус мяса портится, и [host.GetFirstNameNoTooltip] перерезает [man_meat.GetHerHim] горло, когда [man_meat.GetFirstNameNoTooltip] спит. От насыщенного железом аромата крови у меня защекотало в носу. В животе заурчало. #emp В конце концов, почему бы и нет? [man_meat.GetSheHe|U] уже [Select_CString(man_meat.IsFemale, 'мертва', 'мёртв' )]!#!"
 agot_sailing.3307.a: "Чего не сделаешь ради выживания!"
 agot_sailing.3307.b: "Нет, нет, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] справиться со своими искушениями."
 agot_sailing.3307.b.success_tt: "Вам удаётся утолять голод скудными пайками"

 agot_sailing.3400.t: "Безумие Рока Валирии"
 agot_sailing.3400.desc: "Я просыпаюсь от звуков истерии. Выйдя из своей каюты, я обнаруживаю, что [Select_CString(first_mate.IsFemale, 'моя', 'мой' )] обычно [Select_CString(first_mate.IsFemale, 'спокойная первая помощница', 'спокойный первый помощник' )], [first_mate.GetFirstName], всхлипывает за дверью. Я трясу [first_mate.GetHerHis], пытаясь добиться от н[first_mate.GetHerHis] ответа, прежде чем отправиться на поиски других членов команды.\n\nЯ хожу среди команды, расспрашивая моряков с дрожащими руками и пустыми глазами. Каждый рассказывает об одном и том же видении — Рок Валирии, возрождённый в пламени и пепле, огненный вихрь, который пожирает камень и плоть, от которого кипит само море. Эти образы запечатлелись в их сознании подобно клейму.\n\nМой корабль стоит в воде без движения. Ни один парус не поднят, ни одно весло не шевелится. Команда сбилась в кучки на палубе, шепча молитвы старым и новым богам. Они не пойдут вперёд. Они #EMP не могут#!.\n\n«Поверните назад, капитан», - умоляет [first_mate.GetFirstNameNoTooltip] срывающимся голосом. «Рок предупреждает нас. Мы сгорим, как сгорели валирийцы». Остальные вторят [first_mate.GetHerHis] мольбе, их страх - живое существо, распространяющееся подобно корабельной лихорадке."
 agot_sailing.3400.a: "Соберитесь, друзья! Это всего лишь сон, а мы почти на месте!"
 agot_sailing.3400.a.success: "Ваши слова успокаивают команду"
 agot_sailing.3400.a.success.tt: "Вы воодушевляете команду на продолжение плавания, развеяв их сомнения"
 agot_sailing.3400.a.failure: "Они пропускают ваши слова мимо ушей"
 agot_sailing.3400.a.failure.tt: "Ваша команда впадает в отчаяние, а вас берут в плен, чтобы сохранить свои жизни"
 agot_sailing.3400.b: "Рок лишь в вашей голове, а #EMP Я#! [Select_CString(ROOT.Char.IsFemale, 'реальна', 'реален' )]!"
 agot_sailing.3400.b.desc: "Вы используете высокий показатель [Concept('dread', 'ужаса')|E], пытаясь отвести беду от своей команды."
 agot_sailing.3400.b.success.tt: "Вы заставили свою команду вернуться к работе, игнорируя их сомнения, чтобы избежать вашего гнева"
 agot_sailing.3400.b.failure.tt: "Ваши угрозы не способны напугать вашу команду настолько, чтобы они перестали сомневаться"
 agot_sailing.3400.c: "Я чувствую, как меня пронизывает холод... нужно развернуть корабль."
 agot_sailing.3400.c.tt: "Вы возвращаетесь в гавань"

 agot_sailing.3401.t: "Безумие рассеивается"
 agot_sailing.3401.desc: "Мои слова прорываются сквозь лихорадочный сон, охвативший мою команду. Я вижу, как это происходит — дикий огонёк исчезает из их глаз, сменяясь чем-то более спокойным. Рассудок возвращается, как прилив.\n\nОдин за другим команда приходит в себя. [first_mate.GetFirstName] присоединяется ко мне, [Select_CString(first_mate.IsFemale, 'готовая', 'готовый' )] к предстоящему путешествию. Мы снова поворачиваем наш корабль на восток, к тем далёким, проклятым водам.\n\nКоманда работает в тишине, но это больше не тишина ужаса. Это молчание людей, которые заглянули в бездну и всё равно решили плыть вперёд."
 agot_sailing.3401.a: "Мы совладали со страхом."

 agot_sailing.3402.t: "Безумие берёт верх"
 agot_sailing.3402.desc: "Они не хотят слушать. Сначала я пытаюсь рассуждать здраво, потом командовать — мой голос остёр, как лезвие. Но ими овладел ужас, а ужас делает людей глухими ко всему, кроме собственного бешено колотящегося сердца.\n\nКогда я подхожу к штурвалу, [first_mate.GetFirstName] пытается преградить мне путь. [Select_CString(first_mate.IsFemale, 'Моя первая помощница', 'Мой первый помощник' )] медленно качает головой. «Простите, капитан».\n\nПрежде чем я успеваю протиснуться мимо них, чьи-то руки обхватывают меня и крепко держат. «Вы сошли с ума», - шепчет кто-то почти нежно. «Рок коснулся вашего разума. Мы спасаем вас от [Select_CString(ROOT.Char.IsFemale, 'самой', 'самого' )] себя»."
 agot_sailing.3402.a: "Я в своём уме! Это #EMP ВЫ#! безумны!"

 agot_sailing.3500.t: "Нескончаемый шторм"
 agot_sailing.3500.desc: "Наконец-то, кажется, всё идёт хорошо. Судя по моим вычислениям, мы приближаемся к тому месту, где находится затерянная Валирия, и моря были добры к нам — хорошие ветры, спокойные волны.\n\nНо как только я об этом думаю, всё меняется. Ветер сотрясает моё судно, волны бьются о него, как барабаны в морской пучине. И тут начинает лить дождь — сначала тонкой струйкой, а затем потоком. Самый спокойный день превратился в шторм такой ярости, какой я ещё не [Select_CString(ROOT.Char.IsFemale, 'видела', 'видел' )] в своей жизни.\n\nСквозь проливной дождь мне кажется, что я вижу, как всё больше и больше грозовых туч надвигается на корабль. Волна ударяет мне в лицо и уходит обратно в глубину. Однако у меня больше нет времени думать об этом — я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] выбрать, бросить ли вызов буре или повернуть назад, преодолев последнее препятствие."
 agot_sailing.3500.a: "Мы #EMP должны#! справиться с этим штормом!"
 agot_sailing.3500.a.success: "Вам удаётся пережить шторм"
 agot_sailing.3500.a.success.tt: "Полагаясь на свой опыт, вы пытаетесь вспомнить все, что поможет вам пережить шторм"
 agot_sailing.3500.a.failure: "Ваш корабль сгинул в шторме"
 agot_sailing.3500.a.failure.tt: "@death_icon! Шторм оказывается слишком силен, и волны накрывают ваш корабль, пуская его ко дну"
 agot_sailing.3500.b: "Это безумие! Мы должны повернуть назад!"
 agot_sailing.3500.b.tt: "Вы возвращаетесь в гавань"

 agot_sailing.3501.t: "Верхом на буре"
 agot_sailing.3501.desc: "Я хватаюсь за штурвал корабля, перетаскивая его через гребень очередной яростной волны. Гремит гром, и молния пронзает мрак.\n\nЯ выкрикиваю приказы и приказываю снова отрегулировать такелаж, матросы яростно работают, выполняя мои команды. Мой корабль сильно потрёпан, но я отказываюсь сдаваться.\n\nОднако, наконец, ветер начинает стихать, а волны спадать. Буря утихает, и когда солнце впервые выглядывает из-за облаков, я едва ли могу представить себе более прекрасное зрелище. Я [Select_CString(ROOT.Char.IsFemale, 'пережила', 'пережил' )] шторм, которому не было равных, преодолев все волны на своём пути.\n\nА вдалеке... неужели?"
 agot_sailing.3501.a: "Развернуть паруса, мы почти у цели!"

 agot_sailing.3502.t: "Водная могила"
 agot_sailing.3502.desc: "Я отчаянно пытаюсь справиться со штормом, выкрикивая приказы своим людям. Но это не просто шторм.\n\nЯ слышу громкий треск - это грот-мачта корабля, долго терзаемая ветрами, не выдерживает и падает на главную палубу. Корабль начинает разваливаться на части, и яростные волны уносят меня в пучину.\n\nПоследнее, что я слышу, - это всепоглощающий грохот бурлящих вод вокруг меня...\n\nА затем наступает темнота."
 agot_sailing.3502.a: "Н-нгх..."
 agot_sailing.3503.desc: "Я слышу, как [host.GetFirstName] пытается приказать команде продолжать движение. Но это не просто шторм.\n\nЯ слышу громкий треск, когда грот-мачта корабля, долго терзаемая ветрами, не выдерживает и падает на главную палубу. Корабль начинает разваливаться на части, и яростные волны уносят меня в пучину.\n\nПоследнее, что я слышу, - это всепоглощающий грохот бурлящих вод вокруг меня...\n\nА затем наступает темнота."

 agot_sailing.3900.t: "Четырнадцать Огней"
 agot_sailing.3900.desc: "Дикая ухмылка расползается на моём лице, когда я наконец замечаю расколотые острова, и из меня вырывается слегка истерический смех. Мы сделали это. Трудности были велики, и многие сомневались, что это вообще возможно — но мы сделали это. Это, несомненно, то, что осталось от Четырнадцати Огней Валирии.\n\nОднако, когда мы приближаемся, я хмурюсь в раздумьях. Стоит ли нам попытаться высадиться?\n\nСо всех сторон отвесные скалы, по-видимому, не позволяют легко причалить — и повсюду поднимается дым, как из воды, так и из камня. Высадиться на них — значит рискнуть навлечь на себя рок — точно так же, как рок постиг драконьих владык древности.\n\nТеперь у меня есть выбор — высадиться или просто любоваться этим издалека?"
 agot_sailing.3900.a: "Риск не оправдан, одно лишь прибытие сюда достойно песен!"
 agot_sailing.3900.a.tt: "Вы почтительно взираете на Валирию со своего судна"
 agot_sailing.3900.b: "Я [Select_CString(ROOT.Char.IsFemale, 'зашла', 'зашёл')] так далеко, давайте поищем место для высадки."
 agot_sailing.3900.b.success: "Вам удаётся исследовать руины Валирии"
 agot_sailing.3900.b.failure: "Ваше исследование заканчивается внезапным происшествием."

 agot_sailing.3901.t: "Великолепие Валирии"
 agot_sailing.3901.desc: "Я решаю не пытаться высаживаться ни на один из расколотых островов — их высокие утёсы и скалистые берега удерживают меня от приближения. Но даже так, я подвожу корабль как можно ближе, подплывая всё ближе и ближе. Когда мы это делаем, перед нами предстаёт весь ужас Рока Валирии. Разрушенные башни и колонны, полностью разрушенные города и жилища видны сквозь вездесущий дым. И всё же, даже в таком ужасном состоянии, всё ещё можно разглядеть, сколь величественными должны были быть Четырнадцать Огней когда-то.\n\nНаконец, обогнув их много раз, мы поворачиваем домой, удовлетворённые. Мы нашли то, что другие считали мифом, преодолели опасности, не имеющие себе равных, и узрели последний остаток давно потерянной Валирии. Никто не может усомниться в моём мастерстве или славе."
 agot_sailing.3901.a: "Я никогда не забуду это зрелище."

 agot_sailing.3902.t: "Исследование руин"
 agot_sailing.3902.desc: "Осторожно ступая с корабля, пытаясь найти опору, я поднимаю взгляд. Даже сейчас, почти полностью поглощённый волнами, пик вулкана, сформировавшего этот остров, пронзает небо, отвесные скалы вздымаются высоко над прибоем. Напрягая глаза, я наконец нахожу путь через шероховатые камни, ведущий к высеченным в скале ступеням, совершенно разрушенным и разбитым Роком.\n\nПоднявшись по лестнице, я наконец достигаю древнего валирийского дворца, каким-то образом всё ещё в основном целого. Из безмолвного строения исходит дым, и над ним витает дух отчаяния. Я оглядываюсь в поисках чего-нибудь ценного..."
 agot_sailing.3902.a: "Здесь остались только руины."
 agot_sailing.3902.b: "Рассредоточиться! Посмотрим, что ещё можно найти!"
 attempt_to_leave_valyria: "Вы пытаетесь покинуть Валирию"
 valyrian_artifact: "Вы нашли [Concept('artifact', 'артефакт')|E] Старой Валирии"
 guest_reached_valyria_tt: "Все участники получат модификатор «[GetModifier( 'guest_reached_valyria' ).GetNameWithTooltip|L]»"

 agot_sailing.3903.t: "Морское происшествие"
 agot_sailing.3903.desc: "Я стою на палубе корабля, когда наш курс проходит мимо разбитых, дымящихся утёсов, усеивающих Дымное море. В мыслях я уже вижу множество сокровищ, которые мы непременно обнаружим скрытыми в руинах древней Валирии. Золото, драгоценные камни и, конечно, бесценная валирийская сталь... Скоро всё это будет моим...\n\nГромкий #italic треск#! возвращает меня к реальности, и внезапно небо наполняется пеплом и огнём. Град горящих камней обрушивается на корабль, и пламя быстро начинает распространяться. Когда я с ужасом смотрю на это, паруса загораются, и огонь перекидывается с мачты на палубу.\n\nСреди криков паники и боли вокруг меня поднимается невыносимый жар. Не думая, я прыгаю в бушующие воды внизу, только чтобы увидеть, как корабль тонет прямо у меня на глазах. Я отчаянно гребу, чтобы отплыть подальше от обломков..."
 agot_sailing.3903.a: "Я— Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')]... продолжать плыть..."

 agot_sailing.3904.t: "Опасность в руинах"
 agot_sailing.3904.desc_one: "Высадившись на берег, мы находим разрушенную тропу, ведущую вверх к вершине острых утёсов, нависающих над Дымным морем. Ступени опасны, что вынуждает нас двигаться очень медленно. Наконец мы достигаем вершины, прибывая на разрушенный двор, который когда-то мог принадлежать великому поместью валирийского драконьего владыки.\n\nЯ поворачиваюсь к своей команде. «Многие сомневались, что кто-либо вообще сможет сюда попасть, но мы бросили вызов всем скептикам! Теперь богатства Валирии наши! Давайте—»\n\nМою речь прерывает громкий #italic рёв#! позади нас. Я оборачиваюсь как раз вовремя, чтобы увидеть, как огромное чешуйчатое создание прыгает на меня с неестественной скоростью..."
 agot_sailing.3904.desc_two: "Высадившись на берег, мы находим разрушенную тропу, ведущую вверх к вершине острых утёсов, нависающих над Дымным морем. Ступени опасны, что вынуждает нас двигаться очень медленно. Наконец мы достигаем небольшой пещеры, из которой валит дым.\n\n«Что это?» — выдыхаю я, когда из неё появляется маленькое существо. Пучки его меха белы как снег, но из головы торчат тёмные чешуйчатые щупальца.\n\n«Это всего лишь кролик!» Но когда мы приближаемся, мерзкий зверь бросается вперёд с огромными острыми зубами. Я с ужасом наблюдаю, как он отрывает голову одному из моих людей...\n\n«БЕГИТЕ!» — кричу я, но понимаю, что для всех нас уже слишком поздно."
 agot_sailing.3904.desc_three: "Высадившись на берег, мы находим разрушенную тропу, ведущую вверх к вершине острых утёсов, нависающих над Дымным морем. Ступени опасны, что вынуждает нас двигаться очень медленно. Наконец мы достигаем небольшой пещеры, из которой валит дым.\n\nУ входа в пещеру я замечаю небольшую кладку чешуйчатых камней... #italic Неужели это?!#!\n\n#EMP Драконьи яйца!#! Моё сердце колотится, когда я бегу к ним. Но когда моя рука касается самого большого из кладки, оно шипит и трескается, раскрываясь. Боги не имеют названия для звука, который оно издало затем — землетрясущий, пронзительный визг. Я терплю боль достаточно долго, чтобы почувствовать тепло крови, стекающей по обеим сторонам моей головы, когда мой собственный мозг плавится изнутри."
 agot_sailing.3904.desc_four: "Высадившись на берег, мы находим разрушенную тропу, ведущую вверх к вершине острых утёсов, нависающих над Дымным морем. Ступени опасны, поэтому я хватаюсь за скалы, пока мы поднимаемся. Но мои шаги не так осторожны, и я спотыкаюсь о незакреплённый камень.\n\nКогда я теряю равновесие, я хватаюсь за скалистый выступ для опоры, но он отламывается у меня в руке. Я падаю на землю, избегая падения к верной смерти, но мой взгляд прикован к камню в моей руке: #italic Это... палец?#!\n\nМой взгляд скользит вверх, чтобы увидеть каменное лицо, застывшее в ужасе, вплавленное в утёс. Оно почти смотрит на меня в ответ, когда вдруг... Его другая рука дёргается вперёд, хватая меня за горло. Я едва могу выдавить крик сквозь удушающую хватку."
 agot_sailing.3904.desc_five: "Высадившись на берег, мы находим разрушенную тропу, ведущую вверх к вершине острых утёсов, нависающих над Дымным морем. Ступени опасны, что вынуждает нас двигаться очень медленно. Наконец мы достигаем небольшой пещеры, из которой валит дым.\n\nУ входа в пещеру я замечаю большой чёрный камень с застрявшим в нём мерцающим клинком. Неужели рябь на металле может означать только одно: #italic валирийская сталь!#!\n\nТакая награда стоила бы всего путешествия. Когда я крепко хватаюсь за рукоять, я чувствую, как сильно она застряла. Тяга изо всех сил, кажется, ничего не даёт.\n\nЯ так [Select_CString(ROOT.Char.IsFemale, 'увлечена', 'увлечён' )] этим клинком в камне, что почти не замечаю, как моя команда замолкла. Когда я наконец решаю оглянуться, я вижу чёрную как смоль фигуру, возвышающуюся надо мной; её кожа подобна драконьему стеклу, а острые как косы руки занесены надо мной. Одна из них опускается, отрубая мне всю руку, которая всё ещё сжимает бесценный клинок.\n\nДругая начинает своё падение к моей голове."
 agot_sailing.3904.desc_six: "Высадившись на берег, мы находим разрушенную тропу, ведущую вверх к вершине острых утёсов, нависающих над Дымным морем. Ступени опасны, что вынуждает нас двигаться очень медленно. Наконец мы достигаем небольшой пещеры, из которой валит дым.\n\nКогда я вхожу в тускло освещённое пространство, меня встречают каменные фигуры, сбившиеся вместе, как будто для тепла. #italic Нет, для защиты!#!\n\nЭто не пещера; это гробница! Когда я поворачиваюсь, чтобы выйти, я чувствую каменную хватку на своей ноге. Одно из каменных тел схватило меня, и внезапная острая боль пронзает мою икру. Когда я падаю на землю, я чувствую другую каменную руку на своей руке, затем на спине, затем на шее..."
 agot_sailing.3904.a: "[ROOT.Char.Custom('Scream')]"
 ship_sunk: "Ваш корабль потерян в Валирии"
 ship_sunk_bell: "Ваш водолазный колокол потерян вместе с кораблём"

 agot_sailing.3905.t: "Сокровище в руинах"
 agot_sailing.3905.desc: "[host.GetTitledFirstNameNicknamed] осторожно ведёт нас вперёд, когда мы покидаем корабль и ступаем на берег Валирии. Земля, которую не посещали сотни лет, со времён Рока Валирии, со времён, когда [GetScriptedCharacterByHistoryID('Varezys_1').GetName] пытался отвоевать эти земли и провозгласить себя императором.\n\nКогда я выхожу на берег, я вижу пик вулкана, сформировавшего этот остров, пронзающий небо. [host.GetFirstNameNoTooltip] ведёт нас через руины, когда [host.GetSheHe] замечает путь вперёд. Когда [host.GetSheHe] достигает конца разрушенных каменных ступеней, [host.GetSheHe] отдаёт приказ обыскать руины в поисках любых реликвий, которые мы сможем найти.\n\nКогда я делаю шаг вперёд, чтобы начать поиски, я вижу, что мы находимся в одних из наиболее сохранившихся руин старого валирийского дворца, прекрасного даже сейчас, когда из него всё ещё исходит дым.\n\nВремя проходит, пока я разбираю завалы, пока не нахожу это — [newest_found_artifact.GetName].\n\nДревний, драгоценный валирийский артефакт, покоящийся под обломками, просто ждущий, чтобы я [Select_CString(ROOT.Char.IsFemale, 'взяла', 'взял' )] его... чтобы [Select_CString(ROOT.Char.IsFemale, 'взяла', 'взял' )] мою драгоценность..."
 agot_sailing.3905.a: "Реликвия Старой Валирии!"

 agot_sailing.3938.t: "Опасный остров"
 agot_sailing.3938.desc: "Я ступаю на каменистый берег острова, который наш предводитель выбрал для исследования. Тревожное чувство сопровождает наш отряд, когда мы начинаем искать путь к обожжённым руинам, виднеющимся на вершине близлежащих утёсов.\n\nПримерно через час мы натыкаемся на небольшую тропинку, которая, кажется, ведёт вверх по разбитым ступеням из тёмного камня. Следуя по тропе, мы наконец достигаем руин. Возможно, когда-то это был дворец или другое здание, возведённое валирийцами в дни их славы. Теперь остались только мрачные каменные кладки.\n\nКраем глаза я замечаю движение, но когда начинаю оборачиваться, уже слишком поздно. Холодные, сильные руки с неестественной силой сжимают мою шею, и последнее, что я слышу перед тем, как всё погружается во тьму, — ужасное шипение..."
 agot_sailing.3938.a: "Ургх—"
 agot_sailing.3938.a.tt: "Экспедиция провалилась, все затерялись в Валирии, их больше никогда не увидят"

 agot_sailing.3906.t: "Разграбление руин"
 agot_sailing.3906.desc: "[candle_store.GetName] - этого слишком мало! Обыщите руины и не оставьте камня на камне. Найдите что-нибудь более ценное!\n\nЯ отдаю приказ команде, надеясь найти что-то более ценное.\n\nРуины продолжают дымиться вокруг нас; разрушения, причинённые Роком, огромны, и я буду [Select_CString(ROOT.Char.IsFemale, 'удивлена', 'удивлён' )], если здесь осталось много вещей. Но это место слишком опасно, чтобы посещать его часто, поэтому мы должны взять всё, что можем, пока мы здесь, а затем вернуться домой.\n\nКто знает, что может таиться в этом пекле? Команда должна торопиться."
 agot_sailing.3906.a: "Не оставьте камня на камне!"

 agot_sailing.3907.t: "Путь домой"
 agot_sailing.3907.desc_good: "Путешествие к Старой Валирии увенчалось чудесным успехом, и конец нашего пути встречает нас ясным небом и попутным ветром. Ужасы, которые мне снились, были всего лишь снами.\n\nКогда мы направляемся домой, я чувствую лёгкий зуд в животе. #italic Ага! Я не [Select_CString(ROOT.Char.IsFemale, 'ела', 'ел' )] почти целый день!#!"
 agot_sailing.3907.desc_bad: "Путешествие к Старой Валирии увенчалось чудесным успехом, но конец нашего пути встречает нас тёмным небом и неприятными ветрами. Ужасы, которые мне снились, могли быть чем-то большим, чем сны.\n\nКогда мы направляемся домой, я чувствую лёгкий зуд в животе. Затем грызущую боль, почти такую, будто мои внутренности пытаются покинуть моё тело.\n\nЯ замечаю пот, стекающий с моего лба, и клянусь, что кожа на моей руке шевелится всего на мгновение. Я начинаю срывать с себя одежду до нижнего белья, но жар, исходящий изнутри, слишком силён. #italic Я сгораю!#!\n\nЯ хватаюсь за живот, но чувствую только странное шевеление под кожей. Я открываю рот, чтобы закричать, но из него выходит только дым."
 agot_sailing.3907.a_good: "Где те лимонные пирожные, которые я [Select_CString(ROOT.Char.IsFemale, 'припрятала', 'припрятал')]?"
 agot_sailing.3907.a_bad: "Значит, рассказы об огненных червях правдивы?!"

 agot_sailing.3920.t: "$agot_sailing.3101.t$"
 agot_sailing.3920.desc: "После изучения своих морских карт и заметок [host.GetTitledFirstNameNicknamed] провозглашает: «Мы поплывём мимо берегов Вольных городов, к заливу Работорговцев, затем возьмём курс 260 узлов в Дымное море!»\n\nТе, кто сомневался в [host.GetHerHis] здравомыслии, облегчённо вздыхают."
 agot_sailing.3920.a: "Отличная работа, [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]!"

 agot_sailing.3921.t: "$agot_sailing.3102.t$"
 agot_sailing.3921.desc: "После изучения своих морских карт и заметок [host.GetTitledFirstNameNicknamed], похоже, [Select_CString(host.IsFemale, 'озадачена', 'озадачен' )]. Определить вероятное место для хорошей якорной стоянки в пределах Четырнадцати Огней — непростая задача, и, похоже, [host.GetSheHe] не справляется с ней.\n\n[first_mate.GetTitledFirstName] медленно кладёт руку [host.GetHerHim] на плечо. «Может... поищем в другой раз?»"
 agot_sailing.3921.a: "Как жаль, [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]..."

 agot_sailing.3922.t: "$agot_sailing.3200.t$"
 agot_sailing.3922.desc: "Когда мы продолжаем плыть, тонкое чувство тревоги оседает на носу корабля. Вдалеке я вижу, как под поверхностью моря движется что-то... невообразимо огромное и всё приближающееся.\n\n#EMP Могучий кракен!#! Легенды рассказывают о таких мифических существах, но большинство считает их байками кормилиц и септ.\n\n[host.GetTitledFirstNameNicknamed] бросается вперёд, выкрикивая чёткое указание: мы должны отступить, чтобы уцелеть!"
 agot_sailing.3922.a: "Это плавание окончено."

 agot_sailing.3923.t: "$agot_sailing.3200.t$"
 agot_sailing.3923.desc: "Когда мы продолжаем плыть, тонкое чувство тревоги оседает на носу корабля. Вдалеке я вижу, как под поверхностью моря движется что-то... невообразимо огромное и всё приближающееся.\n\n#EMP Могучий кракен!#! Легенды рассказывают о таких мифических существах, но большинство считает их байками кормилиц и септ.\n\n[host.GetTitledFirstNameNicknamed] издаёт рёв; этот момент был запланирован. [host.GetSheHe|U] подносит рог кракена к своим губам, издавая глубокий, резонирующий гул. Звук, кажется, сотрясает саму палубу корабля, и я вижу, как окружающие хватаются за уши от боли.\n\nКракен, однако, кажется невозмутимым. В одно мгновение поднявшееся щупальце обрушивается на н[host.GetHerHis] с треском, обрывая звук рога хлюпающим звуком. Я не могу оторвать взгляд, когда щупальце поднимается над раздавленными останками нашего капитана, теперь просто кровавой лужей из костей и сухожилий. Увы, я даже не замечаю щупальце, нависшее теперь надо мной..."
 agot_sailing.3923.a: "О... о нет!"

 agot_sailing.3924.t: "$agot_sailing.3200.t$"
 agot_sailing.3924.desc: "Когда мы продолжаем плыть, тонкое чувство тревоги оседает на носу корабля. Вдалеке я вижу, как под поверхностью моря движется что-то... невообразимо огромное и всё приближающееся.\n\n#EMP Могучий кракен!#! Легенды рассказывают о таких мифических существах, но большинство считает их байками кормилиц и септ.\n\n[host.GetTitledFirstNameNicknamed] приказывает атаковать, и мы натягиваем луки, обрушивая град стрел на чудовище. Пронзительный вопль пронзает воздух, посылая дрожь по моим костям... затем тишина.\n\n[host.GetFirstNameNoTooltip] [Select_CString(host.IsFemale, 'сделала', 'сделал' )] это! [host.GetSheHe|U] [Select_CString(host.IsFemale, 'убила', 'убил' )] кракена!"
 agot_sailing.3924.desc_horn: "Я и остальная команда отступаем за спину капитана, когда [host.GetTitledFirstNameNicknamed] подносит рог кракена к своим губам и испускает глубокий, громоподобный гул. Звук катится по морю, и мгновения спустя огромное чудовище начинает отступать, исчезая в глубинах, откуда пришло. Теперь не осталось сомнений, что рог обладает истинной силой.\n\nЯ и остальная команда взрываемся восторженными криками, некоторые вскрывают тайные запасы выпивки в честь победы."
 agot_sailing.3924.a: "Подайте [host.GetHerHim] чашу!"

 agot_sailing.3925.t: "$agot_sailing.3200.t$"
 agot_sailing.3925.desc: "Когда мы продолжаем плыть, тонкое чувство тревоги оседает на носу корабля. Вдалеке я вижу, как под поверхностью моря движется что-то... невообразимо огромное и всё приближающееся.\n\n#EMP Могучий кракен!#! Легенды рассказывают о таких мифических существах, но большинство считает их байками кормилиц и септ.\n\n[host.GetTitledFirstNameNicknamed] приказывает атаковать, и мы натягиваем луки. Но чудовище легко стряхивает стрелы. Оно уже нависает над нами, срывая членов команды с палубы, как лимонные пирожные с подноса.\n\nЩупальце обвивает мою руку с непостижимой силой, раздавливая пальцы с отвратительным хрустом. Обломки моей руки зажаты в хватке монстра, когда он поднимает меня к своему рту..."
 agot_sailing.3925.a: "Нет... только не так!"
 agot_sailing.3925.a.success.tt: "Вам каким-то образом удаётся спастись в целости и сохранности"
 agot_sailing.3925.a.failure.tt: "@death_icon! Вас проглотили целиком, и вас больше никогда не увидят"
 agot_sailing.3925.b: "Если бы я только [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] освободиться..."
 agot_sailing.3925.b.success.tt: "Вы вырываетесь, но остаётесь без руки"
 agot_sailing.3925.b.failure.tt: "@death_icon! Вас проглотили почти целиком, но, возможно, ваша рука уплывёт"

 agot_sailing.3926.t: "$agot_sailing.3300.t$"
 agot_sailing.3926.desc: "Мы уже долго в море, и сильные встречные ветры означают, что мы продвинулись гораздо меньше, чем надеялись изначально. Что ещё хуже, припасы опасно заканчиваются...\n\n[host.GetTitledFirstNameNicknamed] явно [Select_CString(host.IsFemale, 'заметила', 'заметил' )] это; чтобы избежать голодной смерти до прибытия к цели, [host.GetSheHe] [Select_CString(host.IsFemale, 'ввела', 'ввёл' )] строгий рацион. Расчёты, кажется, окупаются — хотя все мы голодны, мы всё ещё живы."
 agot_sailing.3926.a: "Отличная работа, [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]!"
 agot_sailing.3926.a.fatty: "Но какой ценой? Зачем [host.GetFirstNameNoTooltip] это [Select_CString(host.IsFemale, 'сделала', 'сделал')]?!"

 agot_sailing.3927.t: "$agot_sailing.3300.t$"
 agot_sailing.3927.desc: "Мы уже долго в море, и сильные встречные ветры означают, что мы продвинулись гораздо меньше, чем надеялись изначально. Что ещё хуже, припасы опасно заканчиваются...\n\n[host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'попыталась', 'попытался' )] ввести строгие нормы, но, похоже, [host.GetHerHis] расчёты ошибочны... Вокруг нас только море. На борту нет еды — только наши медленные крики, когда голодные спазмы пожирают нас."
 agot_sailing.3927.a: "Пожалуйста, хоть кусочек..."

 agot_sailing.3928.t: "$agot_sailing.3300.t$"
 agot_sailing.3928.desc: "Мы уже долго в море, и сильные встречные ветры означают, что мы продвинулись гораздо меньше, чем надеялись изначально. Что ещё хуже, припасы опасно заканчиваются...\n\n[host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'слышала', 'слышал' )] протесты команды, но сурово [Select_CString(host.IsFemale, 'обошлась', 'обошёлся' )] с самыми громкими из нас. Мораль пострадала, и звук урчащих животов стал обычным делом — но по крайней мере мы выживем в предстоящем пути."
 agot_sailing.3928.a: "Отличная работа, [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]!"

 agot_sailing.3929.t: "$agot_sailing.3304.t$"
 agot_sailing.3929.desc: "Мы уже долго в море, и сильные встречные ветры означают, что мы продвинулись гораздо меньше, чем надеялись изначально. Что ещё хуже, припасы опасно заканчиваются...\n\n[mutiny_leader.GetTitledFirstNameNicknamed] [Select_CString(mutiny_leader.IsFemale, 'сеяла', 'сеял' )] раздоры на протяжении всего путешествия, и теперь настал [mutiny_leader.GetHerHis] час. Когда [host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'попыталась', 'попытался' )] убедить команду в необходимости строгой экономии, [mutiny_leader.GetFirstNameNoTooltip] [Select_CString(mutiny_leader.IsFemale, 'предложила', 'предложил' )] другую идею...\n\nПосле короткой борьбы [host.GetFirstName] [Select_CString(host.IsFemale, 'вынуждена', 'вынужден' )] пройти по доске!"
 agot_sailing.3929.a: "Прощай, [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]..."

 agot_sailing.3930.t: "$agot_sailing.3400.t$"
 agot_sailing.3930.desc: "Прошлой ночью снова пришёл сон. #italic Огонь, уничтожающий всё. Камень плавится как сало, море вскипает до пара, драконы воют, когда их собственное пламя пожирает их. И звук — боги, этот звук — будто сам мир раскалывается надвое.#!\n\n#EMP Рок Валирии!#!\n\nЯ вижу это в глазах каждого. Страх сидит в моей груди камнем. Но капитан не называет нас трусами. [host.GetSheHe|U] слушает.\n\n«То, что преследует вас, — это память, а не пророчество. Древний ужас, передаваемый из поколения в поколение, пока не укореняется в наших костях», — спокойно внушает [host.GetTitledFirstName], и безумие развеивается."
 agot_sailing.3930.a: "Кошмары могут вернуться. Но мы продолжим путь."

 agot_sailing.3931.t: "$agot_sailing.3400.t$"
 agot_sailing.3931.desc: "Прошлой ночью снова пришёл сон. #italic Огонь, уничтожающий всё. Камень плавится как сало, море кипит до пара, драконы воют, когда их собственное пламя пожирает их. И звук — боги, этот звук — будто сам мир раскалывается надвое.#!\n\n#EMP Рок Валирии!#!\n\nЯ вижу это в глазах каждого. Страх сидит в моей груди камнем. Но капитан не остановится. Даже после того, как мы умоляли [host.GetHerHis] — #italic умоляли#! [host.GetHerHis] — [host.GetTitledFirstName] продолжает настаивать на продолжении пути, говоря о картах и расстояниях, будто цифры могут сдержать Рок Валирии, будто логика имеет значение, когда сами боги послали нам предупреждение.\n\n«Мы должны это сделать», — тихо говорит [first_mate.GetFirstName]. «Ради [host.GetHerHis] же блага». Мгновение спустя мы запираем капитана в [host.GetHerHis] каюте. Замок поворачивается, но сквозь дерево я слышу, как [host.GetSheHe] кричит, проклинает нас, обещает расправу."
 agot_sailing.3931.a: "Лучше [host.GetHerHis] гнев, чем [host.GetHerHis] погребальный костёр."

 agot_sailing.3932.t: "$agot_sailing.3501.t$"
 agot_sailing.3932.desc: "Хороший ветер, спокойные волны и ясное небо были желанным зрелищем, когда мы приближаемся к месту, где лежит потерянная Валирия. Но всё меняется в одно мгновение.\n\nГромадная грозовая туча катится к нашему кораблю, за ней другая, третья, четвёртая. Они, кажется, направлены прямо на нас. Похоже, это #EMP клинок шторма#!!\n\n[host.GetTitledFirstNameNicknamed] выскакивает вперёд, выкрикивая приказы сквозь раскаты грома и ливень. «Распустить паруса, мы почти на месте!» — слышу я [host.GetHerHis] крик, и впереди я вижу, что [host.GetSheHe] [Select_CString(host.IsFemale, 'права', 'прав' )]..."
 agot_sailing.3932.a: "Неужели?"

 agot_sailing.3933.t: "$agot_sailing.3502.t$"
 agot_sailing.3933.desc: "Хороший ветер, спокойные волны и ясное небо были желанным зрелищем, когда мы приближаемся к месту, где лежит потерянная Валирия. Но всё меняется в одно мгновение.\n\nГромадная грозовая туча катится к нашему кораблю, за ней другая, третья, четвёртая. Они, кажется, направлены прямо на нас. Похоже, это #EMP клинок шторма#!!\n\n[host.GetTitledFirstNameNicknamed] выскакивает вперёд, выкрикивая приказы сквозь раскаты грома и ливень. Но приказы не поспевают за силой бури вокруг нас.\n\nПоследнее, что я слышу, — всепоглощающий грохот бушующих вод вокруг меня...\n\nА затем наступает тьма."
 agot_sailing.3933.a: "Н-нгх..."

 agot_sailing.3934.t: "$agot_sailing.3900.t$"
 agot_sailing.3934.desc: "Дикая ухмылка расползается на [host.GetHerHis] лице, когда [host.GetTitledFirstNameNicknamed] наконец замечает расколотые острова, и из н[host.GetHerHis] вырывается слегка истерический смех. Мы сделали это. Трудности были велики, и многие сомневались, что это вообще возможно — но мы сделали это. Это, несомненно, то, что осталось от Четырнадцати Огней Валирии.\n\nОднако, когда мы приближаемся, раздаётся шёпот: стоит ли нам попытаться высадиться?\n\nСо всех сторон отвесные скалы, по-видимому, не позволяют легко причалить — и повсюду поднимается дым, как из воды, так и из камня. Высадиться на них — значит рискнуть навлечь на себя гибель — точно так же, как рок постиг древних драконьих владык."
 agot_sailing.3934.a: "Что сделает [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]?"

 agot_sailing.3935.t: "$agot_sailing.3901.t$"
 agot_sailing.3935.desc: "[host.GetTitledFirstNameNicknamed] [Select_CString(host.IsFemale, 'решила', 'решил' )] не пытаться высаживаться ни на один из расколотых островов — их высокие утёсы и скалистые берега удерживают [host.GetHerHis] от приближения. Но даже так, мы подводим корабль как можно ближе, подплывая всё ближе и ближе. Когда мы это делаем, перед нами предстаёт весь ужас Рока Валирии. Разрушенные башни и колонны, полностью разрушенные города и жилища видны сквозь вездесущий дым. И всё же, даже в таком ужасном состоянии, всё ещё можно разглядеть, сколь величественными должны были быть Четырнадцать Огней когда-то.\n\nНаконец, обогнув их много раз, мы поворачиваем домой, удовлетворённые. Мы нашли то, что другие считали мифом, преодолели опасности, не имеющие себе равных, и узрели последний остаток давно потерянной Валирии. Никто не может усомниться в [host.GetHerHis] мастерстве или славе."
 agot_sailing.3935.a: "Весьма впечатляюще, [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]!"

 agot_sailing.3936.t: "$agot_sailing.3907.t$"
 agot_sailing.3936.desc_good: "Путешествие к берегам Старой Валирии увенчалось чудесным успехом, и конец нашего пути встречает нас ясным небом и попутным ветром. Ужасы, которые нам снились, были всего лишь снами.\n\nКогда мы направляемся домой, я чувствую лёгкий зуд в животе. #italic Ага! Я не [Select_CString(ROOT.Char.IsFemale, 'ела', 'ел' )] почти целый день!#!"
 agot_sailing.3936.desc_bad: "Путешествие к берегам Старой Валирии увенчалось чудесным успехом, но конец нашего пути встречает нас тёмным небом и неприятными ветрами. Ужасы, которые нам снились, могли быть чем-то большим, чем сны.\n\nКогда мы направляемся домой, [host.GetTitledFirstName] жалуется на лёгкий зуд в животе. Затем [host.GetSheHe] упоминает грызущую боль, почти такую, будто [host.GetHerHis] внутренности пытаются покинуть [host.GetHerHis] тело.\n\nЯ замечаю пот, стекающий с [host.GetHerHis] лба, и клянусь, что кожа на [host.GetHerHis] руке шевелится всего на мгновение. Когда [host.GetSheHe] начинает срывать с себя одежду до нижнего белья, я чувствую жар, исходящий от н[host.GetHerHis] как от печи. #italic [host.GetSheHe|U] горит!#!\n\n[host.GetFirstNameNoTooltip] хватается за живот, но когда [host.GetSheHe] открывает рот, чтобы закричать, из него выходит только дым...\n\nКакая жестокая участь ждёт остальных из нас? Моя собственная кожа начинает сползать."
 agot_sailing.3936.desc_bad_two: "Путешествие к Старой Валирии увенчалось чудесным успехом, но конец нашего пути встречает нас тёмным небом и неприятными ветрами. Ужасы, которые нам снились, могли быть чем-то большим, чем сны.\n\nКогда мы направляемся домой, из капитанской каюты доносится крик. Я вбегаю внутрь и вижу, как [host.GetTitledFirstName] корчится на полу в агонии. Когда я приближаюсь, я останавливаюсь... Жар от [host.GetHerHis] тела ощущается как пылающая печь, хотя в комнате сыро и холодно. И хуже того! Клянусь, я вижу шевелящиеся массы под [host.GetHerHis] кожей, движущиеся взад и вперёд.\n\nЯ отскакиваю от н[host.GetHerHis]; уже слишком поздно для каких-либо утешений. И теперь у меня [Select_CString(ROOT.Char.IsFemale, 'самой', 'самого' )] появляется грызущее чувство внутри. Каюта, которая была холодной, теперь кажется объятой пламенем.\n\nЯ выбегаю на нос корабля, срывая одежду на бегу. Шевеление, которое я видел под [host.GetHerHis] кожей, теперь отчётливо видно на моей собственной. И боль... #EMP Как же она жжёт!#!\n\nЯ хватаюсь за живот, но когда открываю рот, чтобы закричать, из него выходит только дым..."
 agot_sailing.3936.desc_cancelled: "Хотя путешествие к Старой Валирии оказалось неудачным, конец нашего пути встречает нас ясным небом и попутным ветром. Возможно, все ужасы остались позади.\n\nНо когда я брожу по палубе, я чувствую лёгкое покалывание в животе... #italic Ага! Я не [Select_CString(ROOT.Char.IsFemale, 'ела', 'ел' )] почти целый день!#"
 agot_sailing.3936.a_good: "$agot_sailing.3907.a_good$"
 agot_sailing.3936.a_bad: "$agot_sailing.3907.a_bad$"

 agot_sailing.3937.t: "$agot_sailing.3903.t$"
 agot_sailing.3937.desc: "Я стою на палубе корабля, когда наш курс проходит мимо расколотых, дымящихся утёсов, усеивающих Дымное море. В мыслях я уже вижу множество сокровищ, которые мы непременно обнаружим скрытыми в руинах древней Валирии. Золото, драгоценные камни и, конечно, бесценная валирийская сталь... Скоро всё это будет нашим...\n\nГромкий #italic треск#! возвращает меня к реальности, и внезапно небо наполняется пеплом и огнём. Град горящих камней обрушивается на корабль, и пламя быстро начинает распространяться. Когда я с ужасом смотрю на это, паруса загораются, и огонь перекидывается с мачты на палубу.\n\nСреди криков паники и боли вокруг меня поднимается невыносимый жар. Не думая, я прыгаю в бушующие воды внизу, только чтобы увидеть, как корабль тонет прямо у меня на глазах. Я отчаянно гребу, чтобы отплыть подальше от обломков..."
 agot_sailing.3937.a: "$agot_sailing.3903.a$"

 agot_sailing.5500.t: "Охота на морских созданий"
 agot_sailing.5500.desc: "Когда наше судно отплывает дальше в просторы океана, ко мне подходит [first_mate.GetFirstName]. «Мы следим за любыми обитателями океана, капитан. Как только кто-то что-то заметит, вы будете [Select_CString(ROOT.Char.IsFemale, 'первой', 'первым' )], кому сообщат».\n\nЯ киваю, чувствуя, как растёт моё предвкушение. Интересно, с каким существом мы столкнемся сегодня?"
 agot_sailing.5500.desc.a: "Оставив позади нашу предыдущую встречу, я приказываю команде продолжать внимательно следить за горизонтом. Мы найдем еще одного морского обитателя, в этом я [Select_CString(ROOT.Char.IsFemale, 'уверена', 'уверен' )]..."
 agot_sailing.5500.a: "Держите себя в руках, парни!"
 agot_sailing.5500.a.tt: "Вы отправитесь охотиться на #high морских созданий#!"

 agot_sailing.5501.t: "Замечена добыча"
 agot_sailing.5501.desc.a: "Проходит совсем немного времени, и раздаётся оклик. «Капитан, замечена черепаха!»\n\nРядом с нашим судном лениво плывёт большая зелёная #high морская черепаха#!. «Мы поплывём за ней, капитан?», - спрашивает [first_mate.GetFirstName]."
 agot_sailing.5501.a: "Это будет просто..."
 agot_sailing.5501.a.tt: "Вы решаете поохотиться на #high морскую черепаху#!"

 agot_sailing.5501.desc.b: "Проходит совсем немного времени, и раздаётся оклик. «Капитан, замечен тюлень!»\n\nРядом с нашим судном лениво плавает серый #high тюлень#! «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName]."
 agot_sailing.5501.b: "Плывем за тюленем!"
 agot_sailing.5501.b.tt: "Вы решаете поохотиться на #high тюленя#!"

 agot_sailing.5501.desc.c: "Проходит совсем немного времени, и раздаётся оклик. «Капитан, замечен дельфин!»\n\nРядом с нашим судном с волнением плавает стройный #high белый дельфин#!. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName]."
 agot_sailing.5501.c: "Поохотимся на дельфина."
 agot_sailing.5501.c.tt: "Вы решаете поохотиться на #high белого дельфина#!"

 agot_sailing.5501.desc.d: "Проходит совсем немного времени, и раздаётся оклик. «Капитан, замечен морж!»\n\nНа скалистом островке рядом с нашим судном лениво лежит крупный #high морж#!. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName]."
 agot_sailing.5501.d: "За его бивни дадут хорошую цену!"
 agot_sailing.5501.d.tt: "Вы решаете поохотиться на #high моржа#!"

 agot_sailing.5501.desc.e: "Проходит совсем немного времени, и раздаётся оклик. «Капитан, замечена косатка!»\n\nРядом с нашим судном быстро проплывает внушительная #high косатка#!. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName]."
 agot_sailing.5501.e: "Принесите мой гарпун!"
 agot_sailing.5501.e.tt: "Вы решаете поохотиться на #high косатку#!"

 agot_sailing.5501.desc.f: "Проходит совсем немного времени, и раздаётся оклик. «Кит по правому борту, капитан!»\n\nВ этот момент в воздух вздымается мощный поток воды, и сквозь волны прорывается огромный кит. Это взрослый #high горбатый кит#!. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName]."
 agot_sailing.5501.f: "Пора поохотиться, парни!"
 agot_sailing.5501.f.tt: "Вы решаете поохотиться на #high горбатого кита#!"

 agot_sailing.5501.desc.g: "Проходит совсем немного времени, и раздаётся оклик. «Кит по правому борту, капитан!»\n\nВ этот момент в воздух вздымается мощный поток воды, и сквозь волны прорывается огромный кит. Это взрослый #high чёрный кашалот#!. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName]."
 agot_sailing.5501.g: "Он стоит целое состояние!"
 agot_sailing.5501.g.tt: "Вы решаете поохотиться на #high кашалота#!"

 agot_sailing.5501.desc.h: "Проходит совсем немного времени, и раздается оклик. «Кит прямо по курсу, капитан!»\n\nВ этот момент в воздух вздымается мощный поток воды, и сквозь волны прорывается огромный кит. Это крупный #high синий кит#!, настоящий левиафан. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName]."
 agot_sailing.5501.h: "Какой большой! Поймаем его!"
 agot_sailing.5501.h.tt: "Вы решаете поохотиться на #high синего кита#!"

 agot_sailing.5501.desc.i: "Через несколько часов плавания я [Select_CString(ROOT.Char.IsFemale, 'была поражена', 'был поражен' )] криками страха и шока. «Кракен! Кракен!» - кричат матросы, некоторые уже бегут в страхе.\n\nПохоже, наша добыча нашла нас, а не мы ее. Вода позади нашего корабля взбаламутилась, и вскоре показалась покрытая чешуей голова взрослого #high кракена#! с яростно извивающимися щупальцами.\n\n[first_mate.GetFirstName] подбегает ко мне. «Что будем делать, капитан? Будем ли мы сражаться? Или попытаемся сбежать?»"
 agot_sailing.5501.i: "Я не буду убегать! Готовьтесь к бою, парни!"
 agot_sailing.5501.i.tt: "Вы решаете поохотиться #high кракена#!"

 agot_sailing.5501.desc.j: "Проходит совсем немного времени, и раздаётся оклик. «Кит по правому борту, капитан!»\n\nВ этот момент в воздух вздымается мощный поток воды, и сквозь волны прорывается огромный кит. Корабль сотрясается от мощного удара, сбивая нас с ног. Пока я пытаюсь встать, [first_mate.GetFirstName] подползает ко мне, с белым, как простыня, лицом.\n\n«Эт... это Белый ужас, капитан!», - заикается [first_mate.GetSheHe]. Я [Select_CString(ROOT.Char.IsFemale, 'слышала', 'слышал' )] эти истории: белый кит, обладающий огромным коварством и злобой, по слухам, обитает в водах Студёного моря. Он потопил много кораблей, а теперь... нашёл нас."

 agot_sailing.5501.desc.k: "Долгое время море молчит, как будто сам океан затаил дыхание в ожидании. Мне неспокойно; я вышагиваю взад-вперед возле штурвала корабля. И вот, наконец, впередсмотрящий кричит. «Замечен кит!»\n\nЯ бросаюсь вперед, и мои глаза расширяются в неверии. Он нашел нас. Белый ужас стремительно приближается, проносясь сквозь волны на прямой курс столкновения с нашим кораблем.\n\nЯ закрываю глаза на долю секунды, прежде чем схватить гарпун. «Готовьтесь к бою, парни!», - кричу я, когда белый кит ныряет и начинает свою жестокую атаку."

 agot_sailing.5501.reroll: "\n\nК сожалению, уже слишком поздно продолжать поиски новой добычи, так что придётся обойтись этим"

 agot_sailing.5501.j: "Сегодня Белый ужас сделает свой последний вздох!"
 agot_sailing.5501.j.tt: "Вы решаете поохотиться на #high Белого ужаса#!"

 agot_sailing.5501.k: "Наверняка там есть и другие существа."
 agot_sailing.5501.k.tt: "Вы разворачиваете корабль, чтобы поискать добычу в другом месте."
 agot_sailing.5501.l: "Нам нужно убираться отсюда!"

 sailing.hunt.success: "Затащив свою добычу на борт, вы берете курс на возвращение в порт"
 sailing.hunt.failure.tt: "Вы промахнулись"
 sailing.hunt.failure: "Ваша добыча ныряет, исчезая в глубине"

 agot_sailing.5502.t: "Охота на морскую черепаху"
 agot_sailing.5502.desc: "Я стою на палубе с гарпуном в руке. Команда с нетерпением наблюдает за тем, как я прицеливаюсь в морскую черепаху, проплывающую рядом с кораблем.\n\n«Спокойно», - думаю я про себя, крепче сжимая древко оружия."
 agot_sailing.5502.a: "Сделать глубокий вдох, прицелиться, и..."
 agot_sailing.5502.a.success: "Вы сразили морскую черепаху"

 agot_sailing.5503.t: "Охота на тюленя"
 agot_sailing.5503.desc: "Я стою на палубе с гарпуном в руке. Команда с нетерпением наблюдает за тем, как я прицеливаюсь в серого тюленя, плывущего рядом с кораблем.\n\n«Спокойно», - думаю я про себя, крепче сжимая древко оружия."
 agot_sailing.5503.a: "Сделать глубокий вдох, прицелиться, и..."
 agot_sailing.5503.a.success: "Вы сразили тюленя"

 agot_sailing.5504.t: "Охота на дельфина"
 agot_sailing.5504.desc: "Я стою на палубе с гарпуном в руке. Команда с нетерпением наблюдает за тем, как я прицеливаюсь в стройного дельфина, плывущего рядом с кораблем.\n\n«Спокойно», - думаю я про себя, крепче сжимая древко оружия."
 agot_sailing.5504.a: "Сделать глубокий вдох, прицелиться, и..."
 agot_sailing.5504.a.success: "Вы сразили дельфина"

 agot_sailing.5505.t: "Охота на моржа"
 agot_sailing.5505.desc: "Я стою на палубе с гарпуном в руке. Команда с нетерпением наблюдает за тем, как я прицеливаюсь в большого моржа, отдыхающего на близлежащем островке.\n\n«Спокойно», - думаю я про себя, крепче сжимая древко оружия."
 agot_sailing.5505.a: "Сделать глубокий вдох, прицелиться, и..."
 agot_sailing.5505.a.success: "Вы сразили моржа"

 agot_sailing.5506.t: "Охота на косатку"
 agot_sailing.5506.desc: "Я стою на палубе с гарпуном в руке. Команда с нетерпением наблюдает за тем, как я прицеливаюсь в грозную касатку, рыскающую в водах рядом с кораблем.\n\n«Спокойно», - думаю я про себя, крепче сжимая древко оружия."
 agot_sailing.5506.a: "Сделать глубокий вдох, прицелиться, и..."
 agot_sailing.5506.a.success: "Вы сразили косатку"

 agot_sailing.5507.t: "Охота на горбатого кита"
 agot_sailing.5507.desc: "Я стою на палубе с гарпуном в руке. Команда с нетерпением наблюдает за тем, как я прицеливаюсь в серого горбатого кита, бороздящего воды рядом с кораблем.\n\n«Спокойно», - думаю я про себя, крепче сжимая древко оружия."
 agot_sailing.5507.a: "Сделать глубокий вдох, прицелиться, и..."
 agot_sailing.5507.a.success: "Вы сразили горбатого кита"

 agot_sailing.5508.t: "Охота на кашалота"
 agot_sailing.5508.desc: "Я стою на палубе с гарпуном в руке. Команда с нетерпением наблюдает за тем, как я прицеливаюсь в могучего черного кашалота, проносящегося по поверхности воды рядом с кораблем.\n\n«Спокойно», - думаю я про себя, крепче сжимая древко оружия."
 agot_sailing.5508.a: "Сделать глубокий вдох, прицелиться, и..."
 agot_sailing.5508.a.success: "Вы сразили кашалота"

 agot_sailing.5509.t: "Охота на синего кита"
 agot_sailing.5509.desc: "Я стою на палубе с гарпуном в руке. Команда с нетерпением наблюдает за тем, как я прицеливаюсь в величественного синего кита, проплывающего прямо под поверхностью океана рядом с кораблем.\n\n«Спокойно», - думаю я про себя, крепче сжимая древко оружия."
 agot_sailing.5509.a: "Сделать глубокий вдох, прицелиться, и..."
 agot_sailing.5509.a.success: "Вы сразили синего кита"

 agot_sailing.5510.t: "Охота на кракена"
 agot_sailing.5510.desc: "Вокруг корабля воцаряется полный хаос, когда страшный кракен начинает своё нападение. Моряки кричат от страха, некоторые отбрасывают руки в сторону, пытаясь спастись от гнева существа. Его могучие щупальца врезаются в корпус корабля, посылая по нему ударные волны, которые повергают многих членов моей команды на землю.\n\nЛучники обстреливают чудовище, отвлекая и еще больше разъяряя его. Его голова с клювом вздымается в гневе и стремительно приближается к носу корабля, где теперь стою я с гарпуном в руке. В оставшиеся до удара секунды я крепко сжимаю древко оружия. Это единственный шанс, который у меня есть, и я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] его использовать."
 agot_sailing.5510.a: "Пришёл твой конец, мерзкая тварь!"
 agot_sailing.5510.a.success: "Вы сразили кракена"
 agot_sailing.5510.a.failure: "Кракен отбивает ваш гарпун своими щупальцами"
 agot_sailing.5510.b: "Пора трубить в рог!"
 agot_sailing.5510.b_tt: "Вы трубите в рог в надежде отвлечь кракена"

 agot_sailing.5511.t: "Охота на Белого ужаса"
 agot_sailing.5511.desc: "Еще одна ударная волна проходит через корабль. Его корпус треснул, корабль начинает крениться. Я судорожно пытаюсь разглядеть чудовище, но оно слишком быстро. Нырнув глубоко под корабль, оно врезается своим квадратным лбом в нашу лодку снизу, отправляя в полет нескольких членов экипажа. Белый ужас появляется из волн прямо перед кораблем и смотрит мне в глаза. Я узнаю его коварство и чувствую, как по позвоночнику пробегают мурашки. Это враг, которому нет равных в морях Вестероса. И все же Белый ужас выдал себя, хотя бы на мгновение, осмелившись насмехаться надо мной. Я поспешно готовлю гарпун, как раз в тот момент, когда чудовище торжествующе ревет и готовится к новому нападению..."
 agot_sailing.5511.desc.a: "Я чувствую, как крепко сжимаю гарпун, костяшки пальцев побелели. «На этот раз ты #italic не#! уйдёшь, тварь», - бормочу я про себя, когда очередная ударная волна сотрясает весь корабль, отправляя в полет многих членов команды.\n\nНо мои шаги остаются твердыми. Я [Select_CString(ROOT.Char.IsFemale, 'полна', 'полон' )] решимости убить этого монстра и покончить с его мерзким существованием раз и навсегда.\n\nЯ подхожу к штурвалу корабля и вижу, как Белый ужас торжествующе возвышается прямо передо мной. Он смотрит мне в глаза, бросая вызов. #italic Насмехается#! надо мной. Гнев захлестывает меня, я поднимаю руку и прицеливаюсь..."
 agot_sailing.5511.a: "Ты мой, тварь..."
 agot_sailing.5511.a.success: "Вы сразили Белого ужаса!"
 agot_sailing.5511.a.failure: "Белый ужас уклоняется от вашего гарпуна"

 agot_sailing.5512.t: "Проклятие Белого ужаса"
 agot_sailing.5512.desc: "Наш корабль бредет по океану, потрепанный и едва держащийся на плаву. Белый ужас исчез в внезапно возникшем тумане.\n\nЯ не в силах говорить, все еще не оправившись от встречи с этим злобным китом. Я все еще чувствую на себе его пронзительный взгляд. Наблюдает за мной. Ждет меня. Он где-то там, наслаждаясь разрушениями, которые он причинил. Во мне поднимается гнев, и я сжимаю кулаки в бессильной ярости.\n\nЭтого нельзя стерпеть!"
 agot_sailing.5512.a: "Я тебя #italic достану#!, тварь!"
 agot_sailing.5512.b: "Нет, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )]... Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] отпустить..."
 agot_sailing.5512.c: "Неудача - великий учитель..."

 agot_sailing.5600.t: "Поиски добычи"
 agot_sailing.5600.desc: "Когда наше судно уходит всё дальше в открытый океан, я слышу, как разговаривают [host.GetTitledFirstName] и [first_mate.GetFirstName]. «Мы следим за любыми обитателями морских глубин, капитан», - объясняет [first_mate.GetFirstName]. «Как только кто-то что-то заметит, вы узнаете об этом первыми».\n\nЯ поворачиваюсь к безмятежному океану и задаюсь вопросом, с каким существом мы столкнёмся сегодня.\n\nНекоторое время спустя я слышу шум на грот—мачте - вахтенный что-то заметил!"
 agot_sailing.5600.a: "Охота началась!"

 agot_sailing.5601.t: "Успех!"
 agot_sailing.5601.desc.a: "«Капитан, замечена черепаха!»\n\nРядом с нашим судном лениво плывёт большая зелёная #high морская черепаха#!. «Мы поплывём за ней, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в черепаху и...\n\n#italic Удар!#! Прямое попадание! Довольно скоро зелёную тушу черепахи втаскивают на борт."
 agot_sailing.5601.desc.b: "«Капитан, замечен тюлень!»\n\nРядом с нашим судном лениво плавает серый #high тюлень#! «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в тюленя и...\n\n#italic Удар!#! Прямое попадание! Довольно скоро серую тушу тюленя втаскивают на борт."
 agot_sailing.5601.desc.c: "«Капитан, замечен дельфин!»\n\nРядом с нашим судном с волнением плавает стройный #high белый дельфин#!. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в дельфина и...\n\n#italic Удар!#! Прямое попадание! Довольно скоро белую тушу дельфина втаскивают на борт."
 agot_sailing.5601.desc.d: "«Капитан, замечен морж!»\n\nНа скалистом островке рядом с нашим судном лениво лежит крупный #high морж#!. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в моржа и...\n\n#italic Удар!#! Прямое попадание! Довольно скоро бугристую тушу моржа втаскивают на борт."
 agot_sailing.5601.desc.e: "«Капитан, замечена косатка!»\n\nРядом с нашим судном быстро проплывает внушительная #high косатка#!. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в косатку и...\n\n#italic Удар!#! Прямое попадание! Довольно скоро мускулистую тушу косатки втаскивают на борт."
 agot_sailing.5601.desc.f: "«Кит по правому борту, капитан!»\n\nВ этот момент в воздух вздымается мощный поток воды, и сквозь волны прорывается огромный кит. Это взрослый #high горбатый кит#!. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в кита и...\n\n#italic Удар!#! Прямое попадание! Но одного этого недостаточно, чтобы убить такое существо. Другие моряки готовят свои снаряды, нанося дополнительные удары по истекающему кровью киту. После долгой борьбы массивную тушу горбатого кита наконец поднимают на борт."
 agot_sailing.5601.desc.g: "«Кит по правому борту, капитан!»\n\nВ этот момент в воздух вздымается мощный поток воды, и сквозь волны прорывается огромный кит. Это взрослый #high чёрный кашалот#!. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в кашалота и...\n\n#italic Удар!#! Прямое попадание! Но одного этого недостаточно, чтобы убить такое существо. Другие моряки готовят свои снаряды, нанося дополнительные удары по истекающему кровью киту. После долгой борьбы могучую тушу кашалота наконец поднимают на борт."
 agot_sailing.5601.desc.h: "«Кит прямо по курсу, капитан!»\n\nВ этот момент в воздух вздымается мощный поток воды, и сквозь волны прорывается огромный кит. Это крупный #high синий кит#!, настоящий левиафан. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в кита и...\n\n#italic Удар!#! Прямое попадание! Но одного этого недостаточно, чтобы убить такое существо. Другие моряки готовят свои снаряды, нанося дополнительные удары по истекающему кровью киту. После долгой борьбы гигантскую тушу синего кита наконец поднимают на борт."
 agot_sailing.5601.desc.i: "Через несколько часов плавания я [Select_CString(ROOT.Char.IsFemale, 'была поражена', 'был поражен' )] криками страха и шока. «Кракен! Кракен!» - кричат матросы, некоторые уже бегут в страхе.\n\nПохоже, наша добыча нашла нас, а не мы ее. Вода позади нашего корабля взбаламутилась, и вскоре показалась покрытая чешуей голова взрослого #high кракена#! со скользким клювом, щёлкающим с отвратительным воем.\n\nЯ вижу, как [first_mate.GetFirstName] подбегает к капитану. «Что будем делать, капитан? Будем сражаться или попытаемся сбежать?»\n\n«Я не убегу!», - восклицает [host.GetTitledFirstNameNoTooltip]. «Готовьтесь к бою, парни!»\n\nКракен - страшное чудовище, и многие моряки попадают под его щупальца и с криками утаскиваются на глубину. Как раз в тот момент, когда я начинаю опасаться, что корабль может погибнуть, гарпун пронзает глаз существа, полностью исчезая в мягкой выпуклой плоти. Оно кричит — громче, чем когда-либо прежде. И затем... он обмякает. Наконец, зверь убит."
 agot_sailing.5601.desc.i_two: "Через несколько часов плавания я [Select_CString(ROOT.Char.IsFemale, 'была поражена', 'был поражен' )] криками страха и шока. «Кракен! Кракен!» - кричат матросы, некоторые уже бегут в ужасе.\n\nПохоже, наша добыча нашла нас, а не мы ее. Вода позади нашего корабля взбаламутилась, и вскоре показалась покрытая чешуей голова воистину чудовищного #high кракена#! со скользким клювом, щёлкающим с отвратительным воем.\n\nЯ вижу, как [first_mate.GetFirstName] подбегает к капитану. «Что будем делать, капитан? Будем сражаться или попытаемся сбежать?»\n\n«Я не убегу!», - восклицает [host.GetTitledFirstNameNoTooltip]. «Готовьтесь к бою, парни!»\n\nКракен - страшное чудовище, и многие моряки попадают под его щупальца и с криками утаскиваются на глубину. [host.GetTitledFirstNameNoTooltip] трубит в свой рог кракена, и громовой клич отвлекает огромного зверя ровно на столько, чтобы гарпун вонзился в глаз твари, полностью исчезнув в мягкой выпуклой плоти. Он визжит — громче, чем когда-либо прежде. И затем... он обмякает. Наконец, зверь убит."
 agot_sailing.5601.desc.j: "Охота проходит неудачно. В течение нескольких часов не было замечено ни одного живого существа, и я начинаю скучать. Как раз в этот момент позади меня раздаётся испуганный крик. «Кит по правому борту, капитан!»\n\nВ то же мгновение в воздух взметывается огромный столб воды, и огромная фигура кита прорывается сквозь волны. Корабль сотрясается от мощного удара, сбивающего нас с ног. Пока я пытаюсь подняться, [first_mate.GetFirstName] ползёт ко мне с белым, как полотно, лицом.\n\n«Эт... это Белый ужас... Ужас морей!», - заикается [first_mate.GetSheHe]. Я [Select_CString(ROOT.Char.IsFemale, 'слышала', 'слышал' )] рассказы о белом ките, обладающем ужасной хитростью и злобой, который, как говорят, бродит по этим водам подобно гигантскому призраку. Он потопил много кораблей, а теперь... он нашёл нас.\n\n«Приготовиться к бою!», - кричит [host.GetTitledFirstNameNicknamed], хватаясь за гарпун. Корабль получает ещё один удар, и меня швыряет в бочку с провизией, прикреплённую к палубе. Когда я поднимаюсь на ноги, то вижу, как Белый ужас встает на дыбы с оглушительным воем боли — каким-то образом гарпун пронзил его сердце. Сегодня мы покончили с легендой."
 agot_sailing.5601.desc.k: "Долгое время море оставалось безмолвным, словно сам океан затаил дыхание в ожидании. Я беспокойно расхаживаю возле штурвала корабля. Затем, наконец, вахтенный кричит: «Замечен кит!»\n\nЯ бросаюсь вперёд, и мои глаза расширяются от изумления. Он снова нашёл нас. Белый ужас быстро приближается, рассекая волны, прямо навстречу нашему кораблю.\n\nЯ на долю секунды закрываю глаза, прежде чем схватить один из гарпунов. На этот раз, клянусь, я не буду сидеть сложа руки, наблюдая, как белый кит ныряет и начинает своё яростное нападение.\n\nКорабль сотрясается от мощного удара, и я слышу, как подо мной трещит дерево. Я крепче сжимаю гарпун, заставляя себя выпрямиться. Собрав остатки сил, я швыряю оружие в Белого ужаса, пронзая его грудь насквозь, когда он поднимается для новой атаки. Он издаёт оглушительный вой боли... а затем, всё время дергаясь, умирает."
 agot_sailing.5601.a: "Отлично!"

 agot_sailing.5602.t: "Провал..."
 agot_sailing.5602.desc.a: "«Капитан, замечена черепаха!»\n\nРядом с нашим судном лениво плывёт большая зелёная #high морская черепаха#!. «Мы поплывём за ней, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в черепаху и...\n\n#italic Промах!#! Черепаха бесшумно скользит под воду и исчезает."
 agot_sailing.5602.desc.b: "«Капитан, замечен тюлень!»\n\nРядом с нашим судном лениво плавает пухлый #high серый тюлень#! «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в тюленя и...\n\n#italic Промах!#! Тюлень издаёт возмущённый вопль, ныряет и исчезает."
 agot_sailing.5602.desc.c: "«Капитан, замечен дельфин!»\n\nРядом с нашим судном с волнением плавает стройный #high белый дельфин#!. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в дельфина и...\n\n#italic Промах!#! Дельфин испуганно взвизгивает, ныряет и исчезает."
 agot_sailing.5602.desc.d: "«Капитан, замечен морж!»\n\nНа скалистом островке рядом с нашим судном лениво лежит крупный #high морж#!. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в моржа и...\n\n#italic Промах!#! Морж издаёт сердитый вой, ныряет в волны и исчезает."
 agot_sailing.5602.desc.e: "«Капитан, замечена косатка!»\n\nРядом с нашим судном быстро проплывает внушительная #high косатка#!. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в косатку и...\n\n#italic Промах!#! Косатка издаёт испуганный вопль, ныряет и исчезает."
 agot_sailing.5602.desc.f: "«Кит по правому борту, капитан!»\n\nВ этот момент в воздух вздымается мощный поток воды, и сквозь волны прорывается огромный кит. Это взрослый #high горбатый кит#!. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в кита и...\n\n#italic Промах!#! Горбатый кит отворачивается от корабля, ныряет и исчезает."
 agot_sailing.5602.desc.g: "«Кит по правому борту, капитан!»\n\nВ этот момент в воздух вздымается мощный поток воды, и сквозь волны прорывается огромный кит. Это взрослый #high чёрный кашалот#!. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в кашалота и...\n\n#italic Промах!#! Кашалот бьёт хвостом по борту корабля, раскачивая его так сильно, что я спотыкаюсь. Затем он ныряет и исчезает."
 agot_sailing.5602.desc.h: "«Кит прямо по курсу, капитан!»\n\nВ этот момент в воздух вздымается мощный поток воды, и сквозь волны прорывается огромный кит. Это крупный #high синий кит#!, настоящий левиафан. «Мы поплывем за ним, капитан?», - спрашивает [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] хватает гарпун, целится в кита и...\n\n#italic Промах!#! Синий кит реагирует быстро. Он отворачивает от нашего корабля и ныряет, исчезая из виду."
 agot_sailing.5602.desc.i: "Через несколько часов плавания я [Select_CString(ROOT.Char.IsFemale, 'была поражена', 'был поражен' )] криками страха и шока. «Кракен! Кракен!» - кричат матросы, некоторые уже бегут в страхе.\n\nПохоже, наша добыча нашла нас, а не мы ее. Вода позади нашего корабля взбаламутилась, и вскоре показалась покрытая чешуей голова взрослого #high кракена#! со скользким клювом, щёлкающим с отвратительным воем.\n\nЯ вижу, как [first_mate.GetFirstName] подбегает к капитану. «Что будем делать, капитан? Будем сражаться или попытаемся сбежать?»\n\n«Я не убегу!», - восклицает [host.GetTitledFirstNameNoTooltip]. «Готовьтесь к бою, парни!»\n\nКракен - страшное чудовище, и многие моряки попадают под его щупальца и утаскиваются на глубину. Гарпуны просто отскакивают его скользкой кожи. Он не умрёт! К счастью для нас, кракен, наконец, теряет интерес и ныряет, унося с собой множество несчастных душ и оставляя нас ни с чем, кроме ран и поврежденного корабля."
 agot_sailing.5602.desc.i_two: "Через несколько часов плавания я [Select_CString(ROOT.Char.IsFemale, 'была поражена', 'был поражен' )] криками страха и шока. «Кракен! Кракен!» - кричат матросы, некоторые уже бегут в ужасе.\n\nПохоже, наша добыча нашла нас, а не мы ее. Вода позади нашего корабля взбаламутилась, и вскоре показалась покрытая чешуей голова воистину чудовищного #high кракена#! со скользким клювом, щёлкающим с отвратительным воем.\n\nЯ вижу, как [first_mate.GetFirstName] подбегает к капитану. «Что будем делать, капитан? Будем сражаться или попытаемся сбежать?»\n\n«Я не убегу!», - восклицает [host.GetTitledFirstNameNoTooltip]. «Готовьтесь к бою, парни!»\n\nКракен - страшное чудовище, и многие моряки попадают под его щупальца и утаскиваются на глубину. [host.GetTitledFirstNameNoTooltip] трубит в свой рог кракена, привлекая внимание зверя, но раненый и окруженный со всех сторон, монстр проявляет слишком сильную волю к выживанию, чтобы оставаться послушным дольше, чем на мгновение. Гарпуны просто отскакивают с его скользкой кожи. Он не умрёт! К счастью для нас, кракен в конце концов теряет интерес и ныряет, унося с собой множество несчастных душ и оставляя нас ни с чем, кроме ран и повреждённого корабля."
 agot_sailing.5602.desc.j: "Охота проходит неудачно. В течение нескольких часов не было замечено ни одного живого существа, и я начинаю скучать. Как раз в этот момент позади меня раздаётся испуганный крик. «Кит по правому борту, капитан!»\n\nВ то же мгновение в воздух взметывается огромный столб воды, и огромная фигура кита прорывается сквозь волны. Корабль сотрясается от мощного удара, сбивающего нас с ног. Пока я пытаюсь подняться, [first_mate.GetFirstName] ползёт ко мне с белым, как полотно, лицом.\n\n«Эт... это Белый ужас... Ужас морей!», - заикается [first_mate.GetSheHe]. Я [Select_CString(ROOT.Char.IsFemale, 'слышала', 'слышал' )] рассказы о белом ките, обладающем ужасной хитростью и злобой, который, как говорят, бродит по этим водам подобно гигантскому призраку. Он потопил много кораблей, а теперь... он нашёл нас.\n\n«Приготовиться к бою!», - кричит [host.GetTitledFirstNameNicknamed], хватаясь за гарпун. Корабль получает ещё один удар, и меня швыряет в бочку с провизией, прикреплённую к палубе. Когда я поднимаюсь на ноги, я вижу, как Белый ужас поднимается с оглушительным торжествующим воем — он разорвал наш корабль почти в клочья и считает нас побеждёнными. Когда он ныряет, я чувствую, как моё сердце колотится громче, чем когда-либо прежде. Боюсь, это чудовище будет преследовать меня в ночных кошмарах..."
 agot_sailing.5602.desc.k: "Долгое время море оставалось безмолвным, словно сам океан затаил дыхание в ожидании. Я беспокойно расхаживаю возле штурвала корабля. Затем, наконец, вахтенный кричит: «Замечен кит!»\n\nЯ бросаюсь вперёд, и мои глаза расширяются от изумления. Он снова нашёл нас. Белый ужас быстро приближается, рассекая волны, прямо навстречу нашему кораблю.\n\nЯ на долю секунды закрываю глаза, прежде чем схватить один из гарпунов. На этот раз, клянусь, я не буду сидеть сложа руки, наблюдая, как белый кит ныряет и начинает своё яростное нападение.\n\nКорабль сотрясается от мощного удара, и я слышу, как подо мной трещит дерево. Я крепче сжимаю гарпун, заставляя себя выпрямиться. Собрав остатки сил, я швыряю оружие в Белого ужаса — только для того, чтобы он с надменной лёгкостью уклонился от моего броска! Кит встаёт на дыбы с оглушительным торжествующим воем — он разорвал наш корабль почти в клочья и снова считает нас побеждёнными. Почти насмешливо он выбрасывает в воздух огромную струю воды, прежде чем снова нырнуть под волны."
 agot_sailing.5602.a: "Мы были так близки..."

 agot_sailing.5603.t: "Белый ужас ускользает"
 agot_sailing.5603.desc: "Море сегодня спокойное, даже почти безмятежное. Я стою на палубе, наблюдая, как волны мягко ударяются о корпус нашего судна. И тут мой взгляд улавливает движение под тёмной поверхностью воды. Там, внизу, что—то есть - белое пятно, которое становится всё больше и больше, и—\n\nС оглушительным треском огромное существо раскачивает корабль и сбрасывает меня вниз. Когда я снова встаю на ноги, то вижу, как из волн поднимается на дыбы необычно белый кит, его красные глаза устремлены на наш корабль.\n\n«Эт... это Белый ужас... Ужас морей!», - заикается кто-то. Я [Select_CString(ROOT.Char.IsFemale, 'слышала', 'слышал' )] рассказы о белом ките, который отличается невероятной хитростью и злобой и, как говорят, бродит по этим водам подобно гигантскому призраку. Он потопил много кораблей, и теперь... он нашёл нас.\n\nНо Белый ужас, похоже, не заинтересован в сражении. Он кружит вокруг нашего корабля в течение нескольких ужасающих минут, оставаясь вне досягаемости гарпуна, а затем, издеваясь над нами струей воды из своего дыхала, ныряет под волны и исчезает."
 agot_sailing.5603.a: "Что это #italic был#! за монстр?"

 # Sunken Treasure events
 agot_sailing.6000.toast: "Вы украли карту сокровищ во время осады."
 agot_sailing.6000.toast_desc: "Вы нашли коллекцию записей, указывающих на провинцию [sunken_ship_province.GetName], где пропало богатое торговое судно."

 agot_sailing.6001.t: "Поиски обломков"
 agot_sailing.6001.desc: "Когда мы плывём вдоль побережья, я снова сверяюсь с картой. Мы приближаемся к последнему известному местоположению корабля. Он должен быть где-то здесь, на дне океана.\n\n[first_mate.GetName] выставляет дозорных для поиска любых признаков обломков по моему приказу. Я также приказываю подготовить водолазный колокол. Когда мы найдём крушение, я хочу быть [Select_CString(ROOT.Char.IsFemale, 'готовой', 'готовым' )] к погружению как можно скорее.\n\nИнтересно, какие сокровища скрыты на дне океана!"
 agot_sailing.6001.a: "Обыскать всё!"
 agot_sailing.6001.a.success.tt: "Вы находите признаки обломков"
 agot_sailing.6001.a.failure.tt: "Вам не удаётся найти никаких следов корабля"

 agot_sailing.6002.t: "Подготовка к погружению"
 agot_sailing.6002.desc: "«[Select_CString(host.IsFemale, 'Миледи', 'Милорд' )]!»\n\n[first_mate.GetName] кричит, чтобы привлечь моё внимание, когда я смотрю на море.\n\nЯ направляюсь туда, где [first_mate.GetSheHe] стоит у борта, всматриваясь в воду неподалёку от того места, где мы стоим на якоре, — и тут я вижу это.\n\nДалеко под спокойной водой лежат обломки корабля!"
 agot_sailing.6002.a: "Пора поплавать!"
 agot_sailing.6002.b: "Это слишком опасно."

 agot_sailing.6003.t: "Погружение в глубины"
 agot_sailing.6003.desc: "Когда колокол начинает опускаться, я следую за ним в глубину, пока он не достигает дна. По мере того как мы опускаемся всё глубже под волны, я оглядываюсь, чтобы сориентироваться.\n\nКорабль, который я [Select_CString(ROOT.Char.IsFemale, 'пришла', 'пришёл' )] осмотреть в поисках добычи, разбит вдребезги, его останки разбросаны по морскому дну.\n\nЯ не могу сказать, какие опасности могут таиться среди обломков и какие сокровища ещё могут быть скрыты здесь, но мысль о несметных богатствах заставляет моё сердце биться чаще."
 agot_sailing.6003.a: "Посмотрим, что я смогу найти!"

 agot_sailing.6004.t: "Белый кит!"
 agot_sailing.6004.desc: "Когда я приближаюсь к обломкам, я не могу не заметить, как пустынны эти воды. Среди руин не притаились никакие хищники, и почти ни одной рыбы не плавает поблизости.\n\nКогда я размышляю об этом тревожном безмолвии, я слышу далёкий зов огромного зверя.\n\nБелый кит!\n\nЯ наконец замечаю его вдалеке. Должно быть, поэтому ни одно другое существо не осмеливается приблизиться. Благословение от самой величественной зверюги!\n\nЯ могу тщательно обыскать крушение и забрать все сокровища, которые ещё остались."
 agot_sailing.6004.a: "Вернём это сокровище на корабль."

 agot_sailing.6005.t: "Акулы преграждают путь"
 agot_sailing.6005.desc: "Стая акул кружит вокруг пути, ведущего к обломкам. Я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] бы попытаться пробиться сквозь них или попытаться проскользнуть мимо. В противном случае, возможно, придётся отказаться от сокровищ, если опасность окажется слишком велика."
 agot_sailing.6005.a: "Я пробьюсь силой!"
 agot_sailing.6005.a.success: "Вы отгоняете акул"
 agot_sailing.6005.toast.a.success: "Вы пробиваетесь мимо акул и достигаете сокровищ"
 agot_sailing.6005.a.failure: "Акулы оказываются слишком серьёзным препятствием"
 agot_sailing.6005.toast.a.failure: "Акулы одолевают вас, вынуждая бежать"
 agot_sailing.6005.b: "Я могу осторожно обойти их."
 agot_sailing.6005.b.success: "Вы незаметно проходите мимо акул"
 agot_sailing.6005.toast.b.success: "Вы проскальзываете мимо акул и достигаете сокровищ"
 agot_sailing.6005.b.failure: "Вам не удаётся незаметно пройти мимо акул"
 agot_sailing.6005.toast.b.failure: "Акулы замечают вас и вынуждают бежать"
 agot_sailing.6005.c: "Это слишком опасно."

 agot_sailing.6006.t: "В этих тёмных глубинах"
 agot_sailing.6006.desc: "Чудовищные видения часто являются дурными предзнаменованиями, и мои нервы напряжены, когда я наблюдаю за разворачивающейся передо мной сценой: чудовище с щупальцами, несомненно, легендарный кракен, извивается и сплетается со своей добычей... огромным серым китом вдвое больше моего флагмана.\n\nНо сокровище, покоящееся ниже, уже так близко. Погружение впереди опасно, но могу ли я действительно позволить себе повернуть назад?"
 agot_sailing.6006.a: "Сокровище стоит риска!"
 agot_sailing.6006.a.success: "Вы скрылись с сокровищем"
 agot_sailing.6006.toast.a.success: "Вы вернулись на корабль с сокровищем"
 agot_sailing.6006.a.failure: "Вы попадаете в битву между исполинами"
 agot_sailing.6006.toast.a.failure: "Вы ранены в схватке исполинов"
 agot_sailing.6006.b: "Вы не станете рисковать жизнью ради этого!"
 death_by_kraken: "@death_icon! Вас раздавил кракен"

 agot_sailing.6007.t: "Бесполезное путешествие"
 agot_sailing.6007.desc: "[host.GetTitledFirstName] возвращается на безопасный корабле, но без каких-либо сокровищ в качестве результата экспедиции. [host.GetSheHe|U] [Select_CString(ROOT.Char.IsFemale, 'привела', 'привёл' )] всех нас сюда, и теперь [host.GetHerHis] неудача — это всё, что у нас будет..."
 agot_sailing.6007.a: "Пора возвращаться домой."

 agot_sailing.6010.t: "Возвращение капитана"
 agot_sailing.6010.desc_big: "[host.GetTitledFirstName] возвращается с сундуком, извлечённым из обломков. Хотя он заржавел и разбух от долгих лет под водой, его быстро вскрывают, и открывается огромное богатство, которое давно считалось потерянным в пучине."
 agot_sailing.6010.desc_normal: "[host.GetTitledFirstName] возвращается с сундуком, извлечённым из обломков. Хотя он заржавел и разбух от долгих лет под водой, его быстро вскрывают, и открывается сокровище, давно считавшееся потерянным в пучине."
 agot_sailing.6010.desc_small: "[host.GetTitledFirstName] возвращается с сундуком, извлечённым из обломков. Хотя он заржавел и разбух от долгих лет под водой, его быстро вскрывают, и открывается небольшое сокровище, давно считавшееся потерянным в пучине."
 agot_sailing.6010.desc: "[host.GetTitledFirstName] возвращается без сокровищ. Обломки оказались слишком опасными, чтобы добраться до них, и экспедиция не принесла никаких результатов."
 agot_sailing.6010.a: "Пора возвращаться домой."

 agot_sailing.6012.t: "Бесполезное путешествие"
 agot_sailing.6012.desc: "Я благополучно возвращаюсь на корабль, но без каких-либо сокровищ в качестве результата экспедиции. Я [Select_CString(ROOT.Char.IsFemale, 'привела', 'привёл' )] всех этих людей сюда, и теперь моя неудача — единственное, что они запомнят."
 agot_sailing.6012.a: "Просто вернёмся домой..."

 agot_sailing.6013.t: "Время поплавать"
 agot_sailing.6013.desc: "«[Select_CString(host.IsFemale, 'Миледи', 'Милорд' )]!»\n\n[first_mate.GetName] кричит, чтобы привлечь внимание капитана, когда [host.GetTitledFirstName] смотрит на море.\n\nЯ присоединяюсь к н[first_mate.GetHerHim] у поручней, всматриваясь в воду неподалёку от того места, где мы стоим на якоре, — и тут я вижу это!\n\nДалеко под спокойной водой лежит затонувший корабль!"
 agot_sailing.6013.a: "Пусть [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )] совершит погружение..."

 agot_sailing.6014.t: "Удачный подъём"
 agot_sailing.6014.desc: "Я возвращаюсь на корабль с сундуком, извлечённым из обломков. Хотя он заржавел и разбух от долгих лет под водой, нам удаётся вскрыть его, и открываются сокровища, давно считавшиеся потерянными в пучине. Наконец-то мы можем оставить это проклятое место позади."
 agot_sailing.6014.vermax_skull: "\n\nНа дне океана я также [Select_CString(ROOT.Char.IsFemale, 'обнаружила', 'обнаружил' )] останки #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('dragon_vermax').GetID] #L Вермакса#!#!. Говорили, что [vermax.GetSheHe] погиб здесь, в Глотке, во время Танца драконов. Кто мог представить, что мы обнаружим место [vermax.GetHerHis] упокоения в поисках сокровищ?"
 agot_sailing.6014.a: "Достойный улов!"
 agot_sailing.6014.a_generic_artifact: "#V Вы#! получили [Concept('artifact', 'артефакт')|E] - [generic_artifact.GetNameNoTooltip]"
 agot_sailing.6014.a_valyrian_steel_sword: "#V Вы#! получили [Concept('artifact', 'артефакт')|E] - [valyrian_steel_sword.GetNameNoTooltip]"
 agot_sailing.6014.a_spare: "#V Вы#! получили [Concept('artifact', 'артефакт')|E] - [spare.GetNameNoTooltip]"
 found_new_map: "Вы нашли новую карту сокровищ"

 # Sailing:0 End results
 agot_sailing.9001.t: "Конец путешествия" #(Mariner trait +1)
 agot_sailing.9001.desc: "Моё долгое путешествие подходит к концу, когда мой корабль возвращается в порт. Я чувствую чувство достижения, и я, безусловно, [Select_CString(ROOT.Char.IsFemale, 'улучшила', 'улучшил' )] свои навыки мореплавания. С некоторым сожалением я признаю, что [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] вернуться к правлению своими землями..."
 agot_sailing.9001.a: "...и всё же моё сердце тоскует по морю."

 agot_sailing.9002.t: "Конец путешествия"
 agot_sailing.9002.desc: "Моё долгое путешествие подходит к концу, когда мой корабль возвращается в порт. Хотя путешествие закончилось не так, как я [Select_CString(ROOT.Char.IsFemale, 'ожидала', 'ожидал' )], теперь мне нужно перевернуть страницу и вернуться к правлению своими землями..."
 agot_sailing.9002.a: "...и всё же моё сердце тоскует по морю."

 # Sailing:0 Go on a raid
 agot_sailing.9100.t: "Пиратские приготовления"
 agot_sailing.9100.desc: "Я иду к докам, втягивая в лёгкие солёный морской воздух. Меня это бодрит, но не так сильно, как вид моего судна на якоре. И на палубе, и в доках кипит жизнь, моя команда загружает провизию, распевая похабные песни.\n\nКвартирмейстер видит, как я приближаюсь, и преувеличенно кланяется. Я улыбаюсь и киваю в ответ, пересекая трап. Мой первый помощник кричит: «Капитан на палубе!» под всеобщие возгласы команды. Они кажутся готовыми и жаждущими действия.\n\nТеперь осталось только определиться с нашей миссией. Выйдем ли мы в открытые воды в поисках добычи или совершим налёт на враждебные берега?"
 agot_sailing.9100.a: "Мы разграбим берега!"
 agot_sailing.9100.b: "Мы будем бороздить открытые воды!"

 agot_sailing.9110.t: "Выбор цели"
 agot_sailing.9110.desc: "Мои офицеры собираются в кают-компании, где я [Select_CString(ROOT.Char.IsFemale, 'разложила', 'разложил' )] на длинном дубовом столе карты. Я [Select_CString(ROOT.Char.IsFemale, 'сообщила', 'сообщил' )] им, что мы собираемся отправиться на корабле в налёт, но я ещё не [Select_CString(ROOT.Char.IsFemale, 'определилась', 'определился' )] с пунктом назначения. Я считаю, что предоставление им права голоса в миссии укрепит их боевой дух, и слушаю, как они обсуждают достоинства каждой цели.\n\nЧерез час дискуссия становится жаркой, и я решаю, что пришло время уладить этот вопрос. Я хлопаю кубком по столу, и матросы замолкают и смотрят на меня в ожидании."
 agot_sailing.9110.a: "Совершим набег на владение [piracy_destination_1.GetName]"
 agot_sailing.9110.b: "Мы разграбим владение [piracy_destination_2.GetName]!"
 agot_sailing.9110.c: "Как насчёт того, чтобы сжечь владение [piracy_destination_3.GetName]?"
 agot_sailing.9110.d: "Похоже, поблизости нет мест для налёта."

 agot_sailing.9111.t: "Замечен морской патруль!"
 agot_sailing.9111.desc: "Когда мы приближаемся к нашей цели, чувство предвкушения возрастает. Чёрные паруса были развёрнуты, и попутный ветер гонит нас вперёд, нос корабля рассекает волны, как отточенный клинок.\n\nВнезапно из вороньего гнезда раздаётся крик - замечен патрульный корабль. Он быстрый и ощетинился вооружёнными членами экипажа. Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] принять решение - атаковать корабль в лоб, попытаться перехитрить его или развернуться и направиться домой..."
 agot_sailing.9111.a: "Приготовиться, матросы! Мы вступим с ними в бой!"
 agot_sailing.9111.a.success: "Вы потопили патрульный корабль"
 agot_sailing.9111.a.failure: "Ваш корабль получает повреждения в бою, но вам удалось отступить."
 agot_sailing.9111.toast.a.success: "Патрульный корабль затонул!"
 agot_sailing.9111.toast.a.failure: "Ваш корабль повреждён!"

 agot_sailing.9111.c: "Поднять паруса! Мы их обгоним!"
 agot_sailing.9111.c.success: "Вы избежали патрульного корабля"
 agot_sailing.9111.c.failure: "Патрульный корабль повреждает ваше судно и вынуждает вас отступить."
 agot_sailing.9111.toast.c.success: "Патрульный корабль уклонился!"
 agot_sailing.9111.toast.c.failure: "Ваш корабль получает повреждения, и вы вынуждены отступить."
 agot_sailing.9111.e: "Это слишком рискованно, развернуть корабль!"

 agot_sailing.9114.t: "Налёт"
 agot_sailing.9114.desc: "Наконец мы видим берег впереди нас, и на горизонте начинают появляться очертания нашей цели. Собираются чайки, кружащие над нашей мачтой. Моя команда собирается на палубе, точит оружие и потягивает ликёр для храбрости.\n\nПришло время решить, как лучше всего получить прибыль от этого гнусного предприятия?"
 agot_sailing.9114.a: "Саботируем производство во владении [selected_piracy_destination.GetName]"
 agot_sailing.9114.a.success: "Вы снижаете [Concept('development', 'развитие')|E] и размер [Concept('garrison', 'гарнизона')|E] во владении [selected_piracy_destination.GetName]"
 agot_sailing.9114.a.failure: "Стражники ранят вас!"
 agot_sailing.9114.toast.a.success: "Провинция саботирована!"
 agot_sailing.9114.toast.a.failure: "Саботаж не удался!"

 agot_sailing.9114.b: "Пора отработать жалованье! Мы разграбим провинцию [selected_piracy_destination.GetName]!"
 agot_sailing.9114.b.success: "Вы разграбили владение [selected_piracy_destination.GetNameNoTooltip]!"
 agot_sailing.9114.b.failure: "Стражники ранят вас!"
 agot_sailing.9114.toast.b.success: "Провинция разграблена!"
 agot_sailing.9114.toast.b.failure: "Грабёж не удался!"

 agot_sailing.9114.c: "[selected_piracy_destination_baron.GetName], выходи на поединок!"
 agot_sailing.9114.c.success: "Вы ранили персонажа [selected_piracy_destination_baron.GetName]!"
 agot_sailing.9114.c.failure: "[selected_piracy_destination_baron.GetName] наносит вам ранение!"
 agot_sailing.9114.toast.c.success: "Вы выиграли поединок!"
 agot_sailing.9114.toast.c.failure: "Вы проиграли поединок!"

 agot_sailing.9114.d: "Мы должны похитить кого-нибудь из жителей деревни!"
 agot_sailing.9114.d.success: "Вы похитили крестьянина!"
 agot_sailing.9114.d.failure: "Стражники ранят вас!"
 agot_sailing.9114.toast.d.success: "Сельский житель похищен!"
 agot_sailing.9114.toast.d.failure: "Похищение не удалось!"

 agot_sailing.9114.e: "Это слишком рискованно, развернуть корабль!"

 agot_sailing.9120.t: "Торговый корабль"
 agot_sailing.9120.desc: "Погода была хорошая, ветер попутный, но мы плыли несколько дней, не замечая ни одного судна. Команда скучает и становится капризной. Я начинаю беспокоиться, что если их энергию не использовать в ближайшее время, они начнут драться между собой. \n\nПотом раздаётся крик - на западном горизонте замечены паруса! Я приказываю развернуть корабль и идти прямо к нашей цели. По мере приближения я позволяю себе улыбнуться - вот приз! Толстый когг, низко плывущий по воде под тяжестью своего груза."
 agot_sailing.9120.a: "Готовьтесь, ребята! Мы разграбим этот купеческий корабль!"
 agot_sailing.9120.a.success: "Вы разграбили торговый корабль!"
 agot_sailing.9120.toast.a.success: "Торговый корабль разграблен!"
 agot_sailing.9120.a.failure: "Оборона слишком сильна..."
 agot_sailing.9120.toast.a.failure: "Атака не удалась!"

 agot_sailing.9120.c: "Зачем топить их, если мы можем захватить корабль себе?"
 agot_sailing.9120.c.success: "Вы похитили и отвели корабль в свою столицу!"
 agot_sailing.9120.toast.c.success: "Торговое судно захвачено!"
 agot_sailing.9120.c.failure: "Оборона слишком сильна..."
 agot_sailing.9120.toast.c.failure: "Захват не удался!"

 agot_sailing.9120.e: "Это слишком рискованно, развернуть корабль!"

 agot_sailing.9130.t: "Схватка пиратов"
 agot_sailing.9130.desc: "Когда мы приближаемся к владению [selected_piracy_destination.GetName], раздаётся крик, что замечены паруса. При ближайшем рассмотрении другого корабля становится ясно, что это непростая цель, а обветренный корабль пиратов, ищущий собственную добычу.\n\nЕсли мы сможем победить его команду, мы можем найти на борту огромные богатства, но это будет рискованное предприятие."
 agot_sailing.9130.a: "Они не заберут наш приз! В атаку!"
 agot_sailing.9130.a.success: "Вы ограбили корабль пиратов!"
 agot_sailing.9130.toast.a.success: "Корабль пиратов разграблен!"
 agot_sailing.9130.a.failure: "Вам не удалось одолеть вражескую команду..."
 agot_sailing.9130.toast.a.failure: "Корабль повреждён!"

 agot_sailing.9130.c: "[dueled_pirate.GetName], выходи на бой!"
 agot_sailing.9130.c.success: "Вы решаете судьбу персонажа [dueled_pirate.GetName]"
 agot_sailing.9130.toast.c.success: "Победа в поединке!"
 agot_sailing.9130.c.failure: "Вы проиграли поединок"
 agot_sailing.9130.toast.c.failure: "Поражение!"

 agot_sailing.9130.d: "Поднять паруса! Мы отступаем!"

 agot_sailing.9131.t: "Капитан [dueled_pirate.GetFirstNameNoTooltip] [Select_CString(dueled_pirate.IsFemale, 'унижена', 'унижен' )]"
 agot_sailing.9131.desc: "После ожесточенной дуэли я, наконец, стою над своим поверженным врагом, [Select_CString(dueled_pirate.IsFemale, 'которая', 'который' )] лежит, скорчившись, на палубе. Обе команды, кажется, застыли на месте, пристально глядя на меня, пока я наслаждаюсь моментом. Задумчивость прерывается мучительным всхлипом [Select_CString(dueled_pirate.IsFemale, 'моей противницы, которая', 'моего противника, который' )] начинает умолять меня о пощаде.\n\nТеперь я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] решить, как лучше всего воспользоваться ситуацией. Я [Select_CString(ROOT.Char.IsFemale, 'доказала', 'доказал' )] свою доблесть, но здесь могут быть и другие возможности..."
 agot_sailing.9131.a: "На гауптвахту!"
 agot_sailing.9131.b: "Море не терпит слабости. [dueled_pirate.GetFirstNameNoTooltip] пройдёт по доске."
 agot_sailing.9131.c: "Вы хорошо сражались, присоединяйтесь к моей команде!"
 agot_sailing.9131.toast.c.success: "[dueled_pirate.GetNameNoTooltip] присоединяется к вашей команде!"
 agot_sailing.9131.d: "У вас опытная команда..."
 agot_sailing.9131.d.success: "Вы набираете вражескую команду"
 agot_sailing.9131.toast.d.success: "Команда завербована!"
 agot_sailing.9131.d.failure: "Вы не можете убедить команду"
 agot_sailing.9131.toast.d.failure: "Команда отказывается присоединиться к вам"
 agot_sailing.9131.e: "Я не [Select_CString(ROOT.Char.IsFemale, 'лишена', 'лишён' )] милосердия. Ступайте!"
 agot_sailing.9131.toast.e.success: "[dueled_pirate.GetNameNoTooltip] [Select_CString(dueled_pirate.IsFemale, 'освобождена', 'освобождён' )]!"

 agot_sailing.9140.t: "Карта среди добычи?"
 agot_sailing.9140.desc: "Когда я обыскиваю каюту поверженного капитана, я нахожу стопку карт. На первый взгляд они кажутся ничем не примечательными, но при ближайшем рассмотрении я обнаруживаю нечто гораздо более ценное — карту сокровищ, ведущую к месту, где видели тонущий корабль.\n\nСогласно сопроводительным документам, судно было нагружено богатствами. Возможно, часть этих сокровищ всё ещё лежит на дне океана? Если у нас есть водолазный колокол, мы могли бы отправиться в плавание и поискать останки!"
 agot_sailing.9140.a: "Мы должны спланировать новое путешествие!"

 agot_sailing.9150.t: "[host.GetTitledFirstNameNoTooltip]: Неудача"
 agot_sailing.9150.desc: "Наши попытки провести успешный налёт провалились, и в этом всецелом [Select_CString(host.IsFemale, 'виновата', 'виноват' )] [host.GetTitledFirstName]. [host.GetHerHis|U] неумелое руководство сбило нас с пути; моё разочарование безмерно, и мой день испорчен."
 agot_sailing.9150.a: "Какое фиаско..."

 agot_sailing.9151.t: "Успешный налёт!"
 agot_sailing.9151.desc: "Наконец мы видим впереди берег, и на горизонте начинает вырисовываться силуэт нашей цели. Чайки кружат над мачтой, пока команда собирается на палубе, точа оружие и прикладываясь к выпивке для храбрости.\n\n[host.GetTitledFirstName] [Select_CString(host.IsFemale, 'определила', 'определил' )] наш план:"
 agot_sailing.9151.desc_sabotaged_production: "Мы саботируем местную инфраструктуру, нанося непоправимый ущерб их средствам производства.\n\nОстальное — размыто, но я отчётливо помню, как [Select_CString(ROOT.Char.IsFemale, 'подожгла', 'поджёг' )] одно или два здания. #EMP Хорошие были времена!#!"
 agot_sailing.9151.desc_pillage_settlement: "Мы разграбим поселение и заберём их монеты себе.\n\nВозможность прикарманить ценности — желанная; не успеваю я оглянуться, как уже на корабле, рассказывая своим товарищам об успешном грабеже. #EMP Вот это всплеск эмоций!#!"
 agot_sailing.9151.desc_duel_the_baron: "[host.GetSheHe|U] сразится с местным правителем, демонстрируя доблесть.\n\n[host.GetHerHis|U] план проходит без сучка и задоринки, [host.GetSheHe] легко ранит своего противника. #EMP Впечатляюще!#!"
 agot_sailing.9151.desc_kidnap_villager: "Мы похитим местных жителей.\n\nНесомненно, [host.GetTitledFirstNameNoTooltip] найдёт им применение в будущем. #EMP Огромный успех!#!"
 agot_sailing.9151.a: "Отлично сработано, [host.GetTitledFirstNameNoTooltip]!"

 agot_sailing.9152.t: "Провальный налёт..."
 agot_sailing.9152.desc: "Наконец мы видим впереди берег, и на горизонте начинает вырисовываться силуэт нашей цели. Чайки кружат над мачтой, пока команда собирается на палубе, точа оружие и прикладываясь к выпивке для храбрости.\n\n[host.GetTitledFirstName] [Select_CString(host.IsFemale, 'определила', 'определил' )] наш план:"
 agot_sailing.9152.desc_sabotaged_production: "Мы саботируем местную инфраструктуру, нанося непоправимый ущерб их средствам производства.\n\nК сожалению, план идёт не по плану; когда я [Select_CString(ROOT.Char.IsFemale, 'попыталась', 'попытался' )] поджечь здание, появилась стража и задала мне трёпку. Следующее, что я помню, — я снова на лодке. #EMP Ой!#!"
 agot_sailing.9152.desc_pillage_settlement: "Мы разграбим поселение и заберём их монеты себе.\n\nК несчастью для нашей команды, поселение хорошо охраняется, и наша попытка прикарманить ценности местных жителей была отбита. #EMP Как жаль!#!"
 agot_sailing.9152.desc_duel_the_baron: "[host.GetSheHe|U] сразится с местным правителем, демонстрируя доблесть.\n\n[host.GetHerHis|U] план идёт не по плану, и [host.GetSheHe] получает ранение в процессе. #EMP Позор!#!"
 agot_sailing.9152.desc_kidnap_villager: "Мы похитим местных жителей.\n\nК сожалению, мы не ожидали, что поселение будет так хорошо охраняться, и наши попытки сорваны. #EMP Проклятье!#!"
 agot_sailing.9152.a: "Могло быть и получше, [host.GetTitledFirstNameNoTooltip]..."

 agot_sailing.9501.t: "[ship_province.GetNameNoTooltip]: Трагедия"
 agot_sailing.9501.desc_intro: "[admiral.GetName] приближается ко мне с письмом. [admiral.GetSheHe|U] хочет сообщить мне о недавней трагедии в море.\n\nКорабль потерпел крушение у берегов владения [ship_province.GetName], выжило очень мало людей."
 agot_sailing.9501.desc_reaction_sadistic: "\n\nИнтересно, почему [admiral.GetSheHe] [Select_CString(admiral.IsFemale, 'решила', 'решил' )] принести эту новость мне. Я чувствую больше сочувствия к потерянному грузу и потраченному золоту, чем к жизням, поглощённым морем."
 agot_sailing.9501.desc_reaction: "\n\nЭто ужасная трагедия. Я не могу не думать о тех, кто потерял свои жизни, и о семьях, оставшихся в горе."
 agot_sailing.9501.desc_reaction_compassionate: "\n\nЭта трагедия разбивает моё сердце. Столько душ потеряно под волнами, столько семей разрушено. Мысль о таких страданиях тяжело ложится на меня."
 agot_sailing.9501.desc_greed_greedy: "\n\nКогда [admiral.GetNameNoTooltip] говорит о потерянном грузе, мне приходит мысль. Я знаю, где затонул этот корабль — у побережья владения [ship_province.GetNameNoTooltip]. Я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] бы снарядить судно и отправить водолазов, чтобы поднять то, что осталось... хотя, похоже, [admiral.GetNameNoTooltip] не [Select_CString(admiral.IsFemale, 'была первой', 'был первым' )], кто узнал о крушении. Другие могут уже направляться к этому месту."
 agot_sailing.9501.desc_greed_not_tarth: "\n\n[admiral.GetNameNoTooltip] продолжает читать письмо, объясняя, что на обречённом корабле было потеряно огромное состояние, теперь разбросанное по дну океана. Возможно, даже знаменитые сапфировые моря Тарта теперь найдут конкурента в красоте."
 agot_sailing.9501.desc_greed_tarth: "\n\n[admiral.GetNameNoTooltip] продолжает читать письмо, объясняя, что на обречённом корабле было потеряно огромное состояние, теперь разбросанное по дну океана. Сапфировые моря Тарта теперь могут мерцать золотыми вкраплениями — более красивые, чем когда-либо, хотя и ценой ужасной."
 agot_sailing.9501.a: "Какая печальная новость."

 agot_sailing_end: "@warning_icon! #X Этот вариант завершит занятие#!"
 agot_sailing_end_failure: "@warning_icon! #X Это завершит занятие#!"