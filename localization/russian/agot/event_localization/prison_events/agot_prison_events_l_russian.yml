l_russian:

 agot_prison.1001.t: "Лишение языка"

 agot_prison.1001.start.desc: "[recipient.GetTitledFirstName] в цепях [Select_CString(recipient.IsFemale, 'приведена', 'приведён' )] в комнату. «Пожалуйста! Я сделаю всё! Всё, что вы захотите!». [recipient.GetTitledFirstName] замолкает, когда тюремщик затыкает [Select_CString(recipient.IsFemale, 'узнице', 'узнику' )] рот и привязывает к столу.\n\n"
 agot_prison.1001.cruel.desc: "«Ох [recipient.GetFirstNameNoTooltip], [Select_CString(ROOT.Char.IsFemale, 'вздохнула', 'вздохнул' )] я театрально, — мы с вами редко сходились во взглядах. И я наконец-то [Select_CString(ROOT.Char.IsFemale, 'придумала', 'придумал' )], как это решить»."
 agot_prison.1001.compassionate.desc: "«Это может показаться варварством, — пока я это говорю, врач готовит свои инструменты, — но это ради блага державы. Поверьте мне — я не испытываю никакого удовольствия от ваших страданий»."
 agot_prison.1001.child.desc: "«Это улучшит ваше самочувствие», — говорит [physician.GetSheHe] и предлагает [recipient.GetHerHim] маковое молоко. [recipient.GetTitledFirstName] дрожащей рукой подносит чашу с успокоительным, и быстро выпивает всё за один глоток.\n\nКак только [recipient.Custom('GirlBoy')] засыпает, врач бросает на меня взгляд: «Вы уверены в этом, [Select_CString(actor.IsFemale, 'миледи', 'милорд' )]?»"
 agot_prison.1001.a: "О да, это #emp будет#! больно."
 agot_prison.1001.b: "У меня есть свои причины."

 agot_prison.1002.t: "Лишение языка"
 agot_prison.1002.start.desc: "Я спокойно размышляю о своей судьбе, когда тюремщик внезапно захлопывает дверь и вытаскивает меня из камеры. Там, в мрачном коридоре, меня ждёт [actor.GetTitledFirstName].\n\n"
 agot_prison.1002.cruel.desc: "От довольного выражения [actor.GetHerHis] лица у меня по спине пробежала дрожь.\n\n«Не волнуйтесь. Ваша голова мне ни к чему — языка будет вполне достаточно. Несите раскалённые щипцы»."
 agot_prison.1002.compassionate.desc: "«[recipient.GetFirstNameNoTooltip], я не испытываю никакого удовольствия от ваших страданий. Будет лучше, если вы навеки замолкнете. Это ради блага державы»."
 agot_prison.1002.child.desc: "«Это улучшит ваше самочувствие», - говорит мне [physician.GetSheHe], протягивая мне маленькую стеклянную чашу. Это плохое место, с плохими людьми, но [physician.GetHerHis] глаза... полны добра. С дрожащей рукой, я касаюсь чаши губами."
 agot_prison.1002.a: "Мой... мой язык? Пустите! #emp Нееет!#!"
 agot_prison.1002.b: "Я... Я чувствую себя странно..."