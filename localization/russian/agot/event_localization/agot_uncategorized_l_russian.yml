 seduce_outcome.paramour: "Стань моим любовником!"
 pregnancy.2001.father_is_paramour: "Несмотря на моё терпение, кажется, что мои регулы снова не придут и я больше не могу сдерживать предательское возбуждение.\n\nКажется, я вынашиваю ребёнка, чьим отцом является [real_father.GetFirstName], мой верный любовник!"
 pregnancy.2001.paramour: "Какой приятный маленький сюрприз!"
 pregnancy.2002.father_is_paramour: "Мои регулы снова не приходят и я больше не могу сдерживать предательское возбуждение.\n\nКажется, я вынашиваю ребёнка, чьим отцом является [real_father.GetFirstName], мой верный любовник!\n\nКогда я сообщаю новости моему мужу, [spouse.GetFirstName] кажется немного смущённым. «Но мы почти не касались друг друга», — говорит он, считая на пальцах и пытаясь точно определить, сколько лун прошло с тех пор, как мы делили постель.\n\nОднако примерно через минуту он щёлкает пальцами и его рот принимает форму идеально круглой буквы «О». «Ох! [real_father.GetFirstName]?», - спрашивает он. [spouse.GetFirstName] смеётся, явно забавляясь, когда я, улыбаясь от уха до уха, киваю — «Не думал, что в нём это есть!»"
 pregnancy.2002.paramour: "Скорее есть во #italic мне#! ..."
 birth.2001.desc.mother.paramour: "После многих часов родов я с облегчением слышу плач ребенка. Пока ребёнка пеленают, я протягиваю руки к повитухе: «Дайте мне!» — умоляю я, взволнованная встречей с моим ребёнком. «Дайте мне посмотреть!»\n\nЯ держу новорождённого на руках и смотрю ему в лицо. Сходство с отцом уже неоспоримо. Если ранее и были какие-то сомнения, то теперь с ними покончено.\n\nЛюбовь, которую я и [real_father.GetFirstName] питаем друг к другу, теперь воплощена в нашем ребёнке. Как нам повезло!"
 birth.2001.desc.mother.paramour.twins: "После многих часов родов я с облегчением слышу плач ребёнка. Но мои роды не прекращаются и вскоре после этого я рожаю ещё одного ребенка, такого же громкого, как и первый! Пока повитухи пеленают детей, я протягиваю к ним руки: «Дайте их мне!» — взволнованно умоляю я. «Дайте мне посмотреть!»\n\nПовитухи подносят детей к моей постели и я смотрю на них, кажется, целую вечность. Если ранее и были какие-то сомнения, то теперь с ними покончено. Сходство с отцом уже бесспорно!\n\nЛюбовь, которую я и [real_father.GetFirstName] питаем друг к другу, теперь дважды воплощена в наших близнецах. Как нам повезло!"
 birth.2001.desc.father.paramour: "Я чувствую себя могущественнее любого лорда, принца или даже короля, ибо мой венец называется радостью; корона, которой редко наслаждаются короли — моя возлюбленная любовница [mother.GetFirstName] родила! \n\nЕсть ли что-то, чего она #italic не может#!?"
 birth.2001.desc.father.paramour.twins: "Я чувствую себя могущественнее любого лорда, принца или даже короля, ибо мой венец называется радостью; корона, которой редко наслаждаются короли — моя возлюбленная любовница [mother.GetFirstName] родила не одного, а #italic двоих#! наших детей! \n\nЕсть ли что-то, чего она #italic не может#!?"
 birth.2001.b.paramour: "Вот любовь, которая оставляет после себя наследие!"
