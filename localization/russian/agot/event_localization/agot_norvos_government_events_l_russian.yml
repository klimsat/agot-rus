l_russian:

 norvos_government_events.0001.t: "Обличение от Бородатых жрецов"
 norvos_government_events.0001.desc: "[shadowy_priests.GetName] [Select_CString(shadowy_priests.IsFemale, 'издала', 'издал' )] указ, осуждающий меня за мои грехи!\n\nТеперь я изгой в норвошийской политике, и моё положение в обществе будет подорвано на ближайшие десять лет."
 norvos_government_events.0001.a: "Это прискорбный поворот событий."

 norvos_government_events.0050.t: "Неправедная вера"
 norvos_government_events.0050.desc: "[shadowy_priests.GetName] [Select_CString(shadowy_priests.IsFemale, 'объявила', 'объявил' )] меня [Select_CString(ROOT.Char.IsFemale, 'грешницей', 'грешником' )] за принятие #L [ROOT.Char.GetFaith.GetName|l]их#! убеждений, и [Select_CString(shadowy_priests.IsFemale, 'приказала', 'приказал' )] заключить меня под стражу!\n\nХотя в других Вольных городах правители могут исповедовать разные религии и верования, слово бородатых жрецов и их тайного бога по-прежнему имеет первостепенное значение в Норвосе.\n\nПоэтому мы с другими новообращёнными ждём решения от самих верховных жрецов."
 norvos_government_events.0050.a: "Стоит ли [ROOT.Char.GetFaith.HighGodName] всего этого?"
 norvos_government_events.0050.a_tt: "Бородатые жрецы решат вашу судьбу."

 norvos_government_events.0051.t: "Неправедная вера"
 norvos_government_events.0051.desc: "[shadowy_priests.GetName] выносит свой приговор:\n\n"
 norvos_government_events.0051.desc_judgement_conversion: "Мне и моим единоверцам сохранят жизнь, если мы отречёмся от своей веры и вновь примем религию Бородатых жрецов."
 norvos_government_events.0051.desc_judgement_death: "Меня и моих единоверцев приговорили к смертной казни за распространение ереси в Великом Норвосе!"
 norvos_government_events.0051.a: "[ROOT.Char.GetFaith.HighGodName], спаси меня!"
 norvos_government_events.0051.b: "Я приму веру."
 norvos_government_events.0051.c: "Я не откажусь от своих убеждений."
 norvos_government_events.0051.d: "Я публично обращусь в другую веру, но по-прежнему буду тайно исповедовать свою."

 norvos_government_events.0502.t: "[accused.GetShortUINameNoTooltip] и [accused.GetHerHis] грехи"
 norvos_government_events.0502.desc: "[accused.GetName] [Select_CString(accused.IsFemale, 'казнена', 'казнён' )] за принятие #L [ROOT.Char.GetFaith.GetName|l]их#! убеждений.\n\nТеперь я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] принять решение: вновь принять веру Бородатых жрецов или разделить [accused.GetHerHis] участь."
 norvos_government_events.0502.a: "Я приму веру, чтобы сохранить свою жизнь."
 norvos_government_events.0502.b: "Я публично обращусь в другую веру, но по-прежнему буду тайно исповедовать свою."
 norvos_government_events.0502.c: "Значит, смерть."
 norvos_government_events.0502_secret_conversion_tt: "Вы тайно обратитесь в [converted_faith.GetAdjective|l]"