l_russian:

 norvos_government_events.0001.t:0 "Condemnation from the Bearded Priests"
 norvos_government_events.0001.desc:0 "[shadowy_priests.GetName] has issued an edict condemning me for my sins!\n\nI have been marked as a pariah now in Norvoshi politics, and my social standing has been tainted for the next ten years."
 norvos_government_events.0001.a:0 "This is an unfortunate turn of events."

 norvos_government_events.0050.t:0 "The Wrong Faith"
 norvos_government_events.0050.desc:0 "[shadowy_priests.GetName] has declared me a sinner for converting to [ROOT.Char.GetFaith.GetName] and has ordered me arrested!\n\nThough other Free Cities may house rulers of different faiths and creeds, the word of the Bearded Priests and their secret god is still paramount in Norvos.\n\nConsequently, my fellow converts and I await our judgment from the high priests themselves."
 norvos_government_events.0050.a:0 "Is [ROOT.Char.GetFaith.HighGodName] worth all this?"
 norvos_government_events.0050.a_tt:0 "The Bearded Priests will decide your fate."

 norvos_government_events.0051.t:0 "The Wrong Faith"
 norvos_government_events.0051.desc:0 "[shadowy_priests.GetName] has rendered [shadowy_priests.GetHerHis] judgment:\n\n"
 norvos_government_events.0051.desc_judgement_conversion:0 "My fellow converts and I will be allowed to live if we renounce our faith and rejoin the religion of the Bearded Priests."
 norvos_government_events.0051.desc_judgement_death:0 "My fellow converts and I have been sentenced to death for promoting heresy within Great Norvos!"
 norvos_government_events.0051.a:0 "[ROOT.Char.GetFaith.HighGodName], save me!"
 norvos_government_events.0051.b:0 "I will reconvert."
 norvos_government_events.0051.c:0 "I refuse to reconvert."
 norvos_government_events.0051.d:0 "I will publicly convert, but I will still keep my faith in secret."

 norvos_government_events.0502.t:0 "Sins of [accused.GetShortUINameNoTooltip]"
 norvos_government_events.0502.desc:0 "[accused.GetName] has been executed for [accused.GetHerHis] conversion to [ROOT.Char.GetFaith.GetName].\n\nNow, I must make the decision to reconvert to the faith of the Bearded Priests or join [accused.GetNameNoTooltip] in death."
 norvos_government_events.0502.a:0 "I will reconvert to preserve my life."
 norvos_government_events.0502.b:0 "I will publicly convert, but I will still keep my faith in secret."
 norvos_government_events.0502.c:0 "Death it is."
 norvos_government_events.0502_secret_conversion_tt:0 "You secretly convert to [converted_faith.GetName]"