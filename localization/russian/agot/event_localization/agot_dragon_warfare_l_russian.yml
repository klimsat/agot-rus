 killed_by_dragon_wings_knight_friendly: "С мощным взмахом своих крыльев [CHARACTER.GetShortUINameNoTooltip] [Select_CString(EqualTo_string('он', CHARACTER.Custom('GetDragonSheHe')), 'вызвал', 'вызвала')] порыв ветра такой силы, что он сбил [Select_CString(random_knight.IsLocalPlayer, '', 'персонажа ' )][random_knight.GetShortUINamePossessive][Select_CString(random_knight.IsLocalPlayer, 'его персонажа', '' )] с ног, швырнув [random_knight.GetHerHis] в пасть смерти."

