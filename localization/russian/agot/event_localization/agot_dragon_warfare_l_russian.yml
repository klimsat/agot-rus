l_russian:
 agot_dragon_warfare.you_have_received_buff: "#P [dragon_in_battle.GetName] очень [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'помог', 'помогла')] вам в этой битве!#!\n\n#weak Вы получили временный модификатор.#!"
 agot_dragon_warfare.you_have_caused_buff: "#P [dragon_in_battle.GetName] очень [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'помог', 'помогла')] вашей стороне в этой битве!#!\n\n#weak Командир получил временный модификатор.#!"
 agot_dragon_warfare.enemy_has_received_buff: "#N [dragon_in_battle.GetName] сильно [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'навредил', 'навредила')] вашей стороне в этой битве!#!\n\n#weak Вражеский командир получил временный модификатор.#!"

 # A Shattering Roar
 agot_dragon_warfare.0001.t: "Оглушительный рев"

 agot_dragon_warfare.0002.t: "$agot_dragon_warfare.0001.t$"
 agot_dragon_warfare.0002.opening1: "Я и мои вассалы наблюдаем за врагом по всему полю, готовясь сразиться с силами, которыми командует [dragon_commander_in_battle.GetName], когда сверху раздаётся #bold рёв#!, раскалывающий небо!\n\n"
 agot_dragon_warfare.0002.opening2: "Лязг стали о сталь... Хруст металла о плоть... Звуки битвы вокруг меня сливаются в жестокую какофонию. И всё же, когда сквозь шум прорывается пронзительный #bold рёв#!, кажется, что мой мир погружается в тишину.\n\n"
 agot_dragon_warfare.0002.opening3: "То, как [dragon_commander_in_battle.GetName] неумолимо ведёт свои войска на моих собственных солдат, вызывает ужас, но моё внимание быстро переключается на небо. Могучий #bold рёв#! разрывает воздух, вырывая дыхание из моей груди.\n\n"
 agot_dragon_warfare.0002.mid1: "Моя лошадь выскакивает из-под меня, и я едва могу удержать её, когда она галопом убегает, пока прямо на нас по небу несутся [dragonrider_in_battle.GetTitledFirstName] и [dragonrider_in_battle.GetHerHis] [dragon_in_battle.Custom('GetDragonColorFull')] зверь, [dragon_in_battle.GetNameNicknamed]!\n\n"
 agot_dragon_warfare.0002.mid2: "Даже самые стойкие солдаты вокруг меня вздрагивают, переминаются с ноги на ногу, пытаясь напустить на себя храбрый вид, когда по полю боя несутся [dragonrider_in_battle.GetTitledFirstName] и [dragonrider_in_battle.GetHerHis] [dragon_in_battle.Custom('GetDragonColorFull')] дракон, [dragon_in_battle.GetNameNicknamed]!\n\n"
 agot_dragon_warfare.0002.mid3: "Я крепко сжимаю [ROOT.Char.Custom('signature_weapon')], наблюдая, как [dragon_in_battle.Custom('GetDragonColorFull')] чудовище [dragon_in_battle.GetNameNicknamed] поливает пламенем землю вокруг себя, а [dragonrider_in_battle.GetTitledFirstName] [Select_CString(dragonrider_in_battle.IsFemale, 'окутана', 'окутан' )] огненными объятиями на [dragon_in_battle.Custom('GetDragonHerHis')] спине.\n\n"
 agot_dragon_warfare.0002.ending1: "Я оглядываюсь вокруг и вижу, как вражеские войска отступают в брешь, образовавшуюся в наших рядах. Удерживать этот участок сейчас бесполезно. Мы начинаем отступление тяжелым галопом, наша линия вынуждена отступать, когда отставших обдает драконьим пламенем."
 agot_dragon_warfare.0002.ending2: "Все мои оборонительные рубежи рушатся вокруг меня. Что могут люди противопоставить такой силе? Я отдаю приказ о поспешном отступлении, только чтобы увидеть, как многие и многие другие погибают в считанные мгновения, когда драконье пламя поглощает бегущих солдат."
 agot_dragon_warfare.0002.ending3: "Надежды нет, только пепел и дым. Я разворачиваю коня и быстро отступаю с поля боя. Рёв уже почти стихает... Слышны крики и ропот умирающих солдат, которым не так повезло."
 agot_dragon_warfare.0002.a: "Кому по силам устоять против такого монстра?!"

 agot_dragon_warfare.0003.t: "$agot_dragon_warfare.0001.t$"
 agot_dragon_warfare.0003.opening: "[dragon_in_battle.GetName] очень эффективно [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'применён', 'применена')] в сражении за владение [battle_location.GetName]!\n\n"
 agot_dragon_warfare.0003.ending1: "Когда наши ряды столкнулись, [dragonrider_in_battle.GetName] и [dragon_in_battle.GetNameNicknamed] полетели навстречу разбегающимся перед ужасающим #bold рёвом#! войскам, которые возглавляет [enemy_knight.GetName]. После того, как их ряды были прорваны, [dragonrider_in_battle.GetFirstNameNoTooltip] [Select_CString(dragonrider_in_battle.IsFemale, 'окружила', 'окружил' )] войска пламенем. Наши войска атаковали с тыла, и враг отступает перед нами!"
 agot_dragon_warfare.0003.ending2: "В разгар битвы [dragonrider_in_battle.GetName] [Select_CString(dragonrider_in_battle.IsFemale, 'совершила', 'совершил' )] вираж в сторону вражеских позиций на спине дракона [dragon_in_battle.GetNameNicknamed]. [dragon_in_battle.Custom('GetDragonColorFull')] зверь издал громоподобный #bold рёв#!, расколов ряды противника, как дрова для растопки. Когда [enemy_knight.GetName] и [enemy_knight.GetHerHis] солдаты начали неорганизованное отступление, [dragonrider_in_battle.GetFirstNameNoTooltip] [Select_CString(dragonrider_in_battle.IsFemale, 'обрушила', 'обрушил' )] на них пламя!"
 agot_dragon_warfare.0003.ending3: "Пока громко раздавался звон мечей и щитов, [dragon_in_battle.Custom('GetDragonColorFull')] зверь, на спине которого восседает  [dragonrider_in_battle.GetName], издал свирепый #bold рёв#!, заставив вражеские войска разбежаться во все стороны. Наши собственные солдаты воспользовались ситуацией и сокрушили противника. Всё это время [dragon_in_battle.GetNameNicknamed] обрушивает потоки пламени на [enemy_knight.GetHerHis] безрассудство."
 agot_dragon_warfare.0003.ending4: "Мало кто не слышал оглушительный #bold рёв#!, прокатившийся волнами по полю боя, что [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'издал', 'издала')] [dragon_in_battle.GetName]. [enemy_knight.GetName] и [enemy_knight.GetHerHis] войска спотыкаются в поспешном отступлении, в то время как [dragonrider_in_battle.GetName] кричит, перекрывая шум: #emp Дракарис!#!"
 agot_dragon_warfare.0003.a: "Великое благо для этой битвы!"

 agot_dragon_warfare.0004.t: "$agot_dragon_warfare.0001.t$"
 agot_dragon_warfare.0004.opening1: "Как [Select_CString(ROOT.Char.IsFemale, 'командующая', 'командующий' )] нашими войсками, я располагаюсь с более высокой точки обзора, что позволяет мне увидеть ужас как раз перед тем, как это смогут сделать наши войска. Я наблюдаю, как [dragon_in_battle.Custom('GetDragonColorFull')] зверь [dragon_in_battle.GetNameNicknamed] летит к позициям, где [Select_CString(enemy_knight.IsFemale, 'расположилась', 'расположился' )] [enemy_knight.GetName] и [enemy_knight.GetHerHis] войска, которые разбегаются, даже не вступая в бой."
 agot_dragon_warfare.0004.opening2: "Нелегко командовать армией, а тем более противостоять войску, которое может похвастаться такой страшной силой, как дракон. Я с тревогой наблюдаю, как это разворачивается, когда [dragon_in_battle.Custom('GetDragonColorFull')] зверь [dragon_in_battle.GetNameNicknamed] делает бросок в сторону позиций, где [Select_CString(enemy_knight.IsFemale, 'расположилась', 'расположился' )] [enemy_knight.GetName]. Войска разбегаются, как насекомые, но пламя дракона настигает их все чаще и чаще."
 agot_dragon_warfare.0004.opening3: "Битва разворачивается почти так же, как и любая другая: раздается диссонирующий стук стали о сталь, звучит отрывистая песня смерти. С моего места, откуда я смотрю, все становится ясно еще до того, как меняется ее тембр... [dragon_in_battle.GetNameNicknamed] ныряет в сторону позиций, где [Select_CString(enemy_knight.IsFemale, 'расположилась', 'расположился' )] [enemy_knight.GetName], поливая бегущие войска драконьим пламенем. Я слышу #italic крики#!. #italic Это предсмертные вопли людей.#!"
 agot_dragon_warfare.0004.ending: "\n\nЧуть позже [enemy_knight.GetTitledFirstNameNoTooltip] [Select_CString(enemy_knight.IsFemale, 'известил', 'известила' )] меня, что дракон издал ужасающий #bold рёв#!, но это не имеет значения — ущерб уже нанесён."
 agot_dragon_warfare.0004.a: "Когда сражаешься с такими монстрами, требуется немало мужества!"

 agot_dragon_warfare.0005.t: "$agot_dragon_warfare.0001.t$"
 agot_dragon_warfare.0005.opening1: "Битва еще не закончена, и я и [dragon_in_battle.GetName] летим низко над полем боя. Нанося удар по их позициям, мой [dragon_in_battle.Custom('GetDragonColorFull')] зверь издаёт громкий #bold рёв#!, от которого [enemy_knight.GetName] пошатывается, [enemy_knight.GetHerHis] товарищи разбегаются, как только наши собственные силы атакуют.\n\n"
 agot_dragon_warfare.0005.opening2: "По мере того, как битва разгорается, [dragon_in_battle.GetName] по моему приказу ныряет выше линии, которую покорно удерживает [enemy_knight.GetName]. Без моих указаний, [dragon_in_battle.GetNameNoTooltip] мощно #bold ревёт#! — ужасающий звук, наполненный яростью.\n\n"
 agot_dragon_warfare.0005.cruel: "Эти вражеские войска - личинки, которые пугаются и убегают, как будто на них падает свет. #italic «Грязные личинки»#!, - думаю я про себя."
 agot_dragon_warfare.0005.vengeful: "Я [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам' )] прорвусь сквозь ряды врага. Кто может надеяться выстоять против дракона? Кто может надеяться выстоять против #italic меня#!?!"
 agot_dragon_warfare.0005.mid: "Этот неожиданный разгром повергает вражеские войска в смятение и страх — одни группы отступают, другие ждут от своих командиров приказов, которые никогда не поступят, в то время как другие застывают в полном шоке."
 agot_dragon_warfare.0005.ending1: "Наши войска внизу сейчас бросаются вперед, используя эту возможность, чтобы пресечь любую попытку обороны со стороны противника.\n\nЯ осматриваю местность внизу и готовлюсь погрузить ее в пламя."
 agot_dragon_warfare.0005.ending2: "Наши солдаты быстро используют ситуацию в своих интересах, бросаясь вперед, когда ряды противника прогибаются.\n\n Мой взгляд твердеет, когда я готовлюсь обрушить огненный дождь на убегающего врага."
 agot_dragon_warfare.0005.ending3: "Всё, что я вижу перед собой, - это спины вражеских солдат.\n\nЯ чувствую жар и мощь, которые испускает [dragon_in_battle.GetNameNoTooltip] подо мной, и я точно знаю, что делать."
 agot_dragon_warfare.0005.a.valyrian: "#EMP Дракарис!#!"
 agot_dragon_warfare.0005.a: "Выдохни на них пламя, [dragon_in_battle.GetNameNoTooltip]!"

 # A Mad Charge
 agot_dragon_warfare.0006.t: "Безумная атака"

 agot_dragon_warfare.0007.t: "$agot_dragon_warfare.0006.t$"
 agot_dragon_warfare.0007.opening1: "Я оказываюсь в хаосе битвы за владение [battle_location.GetName], а вокруг меня гибнут люди. Запах крови наполняет мои ноздри, и я слышу, как колотится моё сердце в груди. Я наблюдаю, как жизнь исчезает из человеческих глаз, цвета становятся неясными в человеческой жиже. Позади меня раздаётся визг, грохот и волна жара."
 agot_dragon_warfare.0007.opening2: "Я оглядываюсь вокруг, со всех сторон шумно разворачивается жестокая битва за владение [battle_location.GetName]. Сталь сталкивается со сталью. Люди стонут и ворчат, умирая неописуемой смертью вокруг меня. Воздух наполняет запах крови с привкусом железа, затем он становится резким и одурманивающим как... #bold драконье пламя!#!"
 agot_dragon_warfare.0007.opening3: "Чьё-то тело врезается в меня, сбивая с ног. Я смаргиваю пот — или это кровь? — и переориентируюсь, прежде чем сразить другого вражеского солдата, перехватывая [ROOT.Char.Custom('signature_weapon')] и разбрызгивая кровь по моей броне. Внезапно поле боя сотрясает волна жара."
 agot_dragon_warfare.0007.mid: "\n\nЯ поворачиваюсь и вижу, как [dragonrider_in_battle.GetTitledFirstName] и [dragonrider_in_battle.GetHerHis] [dragon_in_battle.Custom('GetDragonColorFull')] дракон [dragon_in_battle.GetNameNicknamed] прокладывают кровавый путь через наш авангард!"
 agot_dragon_warfare.0007.ending1: "Люди поджариваются в своих доспехах, а зубы, хвосты и когти следуют за пламенем, оставшимся после их гибели. Некоторые замирают, не в силах противостоять такой мощи. Они умирают. Большинство спасается бегством, падая духом перед такой мощью.\n\n"
 agot_dragon_warfare.0007.ending2: "Солдаты превратились в пепел, кони поджарились и потрескивают... Хаос вокруг меня неизмерим. Я наблюдаю, как ряды солдат испепеляются очередным взрывом драконьего пламени, в то время как другие разбегаются во все стороны. Кому вообще по силам противостоять такому чудовищу?\n\n"
 agot_dragon_warfare.0007.lunatic: "И тут передо мной предстаёт видение: [ROOT.Char.GetTitledFirstName], убийца драконов, [Select_CString(ROOT.Char.IsFemale, 'героиня, возвышающаяся', 'герой, возвышающийся' )] над всеми остальными. [Select_CString(ROOT.Char.IsFemale, 'Её', 'Его' )] окружает хор певцов, распевающий хвалебные оды. #italic Это я!#! - думаю я, начиная свой безумный бросок к дракону [dragon_in_battle.GetNameNoTooltip]."
 agot_dragon_warfare.0007.rude: "Клятое безумие вокруг меня уступает место безумию в моей собственной голове. Если кто-то и может убить этот #bold проклятый#! мешок с драконьей мочой, это я. Я иду за тобой, [dragon_in_battle.GetNameNoTooltip]. Я стану твоим клятым палачом."
 agot_dragon_warfare.0007.shrewd: "Хаос вокруг меня, кажется, замедляется, словно само время делает глубокий вдох. Я замечаю просвет, и если я смогу точно пронзить дракона, то, возможно, попаду [dragon_in_battle.Custom('GetDragonHerHim')] в слабое место между чешуйками. Возможно, это глупо, но это наша единственная надежда."
 agot_dragon_warfare.0007.zealous: "Среди смерти и разрушений, окружающих меня, я вижу опасный путь — только [ROOT.Char.GetFaith.HighGodName] может направить меня. Передо мной дракон, я произношу молитву и готовлюсь к своей благословенной атаке."
 agot_dragon_warfare.0007.fallback: "Мне неожиданно открылся путь сквозь разрушения. Я вижу это. Это была бы безумная атака. #italic Отчаянная#!. Но, возможно, это то, что нужно."
 agot_dragon_warfare.0007.a: "Слава дому [enemy_knight.GetHouse.GetBaseName]!"
 agot_dragon_warfare.0007.aawaaga: "#bold Ааааааа!#!"
 agot_dragon_warfare.0007.a.f: "Вы бросаетесь в безумную атаку, пытаясь убить дракона [dragon_in_battle.GetName]"
 agot_dragon_warfare.0007.b: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] выбраться отсюда!"
 agot_dragon_warfare.0007.b.f: "Вы бежите, как и все остальные"

 agot_dragon_warfare.0008.t: "$agot_dragon_warfare.0006.t$"
 agot_dragon_warfare.0008.opening1: "Когда [dragon_in_battle.GetName] и я заливаем владение [battle_location.GetName] реками пламени, я чувствую, как [dragon_in_battle.Custom('GetDragonHerHis')] кровь закипает подо мной. [dragon_in_battle.Custom('GetDragonSheHe')|U] жаждет настоящей битвы, и я не могу [dragon_in_battle.Custom('GetDragonHerHim')] отказать. Мы совершаем последний огненный налёт, прежде чем наброситься на их авангард, уничтожая их силы укусами зубов, взмахами хвоста и ударами когтей. Кровь разлетается по воздуху, когда [dragon_in_battle.GetNameNoTooltip] разрывает армию, которой командует [enemy_commander_in_battle.GetTitledFirstName] — и [enemy_commander_in_battle.GetHerHis] людей — на куски.\n\n"
 agot_dragon_warfare.0008.opening2: "[dragon_in_battle.GetName] выпускает ещё один столп пламени, окутывая владение [battle_location.GetName] огнём. Я похлопываю [dragon_in_battle.Custom('GetDragonHerHis')] хребет, призывая [dragon_in_battle.Custom('GetDragonHerHis')] подготовиться. Как только [dragon_in_battle.GetNameNoTooltip] совершает посадку, мы держим курс на авангард, который возглавляет [enemy_commander_in_battle.GetTitledFirstName], разрывая на части людей и лошадей.\n\n"
 agot_dragon_warfare.0008.opening3: "Моя хватка на поводьях крепнет, когда я и [dragon_in_battle.GetName] проносимся рядом с битвой, разворачивающейся во владении [battle_location.GetName]. [dragon_in_battle.Custom('GetDragonHerHis')|U] пламя прорезает ряды врага, разрывая войска, которыми командует [enemy_commander_in_battle.GetTitledFirstName], как нежную баранину. С клокочущим рёвом [dragon_in_battle.Custom('GetDragonSheHe')] приземляется на скопление солдат, отшвыривая своим хвостом несколько убегающих врагов.\n\n"
 agot_dragon_warfare.0008.fled: "Некоторые не могут удержаться и стоят, разинув рты. [dragon_in_battle.GetNameNoTooltip] разрывает их на части точно так же. Остальные бегут перед нашим могуществом, и я замечаю, как [enemy_knight.GetTitledFirstName] бежит прочь вместе с остальными."
 agot_dragon_warfare.0008.died: "Когда вокруг нас растекаются лужи крови врагов, и люди бегут пред нашим могуществом, я вижу как [enemy_knight.GetTitledFirstName] пробирается сквозь толпу бегущих прямо к нам! [enemy_knight.GetSheHe|U] думает, что мы слишком медлительны, но лёгкий поворот моих бёдер, и [dragon_in_battle.GetNameNoTooltip] разворачивается и вгрызается прямо в [enemy_knight.GetHerHis] торс, отправляя окровавленные ноги безжизненно падать на землю."
 agot_dragon_warfare.0008.a: "Все будут трепетать перед нами!"

 agot_dragon_warfare.0009.t: "$agot_dragon_warfare.0006.t$"
 agot_dragon_warfare.0009.opening1: "Пока [dragon_in_battle.GetName] и я окатываем владение [battle_location.GetName] пламенем, я чувствую, как подо мной закипает [dragon_in_battle.Custom('GetDragonHerHis')] кровь. [dragon_in_battle.Custom('GetDragonSheHe')|U] хочет настоящей битвы, и я чувствую, что [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] подчиниться. Мы делаем последний заход, а затем обрушиваемся на их авангард, уничтожая их силы зубами, когтями и хвостом. Кровь брызжет во все стороны, когда [dragon_in_battle.GetNameNoTooltip] разрывает на части войско — и солдат, которых [Select_CString(enemy_commander_in_battle.IsFemale, 'привела', 'привёл' )] [enemy_commander_in_battle.GetTitledFirstName].\n\n"
 agot_dragon_warfare.0009.opening2: "[dragon_in_battle.GetName] выпускает ещё одну струю драконьего пламени, окутывая владение [battle_location.GetName] огнем. Я похлопываю [dragon_in_battle.Custom('GetDragonHerHis')] по чешуе, подгоняя. Мы заходим на авангард, который [Select_CString(enemy_commander_in_battle.IsFemale, 'выставила', 'выставил' )] [enemy_commander_in_battle.GetTitledFirstName], разрывая на части и людей, и лошадей, пока [dragon_in_battle.GetNameNoTooltip] приземляется.\n\n"
 agot_dragon_warfare.0009.opening3: "Я крепче сжимаю поводья, когда [dragon_in_battle.GetName] приближается к месту битвы, разворачивающейся во владении [battle_location.GetName]. [dragon_in_battle.Custom('GetDragonHerHis')|U] пламя прорезает ряды противника, разрывая солдат, которых [Select_CString(enemy_commander_in_battle.IsFemale, 'привела', 'привёл' )] [enemy_commander_in_battle.GetTitledFirstName], на части, словно нежную баранину. Фыркнув, [dragon_in_battle.Custom('GetDragonSheHe')] приземляется на скопление солдат и одним взмахом хвоста отбрасывает в сторону несколько бегущих врагов.\n\n"
 agot_dragon_warfare.0009.killed: "Когда вокруг нас растекаются лужи крови врагов, и люди бегут пред нашим могуществом, я вижу, как [enemy_knight.GetTitledFirstName] пробирается сквозь толпу бегущих прямо к нам! [enemy_knight.GetSheHe|U] мчится со всей скоростью, и хотя я поворачиваю бёдра, чтобы [dragon_in_battle.GetNameNoTooltip] [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'развернулся', 'развернулась')] в [enemy_knight.GetHerHis] сторону, я всё равное не успеваю! Мне остаётся лишь наблюдать, как [enemy_knight.GetFirstNameNoTooltip] наносит один точный и выверенный удар своим клинком, "
 agot_dragon_warfare.0009.decapitated: "пронзив шею дракона [dragon_in_battle.GetNameNoTooltip] и отрубив [dragon_in_battle.Custom('GetDragonHerHim')] голову! Она вращается в воздухе, пока [dragon_in_battle.Custom('GetDragonHerHis')] обезглавленное тело падает навзничь."
 agot_dragon_warfare.0009.slit: "пронзает шею дракона [dragon_in_battle.GetNameNoTooltip], рассекая [dragon_in_battle.Custom('GetDragonHerHis')] горло!"
 agot_dragon_warfare.0009.fall: "\n\nДраконья кровь хлещет по мощной дуге, и я чувствую, как [dragon_in_battle.Custom('GetDragonSheHe')] уходит у меня из-под ног. Я издаю крик и падаю на землю, тяжело приземляясь."
 agot_dragon_warfare.0009.b: "Ты [Select_CString(enemy_knight.IsFemale, 'убила', 'убил' )] моего дракона! Я убью тебя!"
 agot_dragon_warfare.0009.b_tt: "Вы и #V [enemy_knight.GetTitledFirstName]#! сразитесь на земле!"
 agot_dragon_warfare.0009.c: "Нет! Мне не выстоять против [Select_CString(enemy_knight.IsFemale, 'такой воительницы', 'такого воина' )]!"
 agot_dragon_warfare.0009.c_tt: "Вы убежите от персонажа #V [enemy_knight.GetFirstNameNicknamed]#!!"

 # A Fiery Arrangement
 agot_dragon_warfare.0012.t: "Огненная композиция"
 agot_dragon_warfare.0012.opening1: "Я летаю высоко над позициями врага — люди и лошади готовятся к предстоящей битве. Со спины моего великого дракона [dragon_in_battle.GetName] они кажутся мне лишь муравьями. Однако некоторые муравьи важнее других, и развевающиеся вместе знамёна привлекают моё внимание, даже с такой высоты."
 agot_dragon_warfare.0012.opening2: "С высоты, близкой к облакам, сидя на спине дракона [dragon_in_battle.GetName], я наблюдаю за всей разворачивающейся при  владении [battle_location.GetName] битвой — крошечные формирования наших полков сталкиваются с линиями врага. Здесь они выглядят почти как игрушки, которыми играют командиры. Мой взгляд останавливается на группе трепещущих знамен, указывающих на позицию самих командиров..."
 agot_dragon_warfare.0012.opening3: "Я кружу высоко над битвой при владении [battle_location.GetName], подгоняя дракона [dragon_in_battle.GetName] лёгкими движениями бёдер об [dragon_in_battle.Custom('GetDragonHerHis')] [dragon_in_battle.Custom('GetDragonColorFull')] бок. С этой высоты я вижу позицию врага — редкое преимущество, так как замечаю множество трепещущих знамен, скрытых вдали от передовой."
 agot_dragon_warfare.0012.mid: "\n\nСнижаясь с быстрой скоростью, я вижу, что [enemy_knight.GetTitledFirstName] и большинство других известных вражеских воинов собраны в одном месте!"
 agot_dragon_warfare.0012.cruel: "Эти враги — черви, и я заставлю их извиваться. #italic Грязные личинки#!, думаю про себя, наслаждаясь предстоящим пламенем. #italic Готовьтесь сгореть...#!"
 agot_dragon_warfare.0012.vengeful: "Одним мощным ударом я могу закончить эту битву. Кто сможет противостоять дракону? Кто сможет противостоять #italic мне#!?!"
 agot_dragon_warfare.0012.fallback: "Роковая ошибка — бросить вызов такому дракону, как мой! Я чувствую, как [dragon_in_battle.GetNameNoTooltip] вздымает грудь, готовясь испепелить вражеских предводителей драконьим пламенем."
 agot_dragon_warfare.0012.a.valyrian: "#EMP Дракарис!#!"
 agot_dragon_warfare.0012.a: "Сожги [enemy_knight.GetHerHis], [dragon_in_battle.GetNameNoTooltip]!"

 agot_dragon_warfare.0013.t: "Смерть с небес!"
 agot_dragon_warfare.0013.opening1: "Я выхожу из своего шатра во владении [battle_location.GetName], направляясь к кругу, где собрались рыцари и командиры, каждый из которых готов сразиться с врагом, выступившим против нас. Я собираюсь поприветствовать их, как вдруг с неба раздаётся оглушительный рёв!"
 agot_dragon_warfare.0013.opening2: "Вместе с другими командирами моей армии я осматриваю владение [battle_location.GetName], оценивая позиции наших линий и то, смогут ли солдаты устоять против силы дракона. Внезапно раздаётся пронзительный вопль, разрывающий небо!"
 agot_dragon_warfare.0013.opening3: "Воздух сырой и тяжёлый, пока разворачивается битва при владении [battle_location.GetName]. Люди, сражающиеся на поле боя, умирают по нашим приказам... Такова тяжесть командования. Высоко в небе я замечаю быстрое пятно — оно стремительно приближается к нашей позиции, издавая могучий рёв!"
 agot_dragon_warfare.0013.mid: "Это [dragon_in_battle.GetNameNicknamed], [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'которого', 'которую')] [Select_CString(dragonrider_in_battle.IsFemale, 'оседлала', 'оседлал' )] [dragonrider_in_battle.GetName]!\n\nМы в шоке, когда этот [dragon_in_battle.Custom('GetDragonColorFull')] зверь стремительно снижается, быстрее, чем можно себе представить. Когда он открывает пасть, я понимаю, что вот-вот произойдёт, но уже слишком поздно. За гулким вдохом следует волна пламени, и "
 agot_dragon_warfare.0013.death1: "хотя я бросаюсь бежать, я не могу опередить пламя. Лишь на секунду мне удаётся вырвать крик, прежде чем воздух сам по себе исчезает из моих лёгких, и я чувствую, как моя плоть сходит с костей."
 agot_dragon_warfare.0013.death2: "хотя я бросаюсь за большой камень, я ощущаю невообразимый жар вокруг. Моя рука, лежащая на гладкой поверхности, начинает шипеть и трещать, как кусок свинины на открытом огне. Я заживо жарюсь..."
 agot_dragon_warfare.0013.death3: "хотя я перепрыгиваю через некоторых из своих более медленных товарищей, я [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам' )] оказываюсь слишком [Select_CString(ROOT.Char.IsFemale, 'медленной', 'медленным' )]. В одно мгновение я чувствую, как моё тело поглощает драконье пламя, а жилы на руках и ногах превращаются в пепел."
 agot_dragon_warfare.0013.burned1: "всё, о чём я могу думать — это как спастись от пламени. Резко бросившись наутёк, я спиной ощущаю удар, когда драконье пламя врезается в землю. И хотя я [Select_CString(ROOT.Char.IsFemale, 'избежала', 'избежал' )] основной струи пламени, жаркий рёв позади поджигает мою одежду и жарит меня заживо в доспехах."
 agot_dragon_warfare.0013.burned2: "и моя единственная мысль — это побег. Я ныряю за большой камень, наблюдая, как основная струя драконьего пламени уходит в сторону от моего укрытия. Но мой вздох облегчения обрывается, когда я замечаю, что моя одежда пылает — жарче, чем любой огонь, с которым я когда-либо [Select_CString(ROOT.Char.IsFemale, 'сталкивалась', 'сталкивался' )]."
 agot_dragon_warfare.0013.burned3: "я мчусь прочь изо всех сил. Я вижу, как обожённая фигура падает рядом со мной — когда-то это был командир, как и я, и я перепрыгиваю через пылающую массу, торопясь к спасению. [dragon_in_battle.GetNameNoTooltip] направляет большую часть пламени в другую сторону, но я чувствую, как моя кожа начинает пузыриться и трескаться под раскалёнными доспехами."
 agot_dragon_warfare.0013.a: "[ROOT.Char.Custom('Scream')]"

 agot_dragon_warfare.0014.t: "Гибель на крыльях ужаса"
 agot_dragon_warfare.0014.desc: "Это сохранится в памяти как одна из самых разрушительных военных ошибок в истории державы. Вчера было бы немыслимо, что такой стандартный план — встретиться перед битвой для обсуждения стратегии и позиций — мог закончиться настолько ужасно. [enemy_knight.GetTitledFirstName], мои командиры и лучшие воины собрались перед битвой. Но вместо обсуждения стратегии они столкнулись с ужасом: [dragonrider_in_battle.GetTitledFirstName] [Select_CString(dragonrider_in_battle.IsFemale, 'спустилась', 'спустился' )] верхом на драконе и [Select_CString(dragonrider_in_battle.IsFemale, 'окатила', 'окатил' )] командиров моей армии драконьим пламенем!\n\nТе, кто не погибли, ужасно обожжены, в чём повинен [dragon_in_battle.Custom('GetDragonColorFull')] зверь, известный как [dragon_in_battle.GetNameNicknamed]. Я и несколько других полководцев избежали этой участи, так как не успели прибыть... Военачальники нашей армии уничтожены, и теперь мы точно проиграем эту битву."
 agot_dragon_warfare.0014.a: "Проклятые крылатые демоны!"

 agot_dragon_warfare.0015.t: "Неизбежная погибель"
 agot_dragon_warfare.0015.desc: "Это войдёт в историю как одна из самых решительных военных побед в истории державы!\n\nБлагодаря героическим действиям [dragonrider_in_battle.GetTitledFirstName] [Select_CString(dragonrider_in_battle.IsFemale, 'уничтожила', 'уничтожил' )] вражеское командование верхом на драконе. Вражеские командиры встретились перед битвой для обсуждения стратегии и позиций, но такое собрание стало идеальной целью для дракона [dragon_in_battle.GetNameNicknamed].\n\n[enemy_knight.GetTitledFirstName], а также многие другие командиры и известные воины были залиты драконьим пламенем! Те, кто не погибли, ужасно обожжены, за что [dragonrider_in_battle.GetFirstNameNoTooltip] и [dragonrider_in_battle.GetHerHis] [dragon_in_battle.Custom('GetDragonColorFull')] зверь заслуживают похвалы.\n\nВраг дезорганизован, и их солдаты теперь колеблются без чётких приказов. Мы непременно выиграем эту битву."
 agot_dragon_warfare.0015.a: "Великая слава!"

 # The Risks of Bravery
 agot_dragon_warfare.0016.t: "Храбрый риск"

 agot_dragon_warfare.0017.t: "$agot_dragon_warfare.0016.t$"
 agot_dragon_warfare.0017.opening1: "Я лечу выше облаков над владением [battle_location.GetName] верхом на драконе [dragon_in_battle.GetName], [Select_CString(ROOT.Char.IsFemale, 'готовая', 'готовый' )] нанести удар по принципу «молот и наковальня», когда враг пойдёт в атаку. Но, взглянув вниз, я вижу, что "
 agot_dragon_warfare.0017.opening2: "Я парю высоко над полем битвы во владении [battle_location.GetName] верхом на драконе [dragon_in_battle.GetName], обдумывая нашу следующую атаку на вражеский строй, когда замечаю, что "
 agot_dragon_warfare.0017.opening3: "[dragon_in_battle.GetName] поднимает нас всё выше и выше над хаосом владения [battle_location.GetName], давая короткую передышку среди облаков. Окинув взглядом поле боя, я вижу, что "
 agot_dragon_warfare.0017.mid: "[enemy_commander_in_battle.GetTitledFirstName] уже [Select_CString(enemy_commander_in_battle.Char.IsFemale, 'вывела', 'вывел')] свои силы вперёд! Но самое удивительное — [enemy_commander_in_battle.GetSheHe]  [Select_CString(enemy_commander_in_battle.Char.IsFemale, 'сама', 'сам')] возглавляет клин атаки!\n\n"
 agot_dragon_warfare.0017.rude: "Что за клятая недотёпа? У н[enemy_commander_in_battle.GetHerHis] точно мозги набекрень, если [enemy_commander_in_battle.GetFirstNameNoTooltip] думает, что я позволю [Select_CString(enemy_commander_in_battle.IsFemale, 'ей', 'ему')] так свободно атаковать на открытой местности."
 agot_dragon_warfare.0017.cruel: "Я закипаю от ярости из-за этой наглости... Каждая клетка моего тела жаждет заставить [enemy_commander_in_battle.GetHerHis] заплатить, и дорого. [dragon_in_battle.GetNameNoTooltip] несомненно сможет это осуществить..."
 agot_dragon_warfare.0017.vengeful: "Такой шаг ясно демонстрирует неуважение к силе, которой обладает [dragon_in_battle.GetNameNoTooltip], которой обладаю #bold я#!! Я не потерплю такого оскорбления."
 agot_dragon_warfare.0017.fallback: "Хотя [enemy_commander_in_battle.GetSheHe] безусловно [Select_CString(enemy_commander_in_battle.IsFemale, 'храбра', 'храбр')], я не могу не подумать, что такая большая дистанция [enemy_commander_in_battle.GetHerHis] от войск — это неразумно."
 agot_dragon_warfare.0017.a: "Смелый ход для [Select_CString(enemy_commander_in_battle.IsFemale, 'той', 'того' )], кто находится на расстоянии удара хвостом..."
 agot_dragon_warfare.0017.a.f: "Вы пикируете верхом на драконе [dragon_in_battle.GetNameNoTooltip] и смахнёте персонажа [enemy_commander_in_battle.GetFirstNameNoTooltip] прямо с [enemy_commander_in_battle.GetHerHis] лошади."
 agot_dragon_warfare.0017.b.vengeful: "И всё же, [enemy_commander_in_battle.GetSheHe] не имеет никакого значения."
 agot_dragon_warfare.0017.b: "Это было бы неуважением к такой храбрости."
 agot_dragon_warfare.0017.b.f: "Вы продолжаете следовать плану."

 agot_dragon_warfare.0018.t: "$agot_dragon_warfare.0016.t$"
 agot_dragon_warfare.0018.opening1: "Я осматриваю поле битвы во владении [battle_location.GetName], надевая шлем перед тем, как сесть на своего коня. Узкое поле зрения через забрало показывает линии врага, готовящиеся к нашему наступлению. Я беру своё оружие у оруженосца и выдвигаюсь к передовой своих войск. Хотя у врага есть драконий наездник, я [Select_CString(ROOT.Char.IsFemale, 'уверена', 'уверен' )], что мы всё равно можем выиграть сегодня. Решительная атака рассеет их, независимо от дракона."
 agot_dragon_warfare.0018.opening2: "Оглядываясь вокруг на хаос битвы при владении [battle_location.GetName], я не могу избавиться от ощущения, что битва ускользает из моих рук. Возможно, если уж ничего другого не осталось, моя храбрость сможет переломить исход. Я зову своего оруженосца, обнажаю оружие и сажусь на коня. У врага может быть и есть драконий наездник, но эта битва будет выиграна на земле."
 agot_dragon_warfare.0018.opening3: "Я еду вдоль строя своих войск, пытаясь придумать вдохновляющую речь, чтобы придать смелости и храбрости солдатам. #italic Сражайтесь, и вы можете умереть. Бегите, и вы будете жить... хотя бы какое-то время.#! Нет, эта речь не подходит. Не найдя нужных слов, я решаю прибегнуть к следующему лучшему возможному варианту: я возглавлю мощную атаку, которая разобьёт вражеские ряды."
 agot_dragon_warfare.0018.ending: "\n\nЯ поднимаю [ROOT.Char.Custom('signature_weapon')] и отдаю приказ атаковать, [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам' )] возглавляя наступление. Мы быстро сокращаем дистанцию, боевой дух высок. Я чувствую рёв своих людей, подталкивающий меня вперёд, грохот копыт под ногами моей лошади, землю, которая-"
 agot_dragon_warfare.0018.a: "#bold ВЖУХ!#!"
 agot_dragon_warfare.0018.a.f: "[dragon_in_battle.GetNameNoTooltip] сбивает вас с лошади. Ваше изломанное тело раздавлено под ногами ваших собственных атакующих войск."

 agot_dragon_warfare.0019.t: "$agot_dragon_warfare.0016.t$"
 agot_dragon_warfare.0019.desc: "Я наблюдаю за подготовкой своей армии к неизбежной битве при владении [battle_location.GetName]. Занимаясь расстановкой войск, я замечаю, как [enemy_commander_in_battle.GetName] надевает шлем на противополжном конце поля предстоящей битвы. Неужели [enemy_commander_in_battle.GetSheHe] собирается самостоятельно возглавлять атаку в авангарде своих войск? [enemy_commander_in_battle.GetSheHe|U] действительно решает сделать это! Как солнце в ясный день, я вижу, что случится в бою ещё до того, как это произойдёт. [dragonrider_in_battle.GetTitledFirstName] спускается с небес, как молния, верхом на драконе [dragon_in_battle.GetName], и с оглушительным #bold ВЖУХ#!, слышным по всему полю боя, я вижу, как [enemy_commander_in_battle.GetHerHis] тело сносит с лошади и отлетает на десятки футов, прежде чем разбиться о землю. Как будто этого было мало, [enemy_commander_in_battle.GetSheHe] оказывается [Select_CString(enemy_commander_in_battle.IsFemale, 'затоптана', 'затоптан')] своими собственными войсками во время их натиска."
 agot_dragon_warfare.0019.a: "[Select_CString(enemy_commander_in_battle.IsFemale, 'Храбрая дура', 'Храбрый дурак')]."

 # A Bolt from the Blue
 agot_dragon_warfare.0020.t: "Как гром среди ясного неба"

 agot_dragon_warfare.0021.t: "$agot_dragon_warfare.0020.t$"
 agot_dragon_warfare.0021.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'командовала', 'командовал' )] нашими силами во время битвы при владении [battle_location.GetName], когда [Select_CString(ROOT.Char.IsFemale, 'увидела', 'увидел' )], как [dragonrider_in_battle.GetTitledFirstName] и [dragon_in_battle.GetName] летят к вражеским линиям. Великое знамение! Я [Select_CString(ROOT.Char.IsFemale, 'собиралась', 'собирался' )] отдать приказ атаковать, когда [Select_CString(ROOT.Char.IsFemale, 'заметила', 'заметил' )] блеск света от летящего в сторону вражеских линий металлического предмета. Это снаряд скорпиона! Он летит прямо туда, где парит [dragonrider_in_battle.GetTitledFirstNameNoTooltip]!\n\nЯ могу лишь наблюдать, как болт попадает в [dragonrider_in_battle.GetHerHis] дракона, из раны брызжут кровавые струи и огонь. [dragon_in_battle.GetNameNoTooltip] издаёт рёв боли и ярости, прежде чем они оба падают на землю в огромном облаке пыли."
 agot_dragon_warfare.0021.a: "Ну, это точно не к добру."
 agot_dragon_warfare.0021.a.f: "Гибель [Select_CString(dragonrider_in_battle.IsFemale, 'драконьей наездницы', 'драконьего наездника' )] — это большая утрата."

 agot_dragon_warfare.0022.t: "$agot_dragon_warfare.0020.t$"
 agot_dragon_warfare.0022.desc: "Я с большой осторожностью направляю наши силы, зная, что для того, чтобы этот план сработал, нам нужно быть в нужном месте в нужное время. Я [Select_CString(ROOT.Char.IsFemale, 'собиралась', 'собирался' )] отдать приказ атаковать, когда [Select_CString(ROOT.Char.IsFemale, 'заметила', 'заметил' )], как [dragonrider_in_battle.GetTitledFirstName] и [dragon_in_battle.GetNameNicknamed] летят прямо к нам. Нет времени на планирование, нужно действовать!\n\nЯ отдаю приказ жестом руки, и снаряд нашего скорпиона летит прямо и точно. Словно стрела мастера-лучника, он попадает в дракона, на котором восседает [dragonrider_in_battle.GetTitledFirstNameNoTooltip], из раны брызжут кровавые струи и огонь. [dragon_in_battle.GetNameNoTooltip] издаёт рёв боли и ярости, прежде чем они оба падают на землю в огромном облаке пыли."
 agot_dragon_warfare.0022.a: "Фантастический выстрел!"
 agot_dragon_warfare.0022.a.f: "Гибель [Select_CString(dragonrider_in_battle.IsFemale, 'вражеской драконьей наездницы', 'вражеского драконьего наездника' )] — это большая удача для вашей стороны."

 agot_dragon_warfare.0023.t: "$agot_dragon_warfare.0020.t$"
 agot_dragon_warfare.0023.desc: "Ветер свистит мимо моего лица, я ощущаю мощь дракона [dragon_in_battle.GetName] под собой. Мы летим к вражеским линиям, и я вижу, как вражеский командир управляет своими силами. Я [Select_CString(ROOT.Char.IsFemale, 'собиралась', 'собирался' )] окутать их пламенем, когда [Select_CString(ROOT.Char.IsFemale, 'заметила', 'заметил' )] блеск света среди вражеских рядов. Это снаряд скорпиона! Он летит прямо к нам!\n\nЯ могу только наблюдать, как снаряд попадает в дракона, из раны брызжут кровавые струи и огонь. [dragon_in_battle.GetFirstNameNoTooltip] издаёт рёв боли и ярости, выпуская огромный поток огня, пока мы оба не кричим в ужасе в наши последние моменты..."
 agot_dragon_warfare.0023.a: "[ROOT.Char.Custom('Scream')]"
 agot_dragon_warfare.0023.a.f: "Ваше тело будет найдено среди останков дракона [dragon_in_battle.GetNameNoTooltip]."

 agot_dragon_warfare.0024.t: "$agot_dragon_warfare.0020.t$"
 agot_dragon_warfare.0024.desc: "Я стою, готовясь к битве, [Select_CString(ROOT.Char.IsFemale, 'окружённая', 'окружённый' )] слугами. В строю с моими людьми, наблюдая, как [dragonrider_in_battle.GetTitledFirstName] верхом на драконе [dragon_in_battle.GetName] летит к врагу, я чувствую, как начинает подниматься адреналин. Мы непременно победим с такой силой на нашей стороне!\n\nОднако, прямо перед моими глазами, из шеи дракона брызжет поток крови и пламени, рёв раздаётся по будущему полю битвы! Прищурив глаза, я вижу источник — это снаряд скорпиона! И [dragon_in_battle.GetFirstNameNoTooltip], и [Select_CString(dragonrider_in_battle.IsFemale, 'наездница', 'наездник' )] кричат, прежде чем падают на землю в огромном облаке пыли, и больше не поднимаются."
 agot_dragon_warfare.0024.a: "Большая утрата для нашей стороны."
 agot_dragon_warfare.0024.a.f: "Зрелище падения такого великого ресурса вызывает у вас чувство тревоги перед предстоящей битвой."

 agot_dragon_warfare.0025.t: "$agot_dragon_warfare.0020.t$"
 agot_dragon_warfare.0025.desc: "Я с ужасом жду следующей фазы битвы, зная, что что бы мы ни делали здесь, на земле, по-настоящему исход битвы решат [dragonrider_in_battle.GetTitledFirstName] и [dragonrider_in_battle.GetHerHis] [dragon_in_battle.Custom('GetDragonColorFull')] зверь, [dragon_in_battle.GetNameNicknamed]. Я чувствую, как пот капает с моего лба, наблюдая, как они летят к нам, готовые окутать нас драконьим пламенем!\n\nВнезапно я слышу #emp *та-вууп*#! и серебристая полоса арки проносится через небо, попадая в дракона, на котором восседает [dragonrider_in_battle.GetTitledFirstNameNoTooltip], из раны брызжут кровавые струи и огонь. [dragon_in_battle.GetNameNoTooltip] издаёт рёв боли и ярости, прежде чем они оба падают прямо перед нашими линиями!"
 agot_dragon_warfare.0025.a: "Ха! Вот тебе, ты большая ящерица!"
 agot_dragon_warfare.0025.a.f: "Вы издаёте победный крик, гибель [Select_CString(dragonrider_in_battle.IsFemale, 'вражеской драконьей наездницы', 'вражеского драконьего наездника' )] — это большая удача для вашей стороны."

 # The Great Deluge
 agot_dragon_warfare.0040.t: "Великий потоп"

 agot_dragon_warfare.0041.t: "$agot_dragon_warfare.0040.t$"
 agot_dragon_warfare.0041.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'командовала', 'командовал' )] нашими силами во время битвы при владении [battle_location.GetName], когда [Select_CString(ROOT.Char.IsFemale, 'заметила', 'заметил' )], как [dragonrider_in_battle.GetTitledFirstName] и [dragon_in_battle.GetNameNicknamed] летят к вражеским линиям. Великое знамение! Я [Select_CString(ROOT.Char.IsFemale, 'собиралась', 'собирался' )] отдать приказ атаковать, когда вдруг появилась спиралеобразная колонна воды, возвышающаяся над полем битвы.\n\n[dragon_in_battle.GetNameNoTooltip] рычит с вызовом, [dragon_in_battle.Custom('GetDragonHerHis')] крылья яростно бьются, когда [dragon_in_battle.Custom('GetDragonSheHe')] пытается сбежать, а [dragonrider_in_battle.GetTitledFirstNameNoTooltip] пытается удержать контроль над зверем, но водяная колонна быстро охватывает дракона и [Select_CString(dragonrider_in_battle.IsFemale, 'наездницу', 'наездника' )]. [dragon_in_battle.GetNameNoTooltip] борется, [dragon_in_battle.Custom('GetDragonHerHis')] тело извивается в утопающем захвате бездны, но неумолимый поток тянет [dragon_in_battle.Custom('GetDragonHerHis')] вниз. Постепенно могучее тело дракона тонет, поглощённое водой, и его яростные ревы затихают в глубинах.\n\nНаконец вода отступает, и перед нами предстаёт [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'безжизненный', 'безжизненная')] [dragon_in_battle.GetNameNoTooltip], а рядом находится [Select_CString(dragonrider_in_battle.IsFemale, 'изломанная и бездыханная', 'изломанный и бездыханный' )] [dragonrider_in_battle.GetTitledFirstNameNoTooltip]."
 agot_dragon_warfare.0041.a: "Проклятье!"
 agot_dragon_warfare.0041.a.f: "Гибель [Select_CString(dragonrider_in_battle.IsFemale, 'драконьей наездницы', 'драконьего наездника' )] — это большая утрата."

 agot_dragon_warfare.0042.t: "$agot_dragon_warfare.0040.t$"
 agot_dragon_warfare.0042.desc: "Я с большой осторожностью веду наши силы, зная, что для того, чтобы этот план сработал, нам нужно быть в нужном месте в нужное время. Я [Select_CString(ROOT.Char.IsFemale, 'собиралась', 'собирался' )] отдать приказ атаковать, когда [Select_CString(ROOT.Char.IsFemale, 'заметила', 'заметил' )], как [dragonrider_in_battle.GetTitledFirstName] и [dragon_in_battle.GetNameNicknamed] летят прямо к нам. Пора действовать!\n\nЯ отдаю приказ жестом руки, и водные маги начинают свою работу, когда появляется спиралеобразная колонна воды, возвышающаяся над полем битвы.\n\n[dragon_in_battle.GetNameNoTooltip] рычит с вызовом, [dragon_in_battle.Custom('GetDragonHerHis')] крылья яростно бьются, когда [dragon_in_battle.Custom('GetDragonSheHe')] пытается сбежать, а [dragonrider_in_battle.GetTitledFirstNameNoTooltip] пытается удержать контроль над зверем, но водяная колонна быстро охватывает дракона и [Select_CString(dragonrider_in_battle.IsFemale, 'наездницу', 'наездника' )]. [dragon_in_battle.GetNameNoTooltip] борется, [dragon_in_battle.Custom('GetDragonHerHis')] тело извивается в утопающем захвате бездны, но неумолимый поток тянет [dragon_in_battle.Custom('GetDragonHerHis')] вниз. Постепенно могучее тело дракона тонет, поглощённое водой, и его яростные рёвы затихают в глубинах.\n\nНаконец вода отступает, и перед нами предстаёт [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'безжизненный', 'безжизненная')] [dragon_in_battle.GetNameNoTooltip], а рядом находится [Select_CString(dragonrider_in_battle.IsFemale, 'изломанная и бездыханная', 'изломанный и бездыханный' )] [dragonrider_in_battle.GetTitledFirstNameNoTooltip]."
 agot_dragon_warfare.0042.a: "Фантастический выстрел!"
 agot_dragon_warfare.0042.a.f: "Гибель [Select_CString(dragonrider_in_battle.IsFemale, 'вражеской драконьей наездницы', 'вражеского драконьего наездника' )] — это большая удача для вашей стороны."

 agot_dragon_warfare.0043.t: "$agot_dragon_warfare.0040.t$"
 agot_dragon_warfare.0043.desc: "Ветер свистит мимо моего лица, я ощущаю мощь дракона [dragon_in_battle.GetNameNicknamed] под собой. Мы летим к вражеским линиям, и я вижу, как вражеский командир руководит своими силами. Я [Select_CString(ROOT.Char.IsFemale, 'собиралась', 'собирался' )] окутать их пламенем, когда вдруг появилась спиралеобразная колонна воды в небе.\n\n[dragon_in_battle.GetNameNoTooltip] пугается и пытается сбежать, но вскоре мы оказываемся полностью окружены водой. Я пытаюсь задержать дыхание, но неумолимая сила воды не утихает, и я начинаю терять сознание..."
 agot_dragon_warfare.0043.a: "Так спокойно..."
 agot_dragon_warfare.0043.a.f: "Ваше тело будет найдено среди останков дракона [dragon_in_battle.GetNameNoTooltip]."

 agot_dragon_warfare.0044.t: "$agot_dragon_warfare.0040.t$"
 agot_dragon_warfare.0044.desc: "Я стою, готовясь к битве, [Select_CString(ROOT.Char.IsFemale, 'окружённая', 'окружённый' )] слугами. В строю с моими людьми, наблюдая, как [dragonrider_in_battle.GetTitledFirstName] верхом на драконе [dragon_in_battle.GetName] летит к врагу, я чувствую, как начинает подниматься адреналин. Мы непременно победим с такой силой на нашей стороне!\n\nОднако, прямо перед моими глазами, появляется спиралеобразная колонна воды, возвышающаяся над полем битвы.\n\n[dragon_in_battle.GetNameNoTooltip] рычит с вызовом, [dragon_in_battle.Custom('GetDragonHerHis')] крылья яростно бьются, когда [dragon_in_battle.Custom('GetDragonSheHe')] пытается сбежать, а [dragonrider_in_battle.GetTitledFirstNameNoTooltip] пытается удержать контроль над зверем, но водяная колонна быстро охватывает дракона и [Select_CString(dragonrider_in_battle.IsFemale, 'наездницу', 'наездника' )]. [dragon_in_battle.GetNameNoTooltip] борется, [dragon_in_battle.Custom('GetDragonHerHis')] тело извивается в утопающем захвате бездны, но неумолимый поток тянет [dragon_in_battle.Custom('GetDragonHerHis')] вниз. Постепенно могучее тело дракона тонет, поглощённое водой, и его яростный рёв затихает в глубинах.\n\nНаконец вода отступает, и перед нами предстаёт [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'безжизненный', 'безжизненная')] [dragon_in_battle.GetNameNoTooltip], а рядом находится [Select_CString(dragonrider_in_battle.IsFemale, 'изломанная и бездыханная', 'изломанный и бездыханный' )] [dragonrider_in_battle.GetTitledFirstNameNoTooltip]."
 agot_dragon_warfare.0044.a: "Большая утрата для нашей стороны."
 agot_dragon_warfare.0044.a.f: "Зрелище падения такого великого ресурса вызывает у вас чувство тревоги перед предстоящей битвой."

