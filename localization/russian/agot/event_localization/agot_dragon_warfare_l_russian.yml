 dragon_ate_enemy_friendly: "Наш #TOOLTIP:GAME_TRAIT,dragon,[GetNullCharacter] #L дракон#!#! [CHARACTER.GetShortUINameNoTooltip] [Select_CString(EqualTo_string('он', CHARACTER.Custom('GetDragonSheHe')), 'поглотил', 'поглотила')] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', 'персонажа ' )][TARGET_CHARACTER.GetShortUINamePossessive][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'его персонажа', '' )]!"

 dragon_killed_enemy_with_dragon_fire_enemy: "Наш $knight_culture_player_no_tooltip_lowercase$ [TARGET_CHARACTER.GetShortUINameNoTooltip] [Select_CString(TARGET_CHARACTER.IsFemale, 'была уничтожена', 'был уничтожен' )] огненным дыханием #TOOLTIP:GAME_TRAIT,dragon,[GetNullCharacter] #L дракона#!#! [CHARACTER.GetShortUINameNoTooltip]!"

 dragon_killed_enemy_with_dragon_fire_friendly: "Наш #TOOLTIP:GAME_TRAIT,dragon,[GetNullCharacter] #L дракон#!#! [CHARACTER.GetShortUINameNoTooltip] [Select_CString(EqualTo_string('он', CHARACTER.Custom('GetDragonSheHe')), 'уничтожил', 'уничтожила')] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', 'персонажа ' )][TARGET_CHARACTER.GetShortUINamePossessive][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'его персонажа', '' )] огненным взрывом своего драконьего пламени!"

 killed_by_dragon_flame_knight_friendly: "С огненным рёвом, который потряс землю, наш #TOOLTIP:GAME_TRAIT,dragon,[GetNullCharacter] #L дракон#!#! [CHARACTER.GetShortUINameNoTooltip] [Select_CString(EqualTo_string('он', CHARACTER.Custom('GetDragonSheHe')), 'изверг', 'извергла')] поток жгучего пламени, превратив [Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', 'персонажа ' )][TARGET_CHARACTER.GetShortUINamePossessive][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'его персонажа', '' )] в пепел в мгновение ока."

 killed_by_dragon_flame_knight_enemy: "С огненным рёвом, который потряс землю, вражеский #TOOLTIP:GAME_TRAIT,dragon,[GetNullCharacter] #L дракон#!#! [CHARACTER.GetShortUINameNoTooltip] [Select_CString(EqualTo_string('он', CHARACTER.Custom('GetDragonSheHe')), 'изверг', 'извергла')] поток жгучего пламени, превратив [Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', 'персонажа ' )][TARGET_CHARACTER.GetShortUINamePossessive][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'его персонажа', '' )] в пепел в мгновение ока."


 killed_by_dragon_tail_knight_friendly: "В стремительном, смертельном манёвре наш #TOOLTIP:GAME_TRAIT,dragon,[GetNullCharacter] #L дракон#!#! [CHARACTER.GetShortUINameNoTooltip] бьёт хвостом [Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', 'персонажа ' )][TARGET_CHARACTER.GetShortUINamePossessive][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'его персонажа', '' )] прямо в разгаре атаки, отбросив [Select_CString(TARGET_CHARACTER.IsFemale, 'её', 'его' )] в сторону, как игрушку."

 killed_by_dragon_tail_knight_enemy: "В стремительном, смертельном манёвре #TOOLTIP:GAME_TRAIT,dragon,[GetNullCharacter] #L дракон#!#! [CHARACTER.GetShortUINameNoTooltip] бьёт хвостом доблестного [Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', 'персонажа ' )][TARGET_CHARACTER.GetShortUINamePossessive][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'его персонажа', '' )] прямо в разгаре атаки, отбросив [Select_CString(TARGET_CHARACTER.IsFemale, 'её', 'его' )] в сторону, как игрушку."


 killed_by_dragon_jaws_knight_friendly: "[CHARACTER.GetShortUINameNoTooltip] резко [Select_CString(EqualTo_string('он', CHARACTER.Custom('GetDragonSheHe')), 'спустился', 'спустилась')], захлопнув свои гигантские челюсти вокруг [Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', 'персонажа ' )][TARGET_CHARACTER.GetShortUINamePossessive][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'его персонажа', '' )], подняв [TARGET_CHARACTER.GetHerHis] в воздух, прежде чем выпустить [TARGET_CHARACTER.GetHerHis] в пустоту ниже."

 killed_by_dragon_jaws_knight_enemy: "[CHARACTER.GetShortUINameNoTooltip] резко [Select_CString(EqualTo_string('он', CHARACTER.Custom('GetDragonSheHe')), 'спустился', 'спустилась')], захлопнув свои гигантские челюсти вокруг [Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', 'персонажа ' )][TARGET_CHARACTER.GetShortUINamePossessive][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'его персонажа', '' )], подняв [TARGET_CHARACTER.GetHerHis] в воздух, прежде чем выпустить [TARGET_CHARACTER.GetHerHis] в пустоту ниже."


 killed_by_dragon_breath_knight_friendly: "Внезапный порыв серного дыхания был для [Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', 'персонажа ' )][TARGET_CHARACTER.GetShortUINamePossessive][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'его персонажа', '' )] единственным предупреждением, прежде чем смертельный поток пламени поглотил [TARGET_CHARACTER.GetHerHis], оставив после себя лишь обугленный силуэт."

 killed_by_dragon_breath_knight_enemy: "Внезапный порыв серного дыхания был для [Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', 'персонажа ' )][TARGET_CHARACTER.GetShortUINamePossessive][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'его персонажа', '' )] единственным предупреждением, прежде чем смертельный поток пламени поглотил [TARGET_CHARACTER.GetHerHis], оставив после себя лишь обугленный силуэт."


 killed_by_dragon_claws_knight_friendly: "[CHARACTER.GetShortUINameNoTooltip] своими острыми, как лучшая валирийская сталь, [Select_CString(EqualTo_string('он', CHARACTER.Custom('GetDragonSheHe')), 'разрезал', 'разрезала')] броню [Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', 'персонажа ' )][TARGET_CHARACTER.GetShortUINamePossessive][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'его персонажа', '' )] как бумагу, оставив [TARGET_CHARACTER.GetHerHis] смертельно [Select_CString(TARGET_CHARACTER.IsFemale, 'раненой', 'раненым' )] на поле боя."

 killed_by_dragon_claws_knight_enemy: "[CHARACTER.GetShortUINameNoTooltip] своими острыми, как лучшая валирийская сталь, [Select_CString(EqualTo_string('он', CHARACTER.Custom('GetDragonSheHe')), 'разрезал', 'разрезала')] броню [Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', 'персонажа ' )][TARGET_CHARACTER.GetShortUINamePossessive][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'его персонажа', '' )] как бумагу, оставив [TARGET_CHARACTER.GetHerHis] смертельно [Select_CString(TARGET_CHARACTER.IsFemale, 'раненой', 'раненым' )] на поле боя."


 killed_by_dragon_crushed_knight_friendly: "Земля затряслась, когда [CHARACTER.GetShortUINameNoTooltip] [Select_CString(EqualTo_string('он', CHARACTER.Custom('GetDragonSheHe')), 'приземлился', 'приземлилась')], [CHARACTER.Custom('GetDragonHerHis')] огромный вес раздавил [Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', 'персонажа ' )][TARGET_CHARACTER.GetShortUINamePossessive][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'его персонажа', '' )] под собой, лишив [TARGET_CHARACTER.GetHerHis] жизни в мгновение ока."

 killed_by_dragon_crushed_knight_enemy: "Земля затряслась, когда [CHARACTER.GetShortUINameNoTooltip] [Select_CString(EqualTo_string('он', CHARACTER.Custom('GetDragonSheHe')), 'приземлился', 'приземлилась')], [CHARACTER.Custom('GetDragonHerHis')] огромный вес раздавил [Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', 'персонажа ' )][TARGET_CHARACTER.GetShortUINamePossessive][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'его персонажа', '' )] под собой, лишив [TARGET_CHARACTER.GetHerHis] жизни в мгновение ока."


 killed_by_dragon_horns_knight_friendly: "[TARGET_CHARACTER.GetShortUINameNoTooltip] не [Select_CString(TARGET_CHARACTER.IsFemale, 'успела', 'успел' )] отреагировать, когда [CHARACTER.GetShortUINameNoTooltip] [Select_CString(EqualTo_string('он', CHARACTER.Custom('GetDragonSheHe')), 'пронёсся', 'пронеслась')] через [TARGET_CHARACTER.GetHerHis] ряды, пробив своими смертоносными рогами [TARGET_CHARACTER.GetHerHis] броню и пронзив [TARGET_CHARACTER.GetHerHis]."

 killed_by_dragon_horns_knight_enemy: "[TARGET_CHARACTER.GetShortUINameNoTooltip] не [Select_CString(TARGET_CHARACTER.IsFemale, 'успела', 'успел' )] отреагировать, когда [CHARACTER.GetShortUINameNoTooltip] [Select_CString(EqualTo_string('он', CHARACTER.Custom('GetDragonSheHe')), 'пронёсся', 'пронеслась')] через [TARGET_CHARACTER.GetHerHis] ряды, пробив своими смертоносными рогами [TARGET_CHARACTER.GetHerHis] броню и пронзив [TARGET_CHARACTER.GetHerHis]."

 killed_by_dragon_maw_knight_friendly: "[CHARACTER.GetShortUINameNoTooltip] со смертоносным блеском в глазах [Select_CString(EqualTo_string('он', CHARACTER.Custom('GetDragonSheHe')), 'выбрал', 'выбрала')] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', 'персонажа ' )][TARGET_CHARACTER.GetShortUINamePossessive][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'его персонажа', '' )], [CHARACTER.Custom('GetDragonHerHis')] челюсти схватили [TARGET_CHARACTER.GetHerHis] и заставили навсегда умолкнуть боевой клич."

