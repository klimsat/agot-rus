 agot_dragon_warfare.0045.desc: "Я с ужасом жду следующей фазы битвы, зная, что что бы мы ни делали здесь, на земле, по-настоящему исход битвы решат [dragonrider_in_battle.GetTitledFirstName] и [dragonrider_in_battle.GetHerHis] [dragon_in_battle.Custom('GetDragonColorFull')] зверь, [dragon_in_battle.GetNameNicknamed]. Я чувствую, как пот капает с моего лба, наблюдая, как они летят к нам, готовые окутать нас драконьим пламенем!\n\nВнезапно я вижу, как появляется спиралеобразная колонна воды, возвышающаяся над полем битвы.\n\n[dragon_in_battle.GetName] рычит с вызовом, [dragon_in_battle.Custom('GetDragonHerHis')] крылья яростно бьются, когда [dragon_in_battle.Custom('GetDragonSheHe')] пытается сбежать, а [dragonrider_in_battle.GetTitledFirstName] пытается удержать контроль над зверем, но водяная колонна быстро охватывает дракона и [Select_CString(dragonrider_in_battle.IsFemale, 'наездницу', 'наездника' )]. [dragon_in_battle.GetName] борется, [dragon_in_battle.Custom('GetDragonHerHis')] тело извивается в утопающем захвате бездны, но неумолимый поток тянет [dragon_in_battle.Custom('GetDragonHerHis')] вниз. Постепенно могучее тело дракона тонет, поглощённое водой, и его яростный рёв затихает в глубинах.\n\nНаконец вода отступает, и перед нами предстаёт [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'безжизненный', 'безжизненная')] [dragon_in_battle.GetName], а рядом находится [Select_CString(dragonrider_in_battle.IsFemale, 'изломанная и бездыханная', 'изломанный и бездыханный' )] [dragonrider_in_battle.GetTitledFirstName]."
 agot_dragon_warfare.0045.a: "Ха! Вот тебе, ты большая ящерица!"
 agot_dragon_warfare.0045.a.f: "Вы издаёте победный крик, гибель [Select_CString(dragonrider_in_battle.IsFemale, 'вражеской драконьей наездницы', 'вражеского драконьего наездника' )] — это большая удача для вашей стороны."

 # Draconic Intervention
 agot_dragon_warfare.0026.battle_title: "Драконье вмешательство:"
 agot_dragon_warfare.0026.t: "$agot_dragon_warfare.0026.battle_title$ [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'Крылатый спаситель', 'Крылатая спасительница')]"
 agot_dragon_warfare.0026.opening: "Одно слово. Одно слово звучит на поле битвы, как приливная волна. Одно слово, чтобы вселить страх в сердца стойких солдат. «ДРАКОН!» Битва замерла, все взгляды устремлены в небо, воздух потяжелел от страха.\n\nОчнувшись от шока, я начинаю сомневаться в увиденном... Но мой вопрос застревает в горле, когда [dragon_in_battle.GetNameNicknamed] разрывает замерший покой битвы чудовищным рёвом. Начинается пекло, и я на мгновение подумываю об отступлении."
 agot_dragon_warfare.0026.outro: "Однако, по прихоти судьбы, [dragon_in_battle.Custom('GetDragonColorFull')] зверь, похоже, предпочитает сжигать вражеские силы, а не наши."
 agot_dragon_warfare.0026.a: "Это наш шанс, вперед!"

 agot_dragon_warfare.0027.t: "$agot_dragon_warfare.0026.battle_title$ Пламя из пекла"
 agot_dragon_warfare.0027.opening1: "Среди лязга мечей и щитов раздаётся неожиданный звук: воющий #bold рёв#! с небес! Дикий дракон, [dragon_in_battle.GetNameNicknamed], кажется, [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'привлечён', 'привлечена')] запахом крови — и [dragon_in_battle.Custom('GetDragonSheHe')] мчится к битве."
 agot_dragon_warfare.0027.opening2: "Запах крови и опорожненных кишечников наполняет воздух, когда две армии сталкиваются друг с другом. #italic Никто не говорит о запахе#!, думаю я, когда внезапно замечаю более серный запах... Мои глаза устремляются в небо, и я вижу [dragon_in_battle.Custom('GetDragonHerHis')]: дикий дракон [dragon_in_battle.GetNameNicknamed] летит в бой, огненные вспышки вырываются в воздух."
 agot_dragon_warfare.0027.opening3: "Я вырываю [ROOT.Char.Custom('signature_weapon')] из поверженного врага, его тело падает на землю в лужу крови. #italic Ни один человек не может мне противостоять#!, думаю я, осматривая хаос вокруг. В тот же миг моя уверенность исчезает: яростный рёв пронзает воздух, когда дикий дракон [dragon_in_battle.GetNameNicknamed] врывается в бой."
 agot_dragon_warfare.0027.mid: "\n\n[dragon_in_battle.Custom('GetDragonColorFull')] зверь [dragon_in_battle.GetNameNoTooltip] извергает поток драконьего пламени на #bold мои#! войска, мгновенно поджигая тех, кто стоит передо мной. Дикий зверь поворачивается ко мне, и..."
 agot_dragon_warfare.0027.a: "[ROOT.Char.Custom('Scream')]"

 agot_dragon_warfare.0028.t: "$agot_dragon_warfare.0026.battle_title$ Крылатый демон"
 agot_dragon_warfare.0028.opening1: "Как [Select_CString(ROOT.Char.IsFemale, 'командующая', 'командующий' )] нашими войсками, я [Select_CString(ROOT.Char.IsFemale, 'расположилась', 'расположился' )] на более высокой точке обзора, что позволяет мне увидеть ужас как раз перед тем, как это смогут сделать наши войска. Неожиданный поворот событий - [dragon_in_battle.Custom('GetDragonColorFull')] дикий дракон [dragon_in_battle.GetNameNicknamed] [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'прибыла', 'прибыл')] на поле боя, вероятно, [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'привлечённая', 'привлечённый')] запахом крови..."
 agot_dragon_warfare.0028.opening2: "Нелегко командовать войском... Эта битва казалась не таким уж тяжёлым испытанием, как другие, пока воздух не прорезал пронзительный рёв. Я с тревогой наблюдаю за тем, как разворачивается битва и [dragon_in_battle.Custom('GetDragonColorFull')] дикий дракон [dragon_in_battle.GetNameNicknamed] врывается на поле боя."
 agot_dragon_warfare.0028.opening3: "Битва разворачивается, как и любая другая: раздаётся диссонирующий стук стали о сталь, исполняется отрывистая песня смерти. С моего удалённого наблюдательного пункта мне всё становится ясно ещё до того, как тембр голоса меняется... Дикий дракон [dragon_in_battle.GetNameNicknamed] неожиданно [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'появился', 'появилась')], выпуская вспышки драконьего пламени в воздух."
 agot_dragon_warfare.0028.outro: "\n\nНа удивление, [dragon_in_battle.Custom('GetDragonSheHe')] [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'встал', 'встала')] на сторону противника, кажется, нанося разрушения только #bold моим#! войскам. С такого расстояния мне не остаётся ничего, кроме как наблюдать, как мои солдаты превращаются в пепел прямо у меня на глазах."
 agot_dragon_warfare.0028.a: "Будь проклят этот дракон!"

 agot_dragon_warfare.0029.t: "$agot_dragon_warfare.0026.battle_title$ Суровое суждение"
 agot_dragon_warfare.0029.outro: "[dragon_in_battle.Custom('GetDragonColorFull')] ужас убивает обе стороны без разбора."
 agot_dragon_warfare.0029.a: "#bold БЕЖИМ!#!"
 agot_dragon_warfare.0029.a.tt: "#N [dragon_in_battle.GetName] сильно [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'навредил', 'навредила')] всем сторонам в этой битве!#!\n\n#weak Вам неприятно это видеть.#!"

 agot_dragon_warfare.0030.t: "$agot_dragon_warfare.0026.battle_title$ Пламя из преисподней"
 agot_dragon_warfare.0030.mid: "\n\n[dragon_in_battle.Custom('GetDragonColorFull')] зверь [dragon_in_battle.GetNameNoTooltip] [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'вступил', 'вступила')] в битву и теперь ведёт войну на всех направлениях. [dragon_in_battle.Custom('GetDragonSheHe')|U] приземляется прямо передо мной, и..."
 agot_dragon_warfare.0030.a: "[ROOT.Char.Custom('Scream')]"
 agot_dragon_warfare.0030.a.tt: "#N [dragon_in_battle.GetName] сильно [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'навредил', 'навредила')] всем сторонам в этой битве!#!\n\n#weak Что ж, это полный провал.#!"

 agot_dragon_warfare.0031.t: "$agot_dragon_warfare.0026.battle_title$ Суровое суждение"
 agot_dragon_warfare.0031.outro: "\n\n[dragon_in_battle.Custom('GetDragonSheHe')|U] не проявляет разборчивости в своей ярости, извергая драконье пламя как на своих солдат, так и на врага. С такого расстояния я ничего не могу сделать, кроме как наблюдать, как мои солдаты превращаются в пепел прямо у меня на глазах."
 agot_dragon_warfare.0031.a: "Это какой-то адский кошмар!"
 agot_dragon_warfare.0031.a.tt: "#N [dragon_in_battle.GetName] сильно [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'навредил', 'навредила')] всем сторонам в этой битве!#!\n\n#weak Проклятье, надо было быть осторожнее.#!"

 agot_dragon_warfare.0034.t: "$agot_dragon_warfare.0026.battle_title$ Возмездие"
 agot_dragon_warfare.0034.intro: "Битва окончена, мы проиграли. Убегая с поля боя, я натыкаюсь на ужасающую сцену. Дикий дракон [dragon_in_battle.GetNameNicknamed] [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'устроил', 'устроила')] пиршество, властно распоряжаясь на плотью умерших. Мои внутренности наполняются смесью отвращения и ярости... Ярости хватит на все жизни, потерянные в этой битве из-за вмешательства этого адского чудовища."
 agot_dragon_warfare.0034.one_knight: "[knight_one.GetName]."
 agot_dragon_warfare.0034.two_knights: "[knight_one.GetName] и [knight_two.GetName]."
 agot_dragon_warfare.0034.three_knights: "[knight_one.GetName], [knight_two.GetName] и [knight_three.GetName]."
 agot_dragon_warfare.0034.craven: "Но, несмотря на свою ярость, я ловлю себя на том, что в ужасе убегаю."
 agot_dragon_warfare.0034.a: "Ты заплатишь за это, чудовище!"
 agot_dragon_warfare.0034.a.tt: "Вы попытаетесь убить дикого дракона. #warning Это чрезвычайно опасно.#!"
 agot_dragon_warfare.0034.b: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] выбраться отсюда."
 agot_dragon_warfare.0034.b.craven: "Вы надеетесь, что [dragon_in_battle.Custom('GetDragonSheHe')] не [Select_CString(EqualTo_string('он', dragon_in_battle.Custom('GetDragonSheHe')), 'заметил', 'заметила')] вас!"

