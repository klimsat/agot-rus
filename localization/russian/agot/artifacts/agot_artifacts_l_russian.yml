 artifact_grandmaester_chain: "Цепь Великого мейстера"
 artifact_grandmaester_chain_desc: "Это церемониальное ожерелье носит Великий мейстер Железного трона. В отличие от традиционной цепи мейстера, в его цепочку помимо обычных металлов вплетены драгоценные камни."

 agot_must_be_archmaester_desc: "Вы должны быть архимейстером, чтобы носить это. Если вы видите это, то вам должно быть стыдно."
