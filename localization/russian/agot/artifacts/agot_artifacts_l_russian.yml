 artifact_glass_candle: "Стеклянная свеча"
 agot_artifact_glass_candle_desc: "Обсидиановая свеча, [newly_created_artifact.GetFeatureText('glass_candle_color')] цвета, высокая и витая, острая на ощупь. Считается, что эти свечи горят вечно, позволяя своим владельцам смотреть сквозь океаны и горы. [newly_created_artifact.Custom('GetCandleMagic')]"
 agot_glass_candle_lit_desc: "Эта свеча светит некомфортно ярко, искажая цвета вокруг себя."
 agot_glass_candle_unlit_desc: "Школяры Цитадели бдят перед тремя такими свечами в ночь своего повышения в звании, тщетно пытаясь зажечь их."
 agot_glass_candle_lit.tt: "Магия в этом мире сильна, и стеклянная свеча зажглась."

