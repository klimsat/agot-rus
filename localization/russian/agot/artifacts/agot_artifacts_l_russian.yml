l_russian:
 vs_adders_fang_name: "Клык Гадюки"
 vs_adders_fang_description: "Клык Гадюки — родовой меч главы дома Виль. Богато украшенный меч-бастард с характерным волнистым лезвием бесчисленное количество раз использовался при защите Дорна."
 vs_blackfyre_name: "Чёрное Пламя"
 vs_blackfyre_description: "Чёрное Пламя было одним из двух валирийских мечей, которые Таргариены привезли в Вестерос из Валирии ещё до Рока, что сделало его одним из самых ценных владений семьи Таргариенов. Это богато украшенный полуторный меч, кильон которого представлял из себя головы драконов из почерневшей стали."
 vs_black_blood_name: "Чёрная Кровь"
 vs_black_blood_description: "Огромный двуручный валирийский топор дома Хоар. В отличие от большинства других железнорождённых, которые получали свои фамильные ценности, выплатив железную цену, дом Хоар не стал этим заморачиваться. Такая расточительность стала возможной благодаря их растущему богатству и развитию торговли на Железных островах. Подобные неортодоксальные обычаи принесли членам дома прозвище «чёрная кровь» — оскорбление, превратившееся в знак гордости."
 vs_eleneis_grace_name: "Милосердие Эленеи"
 vs_eleneis_grace_description: "Этот огромный двуручный валирийский меч является фамильным мечом дома Дюррандон. О его владельцах сложено множество песен, в которых их сравнивают с самим штормом, когда они взмахивают клинком в битве, разрубая бесчисленных врагов в изящном танце стали."
 vs_sg_lizard_lion_name: "Львоящер"
 vs_sg_lizard_lion_description: "Отпарируй это, вонючий казуал!"
 vs_brightroar_name: "Светлый Рёв"
 vs_brightroar_description: "Светлый Рёв — родовой валирийский меч дома Ланнистер, потерянный в Валирии вместе с Томменом II после Рока."
 vs_cloudbreak_name: "Разрезающий Облака"
 vs_cloudbreak_description: "Элегантное оружие из более цивилизованной эпохи. Этот длинный меч с рукоятью из драконьей кости увенчан полированным кровавым камнем в качестве навершия. С тех пор, как драконий наездник, владевший этим клинком, погиб во время Рока, Разрезающий Облака хранится у богатых тирошийских купцов из дома Адарис, являясь явным символом их возвышения."
 vs_iron_will_name: "Железная Воля"
 vs_iron_will_description: "Железная Воля — двуручный валирийский меч, поколениями передававшийся между лордами дома Форрестер. Невероятно ценный и желанный."
 vs_pincer_name: "Клешня Краба"
 vs_pincer_description: "Клешня Краба — топор из валирийской стали, принадлежащий дому Селтигар. Тёмный клинок, реликвию валирийского наследия носили поколения Селтигаров ещё до Рока."
 vs_dark_moon_name: "Тёмная Луна"
 vs_dark_moon_description: "Лезвие этого меча сияет, как лучи луны. На рукояти выбита полная луна, холодная и свинцовая, и этот меч - лишь луч ее света."
 vs_dark_sister_name: "Тёмная Сестра"
 vs_dark_sister_description: "Тёмная Сестра была одним из двух валирийских мечей, которые Таргариены принесли на Драконий Камень до Рока. Это длинный меч, тонкий и изящный, с дымчато-тёмным лезвием."
 vs_heartsbane_name: "Губитель Сердец"
 vs_heartsbane_description: "Губитель Сердец — древний валирийский меч, принадлежащий дому Тарли. Это двуручный меч, который принадлежал семье в течение пятисот лет."
 vs_ice_name: "Лёд"
 vs_ice_description: "Лёд — двуручный валирийский меч, принадлежащий дому Старк, выкованный в Валирии за столетие до завоеваний Эйгона. Но само имя клинка намного древнее: его носил другой меч или мечи, которыми Старки владели в Век Героев."
 vs_oathkeeper_name: "Верный Клятве"
 vs_oathkeeper_description: "Этот валирийский меч обладает уникальным цветом, с переливами тёмно-красного и серого по всему лезвию. На навершии изображена золотая львиная голова, рубиновые глаза которой сияют, как две красные звезды."
 vs_oathkeeper_historical_description: "Верный Клятве - длинный валирийский меч, перекованный изо Льда по приказу Тайвина Ланнистера. По его острому, как бритва, лезвию пробегают красные и чёрные круги."
 vs_widows_wail_name: "Вдовий Плач"
 vs_widows_wail_description: "Этот меч из валирийской стали имеет уникальную окраску с рябью глубокого красного и серого цвета по всему лезвию. К нему прилагаются ножны, украшенные золотом, вишнёвым деревом, красной кожей и золотыми львиными головами с рубиновыми глазами."
 vs_widows_wail_historical_description: "Вдовий Плач — новый валирийский меч, выкованный из старого клинка «Лёд» по приказу Тайвина Ланнистера. Его сталь покрыта красной и чёрной рябью, а ножны были сделаны из вишневого дерева и красной кожи, и украшены золотыми львиными головами, глазами которых служили рубины."
 vs_lady_forlorn_name: "Покинутая"
 vs_lady_forlorn_description: "Покинутая — валирийский меч, принадлежащий дому Корбрей. В навершие вставлен рубин в форме сердца."
 vs_lamentation_name: "Плач"
 vs_lamentation_description: "Плач — меч из валирийской стали, принадлежащий дому Ройс, древнему и могущественному благородному дому Долины. Они могут проследить свою родословную до времён Первых людей, которые когда-то населяли Долину и называли себя Бронзовыми королями Рунного Камня, вплоть до завоевания андалами, в котором они были побеждены Артисом Арреном, королём Гор и Долины."
 vs_longclaw_name: "Длинный Коготь"
 vs_longclaw_description: "Длинный Коготь — валирийский меч, принадлежавший дому Мормонт на протяжении сотен лет. Меч сужается к концу, чтобы можно было и колоть, и рубить, три глубоких желобка тянутся по всей длине, улучшая и без того превосходный баланс."
 vs_nightfall_name: "Сумрак"
 vs_nightfall_description: "Сумрак — валирийский меч, принадлежащий дому Харлоу в конце третьего столетия от З.Э. За длинный меч с тёмным лезвием лорд Дальтон Грейджой заплатил железную цену, нанеся в бою смертельную рану корсару. Навершие украшено лунным камнем."
 vs_orphan_maker_name: "Делатель Сирот"
 vs_orphan_maker_description: "Делатель Сирот — валирийский меч, изначально принадлежавший дому Рокстон. На тёмном металле из воронёной стали вырезаны угрожающие шипы, придающие страшную ауру этому грозному оружию."
 vs_poison_name: "Яд"
 vs_poison_description: "Яд - полуторный меч из валирийской стали, принадлежавший дому Вунатис. Предназначался для обмена на мешки с золотом волантинцев за Узким морем, но корабль, на котором находился клинок, был захвачен пиратскими лордами Кровавого Камня. Рукоять сделана из драконьей кости, вырезанной в виде спирали."
 vs_red_rain_name: "Багряный Дождь"
 vs_red_rain_description: "Багряный Дождь — это полуторный меч тёмно-кровавого цвета, инкрустированный каплевидными рубинами. Он принадлежит дому Драмм с тех пор, как Хильмар Хитрый с помощью смекалки и увесистой дубинки отобрал меч у закованного в сталь рыцаря."
 vs_remige_name: "Перо"
 vs_remige_description: "Перо — наследственный меч из валирийской стали, принадлежащий дому Каргилл, который держал в руках легендарный Золотой Гусь, который первым принёс яйца в Вестерос."
 vs_resonance_name: "Отклик"
 vs_resonance_description: "Отклик - древний валирийский меч дома Белмор; говорят, что он издаёт прекрасные звуки, когда соприкасается с другой сталью."
 vs_starcross_name: "Звёздный крест"
 vs_starcross_description: "Звёздный крест - валирийский меч дома Темплтон. Ходят слухи, что именно этим клинком был сражён Робар II Ройс в битве Семи Звёзд."
 vs_upright_name: "Отвесный"
 vs_upright_description: "Отвесный - валирийский меч, принадлежащий дому Уэйнвуд, благородному семейству из Долины. Рукоять меча инкрустирована изумрудом."
 vs_redhorn_name: "Красный Рог"
 vs_redhorn_description: "Красный Рог - валирийский меч дома Престер, лордов Пиршественных Огней. Говорят, что им владели самые свирепые члены семьи, чтобы дать отпор железнорождённым."
 vs_fools_errand_name: "Глупая Затея"
 vs_fools_errand_description: "Глупая Затея - валирийский меч дома Фолвелл. Это длинный меч с красными и золотыми украшениями на рукояти."
 vs_blood_moon_name: "Кровавая Луна"
 vs_blood_moon_description: "Кровавая Луна - валирийский меч, принадлежащий дому Винч из Железной Рощи. Клинок был захвачен у убитого пиратского капитана на берегах Молота Черепа ещё до Рока, за него была уплачена железная цена."
 vs_elegance_name: "Изящный"
 vs_elegance_description: "Изящный - старинный валирийский меч дома Редвин, лордов Арбора. Это сложное оружие представляет собой трёхгранный меч-бастард с изогнутой рукоятью и латунной отделкой. Он попал к ним незадолго до Века Крови и Рока Валирии."
 vs_guile_name: "Хитрость"
 vs_guile_description: "Этот инкрустированный серебром стилет — родовой кинжал дома Флорент, лордов Ясноводной крепости. Его острое как бритва лезвие из валирийской стали на протяжении бесчисленных поколений служило не только ценной реликвией, но и тонким намёком на коварство своего владельца."
 vs_oldroot_name: "Старый Корень"
 vs_oldroot_description: "Старый Корень - родовой валирийский меч дома Окхарт. Он пережил множество войн с дорнийцами и унёс жизни десятков значимых лордов."
 vs_clover_name: "Клевер"
 vs_clover_description: "Клевер - валирийский меч дома Гоуэр. Он был захвачен во время Распри сестёр лордом Мартином Гоуэром, который убил его бывшего владельца в бою." #Sororicide?
 vs_feastmaker_name: "Пирующий"
 vs_feastmaker_description: "Пирующий - валирийский меч дома Морриген. Своё название он получил из-за того, что после битвы оставлял воронам пиршество."
 vs_heartbreaker_name: "Сердцеед"
 vs_heartbreaker_description: "Этот острый и грозный кинжал принадлежал дому Стедмон на протяжении многих поколений. Немногие знают, как часто его лезвие из валирийской стали пробовало кровь врагов или отвергнутых возлюбленных. Но его вечно острый наконечник представляет постоянную угрозу для врагов дома."
 vs_freedom_name: "Свобода"
 vs_freedom_description: "Свобода - древний валирийский меч дома Тойн. Это один из последних оставшихся у них символов былого почёта."
 vs_mourning_name: "Скорбь"
 vs_mourning_description: "Скорбь, принадлежащая дому Пенроз, представляет собой валирийский меч с инкрустацией белой эмалью по всей рукояти."
 vs_guardian_name: "Хранитель"
 vs_guardian_description: "Хранитель - секира из валирийской стали, принадлежащая дому Айронвуд. Это универсальное оружие столь же опасно, сколь и богато украшено. Оно разрубало, сокрушало или пронзало насквозь многих потенциальных захватчиков, которые слишком поздно узнали, что Каменный путь всегда охраняется. Это уникальное оружие, которым владеют бесчисленные представители Королевской Крови, является одним из самых известных в Дорне."
 vs_boneclaw_name: "Костяной Коготь"
 vs_boneclaw_description: "Костяной Коготь - валирийский меч, принадлежащий дому Вейт. На рукояти вырезана голова леопарда."
 vs_honest_broker_name: "Честный Делец"
 vs_honest_broker_description: "Честный Делец - родовой валирийский меч дома Вэнс. Он хранился в роду Приюта Странника на протяжении многих поколений, вызывая сильную зависть других ветвей семьи."
 vs_ascendant_name: "Восхождение"
 vs_ascendant_description: "Восхождение - древняя алебарда из валирийской стали, принадлежащая дому Маллистер. Её наконечник украшен замысловатой гравировкой, а рукоять сделана из прекрасной древесины чардрева. Прославленное тем, что на протяжении сотен лет защищало жителей Сигарда, это оружие является предметом гордости Маллистеров, которые будут часто использовать его, стоя бок о бок со своими воинами на защите своего дома."
 vs_fortitude_name: "Стойкость"
 vs_fortitude_description: "Этот двуручный валирийский меч является фамильным клинком дома Стронг. Он может похвастаться рукоятью из чардрева, а его бронзовая гарда и навершие украшены сапфирами, рубинами и изумрудами, демонстрирующими цвета дома и Трезубца, который является их домом. Он принадлежал семье на протяжении многих поколений и повидал множество сражений."
 vs_venom_name: "Отрава"
 vs_venom_description: "Отрава - валирийский меч дома Випрен из Безмолвной топи. Говорят, что раны, нанесенные этим мечом, чернеют и вызывают болезненные ощущения, что делает даже порез смертельным приговором."

 vs_strangers_mercy_name: "Милосердие Неведомого"
 vs_strangers_mercy_description: "Милосердие Неведомого — полуторный меч из валирийской стали, навершие которого украшено кусочком полированного драконьего стекла."
 vs_truth_name: "Истина"
 vs_truth_description: "Истина — меч из валирийской стали, принадлежащий дому Рогаре, благородной семье древнего происхождения из Лиса. Золотая рукоять украшена богатой резьбой, намекающей на неприличное богатство семьи, накопленное за века работы в банковской сфере."
 vs_vigilance_name: "Бдительность"
 vs_vigilance_description: "Бдительность — родовой меч из валирийской стали, принадлежавший дому Хайтауэр. Тонкий и заострённый боевой меч, украшенный пламенем и зубцами, напоминающий маяк Высокой башни в самом сердце Староместа."
 vs_widestripe_name: "Широкополосный"
 vs_widestripe_description: "Широкополосный — родовой двуручный меч из валирийской стали, принадлежавший дому Лидден, впервые доставленный в Вестерос в руках будущего короля Джоффри Лиддена. Широкий тёмный клинок использовался во многих битвах рыцарями и лордами с барсучьими гребнями."
 vs_longclaw_stark_name: "Длинный Коготь"
 vs_longclaw_stark_description: "Длинный Коготь — родовой меч из валирийской стали, который находился в руках династии Мормонт на протяжении сотен лет. Меч сужается к концу, чтобы можно было и колоть, и рубить, три глубоких желобка тянутся по всей длине, улучшая и без того превосходный баланс. Навершие в виде головы медведя было заменено на голову белого лютоволка, когда меч был подарен Джону Сноу."

 vs_dancer_name: "Танцор"
 vs_dancer_description: "Этот меч-бастард с широким лезвием носил последний из королей дома Масси, которые претендовали на земли, простиравшиеся от восточных берегов Крюка Масси до устья Черноводной, и защищали их. На золотой рукояти вырезаны древние узоры, возможно, по образцу более раннего оружия Века Героев."
 vs_darktalon_name: "Тёмный Коготь"
 vs_darktalon_description: "Вирвелы из Покоя Виверны владели этим длинным мечом на протяжении поколений. На посеребрённой рукояти вырезана свирепая виверна с широко распростёртыми крыльями."
 vs_dawn_name: "Рассвет"
 vs_dawn_description: "Рассвет — легендарный фамильный меч дорнийского дома Дейн. Огромный меч имеет бледное, как молочное стекло, лезвие и золотую звезду, украшающую рукоять. Легенды гласят, что упавшую звезду основатель дома Дейн нашёл в устье Быстроводной, в месте, которое впоследствии было названо Звездопадом. Из сердца этой звезды был выкован Рассвет, и с тех пор им владеют самые достойные члены дома Дейн."
 vs_dusk_name: "Мрак"
 vs_dusk_description: "Мрак - древний валирийский меч дома Карон. Это двуручный меч с массивным тёмным лезвием и изогнутой гардой и навершием, которые подчёркивают грозный вид оружия."
 vs_defiance_name: "Непокорный"
 vs_defiance_description: "Непокорный — боевой меч с бронзовой рукоятью, принадлежащий дому Айронсмит. Айронсмиты прославились благодаря подковам, которые поставляли для северной кавалерии. В конце концов, эта известность позволила им заказать Непокорного и укрепить свой статус среди знати Севера."
 vs_disputant_name: "Спорщик"
 vs_disputant_description: "Спорщик - боевой меч с коротким лезвием и тёмно-золотой рукоятью в форме летучей мыши. Лезвие чёрное, как ночь."
 vs_the_dagger_name: "Кинжал с рукоятью из драконьей кости"
 vs_the_dagger_description: "Этот кинжал инкрустирован рубинами по всей длине изогнутой рукояти, сделанной из драконьей кости. Необычная полукруглая форма и использование драконьей кости в рукояти этого коварного кинжала показывают, что этот кинжал был выкован в древней Валирии для знатной и богатой семьи."
 vs_eleneis_bulwark_name: "Оплот Эленеи"
 vs_eleneis_bulwark_description: "agot_eleneis_bulwark_description"
 vs_justicar_name: "Правосудие"
 vs_justicar_description: "agot_justicar_description"
 vs_pride_name: "Гордость"
 vs_pride_description: "Рыцари с львиными гребнями из дома Джаст носят этот длинный меч со времён королевства Утёс."
 vs_prosperity_name: "Процветание"
 vs_prosperity_description: "Этот богато украшенный золотой меч является собственностью дома Нарратис, знатной семьи с богатой родословной среди аристократии Пентоса. Несколько принцев Пентоса происходили из этой династии, что позволило им накопить богатство, необходимое для приобретения символа их собственного процветания."
 vs_seafoam_name: "Морская Пена"
 vs_seafoam_description: "Валирийская сабля, принадлежащая дому Веларион, украшенная их символом в виде морского конька. Этот изогнутый меч с красивой резной серебряной рукоятью был приобретён на доходы, полученные в результате многолетней торговли."
 vs_skullcleaver_name: "Череполом"
 vs_skullcleaver_description: "Лорды Погибельной крепости владели этим огромным двуручным мечом на протяжении многих поколений. Меч был назван в честь капитана железнорождённых, убитого в единоборстве лордом дома Бейнфорт ударом, который прошёл сквозь топор налётчика, шлем и череп под ним."
 vs_soaring_glory_name: "Парящая Слава"
 vs_soaring_glory_description: "agot_soaring_glory_description"
 vs_stalwart_name: "Стойкий"
 vs_stalwart_description: "Этот смертоносный заострённый длинный меч с гравированной золотой отделкой представляет собой зрелище, достойное восхищения. Он доказал свою смертоносность в боях на протяжении поколений. Короли, лорды и рыцари из дома Дарклин сражались этим мечом со многими противниками и защищали больше королей, чем любой другой дом."
 vs_swansong_name: "Лебяжья Песнь"
 vs_swansong_description: "Лебяжья Песнь - родовой валирийской меч дома Сванн. За годы своего существования он помог лордам Камнешлема отразить бесчисленные набеги дорнийцев и пиратов. Помпоном меча служит изящный лебедь, вырезанный из белого мрамора."
 vs_supremacy_name: "Превосходство"
 vs_supremacy_description: "Серретты с Серебряного Холма — гордый андальский дом, купивший этот вычурный меч на серебро, добытое в землях, окружающих их замок."
 vs_swordfish_name: "Меч-рыба"
 vs_swordfish_description: "Дом Бар-Эммон с Острого Мыса был основан Тогарионом Ужасным — андальским военачальником, выкроившим с мечом в руке себе и своим потомкам собственное маленькое королевство. Этот полуторный меч с золотой и серебряной рукоятью впоследствии использовался Бар-Эммонами для сохранения контроля над этим королевством — они даже назвали флагман своего флота в честь меча."
 vs_yron_key_name: "Железный Ключ"
 vs_yron_key_description: "agot_yron_key_description"
 vs_tranquility_name: "Спокойствие"
 vs_tranquility_description: "Этот посеребрённый длинный меч инкрустирован аметистами. Дом Бракс владеет этим впечатляющим мечом из валирийской стали уже сотни лет."
 vs_wyrmfang_name: "Змеиный Клык"
 vs_wyrmfang_description: "Дастины из Барроутона — старинный дом с богатой и легендарной историей. Этот меч был выкован по подобию бронзовых мечей, которые носили древние короли из дома Дастин в Век Героев."
 vs_evergold_name: "Вечнозолотой"
 vs_evergold_description: "Этот клинок, выкованный по заказу прославленного дома Рован ещё до Рока, выполнен в высочайшем валирийском мастерстве. На его навершии золотой древесный штандарт дома Рован."
 vs_longthorn_name: "Длинный Шип"
 vs_longthorn_description: "Длинный Шип — родовой валирийский меч дома Гарденер, которым веками владели короли Простора. Его тёмно-зелёный клинок дополняет изящная гарда, украшенная изумрудами, а навершием служит отполированная рука из зелёного мрамора."
 vs_longprickle_name: "Длинная Колючка"
 vs_longprickle_description: "Длинная Колючка - родовой валирийский клинок дома Гарденер, который короли Простора носили на протяжении веков. Его тёмно-зелёное лезвие дополнено богато украшенной изумрудами гардой и рукоятью из полированного зелёного мрамора на навершии."
 vs_longthorn_ruined_name: "Клинок Длинный Шип"
 vs_longthorn_ruined_description: "Длинный Шип был длинным мечом, которым некогда владели короли Простора. После почти полного уничтожения на Пламенном поле дом Олдфлауэрс бережно хранил его обломки в надежде однажды восстановить его, став истинными правителями Хайгардена."
 vs_longthorn_restored_description: "Длинный Шип — восстановленный валирийский меч дома Гарденер, перекованный после гибели на Пламенном поле. Его зелёный клинок вновь заключён в нововыкованную гарду с золотой отделкой и новую рукоять. Снова увенчанный отполированным навершием в виде руки из зелёного мрамора, он служит заявлением о законной власти в землях Простора."
 vs_boartusk_name: "Клык Вепря"
 vs_boartusk_description: "Это длинное и внушительное копьё с наконечником из валирийской стали было изготовлено по заказу дома Крейкхолл ещё до Рока. Многие враги, будь то звери или люди, встретили свой конец от него."

 vs_black_death_name: "Чёрная Смерть"
 vs_black_death_description: "Этот меч был выкован исключительно для того, чтобы быть эффективным на поле боя. Его перекрестье заточено под острые шипы, рукоять сделана из хрупкого чёрного железа, а на рукояти красуется шипастая железная булава, призванная сокрушать черепа тех, кто осмелится приблизиться."
 vs_mothers_grief_name: "Скорбь Матери"
 vs_mothers_grief_description: "На рукояти этого длинного меча вырезана медная статуя Небесной Матери, возможно, в качестве мольбы к богам о защите близких в бою. Гравированные крестовина и гарда сделаны из той же красной меди."
 vs_talon_name: "Коготь"
 vs_talon_description: "Крестовина этого длинного меча выполнена в форме крыльев, в центре которых находится крупный синий сапфир. На рукояти, изготовленной из той же стали с синим оттенком, изображена голова сокола с золотыми прожилками, идущими снизу, и двумя небольшими сапфирами в качестве глаз."
 vs_glory_name: "Слава"
 vs_glory_description: "Рубин глубокого красного цвета, выточенный в форме сердца, служит навершием этого короткого меча. Массивное золото, выложенное в форме лижущего пламени, обнимает рубин с каждой стороны в пламенных объятиях Рглора."
 vs_skinpeeler_name: "Сдиратель кожи"
 vs_skinpeeler_description: "Этот двуручный меч имеет характерный волнистый клинок из валирийской стали, оттененный светло-розовым цветом."
 vs_sting_name: "Жало"
 vs_sting_description: "Изысканный длинный меч с острым, стремительно сужающимся клинком из валирийской стали, точным и жалящим, как укус. У него спиралевидная мраморная рукоять и затейливая золотая гарда, подчёркивающая безупречную отделку. В каплевидном навершии покоится гладкий янтарный камень, придающий оружию изящный, но смертельно опасный вид."
 vs_stormy_nights_name: "Штормовая Ночь"
 vs_stormy_nights_description: "Жестокий и суровый на вид клинок, лишённый вычурных украшений, присущих большинству валирийских артефактов, этот меч сохраняет тёмный оттенок, с которым он был рождён в кузнице, скрученный и вылепленный его создателем в практичную форму. Отсутствие украшений придаёт этому оружию суровую и грозную ауру в противовес большинству творений старой империи - оружие воина, а не благородное украшение."
 vs_strangers_touch_name: "Касание Неведомого"
 vs_strangers_touch_description: "Те, кто оказался в тени этого чудовища, должны найти утешение в том, что их осудил тот, кто посчитал, что их конец стоит самых высоких затрат."
 vs_dragonbane_name: "Драконья Погибель"
 vs_dragonbane_description: "Эфес этого меча изготовлен из серебра, окрашенного в тёмно-синий цвет. Из того же металла изготовлено и навершие с замысловатой гравировкой. Перекрестье меча выполнено в виде пары драконов с распростёртыми крыльями по обе стороны клинка."
 vs_iron_price_name: "Железная Цена"
 vs_iron_price_description: "Большой и грозный, этот меч может похвастаться изображением кракена на своей гарде и навершии."
 vs_unkindness_name: "Недоброжелатель"
 vs_unkindness_description: "Острый и стремительный клинок этого меча украшен почерневшим изображением черепа ворона на навершии, а также прочной рукоятью из чардрева. Кроме того, он украшен несколькими рубинами."
 vs_darkflame_name: "Темнопламень"
 vs_darkflame_description: "Огромный богато украшенный полуторный меч, инкрустированный красными рубинами, с чернеющими стальными языками пламени на крестовине и навершии."
 vs_duskmaiden_name: "Сумеречная Дева"
 vs_duskmaiden_description: "Изящный длинный меч с дымчато-чёрным клинком, украшенный красными рубинами и чернеющими стальными крыльями дракона на крестовине, с тёмным навершием в форме пламени."

 vs_andal_armingsword_gold_name: "Золотой андальский боевой меч"
 vs_andal_armingsword_gold_description: "Металлическая отделка этого оружейного меча сверкает золотым блеском. Тонкая филигрань мерцает в свете свечей, так же детально, как и вихревые узоры на темном рифленом лезвии из валирийской стали. Этот меч кажется достойным самого воина, героическое оружие, напоминающее об ушедшей эпохе."
 vs_andal_armingsword_silver_name: "Серебряный андальский боевой меч"
 vs_andal_armingsword_silver_description: "Витиеватый серебряный металл этого оружейного меча прекрасно выгравирован. Тонкая филигрань мерцает в свете свечей, так же детально, как и вихревые узоры на тонком рифленом лезвии из валирийской стали. Этот меч кажется достойным самого воина, героическое оружие, напоминающее об ушедшей эпохе."
 vs_andal_longsword_gold_name: "Золотой андальский длинный меч"
 vs_andal_longsword_gold_description: "Металлическая отделка этого длинного меча сверкает золотым блеском. Тонкая филигрань мерцает в свете свечей, так же детально, как и вихревой узор на тонком рифлёном лезвии из валирийской стали. Этот меч кажется достойным самого воина, героическое оружие, напоминающее об ушедшей эпохе."
 vs_andal_longsword_silver_name: "Серебряный андальский длинный меч"
 vs_andal_longsword_silver_description: "Витиеватый серебряный металл этого длинного меча прекрасно выгравирован. Тонкая филигрань мерцает в свете свечей, так же детально, как и вихревые узоры на тонком рифлёном лезвии из валирийской стали. Этот меч кажется достойным самого воина, героическое оружие, напоминающее об ушедшей эпохе."
 vs_firstman_armingsword_gold_name: "Золотой боевой меч Первых людей"
 vs_firstman_armingsword_gold_description: "Металлическая отделка этого оружейного меча сверкает золотым блеском. Рунические надписи, написанные на древнем языке, мерцают в свете свечей, так же подробно, как и вихревой узор на тёмном рифлёном лезвии из валирийской стали. По стилю и пропорциям этот меч сильно напоминает мечи, которые носили древние герои многих северных домов, ведущих своё происхождение от Первых людей."
 vs_firstman_armingsword_silver_name: "Серебряный боевой меч Первых людей"
 vs_firstman_armingsword_silver_description: "Витиеватый серебряный металл этого длинного меча искусно выгравирован. Рунические надписи, написанные на древнем языке, мерцают в свете свечей, так же подробно, как и вихревой узор на тёмном рифлёном лезвии из валирийской стали. По стилю и пропорциям этот меч сильно напоминает мечи, которые носили древние герои многих северных домов, ведущих своё происхождение от Первых людей."
 vs_firstman_armingsword_bronze_name: "Бронзовый боевой меч Первых людей"
 vs_firstman_armingsword_bronze_description: "Бронзовый металл этого оружейного меча отполирован до блеска. Рунические надписи, написанные на древнем языке, мерцают в свете свечей, так же подробно, как и вихревой узор на тёмном рифлёном лезвии из валирийской стали. По стилю и пропорциям этот меч сильно напоминает мечи, которые носили древние герои многих северных домов, ведущих своё происхождение от Первых людей."
 vs_firstman_longsword_gold_name: "Золотой длинный меч Первых людей"
 vs_firstman_longsword_gold_description: "Металлическая отделка этого длинного меча сверкает золотым блеском. Рунические надписи, написанные на древнем языке, мерцают в свете свечей, так же подробно, как и вихревой узор на тёмном рифлёном лезвии из валирийской стали. По стилю и пропорциям этот меч сильно напоминает мечи, которые носили древние герои многих северных домов, ведущих свое происхождение от Первых людей."
 vs_firstman_longsword_silver_name: "Серебряный длинный меч Первых людей"
 vs_firstman_longsword_silver_description: "Витиеватый серебряный металл этого длинного меча искусно выгравирован. Рунические надписи, написанные на древнем языке, мерцают в свете свечей, так же подробно, как и вихревой узор на тёмном рифлёном лезвии из валирийской стали. По стилю и пропорциям этот меч сильно напоминает мечи, которые носили древние герои многих северных домов, ведущих своё происхождение от Первых людей."
 vs_firstman_longsword_bronze_name: "Бронзовый длинный меч Первых людей"
 vs_firstman_longsword_bronze_description: "Бронзовый металл этого оружейного меча отполирован до блеска. Рунические надписи, написанные на древнем языке, мерцают в свете свечей, так же подробно, как и вихревые узоры на тёмном рифлёном клинке из валирийской стали. По стилю и пропорциям этот меч сильно напоминает мечи, которые носили древние герои многих северных домов, ведущих своё происхождение от Первых людей."
 vs_valyrian_armingsword_gold_name: "Золотой валирийский боевой меч"
 vs_valyrian_armingsword_gold_description: "Витиеватая металлическая отделка этого оружейного меча сверкает золотым блеском. Фактурная чешуя металла мерцает и светится в свете свечей, как и вихревые узоры на тёмном рифлёном клинке из валирийской стали. Этот меч напоминает грозное оружие, которым владели драконьи владыки древней Валирии."
 vs_valyrian_armingsword_silver_name: "Серебряный валирийский боевой меч"
 vs_valyrian_armingsword_silver_description: "На витиеватом серебряном металле этого оружейного меча выполнена великолепная гравировка. Фактурные чешуйки металла мерцают и сияют в свете свечей, как и вихревые узоры на темном рифленом лезвии из валирийской стали. Этот меч напоминает грозное оружие, которым владели драконьи владыки древней Валирии."
 vs_valyrian_longsword_gold_name: "Золотой валирийский длинный меч"
 vs_valyrian_longsword_gold_description: "Металлическая отделка этого длинного меча сверкает золотым блеском. Тонкая филигрань мерцает в свете свечей, так же детально, как и вихревой узор на тёмном рифлёном клинке из валирийской стали. Этот меч напоминает грозное оружие, которым владели драконьи владыки древней Валирии."
 vs_valyrian_longsword_silver_name: "Серебряный валирийский длинный меч"
 vs_valyrian_longsword_silver_description: "Витиеватый серебряный металл этого длинного меча прекрасно выгравирован. Текстурированные чешуйки металла мерцают и светятся в свете свечей, как и вихревые узоры на тёмном рифлёном лезвии из валирийской стали. Этот меч напоминает грозное оружие, которым владели драконьи владыки древней Валирии."

 maekar_mace_name: "Булава Мейкара"
 maekar_mace_description: "Эту огромную булаву с шипами, выкованную во времена юности Мейкара Таргариена, могут поднять только самые могучие воины."
 hes_strong: "Требуется свойство «[GetTrait('strong').GetName( GetNullCharacter )]», «[GetTrait('physique_good_1').GetName( GetNullCharacter )]», «[GetTrait('physique_good_2').GetName( GetNullCharacter )]» или «[GetTrait('physique_good_3').GetName( GetNullCharacter )]»"
 bobby_hammer_name: "Боевой молот Роберта"
 bobby_hammer_description: "Этот боевой молот, выкованный мастером-кузнецом Штормового Предела Доналом Нойе, имеет такие огромные размеры и вес, что для владения им нужен человек с силой великана."
 bobby_hammer_cooler_description: "Этот боевой молот, выкованный мастером-кузнецом Штормового Предела Доналом Нойе, имеет такие огромные размеры и вес, что для владения им нужен человек с силой великана. Роберт Баратеон проломил этим молотом грудную клетку принца Рейгара Таргариена в битве на Трезубце."
 bobby_hammer_duel_description: "[my_weapon.GetDesc] [owner.GetFullName] [Select_CString(owner.IsFemale, 'проломила', 'проломил' )] этим молотом грудную клетку персонажа [loser.GetFullNamePossessive] в битве за [battle_location.GetNameNoTooltip]."
 emoBoy_sword_name: "Арфа Влюблённого"
 emoBoy_sword_description: "Лучший клинок, когда-либо выкованный на Стальной улице Королевской Гавани, подаренный принцу Рейгару Таргариену, когда он стал принцем Драконьего Камня. Тонкий и элегантный, достойный клинок для человека, который однажды может стать королём."
 emoBoy_sword_duel_description: "[my_weapon.GetDesc] [owner.GetFullName] [Select_CString(owner.IsFemale, 'сразила', 'сразил' )] этим мечом персонажа [loser.GetFullName] в битве за [battle_location.GetNameNoTooltip]."
 bumblin_sword_name: "Колючка"
 bumblin_sword_description: "«Колючка» — родовой меч дома Бисбери. Изысканный длинный меч с сильно сужающимся клинком, острым и точным, как жало. У него витая янтарная рукоять и сложная гарда из чернёной стали, подчёркивающая его утончённый облик. Отполированный янтарный камень завершает его изысканный вид."
 kingsguard_sword_name: "Меч персонажа [owner.GetFullNamePossessive]"
 kingsguard_sword_description: "Меч, вручённый персонажу [owner.GetFullName] при вступлении в Королевскую гвардию."
 redbeard_axe_name: "Топор Рыжебородого"
 redbeard_axe_description: "Бронзовый топор ручной работы, когда-то принадлежавший Раймуну Рыжебородому, королю-за-Стеной."
 agot_is_wildling_desc: "Вы являетесь частью Вольного народа"
 bloodraven_longbow_name: "Вороний Зуб"
 bloodraven_longbow_description: "Белоснежный лук, изготовленный для Бриндена Риверса, более известного как «Кровавый Ворон». Этот впечатляющий лук был сделан из упавшей ветки большого чардрева, по которому Воронодрев получил свое название."
 weirwood_longbow_name: "Длинный лук из чардрева"
 weirwood_longbow_description: "Изготовленный из древесины чардрева, этот лук обладает неповторимым костяным белым цветом, характерным для священных деревьев Старых богов. Он хорошо изготовлен и никогда не сгниет."
 dragonbone_longbow_name: "Длинный лук из драконьей кости"
 dragonbone_longbow_description: "Такие луки редки и очень востребованы. Прочная, как сталь, но более легкая и гибкая, драконья кость служит прекрасным материалом для луков, которые, как говорят, превосходят даже луки из златосерда Летних островов."

 #Crown Tooltip
 agot_is_independent_crown_tooltip_desc: "Эту корону могут носить только независимые правители, их супруги или наследники."
 baelor_crown_tooltip_desc: "Эту корону могут носить только добродетельные правители."

 #Targaryen Crowns
 aegon_i_crown_name: "Корона Завоевателя"
 aegon_i_crown_description: "Корона Эйгона I «Завоевателя», человека, который пламенем и кровью выковал единое королевство. Корона выкована из валирийской стали и инкрустирована крупными рубинами."
 aenys_crown_name: "Корона Старшего сына"
 aenys_crown_description: "Корона Эйниса I, выкованная из желтого золота с инкрустацией из нефрита и жемчуга и ликами Семерых - ирония судьбы, учитывая особенности его правления."
 jaehaerys_crown_name: "Корона Миротворца"
 jaehaerys_crown_description: "Корона Джейхейриса I «Миротворца» представляет собой простой обруч из семи драгоценных камней разного цвета, по одному для каждого из королевств и каждого из богов."
 aegon_iii_crown_name: "Корона Драконьей Погибели"
 aegon_iii_crown_description: "Корона Эйгона III «Драконьей Погибели» - простая корона, представляющая собой обычный золотой обруч. Эйгон III предпочитал поддерживать при дворе тишину и порядок, что и демонстрирует корона."
 baelors_crown_name: "Корона Благословенного"
 baelors_crown_description: "Корона из настоящих цветов, которую носил Бейлор «Благословенный», отказавшись от металлических венцов своих предшественников. Переплетение ярких цветов и зелени говорило о восхищении и преданности Бейлора Семи ликам Единого и всему их творению."
 aegon_iv_crown_name: "Корона Недостойного"
 aegon_iv_crown_description: "Корона Эйгона IV «Недостойного» изготовлена из красного золота, украшена по кругу головами драконов с глазами из драгоценных камней."
 maekars_crown_name: "Корона Наковальни"
 maekars_crown_description: "Корона Мейкара I - это боевая корона, подобающая своему владельцу, украшенная заострениями из чёрного железа, перевязанными лентой из красного золота."
 rhaella_crown_name: "Корона Печальной королевы"
 rhaella_crown_historical_description: "Корона, принадлежавшая королеве Рейлле Таргариен, жене короля Эйриса II. Это обруч из серебра и стали, украшенный красными рубинами и пересыпанный десятками бриллиантов."
 rhaella_crown_description: "Корона, которую носила королева Рейлла Таргариен. Это обруч из серебра и стали, украшенный красными рубинами и пересыпанный десятками бриллиантов."
 visenya_circlet_name: "Обруч Тёмной сестры"
 visenya_circlet_description: "Обруч из тёмной валирийской стали, окружённый красными рубинами, который носила королева Висенья, старшая из Трёх Драконов. Он служит ярким напоминанием о Тёмной сестре Эйгона Дракона."
 rhaenys_circlet_name: "Обруч Возлюбленной королевы"
 rhaenys_circlet_description: "Выкованный из тёмной валирийской стали и инкрустированный ромбовидными рубинами, этот чудесный обруч принадлежал королеве Рейнис Таргариен."
 rhaenys_circlet_historical_description: "Выкованный из тёмной валирийской стали и инкрустированный ромбовидными рубинами, этот чудесный обруч принадлежал королеве Рейнис Таргариен, самой прекрасной из жён короля Эйгона Завоевателя."
 alysannecrown_name: "Корона Доброй королевы"
 alysannecrown_description: "Корона королевы Алисанны Таргариен представляет из себя тонкий, простой обруч из семи драгоценных камней, каждый из которых имеет свой цвет."
 alysannecrown_historical_description: "Корона королевы Алисанны Таргариен, известной как «Добрая королева», которая представляет собой более тонкую вариацию короны её мужа."
 daenerys_crown_name: "Корона Бурерождённой"
 daenerys_crown_historical_description: "Корона Дейнерис I «Бурерождённой» была подарена в Кварте, и, безусловно, обладает восточным колоритом. Выполнена в виде трёхглавого дракона. Змеевики из жёлтого золота, крылья серебряные, головы вырезаны из нефрита, слоновой кости и оникса."
 daenerys_crown_description: "Корона Дейнерис I «Бурерождённой». Выполнена в виде трёхглавого дракона. Змеевики из жёлтого золота, крылья серебряные, головы вырезаны из нефрита, слоновой кости и оникса."
 daemon_stepstone_crown_name: "Корона Порочного принца"
 daemon_stepstone_crown_description: "Корона из железа и серебра, инкрустированная красными рубинами и вдохновлённая коронами Завоевателя и Миротворца. Эту корону носил Порочный принц Деймон Таргариен после завоевания Ступеней."
 daemon_queen_stepstone_crown_name: "Корона консорта Порочного принца"
 daemon_queen_stepstone_crown_description: "Обруч из железа и серебра, инкрустированный красными рубинами и вдохновлённый коронами Завоевателя и Миротворца."
 westerosi_valyrian_crown1_name: "Корона Красного Дракона"
 westerosi_valyrian_crown1_description: "Золотая корона, по форме напоминающая кожистые крылья дракона, украшенная тремя крупными рубинами."
 westerosi_valyrian_crown2_name: "Корона Пламени и Крови"
 westerosi_valyrian_crown2_description: "Корона из чёрного железа, по форме напоминающая кожистые крылья драконов и украшенная тремя крупными рубинами, символизирующими цвета и символ дома Таргариен."

 #Baratheon Crowns
 robertI_crown_name: "Корона Венценосного Оленя"
 robertI_crown_description: "Корона Роберта I Баратеона, выполненная в форме оленьих рогов и отделанная золотом."
 stannis_crown_name: "Корона Пламенного Оленя"
 stannis_crown_description: "Корона Станниса I Баратеона сделана из красного золота и отточена в пламени Владыки Света, его нового бога."
 renly_crown_name: "Корона Усмехающегося Оленя"
 renly_crown_description: "Корона Ренли I Баратеона олицетворяет его брак: нефритовая голова оленя с золотыми глазами и рогами, окружённая кольцом из золотых роз."
 joffreyI_crown_name: "Корона Льва и Оленя"
 joffreyI_crown_description: "Корона Джоффри I Баратеона - золотая, из оленьих рогов, хотя и более скромная, чем корона его отца, украшенная рубинами и чёрными бриллиантами."

 #Blackfyre crowns
 daemonblackfyre_crown_name: "Корона Чёрного Дракона"
 daemonblackfyre_crown_historical_description: "Корона Деймона Блэкфайра, так называемого «Чёрного Дракона» и первого претендента из дома Блэкфайр. Создана по подобию короны Завоевателя, однако цвета изменены на противоположные, как и на знамени дома Блэкфайр. Вместо валирийской стали использовалось драконье стекло, окованное красной медью."
 daemonblackfyre_crown_description: "Эта корона создана по подобию короны Завоевателя, однако цвета изменены на противоположные, как и на знамени дома Блэкфайр. Вместо валирийской стали использовалось драконье стекло, окованное красной медью."

 #Kingdom Crowns
 driftwood_crown_1_name: "Корона из плавника"
 driftwood_crown_1_description: "В отличие от королей зелёных земель, короны древних верховных королей были дарами моря, сделанными из куска коряги, выброшенного на берег, чтобы напомнить, что всё, что они имели, было дано им Утонувшим богом."
 iron_isles_crown_name: "Корона Железных королей"
 iron_isles_crown_description: "Когда дом Грейайрон положил конец созыву Вече королей и провозгласил себя железными королями Островов, они изготовили для себя железную корону, символизирующую их власть."
 iron_isles_crown_historical_description: "Когда дом Грейайрон положил конец созыву Вече королей и провозгласил себя железными королями Островов, они изготовили для себя железную корону, символизирующую их власть. С тех пор она передавалась по наследству среди королей Железных островов."
 riverlands_crown_name: "Корона Трезубца"
 riverlands_crown_description: "Элегантная корона, украшенная символом трезубца, символизирующим великую реку, носящую его имя. Предназначена для ношения правителем Речных земель."
 crown_of_mudd_name: "Корона Рек и Холмов"
 crown_of_mudd_description: "Золотая корона, усыпанная изумрудами. Корона выполнена по образу и подобию герба древнего дома Мадд."
 crown_of_mudd_coa_name: "Корона древних королей"
 crown_of_mudd_coa_description: "Золотая корона, усыпанная драгоценными камнями. Эта корона выполнена в старинном стиле, подобном тому, что носили древние короли Трезубца."
 crown_of_winter_name: "Корона Зимы"
 crown_of_winter_description: "Древняя корона дома Старков, сначала как королей Зимы, а затем как королей Севера. Изготовленная из девяти железных мечей, скрепленных бронзовым кольцом с начертанными на нём рунами, она является символом суровой земли и сурового народа."
 crown_of_winter_historical_description: "Древняя корона королей Зимы из дома Старк. Изготовленная из девяти железных мечей, скрепленных бронзовым кольцом с начертанными на нём рунами, она является символом суровой земли и сурового народа."
 crown_of_jeyne_westerling_name: "Корона Юной королевы"
 crown_of_jeyne_westerling_description: "Открытый обруч из кованой бронзы с серебряными краями. Подобно знаменитой Короне Зимы, которую носили древние короли из дома Старков, эта корона увенчана шипами, выточенными в форме мечей. Правда, в отличие от неё, на короне всего шесть серебряных мечей, выполненных в форме Льда - родового клинка из валирийской стали дома Старков. В качестве символа семьи владельца короны между клинками вставлены шесть серебряных ракушек."
 dorne_crown_name: "Корона Солнца и Копья"
 dorne_crown_description: "Обруч из золота, окружённый восемью золотыми символами дома Нимерос Мартелл - солнцем и копьями, в центре которых красуется красный рубин."
 falcon_crown_name: "Соколиная корона Гор и Долины"
 falcon_crown_description: "Серебряная корона, подобная тем, что носили короли Гор и Долины из дома Аррен, в центре короны - крылья сокола, выходящие из голубого драгоценного камня, а внизу - серебряная луна с гребнем."
 falcon_crown_historical_description: "Серебряная корона королей Гор и Долины из дома Аррен, в центре короны - крылья сокола, выходящие из голубого драгоценного камня, а внизу - серебряная луна с гребнем."
 iron_stag_crown_name: "Корона Железного оленя"
 iron_stag_crown_description: "Корона одного из самых воинственных Дюррандонов отражает его характер. Хотя большинство Штормовых королей были известны своими боевыми подвигами, эта корона предназначена для тех, кто действительно предан пути меча."
 stormlands_crown_name: "Корона Штормов"
 stormlands_crown_description: "Корона Штормов была родовой короной дома Дюррандон, которую носили с тех пор, как Дюрран женился на Эленее и был возведён Седьмой замок."
 stormlands_crown_historical_description: "Корона Штормов является родовой короной дома Дюррандон, которую носили с тех пор, как Дюрран женился на Эленее и был возведён Седьмой замок."
 westerlands_crown_name: "Обруч Утёса"
 westerlands_crown_description: "Обруч Утёса - традиционная корона королевы-консорта из дома Ланнистер, представляющая собой красивый обруч, украшенный золотом, драгоценными камнями и львами."
 westerlands_crown_historical_description: "Обруч Утёса - традиционная корона королевы-консорта из дома Ланнистер, представляющая собой красивый обруч, украшенный золотом, драгоценными камнями и львами."
 westerlands2_crown_name: "Корона Утёса и Холмов"
 westerlands2_crown_description: "Корону Утёса носили короли Утёса из дома Ланнистер, ведущие свое происхождение от Ланна Умного и Лореона Льва."
 westerlands2_crown_historical_description: "Корону Утёса носят короли Утёса из дома Ланнистер, ведущие свое происхождение от Ланна Умного и Лореона Льва."
 crown_of_gardener_peace_name: "Цветы Мира"
 crown_of_gardener_peace_description: "Корона из лозы и цветов. Короли из рода Гарденер в старину надевали такие короны в мирные времена."
 crown_of_gardener_peace_historical_description: "Корона из лозы и цветов, которую короли из дома Гарденер надевают в мирные времена."
 crown_of_gardener_war_iron_name: "Шипы Войны"
 crown_of_gardener_war_iron_description: "Корона из железных лоз с ярко выраженными шипами. Короли из рода Гарденер в старину надевали такие короны во время войны."
 crown_of_gardener_war_iron_historical_description: "Корона из железных лоз с ярко выраженными шипами, которую короли из дома Гарденер надевают во время войны."

 #Regional Crowns
 crown_of_first_men_name: "Корона Первых людей"
 crown_of_first_men_description: "Простой бронзовый обруч с начертанными рунами Первых людей."
 crown_of_the_andals_name: "Корона андалов"
 crown_of_the_andals_description: "Царственная корона из бронзы и серебра, инкрустированная крупными драгоценными камнями и украшенная мелким жемчугом. Этот головной убор выполнен в традиционном андальском дизайне, восходящем к древним искателям приключений."
 crown_of_the_andals_silver_name: "Серебряная корона андалов"
 crown_of_the_andals_silver_description: "Царственная корона из серебра, инкрустированная крупными драгоценными камнями и украшенная мелким жемчугом. Этот головной убор выполнен в традиционном андальском дизайне, восходящем к древним искателям приключений."
 crown_of_westerosi_diadem_name: "Вестеросская диадема"
 crown_of_westerosi_diadem_description: "Прочная бронзовая корона, инкрустированная разноцветными драгоценными камнями и украшенная золотыми деталями."
 crown_of_westerosi_diadem_silver_name: "Вестеросская серебряная диадема"
 crown_of_westerosi_diadem_silver_description: "Прочная серебряная корона, инкрустированная разноцветными драгоценными камнями и украшенная золотыми деталями."
 valeman_crown_name: "Корона долинян"
 valeman_crown_description: "Серебряная корона с искусно вырезанными узорами и инкрустированными драгоценными камнями выполнена в стиле, характерном для Долины."
 stormlander_crown_name: "Корона штормовиков"
 stormlander_crown_description: "Гордая золотая корона с крупными драгоценными камнями по окружности. Выполнена в стиле, характерном для Штормовых земель."
 westerlander2_crown_name: "Корона западноземцев"
 westerlander2_crown_description: "Нарядная золотая корона с замысловатыми узорами и отполированными драгоценными камнями выполнена в стиле, характерном для Западных земель."
 reachman_crown_name: "Корона просторцев"
 reachman_crown_description: "Прекрасная золотая корона, украшенная причудливо переплетенными золотыми лозами, украшенными сверкающими драгоценными камнями. В центре этой изысканной короны - великолепный золотой цветок, сердцевина которого украшена крупной жемчужиной, придающей пленительную элегантность."
 dornish_crown_name: "Корона дорнийцев"
 dornish_crown_description: "Круглый обруч из золота, окруженный восемью золотыми солнцами, в центре которых виднеются разноцветные драгоценные камни."
 swann_crown_name: "Корона сражающихся Лебедей"
 swann_crown_description: "Черно-белая корона, на которой изображены два лебедя, обращенные друг к другу, а в центре - множество мелких драгоценных камней."
 beyondthewall_crown_name: "Корона Вольного народа"
 beyondthewall_crown_description: "Корона из грубой кожи и обсидиановых шипов, изготовленная для того, кто достаточно смел, чтобы претендовать на земли за Стеной и удерживать их."
 blackwood_crown_name: "Воронья корона"
 blackwood_crown_description: "Тёмная корона, выполненная в форме черепа ворона с ветвями, олицетворяющими древнее чардрево Воронодрева."
 bolton_crown_name: "Ободранная корона"
 bolton_crown_description: "Устрашающая корона с изображением ободранных людей на ней. Гордо демонстрирует древнюю традицию дома Болтон, давшую им свой герб - сдирать кожу со своих врагов, как они когда-то расправились с несколькими королями Зимы."
 bolton_skin_crown_name: "Корона Свежевателя"
 bolton_skin_crown_description: "Широкий серебряный обруч, вся внешняя поверхность которого покрыта грубо сшитыми между собой кусками человеческой кожи. Это жуткое украшение служит намеренной демонстрацией древнего и печально известного обычая дома Болтон — сдирать кожу со своих врагов."
 cargyll_crown_name: "Корона Золотого Яйца"
 cargyll_crown_description: "Золотая корона с изображением двух золотых гусей, обращённых друг к другу, в центре - два красных рубина и крупный чёрный рубин."
 dayne_crown_name: "Корона Зари"
 dayne_crown_description: "Эта корона, выполненная в стиле древних головных уборов королей Звездопада, изготовлена из серебра и имеет в центре большую серебряную звезду с аметистовым драгоценным камнем в сердцевине."
 crown_of_hellholt_name: "Корона Пекла"
 crown_of_hellholt_description: "Огненная корона из красного золота, созданная для того, чтобы представлять тех, кто будет править Серноводной."
 dustin_crown_name: "Корона Курганов"
 dustin_crown_description: "Корона древних королей Курганов, предположительно потомков Первого Короля."
 florent_crown_name: "Корона Лисицы"
 florent_crown_description: "Золотая корона, в центре которой - красно-рубиновая хитрая лисица, а по бокам - бронзовые цветы, инкрустированные голубым драгоценным камнем."
 frey_crown_name: "Корона Переправы"
 frey_crown_description: "Имитация короны, которую, по преданию, носили тысячи лет назад в век Ста Королевств представители дома Фреев, представляет собой серебряную корону с рядом небольших миниатюрных башен Переправы и тремя голубыми драгоценными камнями под каждой башней."
 greyjoy_crown_name: "Корона Кракена"
 greyjoy_crown_description: "Корона из железа и золота с изображением кракена, длинные щупальца которого окружают и обхватывают голову того, кто её носит."
 harlaw_crown_name: "Корона Сурового Закона"
 harlaw_crown_description: "Корона, пронизанная смертью, с изображением кричащих черепов мертвецов, косы Неведомого и светло-фиолетового драгоценного камня."
 hightower_crown_name: "Корона Высокой башни"
 hightower_crown_description: "Изысканная корона, выполненная из серебра и золота, включает девять миниатюрных копий Высокой башни Староместа, выполненных в серебре, каждая из которых украшена сверкающим золотым пламенем на вершине. Эти башни изящно соединены дополнительными резными золотыми языками пламени, а сама корона изящно инкрустирована сияющими изумрудными и рубиновыми драгоценными камнями."
 manderly_crown_name: "Корона Водяного"
 manderly_crown_description: "Точная копия короны, которую когда-то носил дом Мандерли за много веков до своего изгнания из Простора. Великолепная золотая корона, напоминающая плещущиеся волны и украшенная сверкающим жемчугом, в самом центре украшена тщательно проработанным изображением двух водяных, сжимающих трезубец. Вокруг короны среди искусно вырезанных мотивов волн аккуратно расположены изумрудные драгоценные камни, придающие короне царственный вид."
 reach_crown_name: "Корона Золотой Розы"
 reach_crown_description: "Красивый золотой ободок, украшенный причудливо переплетёнными золотыми лозами, украшенными сверкающими изумрудными драгоценными камнями. В центре изысканной короны - великолепный золотой цветок, сердцевину которого украшает крупный изумрудный камень, придающий пленительную элегантность."
 redwyne_crown_name: "Винная корона"
 redwyne_crown_description: "Тонкий золотой ободок украшен мерцающими голубыми драгоценными камнями, расположенными в виде изящной виноградной лозы. В центре - перевернутый виноградный лист, а по бокам - изысканные фиолетовые драгоценные камни, выполненные в виде виноградин."
 reed_crown_name: "Корона Перешейка"
 reed_crown_description: "Диадема, изготовленная из шкуры крокодила из Перешейка, вершина которой украшена грозными зубами этого существа, а основной фасад диадемы - тремя крокодильими глазами."
 crown_of_bear_island_name: "Корона Медвежьего острова"
 crown_of_bear_island_description: "Высокая и внушительная корона, вдохновленная деревьями Медвежьего острова, инкрустирована крупными изумрудами и черными бриллиантами."
 royce_crown_name: "Руническая корона"
 royce_crown_description: "Эта бронзовая корона с черными круглыми драгоценными камнями и резьбой в виде рун Первых людей выполнена по образу древней королевской короны дома Ройс из Долины."
 crown_of_hearts_home_name: "Корона Дома Сердец"
 crown_of_hearts_home_description: "Богато украшенная серебряная корона с тремя крупными инкрустированными драгоценными камнями в форме сердец и тремя фигурками на них, изображающими воронов. Эта корона сделана в честь геральдики дома Корбрей."
 tarly_crown_name: "Корона Охоты"
 tarly_crown_description: "Пленительная корона из золота и серебра украшена центральной золотой полосой с зелёными драгоценными камнями и рядом серебряных наконечников стрел, каждый из которых украшен сияющим красным рубином в сердцевине. В центре короны расположено великолепное изображение серебряного лука, концы которого украшены сверкающими красными и зелёными драгоценными камнями. Между стрелами, направленными вверх и расположенными в центре лука, находится изящная золотая стрела, украшенная сложной гравировкой в виде листьев и лучников."
 tarth_crown_name: "Корона Вечерней Звезды"
 tarth_crown_description: "Элегантная цилиндрическая золотая корона, отличающаяся шестью тщательно вырезанными отверстиями, напоминающими солнце, и дополненная ещё шестью тщательно вырезанными отверстиями, зеркально отражающими форму луны."
 crown_of_dondarrion_name: "Корона Чёрного Приюта"
 crown_of_dondarrion_description: "Темный обруч с белыми бриллиантами в форме звезд. Сделан так, чтобы напоминать цвета дома Дондаррион из Штормовых земель."
 tully_crown_name: "Корона Форели"
 tully_crown_description: "Корона из железа и серебра, украшенная башнями в форме рыбьих плавников. Основание короны украшено железным ободком, а над и под башнями в виде рыбьих плавников - узор из изысканных голубых и розовых драгоценных камней, покрытых серебряной чешуёй, что придаёт короне особую пышность."
 umber_crown_name: "Корона Последнего Очага"
 umber_crown_description: "Железная корона, причудливо отлитая в форме рук прикованного человека, символизирует его освобождение от цепей."
 crown_of_the_wall_name: "Корона Стены"
 crown_of_the_wall_description: "Корона из стекла и грубых чёрных железных шипов, напоминающая Стену и её девятнадцать замков. Традиционно являясь резиденцией Ночного Дозора, Стена охраняет царство людей от угроз извне. Любому правителю, напрямую претендующему на это древнее укрепление, правление будет даваться нелегко и вызывать много нареканий."
 crown_of_westerling_name: "Корона Скалы"
 crown_of_westerling_description: "Открытый обруч с песчаной текстурой по всей длине, украшенный шестью белыми ракушками, символизирующими принадлежность к дому Вестерлинг."
 crown_of_castamere_name: "Корона Кастамере"
 crown_of_castamere_description: "Серебряная корона с рубинами, украшенная выдающимися фигурами красных львов."
 crown_of_deep_den_name: "Корона Глубокой Норы"
 crown_of_deep_den_description: "Величественная корона из бронзы и серебра, инкрустированная крупными изумрудами и украшенная мелким жемчугом. Этот головной убор отдает дань уважения цветам и символу дома Лидден из Глубокой Норы."
 crown_of_the_banefort_name: "Корона Погибельной крепости"
 crown_of_the_banefort_description: "Огненно-золотая корона, выполненная в стиле, который носили древние короли-в-капюшоне из дома Бэйнфорт."
 crown_of_crakehall_name: "Корона Крейкхолла"
 crown_of_crakehall_description: "Вычурная бронзовая корона с замысловатыми узорами и отполированными черными бриллиантами - эта корона создана для воплощения цветов дома Крейкхолл."
 crown_of_the_tides_name: "Корона Приливов"
 crown_of_the_tides_description: "Нарядная корона с фигурками морских коньков вдоль неё и узорами, напоминающими глубину океана. Подходит для короля Приливов."
 crown_of_darklyn_name: "Корона Сумеречного Дола"
 crown_of_darklyn_description: "Величественная корона из черного железа и серебра, инкрустированная крупными драгоценными камнями и украшенная семью жемчужинами."
 crown_of_true_winter_name: "Ледяная корона"
 crown_of_true_winter_description: "Открытый обруч из полированного железа, инкрустированный сверкающими бриллиантами и увенчанный девятью ледяными шипами. Подобная корона была утеряна давным-давно, и теперь о ней помнят только в записях Цитадели и разрозненных документах по всему Северу. По форме она напоминала исторические Короны Зимы дома Старк, хотя цвет, дизайн и материал значительно отличались. Состав шипов остается предметом споров: одни утверждают, что они были сделаны из алмаза, стекла или неизвестного кристалла, другие - что они были сформированы из настоящего льда, сохраненного древней магией Детей Леса. Происхождение короны неизвестно - некоторые считают, что она была создана в знак уважения к дому Старков, возможно, ее носила королева или принцесса Винтерфелла, другие же утверждают, что она была сделана в насмешку над королями Старков. Еще более фантастичны рассказы о том, что оно когда-то принадлежало голубоглазой мёртвой королеве, возлюбленной легендарного Короля Ночи. Однако мейстеры решительно оспаривают эти утверждения, считая их просто слухами."
 valyrian_crown1_name: "Обруч Фригольда"
 valyrian_crown1_description: "Обруч валирийского образца в честь богов старой Валирии."
 valyrian_crown2_name: "Корона Фригольда"
 valyrian_crown2_description: "Серебряная корона, напоминающая кожистые крылья дракона и украшенная тремя крупными драгоценными камнями."

 #Religious Crowns
 crown_of_the_grey_king_rusted_name: "Корона Серого короля"
 crown_of_the_grey_king_rusted_description: "Эта древняя корона была сделана из зубов Нагги, великого морского дракона, которого убил Серый король. Она является высшим знаком власти среди железнорожденных, ибо только этот великий жнец носил её."
 crown_of_the_nights_king_name: "Короня Короля Ночи"
 crown_of_the_nights_king_description: "Мрачная и древняя корона, созданная для человека, которого история запомнила как Короля Ночи. Этот грозный головной убор сделан из чёрного железа и вечно холодных шипов острого льда, которые остаются нерастаявшими только благодаря той же магии, что поддерживает саму Стену."
 crown_of_the_nights_king_replica_name: "Короня Короля Ночи"
 crown_of_the_nights_king_replica_description: "Тёмная корона, сделанная по подобию той, которую носил человек, запомнившийся истории как Король Ночи. Этот наводящий ужас головной убор изготовлен из чёрного железа и украшен шипами из стекла, имитирующими лёд Стены."
 cannibal_crown_name: "Корона сломанного хребта"
 cannibal_crown_description: "Жуткая корона, изготовленная из человеческого позвоночника, чьи позвонки изогнуты в жестокий венец. Спереди покоится верхняя часть черепа, а плавный изгиб кости и пустая носовая полость образуют зловещий центральный элемент."
 crown_of_the_seven_name: "Корона Веры"
 crown_of_the_seven_description: "Корона Веры - символ Семи ликов Единого и их почитания. Выполненная из золота и украшенная жемчугом, серебром и разноцветными драгоценными камнями, эта корона с гордостью демонстрирует семь образов семиконечной звезды по всей окружности."
 crown_of_the_old_gods_name: "Корона Договора"
 crown_of_the_old_gods_description: "Корона Договора - символ веры в Старых богов. Выкованная из бронзы, металла Первых людей, и украшенная рубинами, отражающими чардрева, корона является символом для всех приверженцев Старых богов."
 crown_of_rhllor_name: "Корона Пламени"
 crown_of_rhllor_description: "Огненная корона, созданная в честь Владыки Света. Ибо ночь темна и полна ужасов."
 circlet_of_rhllor_name: "Обруч Пламени"
 circlet_of_rhllor_description: "Огненный обруч, созданный в честь Владыки Света. Ибо ночь темна и полна ужасов."
 crown_of_hugor_name: "Корона помазанника Отца"
 crown_of_hugor_description: "Изготовленная из семи звёзд Хугора, эта корона воссоздаёт легендарную корону, дарованную первому королю андалов самим Отцом."

 #Other Crowns
 crown_of_winter_roses_name: "Корона из зимних роз"
 crown_of_winter_roses_description: "Красивая корона из голубых зимних роз."

 shieraseastar_necklace_name: "Ожерелье Ширы Морской Звезды"
 shieraseastar_necklace_description: "Ожерелье, принадлежавшее Шире Морской Звезде, незаконнорожденной дочери короля Эйгона IV Таргариена «Недостойного», с огромным количеством морского белого жемчуга, а также более крупными зелёными и голубыми жемчужинами."

 #Armors
 brightflame_armor_name: "Доспех Яркого Пламени"
 brightflame_armor_description: "Эти замысловато украшенные доспехи были изготовлены по заказу принца Эйриона Таргариена по прозвищу «Яркое Пламя». Шлем украшен парой больших драконьих крыльев и разинутой зубастой пастью, призванной наводить страх на противников принца."
 maelys_armor_name: "Пластинчатый доспех Ужасного"
 maelys_armor_description: "Мейлис Блэкфайр, печально известный претендент, знаменит своей чудовищной второй головой, для ношения которой требуются особые доспехи."
 monstrous_desc: "Эти доспехи были созданы для кого-то чудовищного."
 rhaegars_armor_name: "Броня Рейгара"
 rhaegars_armor_description: "Доспехи Рейгара Таргариена сделаны из чёрных как ночь пластин, а трёхглавый дракон дома Таргариенов, выполненный из рубинов, украшает нагрудник. Под пластинчатыми доспехами скрывается кольчуга из золотых колец, а шлем искусно украшен драконьим мотивом."
 roberts_armor_name: "Броня Роберта"
 roberts_armor_description: "Доспехи Роберта Баратеона простые, но грозные. Носящего защищают большие стальные пластины, под которыми находится кольчуга. Большая часть доспехов прикрыта гербовой накидкой с изображением черного оленя дома Баратеонов. Шлем украшен устрашающими оленьими рогами, также являющимися символом Баратеонов."
 kingsguard_armor_name: "Доспехи королевского гвардейца [owner.GetFullName]"
 kingsguard_armor_description: "Комплект белых эмалированных доспехов, вручённый персонажу [owner.GetFullName] при вступлении в Королевскую гвардию."
 skinchangers_second_pelt_name: "Вторая шкура оборотня"
 skinchangers_second_pelt_description: "Эта некачественно выделанная шкура была снята со зверя, которого выбрал оборотень, чтобы завладеть им, когда его собственное тело ослабнет."
 valyrian_steel_armor_name: "Броня из валирийской стали"
 valyrian_steel_armor_description: "Чешуйчатые доспехи стоят как целое королевство и, несомненно, являются самой надежной защитной броней."
 decorated_dragon_plate_armor_name: "Украшенный драконий нагрудник"
 decorated_dragon_plate_armor_description: "Этот полный доспех имеет посеребрённую отделку и тонкую окантовку, напоминающую крылья дракона."
 royce_runic_armor_name: "Рунический бронзовый доспех"
 royce_runic_armor_description: "Один из нескольких комплектов древних бронзовых доспехов, принадлежащих дому Ройс. На броне начертаны руны, которые, как считается, делают его владельца неуязвимым к ранениям."

 # Armor Commission
 agot_custom_armor_name: "Мой доспех"
 baratheon_armor_01_name: "Доспех Баратеонов"
 baratheon_armor_01_description: "На первый взгляд, эти доспехи кажутся простыми и незамысловатыми, состоящими из полной пластины, поверх которой надевается накидка и пояс с бляшками. Большие, грубые наплечники создают внушительный силуэт. Доспехи обладают высокой степенью защиты, но им не хватает замысловатой формы, характерной для других моделей полных пластин."
 ned_armor_01_name: "Доспех Старков"
 ned_armor_01_description: "Этот доспех частично украшен пластинами, которые надеваются поверх кольчуги, что часто встречается на севере Вестероса. Несмотря на то, что он немного украшен, в нём отсутствует золотая или латунная отделка, характерная для доспехов южан, вместо этого используется простое тиснение и пояс с бляшками."
 rhaegar_armor_01_name: "Доспех принца Таргариенов"
 rhaegar_armor_01_description: "Этот воронёный полный доспех украшен наплечниками в форме крыльев дракона, а завершает дизайн золотая кольчуга с красной отделкой. Рубины на нагруднике образуют дракона, объединяя весь образ. Это богато украшенный доспех, подходящий для обладателя соответствующего эго."
 maelys_armor_01_name: "Чудовищный доспех Блэкфайров"
 maelys_armor_01_description: "Эту воронёную цельнокроёную пластину носят с накидкой, и её невозможно перепутать. Правая сторона украшена тонкой каннелюрой и филигранью, что придаёт ей благородный и первозданный вид, в то время как левая покрыта зубами дракона и пластинами большого размера. Несмотря на то, что доспех выглядит хорошо, его можно охарактеризовать только как чудовищный."
 tywin_armor_01_name: "Алый доспех Ланнистеров"
 tywin_armor_01_description: "Этот полный латный доспех выполнен в золотых и красных тонах, с золотой тканью, перекинутой через плечо. Его каннелюры выполнены в западном стиле, а ярко-красная и латунная обшивка напоминает о богатстве и гордости."
 jaime_armor_01_name: "Золотой доспех Ланнистеров"
 jaime_armor_01_description: "Этот золотой доспех сочетается с белой тканью, накинутой на левое плечо, создавая эффектный внешний вид. Поверхность полностью рифлёная, а сам доспех был химически позолочен - опасный процесс, который даёт непревзойдённые результаты."
 reyne_armor_01_name: "Доспех Рейнов"
 reyne_armor_01_description: "Этот ярко-красный доспех выполнен в стиле Западных земель и дополнен тканью, перекинутой через плечо. Полностью покрытая эмалью пластина, подобная этой, является признаком большого богатства, а непрерывный цвет выделяет её на поле боя."
 arryn_armor_01_name: "Доспех Арренов"
 arryn_armor_01_description: "Этим громоздким доспехам отдают предпочтение рыцари, которые придают первостепенное значение полной защите, даже ценой некоторой мобильности. Несмотря на то, что шлем практически не украшен цветами, на нём достаточно украшений, чтобы выделяться, сохраняя при этом традиционный рыцарский вид."
 tyrell_armor_01_name: "Доспех Тиреллов"
 tyrell_armor_01_description: "Эти доспехи покрыты химической позолотой, отполированы почти до зеркального блеска, а также украшены замысловатым тиснением. Перья и атласный наряд дополняют образ, что делает их идеальными для рыцаря, который хочет продемонстрировать богатство и изысканность."
 bolton_armor_01_name: "Доспех Болтонов"
 bolton_armor_01_description: "Пластинчатые доспехи - редкость на Севере и часто бывают простыми, но этот комплект - исключение. Пластины тщательно обработаны и покрыты эмалью, чтобы напоминать ободранную плоть, а линии, напоминающие сухожилия, и кроваво-красные тона придают им гротескный и угрожающий вид."
 royce_armor_01_name: "Доспех Ройсов"
 royce_armor_01_description: "Никто на самом деле не знает, сколько лет этим бронзовым доспехам и какие детали были заменены с течением времени. Это реликвия далёкого прошлого, её наплечники и нагрудник не похожи ни на один современный дизайн. Несмотря на свой возраст, они остаются функциональными и долговечными в бою."
 rowan_armor_01_name: "Доспех Рованов"
 rowan_armor_01_description: "Этот полный латный доспех надевается поверх длинной туники, украшенной замысловатыми узорами из листьев и веток. В дизайне использованы древовидные мотивы, которые с гордостью демонстрируются декоративными завитушками и ярким плакатом спереди."
 osgrey_armor_01_name: "Клетчатый доспех"
 osgrey_armor_01_description: "Этот доспех украшен клетчатым джупоном, который надевается поверх полной пластины, заменяя голый стальной вид яркой геральдической символикой. Он хорошо подходит для домов с клетчатыми узорами, хотя смелый контраст подойдёт для любого герба."
 osgrey_armor_02_name: "Счетверенный доспех"
 osgrey_armor_02_description: "Этот доспех украшен счетверенным джупоном, который надевается поверх полной пластины, заменяя обычную сталь на красочную геральдику. Он особенно подходит для домов со счетверенными гербами, хотя дизайн подходит многим."
 lydden_armor_01_name: "Высокогорный доспех"
 lydden_armor_01_description: "Несмотря на то, что этот доспех относится к категории полностью латных, в нём отсутствуют некоторые более сложные компоненты, которые можно увидеть в других моделях. Его прямоугольный нагрудник, отсутствие выступа и круглые наплечники - редкость в Вестеросе, но они дают неоспоримые преимущества. Однотонное платье позволяет наглядно продемонстрировать геральдику."
 braavosi_armor_01_name: "Браавосийский доспех"
 braavosi_armor_01_description: "Этот броский доспех сочетает в себе элементы из пластин и лубков, хотя самыми примечательными деталями этого комплекта являются вовсе не доспехи. Яркий текстиль с прорезями и складками позволяет предположить, что он предназначен как для демонстрации, так и для боя."
 braavosi_armor_02_name: "Высокий браавосийский доспех"
 braavosi_armor_02_description: "Эти доспехи контрастируют с яркими цветами и сложными формами, сочетая монохромный текстиль и пластины с очень декоративной одеждой. Хотя они могут показаться показными, их носят одни из самых опасных фехтовальщиков."
 norvos_armor_02_name: "Простой норвошийский доспех"
 norvos_armor_02_description: "Этот доспех с прочным нагрудником поверх яркой подкладки выполнен в стиле, характерном для воинов Норвоса."
 norvos_armor_03_name: "Высокий норвошийский доспех"
 norvos_armor_03_description: "Эти украшенные доспехи с выгравированным нагрудником и яркой подкладкой отдают дань уважения символам города и народа Норвоса."
 qohor_armor_02_name: "Простой квохорский доспех"
 qohor_armor_02_description: "Этот доспех, выкованный квохорскими мастерами-металлургами, включает в себя разноцветный нагрудник, наголенники и ламеллярный наруч, надетый поверх кольчуги. Он выполнен в стиле квохорских воинов."
 qohor_armor_03_name: "Высокий квохорский доспех"
 qohor_armor_03_description: "Этот доспех, выкованный квохорскими мастерами-металлургами, включает в себя разноцветный нагрудник, наголенники и ламеллярные наручи, надетые поверх кольчуги. По уровню защиты он не имеет себе равных во всём известном мире."
 triarchy_armor_03_name: "Высокий доспех Триархии"
 triarchy_armor_03_description: "Этот доспех состоит из чешуйчатой кольчуги, надеваемой поверх кожаной куртки и туники с подкладкой, оформленной в стиле, характерном для Вольных городов. Характерная выпуклая нагрудная пластина помогает отражать удары и лучше защищать жизненно важные области тела."
 decorated_dragon_plate_armor_01_name: "Украшенный пластинчатый доспех Дракона"
 decorated_dragon_plate_armor_01_description: "Этот воронёный доспех отделан серебром, чтобы подчеркнуть отдельные пластины. Он надевается поверх чешуи и ярко-красной подкладки. Каннелюры по всей поверхности напоминают крылья дракона, а дизайн оставляет очень мало незащищенных щелей, что делает его вершиной мастерства."
 valyrian_armor_02_name: "Валирийский доспех"
 valyrian_armor_02_description: "Этот рифлёный доспех покрыт тёмной патиной, защищающей его от внешних воздействий. Его острые, угловатые формы контрастируют с украшенной туникой под ним, а отсутствие защиты предплечий обеспечивает большую ловкость в бою."
 valyrian_armor_03_name: "Высокий валирийский доспех"
 valyrian_armor_03_description: "Этот полный латный доспех покрыт тёмной патиной с посеребрёнными каннелюрами по всему периметру. По краям некоторых пластин расположены зубы дракона, а на плечах выгравированы крылья дракона. Длинная туника под ним создает контраст с тёмным металлом."
 valyrian_armor_03_red_name: "Багровый высокий валирийский доспех"
 valyrian_armor_03_red_description: "Этот красный латный доспех украшен многочисленными драконьими мотивами, в том числе рифлениями, напоминающими перепонки драконьих крыльев."
 valyrian_armor_03_high_name: "Пластинчатый доспех Дракона"
 valyrian_armor_03_high_description: "Эти воронёные цельные латы надеваются поверх кольчуги и подкладки, оставляя мало щелей для защиты. Броня богато декорирована рифлением и элементами, напоминающими по форме дракона, включая кисточки и усиленные соединения."
 valyrian_armor_03_high_red_name: "Багровые латы Дракона"
 valyrian_armor_03_high_red_description: "Этот пластинчатый доспех, покрытый красной эмалью, ярко сверкает на поле боя. Его поверхности выполнены в форме драконов, а рукавицы заканчиваются когтистыми пальцами, что делает сам доспех не только защитой, но и оружием."
 stormlander_armor_02_name: "Доспех Штормовых земель"
 stormlander_armor_02_description: "Этот доспех в основном состоит из пластинчатых элементов, включая бригантину на груди и кольчужную рубашку под ней. Кольчужная накидка защищает шею. Хотя она и менее надежна, чем полные латы, но позволяет добиться более яркого цвета, чем обычная сталь."
 stormlander_armor_03_name: "Высокий доспех Штормовых земель"
 stormlander_armor_03_description: "Этот доспех с рифлёной поверхностью надевается поверх джупона с квадратными зазубринами. Хотя в нём отсутствуют некоторые элементы из полных пластин, кольчуга и мантия обеспечивают надежную защиту, сохраняя при этом гибкость."
 westerlander_armor_02_name: "Доспех Западных земель"
 westerlander_armor_02_description: "Этот рифлёный латный доспех украшен небольшой накидкой геральдических цветов, которая создает единственный контраст на фоне голой стали."
 westerlander_armor_03_name: "Высокий доспех Западных земель"
 westerlander_armor_03_description: "Этот полный латный доспех богато украшен рифлениями, создающими характерные узоры на его поверхности. Длинная ткань, перекинутая через плечо, украшена геральдическими цветами."
 valeman_armor_02_name: "Доспех Долины"
 valeman_armor_02_description: "В этой бригантине используются необычно большие внутренние пластины, сохраняющие гибкость. Руки и голени защищены большими стальными пластинами, что обеспечивает высокую степень защиты."
 valeman_armor_03_name: "Высокий доспех Долины"
 valeman_armor_03_description: "Этот доспех известен как белый доспех из-за отсутствия верхней одежды или текстиля. Большие пластины образуют наплечники, кисточки и другие элементы, что делает его одним из наиболее используемых стилей защиты."
 reachman_armor_02_name: "Просторский доспех"
 reachman_armor_02_description: "Этот изысканный доспех тщательно продуман как по форме, так и по функциональному назначению. Нагрудник и выпуклые наплечники покрыты тканью, что позволяет отображать геральдику непосредственно на доспехах."
 reachman_armor_03_name: "Высокий просторский доспех"
 reachman_armor_03_description: "Эти доспехи покрыты рельефными цветочными узорами и узорами в виде виноградных лоз. Атласное одеяние с короткими рукавами, надетое под ним, подчёркивает яркие геральдические цвета."
 honeywiner_armor_01_name: "Медовичный доспех"
 honeywiner_armor_01_description: "В этом массивном нагруднике с рифлёной поверхностью используются большие пластины для защиты жизненно важных зон. Одеяние, надетое поверх нагрудника, создаёт контраст на фоне полированной стали."
 riverlander_armor_03_name: "Простой доспех Речных земель"
 riverlander_armor_03_description: "Этот доспех состоит из чешуи, надеваемой поверх длинной кольчуги, с пластинами, защищающими руки и ноги. Хотя он менее защищен, чем полные латы, он обладает большей гибкостью. Блестящие чешуйки создают прекрасный отражающий эффект, когда свет попадает на них правильным образом"
 riverlander_armor_04_name: "Высокий доспех Речных земель"
 riverlander_armor_04_description: "Этот доспех сочетает в себе чешуйчатую броню и пластины, а также чешуйчатую кольчугу и латы, защищающие грудь, руки и ноги. Джупон добавляет колорита, а на мантии изображен небольшой щит с гербом дома."
 northman_armor_02_name: "Простой северный кожаный доспех"
 northman_armor_02_description: "Этот комплект доспехов состоит из кольчуги и поножей, усиленных варёной кожей. Поверх кирасы надевается сюрко, на котором красуется герб владельца."
 northman_armor_02_b_name: "Простой северный пластинчатый доспех"
 northman_armor_02_b_description: "Этот комплект доспехов состоит из кольчужного хауберка и поножей, усиленных пластинами. Поверх кирасы надевается сюрко, на котором гордо красуется герб владельца."
 northman_armor_03_name: "Высокий северный доспех"
 northman_armor_03_description: "Этот доспех в основном состоит из лубка и бригандины, а пластины предназначены для ключевых суставов. Хотя он позволяет использовать цвета дома, он обеспечивает меньшую защиту, чем более совершенные конструкции лат."
 ironborn_armor_03_name: "Высокий доспех железнорождённых"
 ironborn_armor_03_description: "Этот грубый доспех сделан из больших пластин и ламелей, украшенных шипами в качестве единственного украшения. Несмотря на свою грубую конструкцию, он тяжёлый и обладает высокой степенью защиты."
 dornish_armor_03_name: "Высокий дорнийский доспех"
 dornish_armor_03_description: "Этот доспех украшен крупными бронзовыми пластинами, соединёнными в кольчугу, что создаёт уникальный для Дорна дизайн. Он обеспечивает надёжную защиту, оставаясь при этом дышащим и позволяя свободно двигаться."
 stone_dornish_armor_01_name: "Доспех каменных дорнийцев"
 stone_dornish_armor_01_description: "Этот необычный доспех сочетает в себе чешую под пластинами для конечностей и мягкую тунику на туловище. Она дышащая, защитная и позволяет легко передвигаться даже пешком."
 hedge_knight_armor_01_name: "Доспех межевого рыцаря"
 hedge_knight_armor_01_description: "Эти доспехи представляют собой лоскутное одеяло из разных частей, некоторые из которых проржавели или помяты, и надеваются поверх гамбезона и кольчуги. Возможно, им не хватает изысканности, но при необходимости они обеспечивают защиту."

 raven_feather_cloak_name: "Плащ, расшитый перьями ворона"
 raven_feather_cloak_description: "Великолепный плащ, сделанный из ониксовых перьев воронов, которые гнездятся на древнем мёртвом чардреве Воронодрева."

 dennecent_axe_name: "Кусач"
 dennecent_axe_description: "Несмотря на своё зловещее название, Кусач заслужил внушающую страх репутацию в руках дома Деннесент. Этот древний бронзовый топор пробовал кровь многих поколений, что свидетельствует о вере в то, что даже самое маленькое существо может оставить неизгладимый след."

 lucerys_gun_name: "Орудие Люцериса"
 lucerys_gun_desc: "Готовься к смерти."

 claimed_dawn_desc: "Вы должны заслужить право носить Рассвет по праву рождения или по праву силы."
 sword_of_the_morning_desc: "Меч Зари"

 artifact_martell_wall_shield_name: "Дорнийский щит"
 artifact_martell_wall_shield_description: "Дорнийский щит, стилизованный под богато украшенный регональный орнамент."

 the_white_book_name: "Белая книга"
 the_white_book_desc: "В этом фолианте с белым кожаным переплётом, официально известном как «Книга Братьев», записаны деяния и подвиги каждого, кто когда-либо служил в прославленных рядах Королевской гвардии."

 agot_artifact_saans_scrolls_name: "Древние валирийские свитки"
 agot_artifact_saans_scrolls_desc: "Древние свитки из Валирии, в которых говорится о пророчествах и драконах."

 treasure_map_name: "Карта сокровищ"
 treasure_map_description: "Потрёпанная карта, которая, как говорят, ведёт к затонувшим останкам корабля, когда-то нагруженного богатствами, затерявшегося у берегов владения [sunken_ship_province.GetName]."

 #Filler
 agot_artifact_winter_rose: "Зимняя роза"
 agot_artifact_winter_rose_desc: "Красивый бледно-голубой цветок цвета ранних зимних морозов."

 artifact_dragon_egg: "Драконье яйцо"
 artifact_dragon_egg_reforged_tt: "Ваше яйцо было перековано в [court_artifact|El]"
 dud_egg_desc: "[egg_artifact.GetDesc]\n\nЭто яйцо выглядит окаменевшим и не подает никаких признаков того, что оно когда-либо вылупится."

 dragon_egg_gen_desc: "Окаменевшее яйцо дракона. Века превратили его в камень, но оно по-прежнему горит ярким огнём красоты."
 dragon_egg_gen_parent: "[egg_artifact.GetDesc] Его [Select_CString(dragon_parent.IsFemale, 'отложила', 'отложил' )] [dragon_parent.GetName]."
 dragon_egg_gen_parents: "[egg_artifact.GetDesc] Его отложили [dragon_parent.GetName] и [dragon_parent_other.GetName]."

 dragon_egg_rainbow: "Радужное яйцо дракона"
 dragon_egg_rainbow_desc: "$dragon_egg_gen_desc$ Радужные чешуйки этого яйца мерцают, как полированный металл."
 dragon_egg_rainbow_desc_living: "Радужные чешуйки этого яйца мерцают, как полированный металл."

 dragon_egg_yellow: "Жёлтое яйцо дракона"
 dragon_egg_yellow_desc: "$dragon_egg_gen_desc$ Украшенное блестящими желтыми чешуйками, сияющими на свету, как чеканное золото, это яйцо просто поражает своей красотой."
 dragon_egg_yellow_desc_living: "Украшенное блестящими желтыми чешуйками, сияющими на свету, как чеканное золото, это яйцо просто поражает своей красотой."

 dragon_egg_blue: "Синее яйцо дракона"
 dragon_egg_blue_desc: "$dragon_egg_gen_desc$ Переливаясь кобальтово-синими оттенками, это яйцо, безусловно, завораживает."
 dragon_egg_blue_desc_living: "Переливаясь кобальтово-синими оттенками, это яйцо, безусловно, завораживает."

 dragon_egg_purple: "Фиолетовое яйцо дракона"
 dragon_egg_purple_desc: "$dragon_egg_gen_desc$ Глубокие фиолетовые чешуйки на этой раковине - это сны, сотканные из сумеречных теней и звёздной пыли."
 dragon_egg_purple_desc_living: "Глубокие фиолетовые чешуйки на этой раковине - это сны, сотканные из сумеречных теней и звёздной пыли."

 dragon_egg_red: "Красное яйцо дракона"
 dragon_egg_red_desc: "$dragon_egg_gen_desc$ Темно-красные чешуйки этого яйца мерцают на солнце, словно рубины."
 dragon_egg_red_desc_living: "Темно-красные чешуйки этого яйца мерцают на солнце, словно рубины."

 dragon_egg_tan: "Тусклое яйцо дракона"
 dragon_egg_tan_desc: "$dragon_egg_gen_desc$ Завитки палящих лучей и кремовых линий напоминают о песках Дорна."
 dragon_egg_tan_desc_living: "Завитки палящих лучей и кремовых линий напоминают о песках Дорна."

 dragon_egg_brown: "Коричневое яйцо дракона"
 dragon_egg_brown_desc: "$dragon_egg_gen_desc$ Темно-коричневые чешуйки этого яйца на свету отливают золотисто-бронзовыми переливами."
 dragon_egg_brown_desc_living: "Темно-коричневые чешуйки этого яйца на свету отливают золотисто-бронзовыми переливами."

 dragon_egg_blackdarkred: "Обсидиановое яйцо дракона"
 dragon_egg_blackdarkred_desc: "$dragon_egg_gen_desc$ Черные чешуйки этого яйца волнистые и завитые."
 dragon_egg_blackdarkred_desc_living: "Черные чешуйки этого яйца волнистые и завитые."

 dragon_egg_icefire: "Драконье яйцо льда и пламени"
 dragon_egg_icefire_desc: "$dragon_egg_gen_desc$ Чешуйки этого яйца представляет собой поразительное сочетание огненно-красного и ледяного синего, как будто огонь и лед находятся в вечном конфликте."
 dragon_egg_icefire_desc_living: "Чешуйки этого яйца представляет собой поразительное сочетание огненно-красного и ледяного синего, как будто огонь и лед находятся в вечном конфликте."

 dragon_egg_black: "Чёрное яйцо дракона"
 dragon_egg_black_desc: "$dragon_egg_gen_desc$ Обсидиановый блеск этого яйца напоминает самые темные безлунные ночи."
 dragon_egg_black_desc_living: "Обсидиановый блеск этого яйца напоминает самые темные безлунные ночи."

 dragon_egg_orange: "Оранжевое яйцо дракона"
 dragon_egg_orange_desc: "$dragon_egg_gen_desc$ Чешуя на этом яйце переливается оттенками яркого закатного оранжевого цвета."
 dragon_egg_orange_desc_living: "Чешуя на этом яйце переливается оттенками яркого закатного оранжевого цвета."

 dragon_egg_white: "Белое яйцо дракона"
 dragon_egg_white_desc: "$dragon_egg_gen_desc$ Чешуя этого яйца перламутрово-белая." 
 dragon_egg_white_desc_living: "Чешуя этого яйца перламутрово-белая."

 dragon_egg_pink: "Розовое яйцо дракона"
 dragon_egg_pink_desc: "$dragon_egg_gen_desc$ Бледно-розовые чешуйки этого яйца мягко переливаются на свету."
 dragon_egg_pink_desc_living: "Бледно-розовые чешуйки этого яйца мягко переливаются на свету." 

 dragon_egg_green_1: "Зелёное яйцо дракона"
 dragon_egg_green_1_desc: "$dragon_egg_gen_desc$ Изумрудно-зеленая чешуя этого яйца более чем красива."
 dragon_egg_green_1_desc_living: "Изумрудно-зеленая чешуя этого яйца более чем красива."

 dragon_egg_green_2: "Берилловое яйцо дракона"
 dragon_egg_green_2_desc: "$dragon_egg_gen_desc$ Тёмно-зеленая чешуя этого яйца более чем красива."
 dragon_egg_green_2_desc_living: "Тёмно-зеленая чешуя этого яйца более чем красива."

 dragon_egg_grey_1: "Серое яйцо дракона"
 dragon_egg_grey_1_desc: "$dragon_egg_gen_desc$ Дымчатый оттенок этого яйца походит на вулканический пепел."
 dragon_egg_grey_1_desc_living: "Дымчатый оттенок этого яйца походит на вулканический пепел."

 dragon_egg_grey_2: "Сланцевое яйцо дракона"
 dragon_egg_grey_2_desc: "$dragon_egg_gen_desc$ Дымчатый оттенок этого яйца походит на вулканический пепел."
 dragon_egg_grey_2_desc_living: "Дымчатый оттенок этого яйца походит на вулканический пепел."

 dragon_egg_gold: "Золотое яйцо дракона"
 dragon_egg_gold_desc: "$dragon_egg_gen_desc$ Это яйцо, украшенное очаровательными золотыми чешуйками — настоящее чудо."
 dragon_egg_gold_desc_living: "Это яйцо, украшенное очаровательными золотыми чешуйками — настоящее чудо."

 dragon_egg_whitegold: "Белоснежное яйцо дракона"
 dragon_egg_whitegold_desc: "$dragon_egg_gen_desc$ Белые чешуйки этого яйца дополнены глубокими золотистыми прожилками, мерцающими под лучами солнца."
 dragon_egg_whitegold_desc_living: "Белые чешуйки этого яйца дополнены глубокими золотистыми прожилками, мерцающими под лучами солнца."

 dragon_egg_purplegold: "Аметриновое яйцо дракона"
 dragon_egg_purplegold_desc: "$dragon_egg_gen_desc$ Царственные пурпурные оттенки этого яйца переплетаются с мерцающими золотыми прожилками, создавая величественный вид, напоминающий королевские гобелены."
 dragon_egg_purplegold_desc_living: "Царственные пурпурные оттенки этого яйца переплетаются с мерцающими золотыми прожилками, создавая величественный вид, напоминающий королевские гобелены."

 dragon_egg_flame: "Пламенное яйцо дракона"
 dragon_egg_flame_desc: "$dragon_egg_gen_desc$ Чешуйки этого яйца переливаются огненными оттенками, напоминающими клубящиеся языки пламени."
 dragon_egg_flame_desc_living: "Чешуйки этого яйца переливаются огненными оттенками, напоминающими клубящиеся языки пламени."

 dragon_egg_blackred: "Кроваво-каменное яйцо дракона"
 dragon_egg_blackred_desc: "$dragon_egg_gen_desc$ Это яйцо преимущественно черное, украшенное яркими красными пятнами, блестящими, как свежая кровь."
 dragon_egg_blackred_desc_living: "Это яйцо преимущественно черное, украшенное яркими красными пятнами, блестящими, как свежая кровь."

 dragon_egg_brownspots: "Энстатитовое яйцо дракона"
 dragon_egg_brownspots_desc: "$dragon_egg_gen_desc$ Поверхность этого яйца украшена очаровательными коричневыми пятнами, напоминающими естественные узоры на старой коре дерева."
 dragon_egg_brownspots_desc_living: "Поверхность этого яйца украшена очаровательными коричневыми пятнами, напоминающими естественные узоры на старой коре дерева."

 dragon_egg_redblackgold: "Пепельное яйцо дракона"
 dragon_egg_redblackgold_desc: "$dragon_egg_gen_desc$ Темно-красные чешуйки этого яйца окаймлены мерцающим золотом, а гладкие черные акценты добавляют нотку таинственности и элегантности."
 dragon_egg_redblackgold_desc_living: "Темно-красные чешуйки этого яйца окаймлены мерцающим золотом, а гладкие черные акценты добавляют нотку таинственности и элегантности."

 dragon_egg_palered: "Коралловое яйцо дракона"
 dragon_egg_palered_desc: "$dragon_egg_gen_desc$ Бледно-красная поверхность этого яйца излучает мягкое, теплое свечение, напоминающее нежный румянец на рассвете."
 dragon_egg_palered_desc_living: "Бледно-красная поверхность этого яйца излучает мягкое, теплое свечение, напоминающее нежный румянец на рассвете."

 dragon_egg_darkblue: "Кобальтовое яйцо дракона"
 dragon_egg_darkblue_desc: "$dragon_egg_gen_desc$ Глубокая синяя поверхность этого яйца мерцает, как глубины океана, излучая ощущение таинственности и спокойствия."
 dragon_egg_darkblue_desc_living: "Глубокая синяя поверхность этого яйца переливается, как глубины океана, излучая ощущение таинственности и спокойствия."

 dragon_egg_darkred: "Карминовое яйцо дракона"
 dragon_egg_darkred_desc: "$dragon_egg_gen_desc$ Цвет чешуек этого яйца напоминает свежепролитую кровь, с темным и зловещим оттенком."
 dragon_egg_darkred_desc_living: "Цвет чешуек этого яйца напоминает свежепролитую кровь, с темным и зловещим оттенком."

 dragon_egg_frost: "Морозное яйцо дракона"
 dragon_egg_frost_desc: "$dragon_egg_gen_desc$ Яйцо представляет собой поразительное сочетание ледяного белого и морозного синего цветов, его поверхность излучает холодный, зимний холод."
 dragon_egg_frost_desc_living: "Яйцо представляет собой поразительное сочетание ледяного белого и морозного синего цветов, его поверхность излучает холодный, зимний холод."

 dragon_egg_greengrey: "Изумрудное яйцо дракона"
 dragon_egg_greengrey_desc: "$dragon_egg_gen_desc$ Бледно-зеленая поверхность этого яйца украшена нежными серыми завитками, создающими умиротворяющий и завораживающий узор."
 dragon_egg_greengrey_desc_living: "Бледно-зеленая поверхность этого яйца украшена нежными серыми завитками, создающими умиротворяющий и завораживающий узор."

 dragon_egg_magma: "Магматическое яйцо дракона"
 dragon_egg_magma_desc: "$dragon_egg_gen_desc$ Чешуйки этого яйца представляет собой огненную смесь красных и оранжевых оттенков, напоминающую бурлящую магму."
 dragon_egg_magma_desc_living: "Чешуйки этого яйца представляет собой огненную смесь красных и оранжевых оттенков, напоминающую бурлящую магму."

 dragon_egg_darkpurple: "Фиолетовое яйцо дракона"
 dragon_egg_darkpurple_desc: "$dragon_egg_gen_desc$ Темные и глубокие оттенки фиолетового цвета напоминают о наступающей ночи."
 dragon_egg_darkpurple_desc_living: "Глубокие и темные оттенки фиолетового цвета напоминают о наступающей ночи."

 dragon_egg_palepink: "Примуловое яйцо дракона"
 dragon_egg_palepink_desc: "$dragon_egg_gen_desc$ Цвет чешуек этого яйца мягкий и успокаивающий, напоминающий первые лучи рассвета."
 dragon_egg_palepink_desc_living: "Цвет чешуек этого яйца мягкий и успокаивающий, напоминающий первые лучи рассвета."

 dragon_egg_palebluepink: "Опаловое яйцо дракона"
 dragon_egg_palebluepink_desc: "$dragon_egg_gen_desc$ Это голубое яйцо украшено нежными пятнами розового цвета, напоминающими раннее весеннее утро."
 dragon_egg_palebluepink_desc_living: "Это голубое яйцо украшено нежными пятнами розового цвета, напоминающими раннее весеннее утро."

 dragon_egg_pinkspot: "Пурпурное яйцо дракона"
 dragon_egg_pinkspot_desc: "$dragon_egg_gen_desc$ Это яйцо излучает яркие оттенки розового и фиолетового, смешиваясь в поразительном красочном блеске."
 dragon_egg_pinkspot_desc_living: "Это яйцо излучает яркие оттенки розового и фиолетового, смешиваясь в поразительном красочном блеске."

 dragon_egg_rainbowgold: "Призматическое яйцо дракона"
 dragon_egg_rainbowgold_desc: "$dragon_egg_gen_desc$ Это яйцо демонстрирует темную гамму цветов, смешанную с оттенками золотистого мерцания, что создает поистине завораживающее зрелище."
 dragon_egg_rainbowgold_desc_living: "Это яйцо демонстрирует темную гамму цветов, смешанную с оттенками золотистого мерцания, что создает поистине завораживающее зрелище."

 dragon_egg_sunburst: "Солнечное яйцо дракона"
 dragon_egg_sunburst_desc: "$dragon_egg_gen_desc$ Поверхность этого яйца переливается яркими оттенками, напоминающими лучи солнца, а его цвета смешиваются в ослепительном проявлении тепла и энергии."
 dragon_egg_sunburst_desc_living: "Поверхность этого яйца переливается яркими оттенками, напоминающими лучи солнца, а его цвета смешиваются в ослепительном проявлении тепла и энергии."

 dragon_egg_goldpink: "Трифановое яйцо дракона"
 dragon_egg_goldpink_desc: "$dragon_egg_gen_desc$ Это яйцо сияет блестящим золотистым оттенком, нежно оттененным розовым, излучая ауру элегантности и тепла."
 dragon_egg_goldpink_desc_living: "Это яйцо сияет блестящим золотистым оттенком, нежно оттененным розовым, излучая ауру элегантности и тепла."

 dragon_egg_bluebronze: "Апатитовое яйцо дракона"
 dragon_egg_bluebronze_desc: "$dragon_egg_gen_desc$ Это яйцо представляет собой гармоничное сочетание глубокого синего и насыщенного бронзового цветов, что создает королевский и поразительный вид."
 dragon_egg_bluebronze_desc_living: "Это яйцо представляет собой гармоничное сочетание глубокого синего и насыщенного бронзового цветов, что создает королевский и поразительный вид."

 dragon_egg_greenorange: "Унакитовое яйцо дракона"
 dragon_egg_greenorange_desc: "$dragon_egg_gen_desc$ Это яйцо демонстрирует яркий контраст зеленого и оранжевого цветов, вызывая ощущение энергии и яркости."
 dragon_egg_greenorange_desc_living: "Это яйцо демонстрирует яркий контраст зеленого и оранжевого цветов, вызывая ощущение энергии и яркости."

 dragon_egg_bronze: "Бронзовое яйцо дракона"
 dragon_egg_bronze_desc: "$dragon_egg_gen_desc$ Это яйцо — сверкающая бронза, его поверхность имеет теплый, насыщенный оттенок, напоминающий состаренный металл."
 dragon_egg_bronze_desc_living: "Это яйцо — сверкающая бронза, его поверхность имеет теплый, насыщенный оттенок, напоминающий состаренный металл."

 dragon_egg_blackgreen: "Драконье яйцо дикого огня"
 dragon_egg_blackgreen_desc: "$dragon_egg_gen_desc$ Это яйцо окутано зловещими завитками черного и зеленого цветов, намекающими на безумие и опасность, таящиеся в его глубинах."
 dragon_egg_blackgreen_desc_living: "Это яйцо окутано зловещими завитками черного и зеленого цветов, намекающими на безумие и опасность, таящиеся в его глубинах."

 dragon_egg_greygreenyellow: "Андалузитовое яйцо дракона"
 dragon_egg_greygreenyellow_desc: "$dragon_egg_gen_desc$ Узор этого яйца имитирует палитру природы, органично сочетая зеленые, коричневые и бежевые оттенки."
 dragon_egg_greygreenyellow_desc_living: "Узор этого яйца имитирует палитру природы, органично сочетая зеленые, коричневые и бежевые оттенки."

 dragon_egg_blackyellow: "Серпентиновое яйцо дракона"
 dragon_egg_blackyellow_desc: "$dragon_egg_gen_desc$ Это яйцо украшено черными и желтыми узорами, создающими смелый и привлекающий внимание контраст."
 dragon_egg_blackyellow_desc_living: "Это яйцо украшено черными и желтыми узорами, создающими смелый и привлекающий внимание контраст."

 dragon_egg_yellowgreen: "Хризолитовое яйцо дракона"
 dragon_egg_yellowgreen_desc: "$dragon_egg_gen_desc$ Чешуя этого яйца излучает желтые и зеленые оттенки, воплощая сущность свежей весенней листвы и солнечных, радостных дней."
 dragon_egg_yellowgreen_desc_living: "Чешуя этого яйца излучает желтые и зеленые оттенки, воплощая сущность свежей весенней листвы и солнечных, радостных дней."

 dragon_egg_silver: "Серебряное яйцо дракона"
 dragon_egg_silver_desc: "$dragon_egg_gen_desc$ Это блестящее серебряное яйцо имеет гладкую, зеркальную поверхность и излучает прохладную, мистическую ауру."
 dragon_egg_silver_desc_living: "Это блестящее серебряное яйцо имеет гладкую, зеркальную поверхность и излучает прохладную, мистическую ауру."

 dragon_egg_america: "Грозовое яйцо дракона"
 dragon_egg_america_desc: "$dragon_egg_gen_desc$ Багряные, белые и синие полосы колышутся по этому яйцу, будто в нем пылает огненное сердце бури, выкованное свободой."
 dragon_egg_america_desc_living: "Багряные, белые и синие полосы колышутся по этому яйцу, будто в нем пылает огненное сердце бури, выкованное свободой."

 dragon_egg_greyBlue: "Грифельное яйцо дракона"
 dragon_egg_greyBlue_desc: "$dragon_egg_gen_desc$ Это яйцо светится холодным стальным оттенком, где туманная синь переходит в грозовой серый, как волны бьющиеся о камень."
 dragon_egg_greyBlue_desc_living: "Это яйцо светится холодным стальным оттенком, где туманная синь переходит в грозовой серый, как волны бьющиеся о камень."

 dragon_egg_redGreen: "Турмалиновое яйцо дракона"
 dragon_egg_redGreen_desc: "$dragon_egg_gen_desc$ Ярко-алые жилки обвивают глубокую изумрудную чешую яйца — столкновение пламени и леса, в котором кипит беспокойная жизнь."
 dragon_egg_redGreen_desc_living: "Ярко-алые жилки обвивают глубокую изумрудную чешую яйца — столкновение пламени и леса, в котором кипит беспокойная жизнь."

 dragon_egg_lightBrown: "Охристое яйцо дракона"
 dragon_egg_lightBrown_desc: "$dragon_egg_gen_desc$ Яйцо хранит тепло обожжённой солнцем глины и запах дождя на земле — умиротворяющее и древнее."
 dragon_egg_lightBrown_desc_living: "Яйцо хранит тепло обожжённой солнцем глины и запах дождя на земле — умиротворяющее и древнее."

 dragon_egg_redYellow: "Солнечное яйцо дракона"
 dragon_egg_redYellow_desc: "$dragon_egg_gen_desc$ Золотые прожилки пылают на красной чешуе, словно внутри расплавленного огня закатывается солнце."
 dragon_egg_redYellow_desc_living: "Золотые прожилки пылают на красной чешуе, словно внутри расплавленного огня закатывается солнце."

 dragon_egg_blackWhite: "Мраморное яйцо дракона"
 dragon_egg_blackWhite_desc: "$dragon_egg_gen_desc$ Идеальный баланс света и тени спиралью тянется по яйцу, будто день и ночь навеки связаны гармонией."
 dragon_egg_blackWhite_desc_living: "Идеальный баланс света и тени спиралью тянется по яйцу, будто день и ночь навеки связаны гармонией."

 dragon_egg_spotPurple: "Луноцветное яйцо дракона"
 dragon_egg_spotPurple_desc: "$dragon_egg_gen_desc$ Оттенки царственного пурпура закручиваются с белыми крапинками по всему яйцу, словно лунный свет, отражённый в полуночном море."
 dragon_egg_spotPurple_desc_living: "Оттенки царственного пурпура закручиваются с белыми крапинками по всему яйцу, словно лунный свет, отражённый в полуночном море."

 dragon_egg_teal: "Бирюзовое яйцо дракона"
 dragon_egg_teal_desc: "$dragon_egg_gen_desc$ Яйцо переливается спокойными тонами открытого моря, где синий встречается с зелёным в бесконечном безмятежье."
 dragon_egg_teal_desc_living: "Яйцо переливается спокойными тонами открытого моря, где синий встречается с зелёным в бесконечном безмятежье."

 dragon_egg_tealSpot: "Пенистое яйцо дракона"
 dragon_egg_tealSpot_desc: "$dragon_egg_gen_desc$ Белые струи закручиваются по бирюзовой поверхонесте яйца, отражая волны, что мягко разбиваются о спокойные моря."
 dragon_egg_tealSpot_desc_living: "Белые струи закручиваются по бирюзовой поверхонесте яйца, отражая волны, что мягко разбиваются о спокойные моря."

 dragon_egg_weirwood: "Чардревное яйцо дракона"
 dragon_egg_weirwood_desc: "$dragon_egg_gen_desc$ Бледное, словно кора, белое яйцо с багряными прожилками напоминают о священных деревьях Старых Богов — древних и бдительных."
 dragon_egg_weirwood_desc_living: "Бледное, словно кора, белое яйцо с багряными прожилками напоминают о священных деревьях Старых Богов — древних и бдительных."

 dragon_egg_lime: "Лаймовое яйцо дракона"
 dragon_egg_lime_desc: "$dragon_egg_gen_desc$ Яркий цитрусовый блеск покрывает яйцо — сочный и живой, звенящий электрической энергией."
 dragon_egg_lime_desc_living: "Яркий цитрусовый блеск покрывает яйцо — сочный и живой, звенящий электрической энергией."
 
 artifact_dragon_skull: "Череп дракона"
 agot_artifact_dragon_skull_name: "Череп дракона [dragon.GetNamePossessiveNoTooltip]"
 agot_artifact_dragon_skull_desc: "Это череп [newly_created_artifact.GetFeatureText('dragon_skull_size')] дракона, что был известен как [newly_created_artifact.MakeScope.Var('dragon').Char.GetNameNicknamed]. Пламя источило плоть, теперь [newly_created_artifact.MakeScope.Var('dragon').Char.GetSheHe] всего лишь пепел и кости. [newly_created_artifact.Custom('DragonSkullIsSmallSkull')]\n\n[newly_created_artifact.Custom('DragonSkullGetDragonRider')][newly_created_artifact.Custom('DragonSkullGetDragonKiller')]"
 agot_own_red_keep.tt: "Этот артефакт возможно разместить только в Красном замке."

 feature_dragon_skull_size_huge: "огромного"
 feature_dragon_skull_size_large: "большого"
 feature_dragon_skull_size_medium: "среднего"
 feature_dragon_skull_size_small: "маленького"

 agot_empty: ""
 agot_artifact_dragon_skull_natural: "$agot_empty$"
 agot_artifact_dragon_skull_slain: " [ROOT.Var('dragon').Char.GetNameNoTooltip] [Select_CString(EqualTo_string('он', ROOT.Var('dragon').Char.Custom('GetDragonSheHe')), 'был убит', 'была убита')] персонажем [ROOT.Var('killer').Char.GetName]."
 agot_artifact_dragon_skull_past_rider: "При жизни [ROOT.Var('rider').Char.GetName] [Select_CString(ROOT.Var('rider').Char.IsFemale, 'стала первой наездницей', 'стал первым наездником' )] этого дракона."
 agot_artifact_dragon_skull_famous_past_rider: "[ROOT.Var('famous_rider').Char.GetNameNicknamed] [Select_CString(ROOT.Var('famous_rider').Char.IsFemale, 'была знаменитой наездницей', 'был знаменитым наездником' )] этого дракона."
 agot_artifact_dragon_skull_wall_ornament: "Cвоими пустыми глазницами он смотрит на всех, кто проходит мимо, как будто все еще наблюдая за ними."

 artifact_dragon_horn: "Драконий рог"
 agot_artifact_dragon_horn_desc: "[newly_created_artifact.Custom('DragonHornForgedBy')] Валирийские глифы, вырезанные поверхности этого рога, указывают на его колдовскую природу. Считается, что драконьи владыки старой Валирии использовали подобные артефакты, чтобы подчинить драконов своей воле."

 agot_artifact_dragon_horn_old_valyria: "Этот адский рог был выкован из останков дракона старой Валирии."
 agot_artifact_dragon_horn_after_doom: "Этот адский рог был выкован из останков дракона [ROOT.Var('dragon').Char.GetName] персонажем [ROOT.Var('creator').Char.GetName]."

 agot_dragonbinder: "Укротитель Драконов"
 agot_artifact_dragonbinder_desc: "Этот адский рог длиной более 6 футов был выкован из останков огромного дракона старой Валирии. Он сияет глубоким черным цветом и опоясан красным золотом и валирийской сталью. На отражающей, но искаженной поверхности рога вырезаны валирийские глифы. [ROOT.Char.Custom('DragonBinderReadValyrian')]"
 agot_dragonbinder_read_valyrian: "Глифы гласят: «Укротитель Драконов. Ни один смертный, протрубивший в меня, жив не будет. Кровь за огонь, огонь за кровь»."

 agot_must_bind_horn.tt: "Только тот, кто связан с рогом, может использовать его."

 uller_skull: "Череп с аметистовыми глазами"
 uller_skull_desc: "Дом Уллер хранит в своём замке странный предмет - обычный череп, украшенный лишь двумя аметистами, которые находятся в его глазницах. В ответ на это Уллеры просто улыбаются и говорят, что это старая реликвия."
 hands_hand: "Десница Десницы"
 hands_hand_desc: "Вдоволюб был печально известен своей жестокостью и, когда выкуп за Ориса Баратеона был наконец получен, он отнял у каждого пленника руку, держащую меч, в том числе и у самого десницы короля Ориса Баратеона."
 smugglers_fingers: "Пальцы лукового контрабандиста"
 smugglers_fingers_desc: "Пальцы лукового контрабандиста"
 aemond_eye: "Око Братоубийцы"
 aemond_eye_desc: "Этот сапфир, предположительно являющийся глазом Эймонда Братоубийцы, был найден на берегу Божьего Ока."
 fox_wedding_cloak: "Свадебный плащ Лисицы"
 fox_wedding_cloak_desc: "Согласно легенде, Флорис Лисица трижды выходила замуж, надевая на каждую свадьбу свой плащ, и это, как говорят, один из них."
 stars_of_hugor: "«Звезда» Хугора"
 stars_of_hugor_desc: "Одна из сказочных семи звёзд, сорванных с неба для короны Хугора с Холма самим Отцом."
 harp_of_the_bard: "Арфа Барда"
 harp_of_the_bard_desc: "Эта старая обветшавшая арфа, по преданию, когда-то принадлежала барду, укравшему голубую розу."
 symeon_left_eye: "Левый глаз Симеона"
 symeon_right_eye: "Правый глаз Симеона"
 symeon_eye_desc: "Один из звёздных сапфиров, использовавшихся легендарным рыцарем Симеоном Звездоглазым."
 oily_black_stone: "Кусок маслянистого чёрного камня"
 oily_black_stone_desc: "Кусок маслянистого чёрного камня."
 giants_tooth: "Зуб великана"
 giants_tooth_desc: "Зуб, напоминающий человеческий во всем, кроме своего гигантского размера."
 forgotten_magnars_drinking_horn: "Питьевой рог Забытого магнара"
 forgotten_magnars_drinking_horn_desc: "Этот великолепно украшенный питьевой рог принадлежал древнему вождю Первых людей. Мало кто может предположить, какому именно."
 eggs_boot: "Сапог Эгга"
 eggs_boot_desc: "Этот перстень был подарен Эйгону V его отцом во время службы оруженосцем у сира Дункана Высокого, межевого рыцаря."
 harmund_tongue: "Язык Хармунда"
 harmund_tongue_desc: "Внутри богато украшенной резьбой шкатулки с гербом Ланнистеров находится высушенный язык. Говорят, что шкатулка была похищена во время набега на Западные земли, и её характер наводит на мысль о том, что это правда, но язык, находящийся внутри, принадлежит Хармунду III, чей язык был вырван Сорокопутом за его богохульства и ложь."
 rhaegar_ruby: "Речной рубин"
 rhaegar_ruby_desc: "Когда Роберт Баратеон нанёс смертельный удар Рейгару Таргариену, рубины с его нагрудника рассыпались по воде. Некоторые из них до сих пор иногда намывает на берег Трезубца."
 bran_set_square: "Столярный треугольник Брандона"
 bran_set_square_desc: "Согласно легенде, этот треугольник использовал первый Брандон Старк, более известный как Бран Строитель, который, как считается, построил первую Высокую Башню, Штормовой Предел, Стену и Винтерфелл."
 dragon_blood_and_bones_potion: "Драконий эликсир"
 dragon_blood_and_bones_potion_desc: "Мутный эликсир, сделанный из свежевыжатой крови и костей дракона [dragon.GetName]. Хотя его эффекты не до конца ясны, те, кто употреблял его, известны странными ощущениями, которые они связывают с этим эликсиром."

 gold_leaves_name: "Золотые листья"
 gold_leaves_desc: "Считается, что эта пара золотых листьев упала с золотого дерева, выращенного Рован Золотое Деревце из яблока, завязанного в её золотых волосах. Правда в этом сомнительна, так как ювелир мог просто придать им форму, но дом Рован крайне недоволен подобными заявлениями."
 bors_skull_name: "Череп Борса"
 bors_skull_desc: "Эта древняя реликвия дома Бульвер представляет собой череп мужчины с растущими из него блестящими чёрными бычьими рогами - уродство, полученное Борсом Крушителем от питья только бычьей крови. Цитадель по-прежнему с сомнением относится к этому утверждению."
 elenei_cloak_name: "Девичий плащ Эленеи"
 elenei_cloak_desc: "Этот плащ, вышитый из неизвестной ткани, был ценной реликвией дома Дюррандон, а теперь и дома Баратеон. Ткань мягкая, красивая, по своей природе близкая к шелку, но более легкая и прочная. Её часто используют для подтверждения утверждения о божественности Эленеи."
 elenei_cloak_old_desc: "Этот плащ, вышитый из неизвестной ткани, - ценная реликвия дома Дюррандон. Ткань мягкая, красивая, по своей природе близкая к шелку, но более легкая и прочная. Её часто используют для подтверждения утверждения о божественности Эленеи."
 stone_skin_club_name: "Булава Камнешкурого"
 stone_skin_club_desc: "Аргот Камнешкурый, согласно просторской легенде, выиграл первый в истории Вестероса турнир. Однако «Серый Великан» не получил свой приз - руку Марис Девы - и всю оставшуюся жизнь бушевал у стен Староместа, яростно требуя вернуть свою невесту."
 herndons_horn_name: "Осколки рога Герндона"
 herndons_horn_desc: "Дом Тарли утверждает, что это осколки старого костяного рога, которым пользовался Герндон Рог, один из легендарных братьев, основавших их дом."
 florys_cloak_01_name: "Свадебный плащ Лисицы" #House Florent
 florys_cloak_01_desc: "Согласно легенде, у Флорис Лисицы было трое мужей, каждый из которых покрыл её своим плащом. Считается, что это один из них. Предположительно, он оставался во владении Флорентов со времен Века Героев."
 florys_cloak_02_name: "Свадебный плащ Лисицы" #House Peake
 florys_cloak_02_desc: "Согласно легенде, у Флорис Лисицы было трое мужей, каждый из которых покрыл её своим плащом. Считается, что это один из них. Предположительно, он оставался во владении Пиков со времен Века Героев."
 florys_cloak_03_name: "Свадебный плащ Лисицы" #House Ball
 florys_cloak_03_desc: "Согласно легенде, у Флорис Лисицы было трое мужей, каждый из которых покрыл её своим плащом. Считается, что это один из них. Предположительно, он оставался во владении Боллов со времен Века Героев."
 foss_bow_name: "Лук Фосса"
 foss_bow_desc: "Этот древний лук, бережно хранимый для того, чтобы он не сломался, по преданию, принадлежал Фоссу Лучнику, предку дома Фоссовей и сыну легендарного Гарта Зелёной Руки. Фосс прославился тем, что сбивал яблоки с головы любой девицы, которая ему приглянулась."
 dondarrion_message_name: "Послание Лорда-Молнии"
 dondarrion_message_desc: "Считается, что дом Дондаррион был основан, когда фиолетовая вспышка вилообразной молнии спасла гонца от двух нападавших из засады дорнийцев. При этом он смог вовремя доставить важное послание. Считается, что это и есть то самое послание, запечатанное и сохраненное как реликвия."
 flaying_knife_name: "Острый нож"
 flaying_knife_desc: "Острый нож, когда-то использовавшийся для сдирания плоти с тех, кто имел несчастье назвать себя врагом дома Болтон. Несмотря на то что эта практика запрещена, старые традиции неистребимы, и ходят слухи, что они продолжают сдирать кожу с пленников и выставлять их в потайной галерее Дредфорта."
 falcon_knight_helm_name: "Сломанный шлем «Рыцаря-Сокола»"
 falcon_knight_helm_desc: "Сломанный шлем ложного «Рыцаря-Сокола», убитого королём Робаром II Ройсом. Именно благодаря храбрости этого рыцаря сир Артис Аррен, настоящий Рыцарь-Сокол, смог напасть на Первых людей с тыла и одержать победу в кульминационной битве Семи Звёзд."
 marsh_king_mount_name: "Шкура скакуна Болотного короля"
 marsh_king_mount_desc: "Дом Рид долгое время хранит шкуру личного львоящера Болотного короля, на котором он ездил сражаться с королями Зимы."
 horns_of_the_wood_name: "Лесной рог"
 horns_of_the_wood_desc: "Огромные рога быка-лося на изящной подставке."
 green_hand_tabard_name: "Накидка Зелёной Руки"
 green_hand_tabard_desc: "Накидка, украшенная символом ордена Зелёной Руки. Хотя официально последние члены ордена погибли вместе с королём Мерном IX Гарденером на Пламенном поле, многие рыцари из дома Мандерли на Севере до сих пор претендуют на членство в ордене."

 bittersteel_skull: "Череп Жгучего Клинка"
 bittersteel_skull_desc: "Череп Жгучего Клинка, первого генерал-капитана Золотых Мечей."
 maelys_skull: "Череп Мейлиса Ужасного"
 maelys_skull_desc: "Череп Мейлиса I Блэкфайра, последнего претендента из дома Блэкфайров и генерал-капитана Золотых Мечей. Гротескный череп большего размера, чем обычно, и такой же неправильной формы череп размером с кулак." #Now with added Jimhaerys
 daemon_blackfyre_skull: "Череп Деймона Блэкфайра"
 daemon_blackfyre_skull_desc: "Череп Деймона Блэкфайра, генерал-капитана Золотых Мечей, убитого своим кузеном Мейлисом I Блэкфайром."

 agot_artifact_moons_rod_name: "Лунный член"
 agot_artifact_moons_rod_desc: "Септон Мун славился своей богоподобной плодовитостью. Поэтому после того, как неудачное восстание привело к его смерти, его преданные последователи отрезали его член, погрузили в раствор и сохранили, чтобы будущие поколения бесплодных дев могли расцвести с благословения Лунного члена."

 iron_throne: "Железный трон"
 iron_throne_desc: "Железный трон Семи королевств Вестероса был выкован по приказу короля Эйгона I из мечей его врагов. Это величайший символ королевства и его единого правителя."
 iron_throne_valid: "Это может быть размещено только при дворе владения [GetTitleByKey('c_kings_landing').GetNameNoTier]"
 gilded_throne: "Позолоченный трон"
 gilded_throne_desc: "Этот внушительный трон - постоянное украшение Золотой галереи. Огромный лев, высеченный из самой скалы и позолоченный золотом из шахт внизу, стоит на страже многочисленных сокровищ и ценностей, хранящихся в галерее."
 gilded_throne_valid: "Это может быть размещено только при дворе владения [GetTitleByKey('c_casterly_rock').GetNameNoTier]"
 seastone_chair: "Морской трон"
 seastone_chair_desc: "Таинственный трон Железных островов, Морской трон сделан из маслянистого чёрного камня, а его конструкция и история давно утеряны в анналах времени."
 seastone_chair_valid: "Это может быть размещено только при дворе владения [GetTitleByKey('c_pyke').GetNameNoTier]"
 ruined_oakenseat: "Дубовый пень"
 ruined_oakenseat_desc: "Некогда живой трон дома Гарденеров, который, по преданию, был посажен самим Гартом Зелёным. Этот легендарный трон был давно предан огню и теперь является мёртвым остатком былой славы."
 restored_oakenseat: "Дубовый трон"
 restored_oakenseat_desc: "Новый трон, вырезанный в живом дереве, - дань уважения древнему дубу, который когда-то служил троном королям из дома Гарденеров, а теперь возвышается как свидетельство величия и терпеливой заботы правящей династии Хайгардена."
 oakenseat_valid: "Это может быть размещено только при дворе владения [GetTitleByKey('c_highgarden').GetNameNoTier]"

 painted_table: "Расписной стол"
 painted_table_desc: "Большой стол из цельного лакированного дерева - почерневшего и обугленного, чтобы изобразить моря, реки и озера, - был вырезан в форме Вестероса и его Семи королевств. Изготовленный по приказу Эйгона Завоевателя, этот пятидесятифутовый гигант изображает горы, замки и поселения, инкрустированные золотом ярлыки - но без границ. Все едино. Одно королевство, которым правит только один король."
 painted_table_valid: "Это может быть размещено только при дворе владения [GetTitleByKey('c_dragonstone').GetNameNoTier]"

 high_seat_of_winter: "Высокий трон Зимы"
 high_seat_of_winter_desc: "Высокий и строгий трон из полированного камня, украшенный двумя рычащими лютоволками и сложной рельефной резьбой, отдающей дань уважения чардревам, которые считаются священными для тех, кто верит в Старых богов. На протяжении многих поколений это был трон королей Зимы из дома Старк."
 high_seat_of_winter_valid: "Это может быть размещено только при дворе владения [GetTitleByKey('c_winterfell').GetNameNoTier]"

 weirwood_throne: "Трон из чардрева"
 weirwood_throne_desc: "Высокий трон Орлиного Гнезда, выточенный из древнего чардрева и украшенный бледно-голубой мягкой подушкой, находится в конце Высокого зала. С его вершины короли Гор и Долины правили со времён Артиса «Рыцаря-Сокола»."
 weirwood_throne_valid: "Это может быть размещено только при дворе владения [GetTitleByKey('c_the_eyrie').GetNameNoTier]"

 seahorse_statue: "Статуя морского конька"
 seahorse_statue_desc: "Впечатляющий нефритовый морской конёк, относящийся к эпохе до Рока Валирии, когда драконьи владыки часто торговали с купцами из Далёкого востока."

 artifact_dragon_doll: "Кукла-дракон"
 dragon_doll_01: "Простая кукла-дракон"
 dragon_doll_01_desc: "Простая шерстяная кукла, выполненная в форме дракона, подойдёт любому ребенку из дома, где любят летать верхом на драконах."

 dragon_doll_02: "Изысканная кукла-дракон"
 dragon_doll_02_desc: "Разноцветная и прекрасно сделанная шерстяная кукла в форме дракона идеально подойдет для любого ребенка из дома драконьих наездников."
 
 dragon_doll_03: "Кукла-дракон Среброкрылая"
 dragon_doll_03_desc: "Прекрасная шерстяная кукла, сделанная в облике Среброкрылой королевой Алисанной Таргариен для подарка своим дочерям."
 
 dragon_doll_04: "Кукла-дракон Вермитор"
 dragon_doll_04_desc: "Прекрасная шерстяная кукла, сделанная в облике Вермитора королевой Алисанной Таргариен для подарка своим сыновьям."
 
 dragon_doll_05: "Голубая кукла-дракон"
 dragon_doll_05_desc: "Несовершенная, но от этого не менее очаровательная кукла-дракон из ледяной голубой шерсти, связанная Лианной Старк для своего тогда еще не родившегося ребенка. Неровные стежки и немного неуклюжая форма передают всю глубину любви и стараний Лианны, несмотря на ее явные трудности с рукоделием."

 dragon_doll_06: "Повелительница кукольного зла"
 dragon_doll_06_desc: "Эта зловещая на вид, но от этого не менее очаровательная кукла напоминает чешуйчатого полуночного дракона с изогнутыми фиолетовыми рогами. Её великолепная и в то же время злобная форма разожжёт воображение любого ребёнка — как на добро, так и на зло!"

 viserra_mirror: "Валирийское зеркало"
 viserra_mirror_desc: "Древнее зеркало из Старой Валирии, искусно изготовленное из стали и украшенное рубинами. Рама украшена замысловатым драконьим узором, отражающим мощь и мастерство валирийского Фригольда."
 artifact_mirror: "Зеркало"

 gold_mirror: "Золотое зеркало"
 gold_mirror_desc: "Прекрасно выполненное зеркало из золота."

 silver_mirror: "Серебряное зеркало"
 silver_mirror_desc: "Прекрасно выполненное зеркало из серебра."

 artifact_horn: "Рог"
 horn_of_herrock_name: "Рог Геррока"
 horn_of_herrock_desc: "Огромный черный рог, витой и опоясанный золотом. Легенда гласит, что [GetScriptedCharacterByHistoryID('KenningK_4').GetFirstNameNicknamed] затрубил в него у стен #L [GetTitleByKey('c_kayce').GetNameNoTier]а#!, подав сигнал городским шлюхам, чтобы они открыли ворота, позволив ему и его людям захватить город для дома [GetDynastyByID('dynn_Lannister').GetName]."
 horn_of_herrock_valid: "Член дома [GetDynastyHouseByID('house_KenningK').GetName], владеющий графством [GetTitleByKey('c_kayce').GetNameNoTier] в качестве [Concept('realm_capital', 'столицы')|E]"

 soul_of_harrenhal_name: "Душа Харренхолла"
 soul_of_harrenhal_desc: "Простое, но хорошо сделанное ожерелье с отполированным чёрным камнем, вставленным в сверкающее серебро. Серебряная цепочка, излучающая ночью тусклое, зловещее сияние, обвивает шею владельца, словно объятие любовника."
 soul_of_harrenhal_dagger_desc: "Простой, но хорошо сделанный кинжал с отполированным чёрным камнем, вставленным в сверкающее серебро в рукояти клинка. Серебряное лезвие, излучающее ночью тусклое, зловещее сияние, будто обвивает владельца, словно объятие любовника."

 krakenhorn_name: "Рог кракена"
 krakenhorn_desc: "Среди сокровищ, накопленных домом [GetDynastyByID('dynn_Celtigar').GetName], по слухам, есть великолепный рог, который, если в него подуть, призывает кракенов из морских глубин.\n\nДействительно ли обитатели глубин внимают его призыву? Истина в этом вопросе не совсем ясна. Тем не менее, это #italic очень#! красивый рог."
 krakenhorn_generic_desc: "Великолепный рог, который, как говорят, обладает способностью вызывать кракенов из морских глубин, если в него подуть.\n\nДействительно ли обитатели глубин внимают его призыву? Истина в этом вопросе не совсем ясна. Тем не менее, это #italic очень#! красивый рог."

