 agot_artifact_link_desc: "[owner.GetShortUIName|U] заслужил это звено, обучаясь под руководством такого #L [maester.Custom('MaesterCheck')|l]а#!, как [maester.GetName], [owner.Custom('GetLinkArtifactDescription')]"
 agot_artifact_link_desc_no_maester: "[owner.GetShortUIName|U] заслужил это звено, [owner.Custom('GetLinkArtifactDescription')]"
 agot_artifact_link_desc_black_iron: "овладев искусством ухода и дрессировки воронов."
