 agot_artifact_link_desc_electrum: "загадочным образом."
 agot_artifact_link_desc_yellow_gold: "освоив ведение учётных книг."
 agot_artifact_link_desc_red_gold: "освоив тонкости математики."
 agot_artifact_link_desc_iron: "продемонстрировав знание военного дела."
 agot_artifact_link_desc_lead: "продемонстрировав свои тонкие познания в ядах."
 agot_artifact_link_desc_pewter: "развив свои познания в архитектуре."
 agot_artifact_link_desc_platinum: "посеяв свой успех на пшеничных полях."
 agot_artifact_link_desc_silver: "научившись лечить и заботиться о других с помощью врачевания."
 agot_artifact_link_desc_steel: "выковав себе цепь в ревущей кузнице."
