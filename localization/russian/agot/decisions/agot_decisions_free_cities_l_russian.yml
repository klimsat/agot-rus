l_russian:

 agot_attempt_triarchy: "Попытаться создать Триархию"
 agot_attempt_triarchy_desc: "Обратиться к другим Трём Дочерям, чтобы создать Триархию"
 agot_attempt_triarchy_tooltip: "Обратиться к собратьям-правителям, чтобы создать Триархию"
 agot_attempt_triarchy_confirm: "Принесите мне мою печать"

 agot_stepstones_rhoynish_culture: "Новая идентичность"
 agot_stepstones_rhoynish_culture_desc: "Мы давно застряли на этих островах, и долгое время мы придерживались своих корней из Ройны и Старых княжеств. Но действительно ли мы хотим оставаться такими?"
 agot_stepstones_rhoynish_culture_tooltip: "От $rhoynar_original_collective_noun$ой отделится новая культура со своими традициями." #временный фикс, rhoynish в оригинале
 agot_stepstones_rhoynish_culture_confirm: "К новым начинаниям"

 agot_seize_control: "Захватить контроль"
 agot_seize_control_desc: "Диктатура не может длиться вечно; если я хочу обеспечить преемственность своей династии, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] отказаться от всех притязаний на демократию."
 agot_seize_control_tooltip: "Навсегда покончить с выборами, перейдя к феодальному правлению"
 agot_seize_control_confirm: "Принесите мне мою печать"
 agot_seize_control_full_county_control_tt: "Вы имеете максимальный [county_control|El] в вашей [Concept('capital', 'столице')|E]"
 strong_hook_on_all_powerful_vassals_tt: "У вас имеется [strong_hook|El] на всех ваших [Concept( 'powerful_vassals', 'могущественных вассалов' )|E]"

 agot_form_undisputed_lands: "Заселить Спорные земли"
 agot_form_undisputed_lands_decision_desc: "За эти земли проходили бесконечные стычки и войны со времён Рока Валирии, но я наконец [Select_CString(ROOT.Char.IsFemale, 'объединила', 'объединил' )] их."
 agot_form_undisputed_lands_decision_tooltip: "Создать королевство из этих некогда спорных земель"
 agot_form_undisputed_lands_confirm: "К бесславию и бессмертию!"
 three_daughters_confederation: "Конфедерация Трёх Дочерей существует"

 agot_break_braavos_pentos_treaty:0 "Разорвать договор между Браавосом и Пентосом"
 agot_break_braavos_pentos_treaty_desc: "С 209 года браавосийцы принуждают гордый город Пентос соблюдать тяжёлый договор. Пришло время разорвать этот договор в клочья и свободно управлять Пентосом!"
 agot_break_braavos_pentos_treaty_effect_tt: "Договор между Браавосом и Пентосом будет расторгнут. Пентос снова сможет #bold развивать свою армию, нанимать наёмников и заниматься работорговлей#!."
 agot_break_braavos_pentos_treaty_effect_2_tt: "Браавос получит казус белли на #bold 15 лет#!, который позволит им попытаться вновь навязать договор."
 agot_break_braavos_pentos_treaty_tooltip: "Разорвать договор между Браавосом и Пентосом"
 agot_break_braavos_pentos_treaty_confirm: "За Пентос!"

 agot_create_braavos_pentos_treaty_effect_tt: "Все персонажи в державе Пентос получат постоянный модификатор [GetModifier('agot_pentos_braavos_treaty').GetNameWithTooltip]. Он может быть удалён только в том случае, если Пентос освободится в результате войны."
 agot_break_braavos_pentos_treaty_as_braavos: "$agot_break_braavos_pentos_treaty$"
 agot_break_braavos_pentos_treaty_as_braavos_desc: "Мы неукоснительно соблюдаем границы Пентоса, как было оговорено в Браавосийско-пентошийском договоре 209 года. Но настало время для экспансии; что такое бумажка по сравнению с завоеванием?"
 agot_break_braavos_pentos_treaty_as_braavos_effect_tt: "Вы и любые вассалы Браавоса сможете объявить войну Пентосу и его вассалам."
 agot_break_braavos_pentos_treaty_as_braavos_confirm: "За Браавос!"
 agot_braavos_pentos_treaty_is_active: "Вы не можете объявить войну пока действует [GetModifier('agot_pentos_braavos_treaty').GetNameWithTooltip]."
 agot_break_braavos_pentos_treaty_as_braavos_tooltip: "$agot_break_braavos_pentos_treaty_tooltip$"

 agot_overthrow_bearded_priests: "Свергнуть Бородатых жрецов"
 agot_overthrow_bearded_priests_desc: "Говорят, что истинными правителями Норвоса являются Бородатые жрецы. Они правят державой из тени, в то время как магистры обладают не более чем номинальной властью, занимаясь рутинными делами. Пришло время раз и навсегда вырвать контроль над городом у Бородатых жрецов!"

 norvos_diarch_attempt_to_overthrow_liege.tt.majority_powerful_conspirators_support: "В настоящее время ваш заговор поддерживают [SCOPE.ScriptValue('norvos_pv_overthrow_tally_display_value')|0] подходящих сторонников из числа [Concept('powerful_vassal', 'могущественных вассалов')|E] или [Concept('powerful_family', 'могущественных семейств')|E] #weak (включая вас)#! из необходимых [SCOPE.ScriptValue('norvos_pv_overthrow_threshold_display_value')|0]"

 agot_attempt_to_overthrow_bearded_priests.tt.liege_accepts.keep_hof: "[liege.GetTitledFirstName] сохраняет свои титулы [Concept('head_of_faith', 'главы конфессии')|E]."
 agot_attempt_to_overthrow_bearded_priests.tt.liege_fights_and_loses.may_lose_everything: "[liege.GetTitledFirstName] будет [Select_CString(liege.IsFemale, 'вынуждена', 'вынужден' )] отказаться от своих титулов [Concept('head_of_faith', 'главы конфессии')|E]"

 agot_attempt_to_overthrow_bearded_priests.tt.liege_response: "Ваш [Concept('diarch', 'диарх')|E] либо уступит, либо попытается обыграть вас в выбранном вами [Concept('skill', 'навыке')|E], либо поручит это сделать своему представителю"
