l_russian:
 #Marked for Review

 agot_proclaim_iron_throne:0 "Воссоздать Железный Трон"
 agot_proclaim_iron_throne_tooltip:0 "Это решение позволит объединить державу под властью Железного трона."
 agot_proclaim_iron_throne_desc:0 "Железный трон долгие годы был символом единства и власти в Вестеросе. Теперь, когда бесчисленные мелкие уделы королевства собрались под нашими знамёнами, пришло время собрать клинки поверженных и выковать новый Железный трон для всего королевства.\n\nХватит ли мне силы, хитрости и воли, чтобы заявить свои права на Железный трон? Сумеет ли дом [ROOT.Char.GetHouse.GetName] стать единственным истинным правителем Вестероса?"
 agot_proclaim_iron_throne_confirm:0 "Разослать воронов"

 set_capital_kingslanding_decision:0 "Вернуть Королевскую Гавань"
 set_capital_kingslanding_decision_tooltip:0 "Восстановить Королевскую Гавань в качестве столицы вашей державы."
 set_capital_kingslanding_decision_desc:0 "Королевская Гавань — законная столица Железного трона, и потому она принадлежит мне."
 set_capital_kingslanding_decision_confirm:0 "Восстановить истинную столицу державы!"

 end_the_ironborn_decision:0 "Покончить с железнорождёнными"
 end_the_ironborn_decision_desc:0 "На протяжении столетий безродные железнорождённые псы насиловали, убивали и грабили Вестерос и другие земли. Теперь стало неизбежным, что мы должны принять меры против этих морских разбойников и сокрушить их власть раз и навсегда. Мы должны развязать против них такую опустошительную войну, чтобы никогда больше ни один Железный король не воссел на Морской трон."
 end_the_ironborn_decision_confirm_text_desc:0 "К оружию!"
 end_the_ironborn_decision_tooltip:0 "Смерть железнорожденным."

 regrow_oakenseat_decision:0 "Восстановить Дубовый трон"
 regrow_oakenseat_decision_tooltip:0 "Вызвать опытного садовника, чтобы он заново вырастил Дубовый трон."
 regrow_oakenseat_decision_desc:0 "Дубовый трон, живой престол, посаженный Гартом Зелёной Рукой, был уничтожен дорнийским королём во времена правления короля Гарта X Гарденера, и теперь о нём ходят лишь легенды.\n\nХотя это и непростая задача, восстановление Дубового трона принесёт моему дому огромную славу, власть и влияние в Просторе - и во всех Семи королевствах."
 regrow_oakenseat_decision_confirm:0 "Посадить семя"
 regrow_oakenseat_excellent_aptitude:0 "Ваш $court_gardener_court_position$ должен обладать #V Отличной#! пригодностью"
 agot_major_decisions_events.1001.t:0 "Разросшийся Дубовый трон"
 agot_major_decisions_events.1001.desc:0 "Легенда гласит, что [greenhand.GetFullNameNicknamed] собственной зелёной рукой вырезал изначальный живой дуб, и короли из дома [greenhand.GetHouse.GetName] правили с того самого трона на протяжении многих поколений.\n\nЕго уничтожение вырвало корень - и сердце - из Хайгардена.\n\nНаконец, после десятилетий тщательного ухода, обрезки и разведения, некогда гордый дуб был восстановлен. По всему миру все узнают о славе дома [ROOT.Char.GetHouse.GetName] о нашем прославленном троне. Возможно, я даже смогу претендовать на право называться [Select_CString(ROOT.Char.IsFemale, 'истинной преемницей', 'истинным преемником' )] самого Гарта Зелёной Руки..."
 agot_major_decisions_events.1001.a:0 "Легенда возрождена!"

 ironborn_rebellion_decision:0 "Мятеж против Железного трона"
 ironborn_rebellion_decision_desc:0 "Слишком долго жители зелёных земель спокойно спали в своих постелях. Действительно, со времен смерти Харрена Чёрного Вестерос не знал страха перед железнорожденными, лишь изредка на берег выходили отряды налётчиков, чтобы заплатить железную цену. Короли, один за другим, восседали на своём Железном троне. Но разве мы забыли, что у нас есть свой трон, что на протяжении веков у нас были свои короли?\n\nДругие могли, но я - нет. Я сброшу цепи, сковывающие наш народ; я стану [Select_CString(ROOT.Char.IsFemale, 'королевой', 'королём' )] Соли и Камня. Андалы, ройнары и Первые люди снова узнают, что значит бояться железнорожденных."
 ironborn_rebellion_decision_tooltip:0 "Плачь, о Вестерос, чтобы острова восстали вновь!"
 ironborn_rebellion_decision_confirm_text_desc:0 "Мы заплатим железную цену!"

 defy_winter_lords_decision:0 "Бросить вызов Зимним лордам"
 defy_winter_lords_decision_desc:0 "Каменнорождённые не знают ничего, кроме насмешек северян, которые считают нас не лучше одичалых. Когда-то Скагос был свободен и независим от Зимних лордов - и так будет снова. Наша мощь заставит трепетать такого слабого правителя, как [ROOT.Char.GetLiege.GetNameNicknamedRegnal]!"
 defy_winter_lords_decision_tooltip:0 "Вы объявите о своей независимости, снова вернув скагосийцев в моря."
 defy_winter_lords_decision_confirm_text_desc:0 "Север запомнит, что нужно бояться Скагоса!"

 agot_minor_decisions_events.0001:0 "Бросить вызов Зимним лордам"
 agot_minor_decisions_events.0001.desc:0 "Многие камнерождённые мечтали о том дне, когда Скагос вновь обретёт свободу. Когда король Брандон Старк сломил нашу власть, он запретил нам выходить в море. Теперь Север будет трепетать при приближении наших кораблей!"
 agot_minor_decisions_events.0001.a:0 "Мы #bold отрекаемся#! от клятв."
 agot_minor_decisions_events.0001.a_tt:0 "Конечно, Север не примет этот акт предательства без боя. Готовы ли вы к войне?"

 agot_minor_decisions_events.0002:0 "Независимый Скагос"
 agot_minor_decisions_events.0002.desc:0 "Каменнорождённые снова правят собой! Тюлений залив узнает наши знамена.\n\nЯ [Select_CString(CHARACTER.IsFemale, 'вписала', 'вписал' )] своё наследие в камень, и все камнерожденные будут помнить мое имя."
 agot_minor_decisions_events.0002.a:0 "Моё наследие выдержит испытание временем."
 agot_minor_decisions_events.0002.a_tt:0 "Скагос обретает независимость."

 agot_adopt_kneeler_ways_decision:0 "Приспособиться к южным обычаям"
 agot_adopt_kneeler_ways_decision_desc:0 "Жизнь в жестокой пустоши далёкого Севера превратила нас в безжалостный и неуступчивый народ, совсем не похожий на тот, кто живет по ту сторону Стены. Теперь, когда мы обрели свой дом среди них, возможно, было бы разумно приспособиться к их образу жизни, законам и обычаям."
 agot_adopt_kneeler_ways_decision_confirm:0 "Пора разогнуть колени"
 agot_adopt_kneeler_ways_decision_tooltip:0 "Ваш народ примет уклад подданных Железного трона. Это предоставит вам больше взаимодействия с правителями к югу от Стены, но лишит вас преимуществ Вольного народа."
 is_culture_head:0 "Вы - культурный идеолог вашей культуры"
 hybridized_with_kneelers:0 "Ваша культура была гибридизирована с культурой, представленной к югу от Стены"
 capital_south_of_the_wall:0 "Ваша столица расположена к югу от Стены"
 agot_major_decisions_events.1003.t:0 "По ту сторону..."
 agot_major_decisions_events.1003.desc:0 "Мечта многих поколений о том, чтобы вырваться из суровых реалий жизни по ту сторону Стены, осуществилась. Не будет ли это проявлением высокомерия - демонстративно продолжать жить как прежде и игнорировать законы и обычаи наших новых соседей? Народы южной стороны Стены, возможно, робки и мягки, но их жизнь длинна и комфортна. Они явно знают, как извлечь максимум пользы из этой приятной земли, и если их законы помогают им в этом, то и мы примем их."
 agot_major_decisions_events.1003.a:0 "К новому, более спокойному будущему!"
 every_freefolk_ruler_tt:0 "Каждый вождь из числа Вольного народа"