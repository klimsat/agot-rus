l_russian:

 # agot_pirate_convert_whole_realm_to_feudalism_decision and effects and event following
 agot_pirate_convert_whole_realm_to_feudalism_decision:0 "Принять феодализм"
 agot_pirate_convert_whole_realm_to_feudalism_decision_desc:0 "Чтобы держава [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] и дальше могла расширяться и развиваться, мы должны оставить старые пути и вместе принять новый способ администрирования."
 agot_pirate_convert_whole_realm_to_feudalism_decision_confirm:0 "Принять феодализм"
 agot_pirate_convert_whole_realm_to_feudalism_decision_tooltip:0 "[government|E] меняет форму правления и выбирает [GetGovernment( 'lp_feudal_government' ).GetName] или [GetGovernment( 'feudal_government' ).GetName]"
 pirate_vassals_will_convert:0 "Мои #L [GetGovernment( 'pirate_government' ).GetAdjective|l]ие#! вассалы примут [GetGovernment( 'feudal_government' ).GetName]"
 pirate_vassals_will_convert_lp:0 "Мои #L [GetGovernment( 'pirate_government' ).GetAdjective|l]ие#! вассалы примут [GetGovernment( 'lp_feudal_government' ).GetName|l]"
 msg_vassal_common_feudalised:0 "Вассал стал феодалом"
 msg_vassal_common_feudalised_desc:0 "Ваш вассал, [ROOT.Char.GetShortUIName], оставляет свои  [GetGovernment( 'pirate_government' ).GetAdjectiveNoTooltip]ие традиции и принимает [GetGovernment( 'feudal_government' ).GetNameNoTooltip|l]"
 msg_vassal_lp_feudalised:0 "Вассал стал феодалом"
 msg_vassal_lp_feudalised_desc:0 "Ваш вассал, [ROOT.Char.GetShortUIName], оставляет свои  [GetGovernment( 'pirate_government' ).GetAdjectiveNoTooltip]ие традиции и принимает [GetGovernment( 'lp_feudal_government' ).GetNameNoTooltip|l]"
 all_pirate_holding_will_change:0 "Все [Concept( 'pirate_den_holding', 'пиратские логова' )|E] в державе станут [Concept( 'castle_holdings', 'замками' )|E]"
 agot_pirate_events.0001.t:0 "Новая эра"
 agot_pirate_events.0001.desc:0 "Старые традиции сослужили нам хорошую службу, и мы всегда будем чтить их. Но, если мы хотим и впредь сохранять наше могущество, я как [ROOT.Char.GetTitleAsNameNoTooltip|l] державы [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] полагаю, что мы должны принять принципы феодализма. Это важный следующий шаг на пути к величию!"
 agot_pirate_events.0001.a:0 "Да здравствует [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 agot_pirate_events.0002.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 agot_converting_to_admin_kings_become_lp_feudal:0 "Каждый [vassal|El] с титулом [Concept('kingdom', 'королевского')|E] [Concept('title_tier', 'уровня')|E] примет [Concept('government', 'форму правления')|E] «[GetGovernment( 'lp_feudal_government' ).GetName]»"

 become_landless_pirate_decision:0 "Стать пиратом"
 become_landless_pirate_decision_desc:0 "Я [Select_CString(ROOT.Char.IsFemale, 'вкусила', 'вкусил' )] славы и золота как флибустьер. Теперь пришло время сбросить маску и принять свою истинную пиратcкую природу."
 become_landless_pirate_decision_tooltip:0 "Изменить форму правления, приняв [GetGovernment( 'pirate_government' ).GetName|l]"
 become_landless_pirate_decision_confirm:0 "Стать пиратом."

 agot_located_in_pirating_region:0 "Вы должны находиться в регионе, в котором распространено пиратство, например, [GetGeographicalRegion('world_stepstones').GetName]."
 become_landless_pirate_decision_tt:0 "Вы станете безземельным [Concept('pirate_govt', 'пиратским капитаном')|E]"

 abandon_pirate_holdings_decision:0 "Стать безземельным пиратом"
 abandon_pirate_holdings_decision_desc:0 "Править унылыми скалами и пиратскими логовами - утомительная жизнь. Пришло время полностью посвятить себя морям как [Select_CString(ROOT.Char.IsFemale, 'грабительница', 'грабитель' )] и корсар!"
 abandon_pirate_holdings_decision_tooltip:0 "Отказаться от своих землевладельческих титулов и стать безземельным пиратом"
 abandon_pirate_holdings_decision_confirm:0 "Покинуть мои земельные наделы."

 agot_pirate_higher_tier_title_decision:0 "[ROOT.Char.Custom('GetDominateTitleLoc')]"
 agot_pirate_higher_tier_title_decision_title:0 "Господство над державой [ROOT.Char.GetPrimaryTitle.GetDeJureLiege.GetBaseNameNoTierNoTooltip]"
 agot_pirate_higher_tier_title_decision_desc:0 "Пришло время доказать мое доминирование над регионом и подчинить его обитателей."
 agot_pirate_higher_tier_title_decision_tooltip:0 "Попытаться получить [Concept('title', 'титул')|E] более высокого [Concept('title_tier', 'уровня')|E]"
 agot_pirate_higher_tier_title_decision_confirm:0 "Они падут предо мной."

 agot_become_landed_pirate_decision:0 "Принять пиратство"
 agot_become_landed_pirate_decision_desc:0 "Если я хочу процветать среди пиратов, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] полностью принять пиратство как свою форму правления."
 agot_become_landed_pirate_decision_tooltip:0 "Стать пиратом"
 agot_become_landed_pirate_decision_confirm:0 "$agot_become_landed_pirate_decision_tooltip$"

 agot_become_landed_pirate_decision_shatter_realm_tt:0 "Все принадлежащие вам титулы, помимо [Concept('primary_title', 'основного')|E], будут переданы местным правителям."
 agot_become_landed_pirate_decision_gain_tributaries_tt:0 "Все новые правители в пределах ваших бывших титулов станут вашими [Concept('tributaries', 'данниками')|E]."
 agot_become_landed_pirate_decision_holding_reset_tt:0 "Ваше основное [Concept('holding', 'владение')|E] станет [Concept('pirate_den_holding', 'пиратским логовом')|E]."

 agot_dump_landless_pirate_raid_loot: "Собрать добычу с налёта"
 agot_dump_landless_pirate_raid_loot_desc: "Добыча с моего налёта готова к получению после возвращения в порт. Однако мне нужно отправить нескольких прислужников, чтобы они как следует забрали её от моего имени."
 agot_dump_landless_pirate_raid_loot_tooltip: "Забрать добычу"
 agot_dump_landless_pirate_raid_loot_confirm: "Забрать добычу."