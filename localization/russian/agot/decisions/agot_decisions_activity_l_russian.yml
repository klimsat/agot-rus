l_russian:
 agot_go_on_reaving_decision: "Отправиться на Жатву"
 agot_go_on_reaving_decision_opening_desc: "#F Заплатить железную цену и отправиться в великий налёт, чтобы прочесать земли за Узким морем. Железнорождённые со всей державы примкнут к вашему флоту, чтобы освободить эти земли от шафрана и шёлка!#!"
 reaving_effect_1: "Вы выберете пункт назначения, подходящий для налёта"
 reaving_effect_2: "Чем успешнее вы грабите, тем больше [Concept( 'piety', 'благочестия' )|E] и [Concept('prestige', 'престижа' )|E] вы получаете"
 reaving_effect_3:0 "Вы можете получить свойство «[GetTrait('viking').GetName( GetNullCharacter )]»"
 agot_go_on_reaving_decision_tooltip:0 "Будет созвана великая [reaving|E]"
 agot_go_on_reaving_decision_confirm:0 "Жители зелёных земель устрашатся железнорождённых!"

 agot_buy_diving_bell: "Купить водолазный колокол"
 agot_buy_diving_bell_desc: "Я прикажу установить водолазный колокол на мой корабль, чтобы мой дом мог следовать старым картам затонувших сокровищ и исследовать обломки на океанском дне."
 agot_buy_diving_bell_tooltip: "Установить водолазный колокол"
 agot_buy_diving_bell_effect_tooltip: "Открывает [Concept('activity', 'занятие')|E] #TOOLTIP:ACTIVITY_TYPE,activity_agot_sailing #L морского путешествия#!#! - $agot_sailing_type_treasure$"
 agot_buy_diving_bell_confirm_text_desc: "Приведите корабелов!"

 agot_buy_ship: "Купить корабль"
 agot_buy_ship_desc: "Моря предлагают богатство, славу и приключения тем, кто достаточно смел, чтобы плавать по ним. Прекрасное судно сослужит хорошую службу моему дому, понеся моё знамя к далёким берегам и открывая новые возможности на волнах. Теперь мне нужно лишь решить, какое судно я закажу."
 agot_buy_ship_tooltip: "Заказать корабль для вашего дома"
 agot_buy_ship_effect_1_tooltip: "Открывает #TOOLTIP:ACTIVITY_TYPE,activity_agot_sailing #L морское путешествие#!#! - $agot_sailing_type_raid$"
 agot_buy_ship_effect_2_tooltip: "Открывает #TOOLTIP:ACTIVITY_TYPE,activity_agot_sailing #L морское путешествие#!#! - $agot_sailing_type_valyria$"
 agot_buy_ship_confirm_text_desc: "Приведите корабелов!"
 agot_buy_ship_small_ship: "Приобрести личный корабль"
 agot_buy_ship_small_ship_desc: "Скромное судно, подходящее для того, чтобы нести моё знамя по морям, не опустошая мою казну."
 agot_buy_ship_small_ship_tooltip: "$agot_buy_ship_small_ship_desc$"
 agot_buy_ship_big_ship: "Приобрести большой флагман"
 agot_buy_ship_big_ship_desc: "Величественное судно, достойное могучего дома, несомненно привлекающее восхищённые взгляды, где бы оно ни бросило якорь."
 agot_buy_ship_big_ship_tooltip: "$agot_buy_ship_big_ship_desc$"