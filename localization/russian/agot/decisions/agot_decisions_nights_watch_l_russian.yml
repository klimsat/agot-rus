l_russian:
 #Marked for Review

 restore_the_nights_watch:0 "Возродить Ночной Дозор"
 restore_the_nights_watch_desc:0 "С тех пор, как Ночной Дозор был распущен, наши стены и люди были под угрозой одичалых и иной нечисти, что рыщет далеко на севере. Мы обязаны возродить Ночной Дозор, дабы восстановить порядок на севере и чтобы наши женщины и дети могли спать спокойно по ночам."
 restore_the_nights_watch_tooltip:0 "Мы обязаны возродить Ночной Дозор, дабы восстановить порядок на севере и чтобы наши женщины и дети могли спать спокойно по ночам."
 restore_the_nights_watch.tooltip.1:0 "Будет избран новый Лорд-командующий для защиты и управления Стеной."
 restore_the_nights_watch.tooltip.2:0 "#N Вы потеряете земли, окружающие Стену! #!"
 restore_the_nights_watch_confirm:0 "За царство людей!"

 dissolve_the_nights_watch:0 "Расформировать Ночной Дозор"
 dissolve_the_nights_watch_desc:0 "Ночной Дозор слишком долго наводил ужас на вольный народ! После взятия Стены под контроль, пришло время положить конец братству и даровать нашему народу свободу и мир, которых они были лишены тысячи лет."
 dissolve_the_nights_watch_tooltip:0 "Правлению Ночного Дозора придёт конец."
 dissolve_the_nights_watch_confirm:0 "За вольный народ!"

 rebuild_nights_watch_fort:0 "Реконструировать замки на Стене"
 rebuild_nights_watch_fort_desc:0 "Веками, древний порядок Ночного Дозора находился в плачевном состоянии. Это привело к тому, что множество замков, расположенных вдоль Стены, были заброшены, не сумев противостоять времени. Улучшение финансового положения дозора, многие верят, что пришло время восстановить то, что было утрачено."
 rebuild_nights_watch_fort_tooltip:0 "Восстановить замки вдоль Стены."
 rebuild_nights_watch_fort_confirm:0 "Приведите первого строителя!"

 #Desert the Night's Watch Decision for First Ranger
 desert_the_nw:0 "$game_concept_agot_desert_nw$"
 desert_the_nw_desc:0 "Стена отняла много, но дала мало. Дезертировать из Ночного Дозора - значит нарушить свои клятвы, своих братьев и безопасность долга, но за Стеной лежит свобода, если я осмелюсь на неё претендовать."
 desert_the_nw_tooltip:0 "Вы дезертируете из [Concept('nw_govt', 'Ночного Дозора')|E]"
 desert_the_nw_confirm:0 "Дезертировать из Дозора"

 reclaim_brandons_gift_decision:0 "Вернуть Дар Брандона"
 reclaim_brandons_gift_decision_desc:0 "Вассалы с земель Дара Брандона когда-то приносили присягу Северу, а не Ночному Дозору. Пришло время вернуть наши законные владения и возвести новых лордов, чтобы развивать земли, которыми Дозор так плохо управлял."
 reclaim_brandons_gift_decision_tooltip:0 "Вернуть Дар Брандона"
 reclaim_gift_decision.requirements:0 "Должно выполняться одно из следующих условий:\n$EFFECT_LIST_BULLET$Вы состоите в союзе с Ночным Дозором\n$EFFECT_LIST_BULLET$У вас есть достоинство «[GetPerk('diplomat_perk').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$Лорд-командующий Ночного Дозора имеет к вам мнение 100"
 reclaim_brandons_gift_decision_confirm:0 "$reclaim_brandons_gift_decision_tooltip$"

 reclaim_gift_decision:0 "Вернуть Новый Дар"
 reclaim_gift_decision_desc:0 "Вассалы с земель Нового Дара когда-то приносили присягу Северу, а не Ночному Дозору. Пришло время вернуть наши законные владения и возвести новых лордов, чтобы развивать земли, которыми Дозор так плохо управлял."
 reclaim_gift_decision_tooltip:0 "Вернуть Новый Дар"
 reclaim_gift_decision_confirm:0 "$reclaim_gift_decision_tooltip$"
 reclaim_gift_decision_desc_effect:0 "[GetTitleByKey('k_the_wall').GetHolder.GetName] получит предложение о возвращении владения [GetTitleByKey('d_new_gift').GetNameNoTier] Северу."

 reclaim_brandons_gift_decision_desc_effect:0 "[GetTitleByKey('k_the_wall').GetHolder.GetName] получит предложение о возвращении владения  [GetTitleByKey('d_brandons_gift').GetNameNoTier] Северу."
 reclaim_gift_decision_desc_use_hook_tt:0 "Будет использован ваш [Concept('hook', 'рычаг влияния')|E] на [Concept('top_liege', 'верховного сюзерена')|E]."

 agot_nights_watch.3000.t:0 "Новый Дар"
 agot_nights_watch.3000.desc:0 "[winterfell_petitioner.GetName] просит, чтобы мы вернули Новый Дар Северу в обмен на крупную сумму золота. На этих землях будут назначены четыре новых правителя, но они принесут присягу Северу, впервые за многие поколения положив конец власти Ночного Дозора над этими землями."
 agot_nights_watch.3000.desc_brandons_gift:0 "[winterfell_petitioner.GetName] просит, чтобы мы вернули Дар Брандона Северу в обмен на крупную сумму золота. На этих землях будут назначены три новых правителя, но они принесут присягу Северу, впервые за многие поколения положив конец власти Ночного Дозора над этими землями."
 agot_nights_watch.3000.a:0 "Я соглашусь - пусть Север вернёт свои земли."
 agot_nights_watch.3000.b:0 "Я отказываюсь. Эти земли принадлежат Ночному Дозору."
 agot_nights_watch.3001.t:0 "Дар: просьба удовлетворена"
 agot_nights_watch.3001.desc:0 "[nw_lc.GetName] дал согласие вернуть Дар под власть Севера.\n\nТеперь пора назначить новых правителей, которые заселят графства этого края."
 agot_nights_watch.3001.a:0 "Я [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам' )] выберу новых правителей."
 agot_nights_watch.3001.b:0 "Раздать земли кому угодно."
 agot_nights_watch.3003.t:0 "Правители Нового Дара"
 agot_nights_watch.3003.desc:0 "Пора выбрать правителя для владения [new_gift_county_to_give_away.GetNameNoTier]."
 agot_nights_watch.3003.a:0 "Этот кандидат подойдёт."
 agot_nights_watch.3003.b:0 "Пожалуй, передам титул случайному человеку."
 nw_proposal_rejected:0 "Предложение отклонено"

 agot_nights_watch.3004.t:0 "Дары возвращены"
 agot_nights_watch.3004.desc:0 "Новый Дар возвращён под власть Севера после многих лет управления Ночного Дозора. Чтобы заселить эти земли, назначены следующие правители:\n\n$BULLET$[GetTitleByKey('c_norlinton').GetNameNoTier] - [norlinton_holder.GetFirstName] [norlinton_holder.GetHouse.GetName]\n$BULLET$[GetTitleByKey('c_boreharrow').GetNameNoTier] - [boreharrow_holder.GetFirstName] [boreharrow_holder.GetHouse.GetName]\n$BULLET$[GetTitleByKey('c_whitecross').GetNameNoTier] - [whitecross_holder.GetFirstName] [whitecross_holder.GetHouse.GetName]\n$BULLET$[GetTitleByKey('c_giantsbeard').GetNameNoTier] - [giantsbeard_holder.GetFirstName] [giantsbeard_holder.GetHouse.GetName]"
 agot_nights_watch.3004.desc_brandons_gift:0 "Дар Брандона возвращён под власть Севера после многих лет управления Ночного Дозора. Чтобы заселить эти земли, назначены следующие правители:\n\n$BULLET$[GetTitleByKey('c_weatherback_ridge').GetNameNoTier] - [weatherback_ridge_holder.GetFirstName] [weatherback_ridge_holder.GetHouse.GetName]\n$BULLET$[GetTitleByKey('c_moles_town').GetNameNoTier] - [moles_town_holder.GetFirstName] [moles_town_holder.GetHouse.GetName]\n$BULLET$[GetTitleByKey('c_hoarburn').GetNameNoTier] - [hoarburn_holder.GetFirstName] [hoarburn_holder.GetHouse.GetName]"
 agot_nights_watch.3004.a:0 "Мои деяния принесут Северу пользу на многие поколения вперёд."

 agot_nights_watch.holding_conversion_tt:0 "[new_gift_county_to_give_away.GetNameNoTier] будет преобразован в [Concept('castle_holding', 'замок')|E]"
 agot_nights_watch.new_capital_tt:0 "[new_capital.GetName] станет столицей владения [new_gift_county_to_give_away.GetNameNoTier]."

 donate_land_to_nw_decision_desc:0 "Мы владеем частью исторических земель Ночного Дозора. Возможно, возвращение этих земель укрепит их положение."
 donate_land_to_nw_decision_tooltip:0 "Вернуть земли!"
 donate_land_to_nw_decision:0 "Вернуть Ночному Дозору исторические земли"
 donate_land_to_nw_decision_confirm:0 "Вернуть земли!"

 brandons_gift_will_be_returned_to_nw_tt:0 "Все графства в составе владения [GetTitleByKey('d_brandons_gift').GetName] будут переданы персонажу [GetTitleByKey('k_the_wall').GetHolder.GetName]"
 new_gift_will_be_returned_to_nw_tt:0 "Все графства в составе владения [GetTitleByKey('d_new_gift').GetName] будут переданы персонажу [GetTitleByKey('k_the_wall').GetHolder.GetName]"

 agot_nights_watch.3005.t:0 "Земли возвращены"
 agot_nights_watch.3005.desc:0 "Хотя Север вернул себе Новый Дар, теперь он великодушно передал его под контроль Ночного Дозора.\n\n[GetTitleByKey('c_norlinton').GetNameNoTier], [GetTitleByKey('c_boreharrow').GetNameNoTier], [GetTitleByKey('c_whitecross').GetNameNoTier] и [GetTitleByKey('c_giantsbeard').GetNameNoTier] вновь принадлежат Ночному Дозору!"
 agot_nights_watch.3005.desc_brandons_gift:0 "Хотя Север вернул себе Дар Брандона, теперь он великодушно передал его под контроль Ночного Дозора.\n\n[GetTitleByKey('c_weatherback_ridge').GetNameNoTier], [GetTitleByKey('c_moles_town').GetNameNoTier] и [GetTitleByKey('c_hoarburn').GetNameNoTier] вновь принадлежат Ночному Дозору!"
 agot_nights_watch.3005.a:0 "Мы не вправе растратить это великодушие."