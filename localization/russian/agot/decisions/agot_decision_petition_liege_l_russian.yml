l_russian:
 # Title Paramount
 petition_liege_decision_option_paramount: "Попросить титул верховного лордства \n#low Пожаловать [title|El]#! верховного лордства"
 petition_liege_paramount_desc: "Попросить, чтобы [ROOT.Char.GetLiege.GetTitledFirstName] [Select_CString(ROOT.Char.GetLiege.IsFemale, 'пожаловала', 'пожаловал' )] вам [title|El] [Select_CString(ROOT.Char.IsFemale, 'верховной леди', 'верховного лорда' )]"
 petition_liege_paramount_tooltip: "$petition_liege_decision_second_tooltip$"
 petition_liege_paramount_tt: "#X Ни одна из ваших [Concept('claims', 'претензий')|E] не имеется у вашего [Concept('liege', 'сюзерена')|E], или он не может передать [title|El]#!"
 # Legitimate House Boost
 petition_liege_decision_option_legitimate_house_boost: "Поддержать претензии дома\n#low Утвердить в качестве [Concept('agot_legitimate_house', 'законного дома')|E]#!"
 petition_liege_legitimate_house_boost_desc: "Попросить, чтобы [ROOT.Char.GetLiege.GetTitledFirstName] [Select_CString(ROOT.Char.GetLiege.IsFemale, 'поддержала', 'поддержал' )] притязания вашего дома на положение [Concept('agot_legitimate_house', 'законного дома')|E] провинции [ROOT.Char.GetPrimaryTitle.GetName]"
 petition_liege_legitimate_house_boost_tooltip: "$petition_liege_decision_second_tooltip$"
 petition_liege_legitimate_house_boost_tt: "#X Ваш дом является законным, вас уже поддержали, или ваш сюзерен не принадлежит к законному дому своего основного титула#!"