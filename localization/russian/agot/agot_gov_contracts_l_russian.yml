 special_contract_council_desc:1 "#flavor Заключив $special_contract_council$, [vassal|El] получает множество привилегий, а его политический авторитет быстро растёт. [vassals|E], заключившие $special_contract_council_short$ повышают [prestige|El] [Concept('liege', 'сюзерена')|E], но предоставляют #high [EmptyScope.ScriptValue('palatinate_contract_taxes_tooltip')|0]%#! не [tax|El] и [levies|El], а отправляют свои [Concept('obligations', 'обязательства')|E] предыдущему сюзерену.#!"

 special_contract_landed_knight: "Договор ленника"
 special_contract_landed_knight_short: "Ленник"
 special_contract_landed_knight_desc: "#flavor Согласно условиям договора ленника соответствующий [Concept('vassal', 'вассал')|E] получает в управление небольшое владение и прилегающие к нему земли, часто в качестве награды за образцовую или добросовестную службу. Став [Concept('agot_landed_knight', 'ленником')|E], вассал платит на #high [EmptyScope.ScriptValue('landed_knight_contract_tax_tooltip')|0]%#! меньше [Concept('tax', 'налогов')|E] и получает повышенную [Concept('knight_effectiveness', 'эффективность капитанов')|E], но при этом не имеет права возводить ямы и виселицы, предоставляет на #high [EmptyScope.ScriptValue('landed_knight_contract_levies_tooltip')|0]%#! больше [Concept('levies', 'ополчения')|E] и страдает от снижения способности к [Concept('intrigue', 'плетению интриг')|E] из-за более строгого контроля со стороны закона.#!"

