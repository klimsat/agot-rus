l_english:

 agot_attempt_triarchy:0 "Attempt to Form the Triarchy"
 agot_attempt_triarchy_desc:0 "Reach out to the other Daughters in order to form the Triarchy"
 agot_attempt_triarchy_tooltip:0 "Reach out to your fellow rulers to form the Triarchy"
 agot_attempt_triarchy_confirm:0 "Bring me my seal"

 agot_stepstones_rhoynish_culture:0 "A New Identity"
 agot_stepstones_rhoynish_culture_desc:0 "Long have we been stranded on these islands, and for long we have kept to our roots from the Rhoyne and the Old Principalities. But do we really wish to stay this way?"
 agot_stepstones_rhoynish_culture_tooltip:0 "A new, divergent culture shall emerge from $rhoynish$, with its own set of traditions."
 agot_stepstones_rhoynish_culture_confirm:0 "To new beginnings"

 agot_seize_control:0 "Seize Control"
 agot_seize_control_desc:0 "A dictatorship cannot last forever; if I want to secure my dynasty's succession, I must abandon all pretense at democracy."
 agot_seize_control_tooltip:0 "Forever end elections by converting to a Feudal government"
 agot_seize_control_confirm:0 "Bring me my seal"
 agot_seize_control_full_county_control_tt:0 "You have maximum [county_control|E] in your [capital|E]"
 strong_hook_on_all_powerful_vassals_tt:0 "You have a [strong_hook|E] on all of your [powerful_vassals|E]"

 agot_form_undisputed_lands:0 "Settle the Disputed Lands"
 agot_form_undisputed_lands_decision_desc:0 "These lands have been fought and picked over since the Doom of Valyria, but I have finally united them."
 agot_form_undisputed_lands_decision_tooltip:0 "Form a kingdom from these once-disputed lands"
 agot_form_undisputed_lands_confirm:0 "To infamy and immortality!"
 three_daughters_confederation:0 "The confederation of the Three Daughters exists"

 agot_break_braavos_pentos_treaty:0 "Break the Braavos-Pentos Treaty"
 agot_break_braavos_pentos_treaty_desc:0 "Since 209, the Braavosi have forced the proud city of Pentos to abide by a heavy-handed treaty. The time has come for Pentos to tear this treaty to shreds and govern itself freely!"
 agot_break_braavos_pentos_treaty_effect_tt:0 "The Braavos-Pentos Treaty will be broken. Pentos will once again be able to #bold develop its military, hire sellswords, and participate in slavery#!."
 agot_break_braavos_pentos_treaty_effect_2_tt:0 "Braavos will gain a casus belli for #bold 15 years#! that will allow them to try to reassert the treaty."
 agot_break_braavos_pentos_treaty_tooltip:0 "Break the Braavos-Pentos Treaty"
 agot_break_braavos_pentos_treaty_confirm:0 "For Pentos!"

 agot_create_braavos_pentos_treaty_effect_tt:0 "[GetModifier('agot_pentos_braavos_treaty').GetNameWithTooltip] will be permanently added to all characters under the realm of Pentos. It may only be removed should Pentos break free through war."
 agot_break_braavos_pentos_treaty_as_braavos:0 "$agot_break_braavos_pentos_treaty$"
 agot_break_braavos_pentos_treaty_as_braavos_desc:0 "We have dutifully respected the borders of Pentos, as agreed in the Braavos-Pentos Treaty of 209. But the time is ripe for expansion; what is a piece of paper compared to conquest?"
 agot_break_braavos_pentos_treaty_as_braavos_effect_tt:0 "You, and any Braavosi vassals, will be free to declare war on Pentos and its vassals."
 agot_break_braavos_pentos_treaty_as_braavos_confirm:0 "For Braavos!"
 agot_braavos_pentos_treaty_is_active:0 "You cannot declare war while the [GetModifier('agot_pentos_braavos_treaty').GetNameWithTooltip] is active."
 agot_break_braavos_pentos_treaty_as_braavos_tooltip:0 "$agot_break_braavos_pentos_treaty_tooltip$"

 agot_overthrow_bearded_priests:0 "Overthrow the Bearded Priests"
 agot_overthrow_bearded_priests_desc:0 "The Bearded Priests are said to be the true rulers in Norvos. They exercise a shadowy sovereignty over the realm while the magisterial government is nothing more than a day-to-day figurehead who handles the menial tasks. It is time to regain control of the city from the Bearded Priests once and for all!"

 norvos_diarch_attempt_to_overthrow_liege.tt.majority_powerful_conspirators_support:0 "You currently have [SCOPE.ScriptValue('norvos_pv_overthrow_tally_display_value')|0] eligible [powerful_vassal|E] or [powerful_family|E] supporters #weak (including yourself)#! in your conspiracy, out of a required [SCOPE.ScriptValue('norvos_pv_overthrow_threshold_display_value')|0]"

 agot_attempt_to_overthrow_bearded_priests.tt.liege_accepts.keep_hof:0 "[liege.GetTitledFirstName] keeps [liege.GetHerHis] [head_of_faith|E] titles."
 agot_attempt_to_overthrow_bearded_priests.tt.liege_fights_and_loses.may_lose_everything:0 "[liege.GetTitledFirstName] will be forced to abdicate [liege.GetHerHis] [head_of_faith|E] titles"

 agot_attempt_to_overthrow_bearded_priests.tt.liege_response:0 "Your [diarch|E] will either give in, try to beat you at the [skill|E] you choose, or have a proxy try to do so"
 agot_attempt_to_overthrow_bearded_priests.tt.liege_response.information_on_converting_councillors:0 "#WEAK [powerful_vassals|E] who support your coup will refuse to proxy for your [diarch|E]#!"
 agot_attempt_to_overthrow_bearded_priests.tt.convert_to_free_city:0 "Norvos will be converted to a [GetGovernment( 'administrative_government' ).GetName] realm"
 norvos_estate_tier_change_warning:0 "@warning_icon! #warning The [estate|E] of [usurper.GetName] and every character in your realm will become [duchy|e] [title_tier|e], which may result in changes to already built [domicile_buildings|E]!#!"

 diarch_attempt_to_overthrow_liege.tt.win.norvos_diarch_captured:0 "#P Win#!: you [imprisoned|E] your [diarch|E]"
 diarch_attempt_to_overthrow_liege.tt.win.norvos_diarch_dies:0 "#P Win#!: your [diarch|E] [character_death_dies|E]"
 norvos_diarch_coup_liege_interaction.tt.promising_nothing:0 "Wants me to risk everything for nothing: $VALUE|+=0$"
 norvos_diarch_coup_liege_interaction.tt.has_eroded_bp_power:0 "Has noticeably eroded the Bearded Priests' [swing_scales_of_power|E] swing"