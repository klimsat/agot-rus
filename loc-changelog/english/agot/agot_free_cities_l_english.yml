l_english:
 ### Events ###
 free_city_events.0001.t:0 "A Letter with an Alliance Proposal"
 free_city_events.0001.desc:0 "A letter bearing the sigil of [request_sender.GetTitledFirstName] has been delivered to our court, its contents speaking of a decision of great consequence.\n\n[request_sender.GetTitledFirstNameNoTooltip] extends an olive branch, proposing the renewal of an ancient alliance that once gave rise to the mighty Triarchy. The memory of those days, when our cities stood united in strength and purpose, stirs within us once more.\n\n[request_sender.GetSheHe|U] now seeks to raise again the banner of the Kingdom of the Three Daughters, uniting Myr, Lys, and Tyrosh in common cause and shared ambition.\n\nShall we, as proud and sovereign cities, cast aside the animosities of the past and restore this alliance of old? Will we stand together, shoulder to shoulder, and face the coming storms as a united Triarchy, or will we instead follow our own courses, as lone ships braving the tempest?"
 free_city_events.0001.a:0 "Let the Triarchy once more sail the seas together!"
 free_city_events.0001.b:0 "It was settled long ago and shall not return, not yet..."

 free_city_events.0003.t:0 "Reformation of the Three Daughters"
 free_city_events.0003.desc:0 "Once more, the Three Daughters stand united. Myr, Lys, and Tyrosh have sworn anew the eternal bonds of the Triarchy, their alliance proclaimed far and wide across Essos and Westeros alike.\n\nStanding shoulder to shoulder, we have pledged to reclaim every inch of our rightful lands and drive our foes back to the far corners from whence they came.\n\nLet it be known that a new era has dawned, as the Three Daughters rise again, strong and united, to wield their combined might!"
 free_city_events.0003.a:0 "Let our alliance be eternal, now and always!"

 free_city_events.0004.t:0 "A Dream in Ashes"
 free_city_events.0004.desc:0 "[request_sender.GetTitledFirstNamePossessive] attempt to restore the alliance of the Three Daughters has failed. Though the cause was noble, the Triarchy shall not rise again at this time. Yet perhaps, one day, the dream will be rekindled from the ashes.\n\nThe vision of a united realm, where Myr, Lys, and Tyrosh stand together to reclaim their rightful lands and cast back their foes, remains distant. For now, we will go our separate ways and pursue our own fates.\n\nHad the stars aligned differently, the known world might have bent beneath our strength..."
 free_city_events.0004.a:0 "Had the stars aligned differently..."
 free_city_events.0004.b:0 "So it is has been decided."

 free_city_events.1000.t:0 "Free the Free Cities"
 free_city_events.1000.desc:0 ""Did you think [dead_ruler.GetNamePossessive] tyranny would last forever? Now that [free_city.GetName] has been freed of [dead_ruler.GetHerHis] stain, we have resumed elections, and you are not who we choose.""
 free_city_events.1000.a:0 "Oh no..."

 free_city_events.1001.t:0 "Election Postponed"
 free_city_events.1001.desc_elector:0 "With the realm embroiled in a war against the [war_enemy.GetPrimaryTitle.GetName], the Conclave has deemed it unsafe to proceed with the election of a new First Magister.\n\nInstead, the [current_ruler.GetFullNameNicknamed] has temporarily assumed new powers to help maintain order and stability until the war ends.\n\nThe Conclave and the Gonfaloniere declare in an announcement that they acknowledge the First Magister's authority during this period of crisis, aware that their city's future hangs in the balance. The citizens now sit awaiting the end of the conflict, seemingly divided, either cheering on the decrees or uncertain what lies ahead once peace is restored."
 free_city_events.1001.desc_liege:0 "With the realm embroiled in a war against the [war_enemy.GetPrimaryTitle.GetName], the Conclave has deemed it unsafe to proceed with the election of a new First Magister, keeping my position safe for now.\n\nInstead, the Conclave has declared upon you temporarily assumed new powers for me to help maintain order and stability until the war ends.\n\nThe Conclave and the Gonfaloniere declare in a public announcement that they acknowledge my authority during this period of crisis, aware that their city's future hangs in the balance. My citizens now sit awaiting the end of the conflict, seemingly divided, either cheering on the decrees or uncertain what lies ahead once peace is restored."
 free_city_events.1001.a:0 "Is this how liberty dies?... with thunderous applause?"
 free_city_events.1001.a_liege:0 "They applaud me..."
 free_city_events.1001.a.tt:0 "The Conclave postpones the election until after the war ends."
 free_city_events.1001.war_delayed_due_to_war_tt:0 "The election has been postponed due to the ongoing war."

 free_city_events.1002.t:0 "The End of The War"
 free_city_events.1002.desc_elector:0 "The war has finally ended, and the city prepares to resume the election for a new First Magister. \n\nWith the conflict behind them, the Conclave sets to convene and choose a leader to guide the city through its recovery and into a prosperous future. \n\nEarly indications suggest that [magister_winner.GetFullName] may have the support needed to be chosen. As the Magisters and the Gonfaloniere gather, the citizens are filled with anticipation and hope for stability and a return to normalcy."

 free_city_events.1002.desc_liege:0 "With the war concluded, the question of relinquishing the emergency powers assumed during the conflict looms large. \n\nThe Conclave is preparing to resume the election of a new First Magister, but the process is uncertain. [magister_winner.GetFullName] appears to be a likely candidate, but the final decision has yet to be made. \n\nAs the Magister who maintained stability through the war, you contemplate whether stepping down is truly in the city's best interest, or well, your best interest, or if your continued leadership could provide the guidance needed in these precarious times."
 free_city_events.1002.a:0 "Long live the [current_ruler.GetPrimaryTitle.GetName]! Let the election begin!"

 free_city_events.1002.a_liege:0 "For the sake of [current_ruler.GetPrimaryTitle.GetName], I will follow the due process!"
 free_city_events.1002.a.tt:0 "The conclave resumes the election for a new First Magister."

 free_city_events.1002.b_liege:0 "The city needs a strong leader, and I shall be the one to guide it!"
 free_city_events.1002.b.tt:0 "You strive to maintain your position as First Magister, turning the state into a Dictatorship."

 free_city_events.1003.t:0 "Term Ends"
 free_city_events.1003.desc:0 "A new First Magister has been chosen, and [current_ruler.GetTitledFirstName] has been discharged from [current_ruler.GetHerHis] post. As [current_ruler.GetHerHis] reign ends, another begins, as [magister_winner.GetFullName] has been chosen by the Conclave. With much ceremony, the Magisters and the Gonfaloniere swear their allegiance to the new First Magister and [magister_winner.GetHerHis] authority is officially acknowledged by the people. How [magister_winner.GetFullNameNoTooltip] will rule remains uncertain, and already the Magisters plot on how to sway their new leader to their side."
 free_city_events.1003.a:0 "Long live the First Magister! Long live the [magister_winner.GetPrimaryTitle.GetName]!"

 free_city_events.1004.t:0 "A Dark Turn"
 free_city_events.1004.desc:0 "In a shocking turn of events, [current_ruler.GetFullName] has declared that [current_ruler.GetHerHis] emergency powers will not be relinquished. Instead, [current_ruler.GetHerHis] intends to maintain control and transform the city into a dictatorship. This announcement has sent shockwaves through the Conclave and the populace, who had hoped for a return to democratic governance. As tensions rise, the future of the realm hangs in the balance, with uncertainty and fear spreading among its citizens."
 free_city_events.1004.a:0 "What will become of our realm?"

 free_city_events.2000.t:0 "The Prince's Price"
 free_city_events.2000.desc:0 "I stand before the crowd, my hands bound, the weight of my failures heavier than any chains. For my loss of the war, my people will now sacrifice me to appease the gods.\n\nThe cold blade rests against my throat. I can hear the murmurs of the crowd, but none of it matters anymore; my fate is sealed.\n\nI think of what might have been, the ambitions I once held, and the men who followed me. It all feels so distant now.\n\nWith a final breath, the blade cuts through silence, and I am no more."
 free_city_events.2000.a:0 "..."
 PENTOS_LOST_WAR:0 "Truce signed after the sacrifice of [loser.GetName]"

 free_city_events.9999.t:0 "The [term_limit_country.GetAdjective] Election"
 free_city_events.9999.desc_old_holder:0 "So, it's done. I've been replaced. \n\n[magister_winner.GetFullName] is the new First Magister, and I—well, I step aside for now. The Magisters and the Gonfaloniere have sworn their fealty to the new leader, their voices echoing in the hall with promises I once commanded. \n\nIt's hard to swallow, but I've been here before. Power slips through fingers like sand, but I know the game isn't over. I won't be forgotten. I mustn't be."

 free_city_events.9999.desc_magister_winner:0 "They've chosen me. The Conclave has selected me as the new First Magister. [old_holder.GetTitledFirstName] has been dismissed from the post, and now I stand where they once did..\n\nThe Magisters and the Gonfaloniere have sworn their allegiance to me, pledging loyalty as my authority is cemented. But what now? How will I rule? Already, some Magisters plot openly, while others whisper sweet words to my face, all the while trying to pick my pocket. I must remain vigilant and ready to face whatever comes next."

 free_city_events.9999.desc_vassal:0 "A new First Magister has been chosen, and [old_holder.GetFirstName] has been discharged from [old_holder.GetHerHis] post. \n\nAs [old_holder.GetHerHis] reign ends, another begins, as [magister_winner.GetFullName] has been chosen by the Conclave. With much ceremony, the Magisters and the Gonfaloniere swear their allegiance to the new First Magister, and [magister_winner.GetHerHis] authority is officially acknowledged by the people. \n\nHow [magister_winner.GetFullNameNoTooltip] will rule remains uncertain, and already the Magisters plot on how to sway their new leader to their side."
 free_city_events.9999.a:0 "Long live the First Magister! Long live the [term_limit_country.GetName]!"
 free_city_events.9999.b:0 "I wonder what kind of ruler [magister_winner.GetFirstName] will be..."

