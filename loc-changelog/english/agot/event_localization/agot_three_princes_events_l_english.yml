l_english:

 agot_a_new_harvest_prince_is_elected_tt:0 "A new Harvest Prince will be elected imminently"
 agot_a_new_harvest_prince_is_elected_soon_tt:0 "A new Harvest Prince will be elected in three days"
 agot_a_new_harvest_prince_is_elected_eight_tt:0 "The elections for the Harvest Principality will begin in eight days"

 agot_a_new_fisher_prince_is_elected_tt:0 "A new Fisher Prince will be elected imminently"
 agot_a_new_fisher_prince_is_elected_soon_tt:0 "A new Fisher Prince will be elected in three days"
 agot_a_new_fisher_prince_is_elected_eight_tt:0 "The elections for the Fisher Principality will begin in eight days"

 agot_a_new_prince_of_streets_is_elected_tt:0 "A new Prince of the Streets will be elected imminently"
 agot_a_new_prince_of_streets_is_elected_soon_tt:0 "A new Prince of the Streets will be elected in three days"
 agot_a_new_prince_of_streets_is_elected_eight_tt:0 "The elections for the Principality of the Streets will begin in eight days"

 agot_three_princes.1000.t:0 "The Death of the Harvest Prince"
 agot_three_princes.1000.desc:0 "The [agot_harvest_prince|E] has died, bringing an end to [dead_prince.GetHerHis] tenure as one of Lorath's three ceremonial princes. As a landholder upon the islands of the [GetTitleByKey('k_lorath').GetName], I am granted the right to cast my vote in the election of [dead_prince.GetHerHis] successor. Of the candidates put forward by the landholding electors, whom do I wish to see take up this privileged, if entirely ceremonial, position?"
 agot_three_princes.1000.a:0 "I must consider my choices carefully."

 agot_three_princes.1001.t:0 "Electing a Harvest Prince"
 agot_three_princes.1001.desc:0 "The landholding electors of the Lorathi isles have put forward their candidates, and now the time has come for each elector to cast their vote. The office of the Harvest Prince may carry little authority these days, but the honor of bearing the title remains a coveted one. Which candidate shall receive my vote?"
 agot_three_princes.1001.a:0 "There is dignity in [harvest_prince_candidate_one.GetFullNameNicknamed]."
 agot_three_princes.1001.b:0 "[harvest_prince_candidate_two.GetFullNameNicknamed] understands the needs of the land."
 agot_three_princes.1001.c:0 "I see a Harvest Prince in [harvest_prince_candidate_three.GetFullNameNicknamed]."

 agot_three_princes.1003.t:0 "A New Harvest Prince!"
 agot_three_princes.1003.desc:0 "The ballots have been collected, the votes have been counted, and the result is clear. [lorath_new_harvest_prince.GetFirstName] has been declared the new Harvest Prince! Amid the cheers of the assembled electors, [lorath_new_harvest_prince.GetSheHe] will be escorted to the [GetTitleByKey('c_palliera').GetName], where [lorath_new_harvest_prince.GetSheHe] shall take [lorath_new_harvest_prince.GetHerHis] rightful seat at Harvest Hall."
 agot_three_princes.1003.a:0 "The electors have spoken."

 agot_three_princes.2000.t:0 "The Death of the Fisher Prince"
 agot_three_princes.2000.desc:0 "The [agot_fisher_prince|E] has died, bringing an end to [dead_prince.GetHerHis] tenure as one of Lorath's three ceremonial princes. As a citizen of the [GetTitleByKey('k_lorath').GetName] who owns a ship, I am granted the right to cast my vote in the election of [dead_prince.GetHerHis] successor. Of the candidates put forward by the ship-owning electors, whom do I wish to see take up this privileged, if entirely ceremonial, position?"
 agot_three_princes.2000.a:0 "I must consider my choices carefully."

 agot_three_princes.2001.t:0 "Electing a Fisher Prince"
 agot_three_princes.2001.desc:0 "The ship-owning electors of the Lorathi isles have put forward their candidates, and now the time has come for each elector to cast their vote. The office of the Fisher Prince may have lost its old authority, but the title remains a proud symbol of Lorath's seafaring traditions. Which candidate shall receive my vote?"
 agot_three_princes.2001.a:0 "No one knows the sea better than [fisher_prince_candidate_one.GetFullNameNicknamed]."
 agot_three_princes.2001.b:0 "[fisher_prince_candidate_two.GetFullNameNicknamed] has the makings of a fine Fisher Prince."
 agot_three_princes.2001.c:0 "The sea runs deep in [fisher_prince_candidate_three.GetFullNameNicknamed]."

 agot_three_princes.2003.t:0 "A New Fisher Prince!"
 agot_three_princes.2003.desc:0 "The ballots have been collected, the votes have been counted, and the result is clear. [lorath_new_fisher_prince.GetFirstName] has been declared the new Fisher Prince! Amid the cheers of the assembled electors, [lorath_new_fisher_prince.GetSheHe] will be escorted to the [GetTitleByKey('c_qapahienn').GetName], where [lorath_new_fisher_prince.GetSheHe] shall take [lorath_new_fisher_prince.GetHerHis] rightful seat at Fisher Hall."
 agot_three_princes.2003.a:0 "The electors have spoken."

 agot_three_princes.3000.t:0 "The Death of the Prince of the Streets"
 agot_three_princes.3000.desc:0 "The [agot_streets_prince|E] has died, bringing an end to [dead_prince.GetHerHis] tenure as one of Lorath's three ceremonial princes. As a free citizen of the [GetTitleByKey('k_lorath').GetName], I am granted the right to cast my vote in the election of [dead_prince.GetHerHis] successor. Of the candidates put forward by the free people of the Lorathi isles, whom do I wish to see take up this privileged, if entirely ceremonial, position?"
 agot_three_princes.3000.a:0 "I must consider my choices carefully."

 agot_three_princes.3001.t:0 "Electing a Prince of the Streets"
 agot_three_princes.3001.desc:0 "The free people of the Lorathi isles have put forward their candidates, and now the time has come for each elector to cast their vote. The office of the Prince of the Streets may hold little authority, but its occupant remains a symbol of the common folk who fill Lorath's streets and markets. Which candidate shall receive my vote?"
 agot_three_princes.3001.a:0 "The common folk trust [prince_of_streets_candidate_one.GetFullNameNicknamed]."
 agot_three_princes.3001.b:0 "[prince_of_streets_candidate_two.GetFullNameNicknamed] knows Lorath's streets better than most."
 agot_three_princes.3001.c:0 "[prince_of_streets_candidate_three.GetFullNameNicknamed] has a voice the people will hear."

 agot_three_princes.3003.t:0 "A New Prince of the Streets!"
 agot_three_princes.3003.desc:0 "The ballots have been collected, the votes have been counted, and the result is clear. [lorath_new_prince_of_streets.GetFirstName] has been declared the new Prince of the Streets! Amid the cheers of the assembled electors, [lorath_new_prince_of_streets.GetSheHe] will be escorted to the [GetTitleByKey('c_west_catch').GetName], where [lorath_new_prince_of_streets.GetSheHe] shall take [lorath_new_prince_of_streets.GetHerHis] rightful seat at the Hall of the Streets."
 agot_three_princes.3003.a:0 "The electors have spoken."