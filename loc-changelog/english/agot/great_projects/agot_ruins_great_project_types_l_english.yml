 agot_great_project_events.1010.desc.ruins: "The envoy of my [ROOT.Char.Custom2('RelationToMe', overlord_scope)], [overlord_scope.GetTitledFirstName], approaches me with excitement early in the morning.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" #EMP [envoy.GetSheHe|U] catches [envoy.GetHerHis] breath and bows before me.#! "The restoration of the [province.GetHolding.GetType.GetName|l] in [project_location.GetNameNoTooltip] has finally been completed!"\n\n"Our gracious [overlord_scope.GetTitleAsNameNoTooltip] has sent me here to show [overlord_scope.GetHerHis] appreciation for your generous contributions to this end!" The [envoy.GetWomanMan]'s eyes glow with passionate fervor as [envoy.GetSheHe] retells the vision of the restored building, showering the [province.GetHolding.GetType.GetName|l] with many fanciful descriptions.\n\nI hum and nod, pleased with my contribution to the cause..."
