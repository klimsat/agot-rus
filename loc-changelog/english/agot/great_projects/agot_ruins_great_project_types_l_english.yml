 ##################################
 ########### Great Project Events #
 ##################################

 # Owner Success
 # scopes available: owner, onlooker, onlooker_2, project_location
 agot_great_project_events.1000.t.base: "Great Project"
 agot_great_project_events.1000.t.ruins: "$agot_great_project_events.1000.t.base$: Restored [province.GetHolding.GetSpecialBuildingType.GetName]"
 agot_great_project_events.1000.t.chroyane: "$agot_great_project_events.1000.t.base$: Restored [GetBuilding('agot_ruins_chroyane_walls_03').GetName]"
 agot_great_project_events.1000.t.special: "$agot_great_project_events.1000.t.base$: Constructed [province.GetHolding.GetSpecialBuildingType.GetName]"
 agot_great_project_events.1000.desc.ruins: "I look out over the [province.GetHolding.GetType.GetName|l], restored to its former splendor. The workers, now free from their obligations, scatter, leaving behind a beautiful and sturdy structure raised from ruin.\n\nI pause for a moment to admire this new addition to my realm.\n\nYes, yes, this will do. I shall rule over this [province.GetHolding.GetType.GetName|l] with pride."
 agot_great_project_events.1000.desc.chroyane: "I look out over the [province.GetHolding.GetType.GetName|l], restored to its former splendor. The workers, now free from their obligations, scatter, leaving behind a beautiful and sturdy structure raised from ruin.\n\nI pause for a moment to admire this new addition to my realm.\n\nYes, yes, this will do. But there is much more work to be done to restore the city."
 agot_great_project_events.1000.desc.special: "I look out over the [province.GetHolding.GetType.GetName|l], constructed anew. The workers, now free from their obligations, scatter, leaving behind a beautiful and sturdy structure, an impressive extension to the city.\n\nI pause for a moment to admire this new addition to my realm.\n\nYes, yes, this will do. I shall rule over this [province.GetHolding.GetType.GetName|l] with pride."
 agot_great_project_events.1000.a.ruins: "The progress we are making is outstanding."
 agot_great_project_events.1000.a.chroyane: "What remains of the ruin awaits our efforts."
 agot_great_project_events.1000.a.special: "The splendor of this city continues to grow."

