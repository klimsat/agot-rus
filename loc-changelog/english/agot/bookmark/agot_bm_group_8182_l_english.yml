l_english:
 agot_bm_group_8182:0 "182 A.C."
 agot_bm_8182:0 "The Bells of War"
 agot_bm_8182_desc:0 "Conflict has swept across the Rhoyne and her tributaries. In Lorath, First Magister Thys O’rel seeks to continue his military success following a victorious war against Norvos, but his next target — the Ibbenese colony in the Axe — may prove more burdensome than hoped.\n\nMeanwhile, Qohor has spawned a competitive election between Haratt Ekna — who seeks to punish Norvos for the city’s transgressions — and Korena Ostorlat — who believes Norvos and Qohor are the only hope against Lorath’s young conqueror.\n\nTo the south, the Volantene Governor of Gar Sagon has turned on his Rhoynish allies led by Asuhara Arhe Meali, and is waging an existential war against those he once relied on.\n\n#bold As the chaos of battle swells into a grim chorus, the world will hear for whom the bells of war toll.#!"

 bookmark_182_thys_o_rell:0 "First Magister Thys"
 bookmark_182_thys_o_rell_subheading:0 "First Magister of Lorath"
 bookmark_182_thys_o_rell_desc:0 "[Concept( 'story_content_thys_o_rell_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_thys_o_rell_182', '$bm_story_content_available_copy|q$' )|E]\nLorath’s young leader made a name for himself after defeating Norvos in battle two and a half years ago. In the fashion of a true conqueror — or perhaps an overambitious commander — Thys has set his eyes on the Axe. #bold But as the latest campaign turns into a slog, will the Lorathi’s ambitions leave the Free City vulnerable to those they have scorned?#!"

 bookmark_182_korena_ostorlat:0 "Magister Korena"
 bookmark_182_korena_ostorlat_subheading:0 "Magister of Grjevuros"
 bookmark_182_korena_ostorlat_desc:0 "[Concept( 'story_content_korena_ostorlat_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_korena_ostorlat_182', '$bm_story_content_available_copy|q$' )|E]\nKorena Ostorlat has emerged as the pro-Norvoshi candidate in a competitive election in Qohor. Her calculation is simple: The young Lorathi First Magister poses a direct threat to the region — and he can only be stopped by an alliance of Qohor and Norvos. #bold Before she can face the Lorathi threat, Korena must first win the election that will seal her fate.#!"
 
 bookmark_182_haratt_ekna:0 "Magister Haratt"
 bookmark_182_haratt_ekna_subheading:0 "Magister of Erodhunavar"
 bookmark_182_haratt_ekna_desc:0 "[Concept( 'story_content_haratt_ekna_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_haratt_ekna_182', '$bm_story_content_available_copy|q$' )|E]\nHaratt Ekna stands as not only a leading candidate in the coming Qohorik election, but as the top candidate against the bellicose Norvoshi. He has argued, often loudly, that Norvos should be held accountable for its many crimes against Qohor. #bold Should Haratt emerge as First Magister, the bells of war will surely be made to toll once more.#!"

 bookmark_182_krahas_segal:0 "Governor Krahas"
 bookmark_182_krahas_segal_subheading:0 "Governor of Gar Sagon"
 bookmark_182_krahas_segal_desc:0 "[Concept( 'story_content_krahas_segal_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_krahas_segal_182', '$bm_story_content_available_copy|q$' )|E]\nKrahas Segal holds the strategic domain of Gar Sagon, won for the Volantenes through an alliance with the Rhoynar Confederation. But now, these lands have become hotly contested, as Krahas has turned cloak against his former allies, whom he seeks to shatter completely. #bold Will his plot succeed, scattering the Rhoynar like a wave crashing against sheer rock?#!"

 bookmark_182_arhe_meali:0 "Lady Asuhara"
 bookmark_182_arhe_meali_subheading:0 "Lady of Pihu Sar"
 bookmark_182_arhe_meali_desc:0 "[Concept( 'story_content_arhe_meali_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_arhe_meali_182', '$bm_story_content_available_copy|q$' )|E]\nAsuhara Arhe Meali is the fierce leader of the Rhoynar Confederation. Once the crucial allies of the Volantenes, she and her confederates have been betrayed and now face an existential threat originating from the very fortress they once conquered: Gar Sagon. #bold In the face of treachery and potential exile, will Asuhara muster the Confederation to victory?#!"