 # Dragonfire
 dragon_fire_color_template_de_gui:0 "Fire Color Mode"
 dragon_fire_color_template_de_gui_tt:0 "#bold Default#! matches the flame to your dragon's own coloring.\n\n#bold Custom#! allows you to pick the flame coloring via slider."
 dragon_fire_color_value_de_gui:0 "Fire Color"
 dragon_fire_color_value_de_gui_tt:0 "On #bold Default#!, the percentage reflects how #emp strongly#! the flame takes on your dragon’s coloring — at 0% the flame will be natural orange.\n\nOn #bold Custom#!, the percentage reflects #emp the color itself#!, covering one full turn of the color wheel — both 0% and 100% are natural orange, while 50% is blue.\n\nThe color is strongest at the mouth and fades to natural flame along the plume."
 dragon_fire_smoke_template_de_gui:0 "Smoke Mode"
 dragon_fire_smoke_template_de_gui_tt:0 "#bold Automatic#! shows smoke only on a dark dragon, where it looks natural.\n\n#bold Custom#! allows you to set the smoke amount on any dragon via slider."
 dragon_fire_smoke_value_de_gui:0 "Smoke"
 dragon_fire_smoke_value_de_gui_tt:0 "On #bold Automatic#!, this slider is #emp ignored#!, resulting in denser smoke for darker dragons.\n\nOn #bold Custom#!, the percentage reflects #emp how much#! smoke rises from the flame — none at 0% and full at 100%.
